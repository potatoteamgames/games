const OL='#3b2a20';
function shade(hex,f){ // f<0 darker, f>0 lighter
  let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  if(f<0){r*=1+f;g*=1+f;b*=1+f}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}
  return'#'+((1<<24)+(Math.round(r)<<16)+(Math.round(g)<<8)+Math.round(b)).toString(16).slice(1);
}
function RR(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function box(c,x,y,w,h,r,fill,lw=3){RR(c,x,y,w,h,r);c.fillStyle=fill;c.fill();if(lw){c.lineWidth=lw;c.strokeStyle=OL;c.stroke()}}
function ell(c,x,y,rx,ry,fill,lw=3,rot=0){c.beginPath();c.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill()}if(lw){c.lineWidth=lw;c.strokeStyle=OL;c.stroke()}}
function lg(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}
function poly(c,pts,fill,lw=3){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(lw){c.lineWidth=lw;c.strokeStyle=OL;c.stroke()}}
function line(c,x0,y0,x1,y1,col=OL,lw=3){c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.stroke()}

function bodyPath(c){c.beginPath();c.moveTo(0,-120);c.bezierCurveTo(31,-121,49,-96,48,-63);c.bezierCurveTo(47,-30,32,-7,0,-7);c.bezierCurveTo(-34,-7,-49,-31,-48,-65);c.bezierCurveTo(-47,-99,-29,-119,0,-120);c.closePath()}
// p = {look, outfit, t, walk, dir, mood, sleep}
function drawPet(c,x,y,sc,p){
  const lk=p.look||{},of=p.outfit||{},t=p.t||0,col=lk.color||'#f2c879',an=lk.animal||'bunny';
  const wk=p.walk?Math.sin(t*12):0,bob=p.walk?Math.abs(Math.sin(t*12))*-5:Math.sin(t*2.2)*1.5;
  c.save();c.translate(x,y);c.scale(sc*(p.dir<0?-1:1),sc);
  // shadow
  c.save();c.scale(1,.3);ell(c,0,0,44,22,'rgba(0,0,0,.18)',0);c.restore();
  c.translate(0,bob);
  const dk=shade(col,-.22),lt=shade(col,.35);
  // cape / backpack behind
  if(of.top==='top_hero'){poly(c,[-30,-58,30,-58,46,-4,-46,-4],'#ffc93c')}
  if(of.acc==='ac_backpack'){box(c,-52,-72,104,54,14,CLOTH.ac_backpack.col)}
  drawEars(c,an,col,dk,lt,false,t);
  drawTail(c,an,col,dk,t);
  // feet
  const fy1=-6+(wk>0?-wk*5:0),fy2=-6+(wk<0?wk*5:0);
  const shoe=of.shoes&&CLOTH[of.shoes]?CLOTH[of.shoes].col:dk;
  [[-19,fy1],[19,fy2]].forEach(([fx,fy])=>{ell(c,fx,fy,15,9,shoe);if(of.shoes==='sh_roll'){ell(c,fx-7,fy+9,4,4,'#333',2);ell(c,fx+7,fy+9,4,4,'#333',2)}if(of.shoes==='sh_slip'){ell(c,fx-5,fy-8,3,6,'#ffd1e8',2);ell(c,fx+5,fy-8,3,6,'#ffd1e8',2)}if(of.shoes==='sh_sneak'){line(c,fx-8,fy+2,fx+8,fy+2,'#e8304a',2)}});
  // arms (behind body edge)
  const topCol=of.top&&CLOTH[of.top]?CLOTH[of.top].col:col;
  const sleeve=['top_tee','top_stripes','top_dress','top_vest'].includes(of.top)?col:topCol;
  c.save();c.translate(-44,-52);c.rotate(.5+wk*.35);ell(c,0,10,10,17,sleeve);c.restore();
  c.save();c.translate(44,-52);c.rotate(-.5-wk*.35);ell(c,0,10,10,17,sleeve);c.restore();
  // body
  bodyPath(c);const g=c.createRadialGradient(-16,-92,6,0,-64,62);g.addColorStop(0,lt);g.addColorStop(.6,col);g.addColorStop(1,dk);c.fillStyle=g;c.fill();
  // potato speckles
  c.fillStyle=shade(col,-.3);[[-26,-96,2.6],[29,-84,2.2],[-33,-40,2.4],[24,-30,2]].forEach(([sx,sy,r])=>{c.beginPath();c.arc(sx,sy,r,0,7);c.fill()});
  // clothes clipped to body
  c.save();bodyPath(c);c.clip();drawBottom(c,of.bottom);drawTop(c,of.top,col);c.restore();
  bodyPath(c);c.lineWidth=3.5;c.strokeStyle=OL;c.stroke();
  // skirts / dress flare outside body
  if(of.top==='top_dress')poly(c,[-40,-30,40,-30,52,-6,-52,-6],CLOTH.top_dress.col);
  if(of.bottom==='bot_skirt')poly(c,[-42,-26,42,-26,50,-8,-50,-8],CLOTH.bot_skirt.col);
  if(of.bottom==='bot_tutu'){for(let i=-3;i<=3;i++)ell(c,i*15,-14,14,9,CLOTH.bot_tutu.col,2)}
  drawEars(c,an,col,dk,lt,true,t);
  drawFace(c,lk,p);
  drawAcc(c,of.acc);
  if(of.glasses)drawGlasses(c,of.glasses);
  if(of.hat)drawHat(c,of.hat,an);
  c.restore();
}
function drawEars(c,an,col,dk,lt,front,t){
  const inner='#ffb3c7';
  if(!front){
    if(an==='bunny'){const w=Math.sin(t*1.7)*.05;[-1,1].forEach(s=>{c.save();c.translate(s*17,-108);c.rotate(s*(.18+w));ell(c,0,-40,14,44,col);ell(c,0,-38,7,32,inner,0);c.restore()})}
    if(an==='dog'){[-1,1].forEach(s=>{c.save();c.translate(s*40,-98);c.rotate(s*.35);ell(c,s*4,22,15,30,dk);c.restore()})}
    if(an==='elephant'){[-1,1].forEach(s=>{ell(c,s*52,-74,28,36,col);ell(c,s*52,-74,17,24,inner,0)})}
    if(an==='mouse'){[-1,1].forEach(s=>{ell(c,s*36,-112,24,24,col);ell(c,s*36,-112,14,14,inner,0)})}
    if(an==='bear'){[-1,1].forEach(s=>{ell(c,s*33,-110,15,15,col);ell(c,s*33,-110,8,8,dk,0)})}
  }else{
    if(an==='cat'){[-1,1].forEach(s=>{poly(c,[s*14,-117,s*44,-112,s*36,-150],col);poly(c,[s*21,-118,s*38,-116,s*34,-138],inner,0)})}
    if(an==='fox'){[-1,1].forEach(s=>{poly(c,[s*10,-118,s*44,-108,s*36,-158],col);poly(c,[s*25,-140,s*36,-158,s*30,-134],'#fff',0)})}
    if(an==='pig'){[-1,1].forEach(s=>{poly(c,[s*16,-116,s*42,-108,s*42,-132],shade(col,-.08))})}
  }
}
function drawTail(c,an,col,dk,t){
  const w=Math.sin(t*6)*.25;
  c.save();c.translate(40,-28);c.rotate(w);
  if(an==='cat'){c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(30,-5,26,-40);c.lineWidth=10;c.strokeStyle=OL;c.lineCap='round';c.stroke();c.lineWidth=6;c.strokeStyle=col;c.stroke()}
  if(an==='fox'){ell(c,22,-18,16,30,col,3,-.6);ell(c,34,-38,8,10,'#fff',0,-.6)}
  if(an==='dog'){ell(c,14,-14,6,14,dk,3,-.8)}
  if(an==='pig'){c.beginPath();c.arc(12,-6,7,0,5.5);c.lineWidth=4;c.strokeStyle=shade(col,-.2);c.stroke()}
  if(an==='bunny'){ell(c,8,-2,10,10,'#fff')}
  if(an==='bear'||an==='mouse'){if(an==='mouse'){c.beginPath();c.moveTo(0,0);c.bezierCurveTo(25,0,30,-25,45,-10);c.lineWidth=3;c.strokeStyle='#e7a0b4';c.stroke()}}
  c.restore();
}
function drawFace(c,lk,p){
  const blink=(p.t||0)%4>3.85||p.sleep;
  const sad=p.mood==='sad';
  [-1,1].forEach(s=>{
    const ex=s*17,ey=-80;
    if(blink){c.beginPath();c.arc(ex,ey+2,9,.2,Math.PI-.2);c.lineWidth=3;c.strokeStyle=OL;c.stroke();return}
    ell(c,ex,ey,12.5,15,'#fff',3);
    const ix=ex+(p.look2||0)*2;
    ell(c,ix,ey+2,7.5,9,'#3b2414',0);ell(c,ix,ey+2,4,5,'#111',0);
    c.fillStyle='#fff';c.beginPath();c.arc(ix-2.5,ey-2,2.6,0,7);c.fill();
    if(lk.eyes==='sparkle'){c.beginPath();c.arc(ix+3,ey+5,1.6,0,7);c.fill();c.beginPath();c.arc(ix-3,ey+6,1,0,7);c.fill()}
    if(lk.eyes==='lashes'){for(let k=0;k<3;k++)line(c,ex+s*(5+k*4),ey-13+k*2,ex+s*(9+k*5),ey-19+k*3,OL,2.5)}
    if(lk.eyes==='sleepy'){c.save();c.beginPath();c.ellipse(ex,ey,12.5,15,0,Math.PI,0);c.fillStyle=shade(lk.color||'#f2c879',-.1);c.fill();c.lineWidth=3;c.strokeStyle=OL;c.stroke();c.restore()}
    if(sad)line(c,ex-s*10,ey-21,ex+s*6,ey-17,OL,2.5);
  });
  // cheeks
  c.fillStyle='rgba(255,105,140,.35)';[-31,31].forEach(cx=>{c.beginPath();c.ellipse(cx,-60,8,5,0,0,7);c.fill()});
  const an=lk.animal;
  if(an==='pig'){ell(c,0,-62,12,8,shade(lk.color||'#ff8fb8',-.12));ell(c,-4,-62,2,3,OL,0);ell(c,4,-62,2,3,OL,0)}
  else if(an==='elephant'){c.beginPath();c.moveTo(-6,-68);c.quadraticCurveTo(-8,-44,4,-38);c.lineWidth=11;c.strokeStyle=OL;c.lineCap='round';c.stroke();c.lineWidth=7;c.strokeStyle=lk.color||'#d9d9e3';c.stroke()}
  else ell(c,0,-65,5,3.5,'#3b2414',0);
  // mouth
  const m=sad?'sad':lk.mouth||'smile',my=an==='elephant'?-50:-54;
  c.lineWidth=3;c.strokeStyle=OL;c.lineCap='round';
  if(m==='sad'){c.beginPath();c.arc(an==='elephant'?14:0,my+8,7,Math.PI+.4,-.4);c.stroke()}
  else if(m==='open'||p.talk){c.beginPath();c.ellipse(0,my+2,7,6+(p.talk?Math.abs(Math.sin((p.t||0)*16))*3:0),0,0,7);c.fillStyle='#7a1e2c';c.fill();c.stroke();ell(c,0,my+5,4,2.5,'#ff7a90',0)}
  else{c.beginPath();c.arc(0,my-2,8,.25,Math.PI-.25);c.stroke();
    if(m==='teeth'){box(c,-5,my+5,4.5,6,1,'#fff',1.5);box(c,.5,my+5,4.5,6,1,'#fff',1.5)}
    if(m==='fangs'){poly(c,[-6,my+4,-3,my+4,-4.5,my+10],'#fff',1.5);poly(c,[3,my+4,6,my+4,4.5,my+10],'#fff',1.5)}
    if(m==='tongue'){ell(c,3,my+8,4.5,5,'#ff6f8f',2)}}
}

/* ---------------- walls & floors ---------------- */
function drawWall(c,id,x,y,w,h){
  const base={wp_cream:'#f6ead2',wp_blue:'#9fd3f5',wp_pink:'#f9b6d2',wp_mint:'#b8edd2',wp_stripes:'#fde7c8',wp_dots:'#c9e7ff',wp_floral:'#fff1dc',wp_brick:'#c76b4a',wp_night:'#27306b'}[id]||'#f6ead2';
  c.fillStyle=base;c.fillRect(x,y,w,h);
  if(id==='wp_stripes'){c.fillStyle='rgba(240,140,80,.25)';for(let i=x;i<x+w;i+=48)c.fillRect(i,y,22,h)}
  if(id==='wp_dots'){c.fillStyle='rgba(255,255,255,.75)';for(let j=y+20,r=0;j<y+h;j+=40,r++)for(let i=x+(r%2?20:40);i<x+w;i+=40){c.beginPath();c.arc(i,j,6,0,7);c.fill()}}
  if(id==='wp_floral'){for(let j=y+30,r=0;j<y+h;j+=70,r++)for(let i=x+(r%2?35:70);i<x+w;i+=70){c.save();c.translate(i,j);for(let k=0;k<5;k++){c.rotate(Math.PI*2/5);c.fillStyle='rgba(255,140,180,.45)';c.beginPath();c.ellipse(0,-8,5,8,0,0,7);c.fill()}c.fillStyle='rgba(255,200,60,.6)';c.beginPath();c.arc(0,0,4,0,7);c.fill();c.restore()}}
  if(id==='wp_brick'){c.strokeStyle='rgba(255,230,210,.45)';c.lineWidth=3;for(let j=y,r=0;j<y+h;j+=34,r++){c.beginPath();c.moveTo(x,j);c.lineTo(x+w,j);c.stroke();for(let i=x+(r%2?0:40);i<x+w;i+=80){c.beginPath();c.moveTo(i,j);c.lineTo(i,j+34);c.stroke()}}}
  if(id==='wp_night'){c.fillStyle='#fde68a';for(let k=0;k<70;k++){const sx=x+(k*137)%w,sy=y+(k*71)%h;c.globalAlpha=.4+((k*13)%6)/10;c.fillRect(sx,sy,3,3)}c.globalAlpha=1;ell(c,x+w-160,y+90,30,30,'#fef3c7',0)}
  // soft light from top
  c.fillStyle=lg(c,0,y,0,y+h,[[0,'rgba(255,255,255,.18)'],[1,'rgba(0,0,0,.06)']]);c.fillRect(x,y,w,h);
}
function drawFloor(c,id,x,y,w,h){
  const base={fl_wood:'#b47a46',fl_light:'#e3bf8a',fl_carpet:'#8fb3e0',fl_tiles:'#cfe8f7',fl_checker:'#f3f4f6',fl_marble:'#eef0f4'}[id]||'#b47a46';
  c.fillStyle=base;c.fillRect(x,y,w,h);
  if(id==='fl_wood'||id==='fl_light'){c.strokeStyle=shade(base,-.18);c.lineWidth=2;for(let j=y,r=0;j<y+h;j+=26,r++){c.beginPath();c.moveTo(x,j);c.lineTo(x+w,j);c.stroke();for(let i=x+(r*97)%180;i<x+w;i+=180){c.beginPath();c.moveTo(i,j);c.lineTo(i,j+26);c.stroke()}}}
  if(id==='fl_carpet'){c.fillStyle='rgba(255,255,255,.08)';for(let k=0;k<400;k++)c.fillRect(x+(k*53)%w,y+(k*29)%h,2,2)}
  if(id==='fl_tiles'){c.strokeStyle='rgba(60,120,170,.35)';c.lineWidth=2;for(let i=x;i<x+w;i+=60){c.beginPath();c.moveTo(i,y);c.lineTo(i,y+h);c.stroke()}for(let j=y;j<y+h;j+=40){c.beginPath();c.moveTo(x,j);c.lineTo(x+w,j);c.stroke()}}
  if(id==='fl_checker'){c.fillStyle='#1f2937';for(let j=y,r=0;j<y+h;j+=40,r++)for(let i=x+(r%2?0:60);i<x+w;i+=120)c.fillRect(i,j,60,40)}
  if(id==='fl_marble'){c.strokeStyle='rgba(150,160,180,.35)';c.lineWidth=1.5;for(let k=0;k<14;k++){c.beginPath();c.moveTo(x+(k*173)%w,y);c.bezierCurveTo(x+(k*91)%w,y+h/3,x+(k*211)%w,y+h/2,x+(k*61)%w,y+h);c.stroke()}}
  c.fillStyle=lg(c,0,y,0,y+h,[[0,'rgba(0,0,0,.16)'],[.2,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.05)']]);c.fillRect(x,y,w,h);
}
// thumbnails for shop/inventory cards (cached)
const THUMB={};
function thumb(kind,id,w=110,h=86){
  const key=kind+':'+id+':'+w+'x'+h+':'+(kind==='cloth'?JSON.stringify(S&&S.look):'');
  if(THUMB[key])return THUMB[key];
  const cv=document.createElement('canvas'),d=2;cv.width=w*d;cv.height=h*d;const c=cv.getContext('2d');c.scale(d,d);
  if(kind==='furn'){const f=FURN[id];
    if(f.kind==='wp'){drawWall(c,id,0,0,w,h);c.strokeStyle=OL;c.lineWidth=2;c.strokeRect(1,1,w-2,h-2)}
    else if(f.kind==='fl'){drawFloor(c,id,0,0,w,h);c.strokeStyle=OL;c.lineWidth=2;c.strokeRect(1,1,w-2,h-2)}
    else{const sc=Math.min((w-10)/f.w,(h-10)/f.h);c.translate(w/2,f.kind==='wall'?h/2:h-6);c.scale(sc,sc);DRAW[id](c)}}
  else if(kind==='cloth'){const it=CLOTH[id],of={};of[it.slot]=id;const lk=S&&S.look?S.look:{animal:'bunny',color:'#f2c879'};
    const zoom={hat:1.1,glasses:1.25,acc:.95,top:.95,bottom:1,shoes:1.1}[it.slot]||1,cy={hat:h+30,glasses:h+48,acc:h+6,top:h+4,bottom:h-6,shoes:h-14}[it.slot];
    drawPet(c,w/2,cy,.5*zoom*(h/86),{look:lk,outfit:of,t:0})}
  else if(kind==='food'){c.font=`${h*.62}px serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(FOOD[id].e,w/2,h/2+2)}
  return THUMB[key]=cv;
}

const DECAY={hunger:90,clean:120,fun:100}; // seconds per point
function tickStats(now,offline){
  const dt=(now-S.stT)/1000;if(dt<1)return;
  for(const k in DECAY){let loss=dt/DECAY[k];if(offline)loss=Math.min(loss,S.st[k]*.5);S.st[k]=clamp(S.st[k]-loss,0,100)}
  S.stT=now;
  const me=maxEnergy(),per=90;
  if(S.energy<me){const gain=Math.floor((now-S.enT)/1000/per);if(gain>0){S.energy=Math.min(me,S.energy+gain);S.enT+=gain*per*1000}}else S.enT=now;
}

function panel({title,html='',buttons=[],sm,render,onClose,cls=''}){
  return new Promise(res=>{
    const ov=document.createElement('div');ov.className='ov';
    ov.innerHTML=`<div class="pn ${sm?'sm':''} ${cls}"><div class="ph"><h2>${title}</h2><button class="x" aria-label="Close">✕</button></div><div class="pb">${html}</div>${buttons.length?'<div class="pf"></div>':''}</div>`;
    document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('in'));
    let done=false;const close=v=>{if(done)return;done=true;ov.classList.remove('in');setTimeout(()=>ov.remove(),200);onClose&&onClose(v);res(v)};
    ov._close=close;$('.x',ov).onclick=()=>{SFX.click();close(null)};
    ov.addEventListener('pointerdown',e=>{if(e.target===ov)close(null)});
    const pf=$('.pf',ov);buttons.forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.cls||'');e.innerHTML=b.label;e.disabled=!!b.dis;e.onclick=()=>{SFX.click();close(b.v!==undefined?b.v:b.label)};pf.appendChild(e)});
    if(render)render($('.pb',ov),close,ov);
  });
}

/* ---------------- NPC actors ---------------- */
const ACTORS=NPCS.map((n,i)=>{const[x,y]=randomWalkable();return{id:n.id,npc:n,x,y,tx:null,ty:null,dir:1,walk:false,t:i,wait:rr(1,4),say:'',sayT:0}});
function updateNPCs(dt){
  for(const a of ACTORS){
    a.t+=dt;
    if(a.talking){a.walk=false;continue}
    if(a.tx==null){a.wait-=dt;a.walk=false;if(a.wait<=0){const[x,y]=randomWalkable();if(Math.hypot(x-a.x,y-a.y)<900){a.tx=x;a.ty=y}else a.wait=.5}
      if(Math.random()<dt*.05&&!a.say){a.say=L(pick(a.npc.lines)[0],pick(a.npc.lines)[1]).split(/[.!?]/)[0]+'!';a.sayT=3.5}}
    else{stepToward(a,a.tx,a.ty,90*dt,true);if(a.tx==null)a.wait=rr(2,7)}
    if(a.sayT>0){a.sayT-=dt;if(a.sayT<=0)a.say=''}
  }
}
function stepToward(o,tx,ty,d,town){
  const dx=tx-o.x,dy=ty-o.y,dist=Math.hypot(dx,dy);
  if(dist<=d){o.x=tx;o.y=ty;o.tx=null;o.ty=null;o.walk=false;return true}
  let nx=o.x+dx/dist*d,ny=o.y+dy/dist*d;
  if(town&&blocked(nx,ny)){if(!blocked(nx,o.y))ny=o.y;else if(!blocked(o.x,ny))nx=o.x;else{o.tx=null;o.ty=null;o.walk=false;return true}}
  if(Math.abs(dx)>2)o.dir=dx<0?-1:1;
  o.x=nx;o.y=ny;o.walk=true;return false;
}

/* ---------------- moving the player ---------------- */
function walkTo(x,y,arrive){
  if(SCENE.type==='town'){x=clamp(x,30,MAP_W-30);y=clamp(y,TOWN_MINY,TOWN_MAXY)}else{x=clamp(x,90,ROOM_W-90);y=clamp(y,FLOOR_MIN+15,FLOOR_MAX)}
  ME.tx=x;ME.ty=y;ME.arrive=arrive||null;ME.act=null;
}
function updateMe(dt){
  ME.t+=dt;
  if(ME.tx!=null){const sp=(SCENE.type==='town'?280:240)*dt;const was=Math.floor(ME.t*4);const done=stepToward(ME,ME.tx,ME.ty,sp,SCENE.type==='town');
    if(Math.floor(ME.t*6)!==Math.floor((ME.t-dt)*6))SFX.step();
    if(done){const a=ME.arrive;ME.arrive=null;if(a)a()}}
  else ME.walk=false;
  if(ME.sayT>0){ME.sayT-=dt;if(ME.sayT<=0)ME.say=''}
  if(ME.act)tickAction(dt);
}

function useItem(it){

    if(u.fun)addStat('fun',u.fun);if(u.clean)addStat('clean',u.clean);if(u.hunger)addStat('hunger',u.hunger);
    if(u.energy){a.eAcc=(a.eAcc||0)+u.energy;if(a.eAcc>=1&&S.energy<maxEnergy()){a.eAcc-=1;S.energy++;hud()}}}
  if(a.t>=u.dur||(u.sleep&&S.energy>=maxEnergy()&&a.t>6)){ME.act=null;save()}

/* =====================================================================
   MINI GAMES (jobs) – Bubble Pop, Mash Café, Garden Harvest
   ===================================================================== */
let MINI=null;
function startMini(id,fromArcade){
  const j=JOBS[id];if(!useEnergy(j.cost))return;
  closeDlg();$$('.ov').forEach(o=>o._close&&o._close());
  const W=640,H=460;
  const ov=document.createElement('div');ov.className='mg';
  ov.innerHTML=`<div class="mgw"><div class="mgh"><span>${j.ic} ${esc(L(j.en,j.da))}</span><b id="mgS">0</b>&nbsp;·&nbsp;<b id="mgT">60</b>s</div><canvas class="mgc" id="mgC" width="${W*2}" height="${H*2}"></canvas></div>`;
  document.body.appendChild(ov);
  const c=$('#mgC',ov),g=c.getContext('2d');g.setTransform(2,0,0,2,0,0);
  const game={id,W,H,g,score:0,time:id==='garden'?45:60,over:false,t:0,fromArcade};
  MINI=game;
  const pos=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
  c.addEventListener('pointerdown',e=>{if(game.over)return;const p=pos(e);game.click&&game.click(p.x,p.y)});
  ({bubble:initBubble,cafe:initCafe,garden:initGarden})[id](game);
  // 3-2-1 countdown
  game.count=3;let last=performance.now();
  const loop=now=>{if(MINI!==game)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    if(game.count>0){game.count-=dt;game.draw(dt*0);g.fillStyle='rgba(10,30,60,.5)';g.fillRect(0,0,W,H);label(g,game.count>0?String(Math.ceil(game.count)):L('GO!','KØR!'),W/2,H/2,90);requestAnimationFrame(loop);return}
    game.t+=dt;game.time-=dt;game.update&&game.update(dt);game.draw(dt);
    $('#mgS',ov).textContent=N(game.score);$('#mgT',ov).textContent=Math.max(0,Math.ceil(game.time));
    if(game.time<=0){finishMini(game,ov);return}
    requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
}
function finishMini(game,ov){
  game.over=true;MINI=null;
  const rate={bubble:10,cafe:5,garden:6}[game.id];
  const mult=(mood()==='sad'?.7:1)*(1+S.lvl*.04)*(game.fromArcade?1.1:1);
  const coins=Math.max(5,Math.round(game.score/rate*mult)),xp=Math.round(8+game.score/(rate*5));
  S.best=S.best||{};const best=game.score>(S.best[game.id]||0);if(best)S.best[game.id]=game.score;
  addStat('fun',10);addStat('hunger',-6);bump('jobs');
  SFX.lvl();ov.remove();
  panel({title:L('💼 Shift complete!','💼 Vagten er slut!'),sm:true,html:`<div style="text-align:center"><p style="font-size:15px;margin:2px 0">${L('Score','Score')}</p><div class="logo" style="font-size:52px">${N(game.score)}</div>${best?`<p style="color:#d0457e">🏆 ${L('New best score!','Ny rekord!')}</p>`:''}
    <p style="font-size:20px;font-family:Lilita One">+${N(coins)} 🪙 &nbsp; +${xp} XP</p>${mood()==='sad'?`<p class="hint">😢 ${L('Your pet was unhappy, so the pay was lower.','Dit kæledyr var ked af det, så lønnen var lavere.')}</p>`:''}</div>`,
    buttons:[{label:L('Again','Igen')+` ⚡${JOBS[game.id].cost}`,v:'again',dis:S.energy<JOBS[game.id].cost},{label:L('Collect','Hent'),cls:'go',v:'ok'}]}).then(v=>{addCoins(coins);addXP(xp);if(v==='again')setTimeout(()=>startMini(game.id,game.fromArcade),250)});
}

/* ---- Bubble Pop: tap groups of 2+ same-coloured bubbles ---- */
function initBubble(G){
  const COLS=10,ROWS=8,R=26,cols=['#ff5a7a','#ffc93c','#43c46b','#3fa0ff','#a970ff'],ox=(G.W-COLS*2*R)/2+R,oy=G.H-R-8;
  let grid=[...Array(COLS)].map(()=>[...Array(ROWS)].map(()=>rnd(5)));
  const parts=[];
  G.click=(x,y)=>{const ci=Math.round((x-ox)/(2*R)),ri=Math.round((oy-y)/(2*R));if(ci<0||ci>=COLS||ri<0||ri>=ROWS||grid[ci][ri]==null)return;
    const col=grid[ci][ri],seen=new Set(),stack=[[ci,ri]],grp=[];
    while(stack.length){const[a,b]=stack.pop(),k=a+','+b;if(seen.has(k)||a<0||b<0||a>=COLS||b>=ROWS||grid[a][b]!==col)continue;seen.add(k);grp.push([a,b]);stack.push([a+1,b],[a-1,b],[a,b+1],[a,b-1])}
    if(grp.length<2){SFX.bad();return}
    grp.forEach(([a,b])=>{parts.push({x:ox+a*2*R,y:oy-b*2*R,c:cols[col],t:0});grid[a][b]=null});
    const pts=grp.length*grp.length*2;G.score+=pts;parts.push({x:ox+ci*2*R,y:oy-ri*2*R-20,txt:'+'+pts,t:0});SFX.pop();if(grp.length>=6)SFX.coin();
    for(let a=0;a<COLS;a++){const col2=grid[a].filter(v=>v!=null);while(col2.length<ROWS)col2.push(rnd(5));grid[a]=col2}
  };
  G.draw=dt=>{const g=G.g;g.fillStyle=lg(g,0,0,0,G.H,[[0,'#bfe6ff'],[1,'#ffe0f0']]);g.fillRect(0,0,G.W,G.H);
    for(let a=0;a<COLS;a++)for(let b=0;b<ROWS;b++){const v=grid[a][b];if(v==null)continue;const x=ox+a*2*R,y=oy-b*2*R;ell(g,x,y,R-2,R-2,cols[v],2.5);ell(g,x-8,y-9,7,5,'rgba(255,255,255,.75)',0)}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>.6){parts.splice(i,1);continue}if(p.txt)label(g,p.txt,p.x,p.y-p.t*60,24,'#ffe066');else{g.globalAlpha=1-p.t/.6;g.beginPath();g.arc(p.x,p.y,R*(1+p.t*2),0,7);g.strokeStyle=p.c;g.lineWidth=4;g.stroke();g.globalAlpha=1}}};
}

/* ---- Mash Café: fill the tray, then tap the customer whose order matches ---- */
function initCafe(G){
  const MENU=['🍟','🥔','🍲','🥤'],SEATS=[{x:110},{x:320},{x:530}],tray=[];
  const cust=SEATS.map(()=>null);let spawn=1,flash=0,flashOk=true;
  const newCust=()=>{const n=pick(NPCS);return{n,order:[...Array(1+(Math.random()<.45?1:0))].map(()=>pick(MENU)),pat:1,max:rr(9,14)}};
  G.click=(x,y)=>{
    if(y>360){const i=Math.floor((x-40)/140);if(i>=0&&i<4&&tray.length<2){tray.push(MENU[i]);SFX.pop()}else if(x>590&&tray.length){tray.length=0;SFX.click()}return}
    if(y>380)return;
    const si=SEATS.findIndex(s=>Math.abs(x-s.x)<90),cu=cust[si];if(si<0||!cu)return;
    const want=[...cu.order].sort().join(),have=[...tray].sort().join();
    if(want===have){const pts=20+Math.round(cu.pat*20);G.score+=pts;cust[si]=null;tray.length=0;SFX.coin();flash=.5;flashOk=true}
    else{G.score=Math.max(0,G.score-5);SFX.bad();flash=.5;flashOk=false}
  };
  G.update=dt=>{spawn-=dt;if(spawn<=0){const i=cust.findIndex(c=>!c);if(i>=0)cust[i]=newCust();spawn=rr(1.2,2.6)}
    cust.forEach((c,i)=>{if(!c)return;c.pat-=dt/c.max;if(c.pat<=0){cust[i]=null;G.score=Math.max(0,G.score-10);SFX.bad()}});if(flash>0)flash-=dt};
  G.draw=dt=>{const g=G.g;drawWall(g,'wp_stripes',0,0,G.W,260);drawFloor(g,'fl_checker',0,260,G.W,200);
    label(g,L('Mash Café','Mos-Café'),G.W/2,28,26);
    SEATS.forEach((s,i)=>{const c=cust[i];box(g,s.x-70,300,140,16,5,'#8b5a2b');line(g,s.x,316,s.x,360,OL,6);
      if(c){drawPet(g,s.x,300,.62,{look:c.n.look,outfit:c.n.outfit,t:G.t+i});const bw=c.order.length*44+20;box(g,s.x-bw/2,110,bw,54,14,'#fff',2.5);g.font='32px serif';g.textAlign='center';g.textBaseline='middle';c.order.forEach((o,k)=>g.fillText(o,s.x-bw/2+32+k*44,138));
        box(g,s.x-50,170,100,10,5,'#e5e7eb',2);box(g,s.x-50,170,100*c.pat,10,5,c.pat>.5?'#43c46b':c.pat>.25?'#ffc93c':'#ef4444',0)}});
    box(g,0,370,G.W,90,0,'#fff7e6',0);line(g,0,370,G.W,370,OL,3);
    MENU.forEach((m,i)=>{box(g,40+i*140,382,120,66,14,'#fff',3);g.font='40px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(m,100+i*140,416)});
    g.font='bold 14px Nunito';g.fillStyle=OL;g.textAlign='left';g.fillText(L('Tray:','Bakke:'),8,352);g.font='26px serif';tray.forEach((t,k)=>g.fillText(t,58+k*34,352));
    if(tray.length){g.font='bold 13px Nunito';g.fillStyle='#ef4444';g.textAlign='right';g.fillText(L('✕ clear','✕ tøm'),G.W-8,352)}
    if(flash>0){g.fillStyle=flashOk?'rgba(67,196,107,.18)':'rgba(239,68,68,.18)';g.fillRect(0,0,G.W,G.H)}
    if(G.t<5){g.font='bold 15px Nunito';g.fillStyle=OL;g.textAlign='center';g.fillText(L('Tap food to fill the tray, then tap the customer!','Tryk på mad for at fylde bakken, og tryk så på gæsten!'),G.W/2,60)}};
}

/* ---- Garden Harvest: whack the veggies, not the weeds ---- */
function initGarden(G){
  const holes=[];for(let r=0;r<3;r++)for(let k=0;k<4;k++)holes.push({x:110+k*140,y:150+r*110,item:null,t:0,life:0});
  const GOOD=['🥕','🥔','🍅','🌽'],parts=[];let next=.5;
  G.click=(x,y)=>{for(const h of holes){if(h.item&&Math.hypot(x-h.x,y-(h.y-25))<52){
    let pts;if(h.item==='🌿'||h.item==='🐛'){pts=-10;SFX.bad()}else if(h.item==='⭐'){pts=30;SFX.coin()}else{pts=10;SFX.pop()}
    G.score=Math.max(0,G.score+pts);parts.push({x:h.x,y:h.y-60,txt:(pts>0?'+':'')+pts,t:0,good:pts>0});h.item=null;return}}};
  G.update=dt=>{next-=dt;const speed=1+G.t/45;if(next<=0){const free=holes.filter(h=>!h.item);if(free.length){const h=pick(free);const r=Math.random();h.item=r<.08?'⭐':r<.32?pick(['🌿','🐛']):pick(GOOD);h.t=0;h.life=rr(.9,1.5)/speed}next=rr(.25,.6)/speed}
    holes.forEach(h=>{if(h.item){h.t+=dt;if(h.t>h.life)h.item=null}})};
  G.draw=dt=>{const g=G.g;g.fillStyle=lg(g,0,0,0,G.H,[[0,'#bfe6ff'],[.2,'#d8f2ff'],[.21,'#86d16f'],[1,'#5fb552']]);g.fillRect(0,0,G.W,G.H);
    label(g,L('Community Garden','Fælleshaven'),G.W/2,40,26);
    holes.forEach(h=>{ell(g,h.x,h.y,50,18,'#6b4423',3);if(h.item){const up=Math.min(1,h.t/.12)*Math.min(1,(h.life-h.t)/.12+.2);g.save();g.beginPath();g.rect(h.x-60,h.y-120,120,120);g.clip();g.font='54px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(h.item,h.x,h.y-30+(1-up)*50);g.restore()}ell(g,h.x,h.y+2,50,12,null,0);g.fillStyle='#8a5a3a';g.beginPath();g.ellipse(h.x,h.y+8,52,10,0,0,Math.PI);g.fill()});
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>.7){parts.splice(i,1);continue}label(g,p.txt,p.x,p.y-p.t*50,26,p.good?'#ffe066':'#ff8a80')}
    if(G.t<5){g.font='bold 15px Nunito';g.fillStyle=OL;g.textAlign='center';g.fillText(L('Tap veggies 🥕🥔 – avoid weeds 🌿 and bugs 🐛!','Tryk på grøntsager 🥕🥔 – undgå ukrudt 🌿 og biller 🐛!'),G.W/2,72)}};
}

/* =====================================================================
   FRIENDS ON THE SAME WI-FI (WebRTC via PeerJS, no relay servers)
   The host's browser relays positions, chat and houses between players.
   ===================================================================== */
const PEERJS='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',PREFIX='potato-ville-';
const peerOpts=()=>window.__PEER_OPTS||{config:{iceServers:[]},pingInterval:4000};
const net=(()=>{
  const NS={role:null,peer:null,conns:{},conn:null,code:'',id:'solo',players:{},houses:{},lastSent:'',sendT:0,seen:{}};
  const prof=()=>({name:S.name,look:S.look,outfit:S.outfit,lvl:S.lvl});
  const myState=()=>({scene:sceneKey(),x:Math.round(ME.act?ME.act.item.x:ME.x),y:Math.round(ME.act?ME.act.item.y:ME.y),dir:ME.dir,walk:ME.walk&&!ME.act,say:ME.sayT>0?ME.say:''});
  const send=m=>{if(NS.role==='guest'&&NS.conn&&NS.conn.open)try{NS.conn.send(m)}catch(e){}};
  const bcast=(m,except)=>{Object.entries(NS.conns).forEach(([id,c])=>{if(id!==except&&c.open)try{c.send(m)}catch(e){}})};
  const loadPeer=()=>window.Peer?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src=PEERJS;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)});
  const code=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[rnd(32)]).join('');
  function upsert(id,data){const p=NS.players[id]=NS.players[id]||{id,x:0,y:0,rx:0,ry:0,dir:1,walk:false,t:rnd(9)};
    Object.assign(p,data);if(p.rx===0&&p.ry===0){p.rx=p.x;p.ry=p.y}return p}
  function playersMsg(){const list=Object.values(NS.players).map(p=>({id:p.id,name:p.name,look:p.look,outfit:p.outfit,lvl:p.lvl,scene:p.scene,x:p.x,y:p.y,dir:p.dir,walk:p.walk,say:p.say}));return{t:'players',list}}
  function houseUpdate(owner,rooms){NS.houses[owner]=rooms;if(SCENE.type==='home'&&SCENE.owner===owner&&OTHER_HOUSE)OTHER_HOUSE.rooms=rooms}
  function onHostMsg(c,m){if(!m||typeof m!=='object')return;NS.seen[c.peer]=Date.now();
    if(m.t==='hello'){if(Object.keys(NS.players).length>=4){c.send({t:'full'});setTimeout(()=>c.close(),300);return}
      NS.conns[c.peer]=c;upsert(c.peer,{...m.prof,scene:'town',x:BLD[0].door.x,y:520});if(m.house)NS.houses[c.peer]=m.house;
      c.send({t:'welcome',id:c.peer,houses:NS.houses});bcast(playersMsg());bcast({t:'house',owner:c.peer,rooms:NS.houses[c.peer]},c.peer);
      toast(L(`📶 ${esc(m.prof.name)} joined!`,`📶 ${esc(m.prof.name)} er med!`));SFX.buy();refreshNet();return}
    const p=NS.players[c.peer];if(!p)return;
    if(m.t==='st')Object.assign(p,m.s);
    else if(m.t==='prof'){Object.assign(p,m.prof);bcast(playersMsg())}
    else if(m.t==='house'){houseUpdate(c.peer,m.rooms);bcast({t:'house',owner:c.peer,rooms:m.rooms},c.peer)}
    else if(m.t==='chat'){p.say=String(m.text).slice(0,60);p.sayT=5;bcast({t:'chat',id:c.peer,text:p.say},c.peer)}
  }
  function hostLost(id){if(!NS.players[id])return;const nmx=NS.players[id].name;delete NS.players[id];delete NS.conns[id];bcast({t:'bye',id});toast(L(`👋 ${esc(nmx)} left`,`👋 ${esc(nmx)} gik`));kickIfVisiting(id);refreshNet()}
  function kickIfVisiting(id){if(SCENE.type==='home'&&SCENE.owner===id){goTown('home');toast(L('Your friend left, so you walked back to town.','Din ven gik, så du gik tilbage til byen.'))}}
  function onGuestMsg(m){if(!m||typeof m!=='object')return;NS.lastHost=Date.now();
    if(m.t==='ping')return;
    if(m.t==='welcome'){NS.id=m.id;Object.assign(NS.houses,m.houses||{});toast(L('📶 Connected! Walk to town to meet your friends.','📶 Forbundet! Gå til byen for at møde dine venner.'));refreshNet();sendMe(true);return}
    if(m.t==='full'){toast(L('That game is full (4 players).','Det spil er fuldt (4 spillere).'));leave();return}
    if(m.t==='players'){const seen=new Set();m.list.forEach(d=>{if(d.id===NS.id)return;seen.add(d.id);const p=upsert(d.id,d);if(d.say&&d.say!==p.lastSay){p.lastSay=d.say;p.sayT=5}});Object.keys(NS.players).forEach(id=>{if(!seen.has(id)){delete NS.players[id];kickIfVisiting(id)}});refreshNet(true);return}
    if(m.t==='house'){houseUpdate(m.owner,m.rooms);return}
    if(m.t==='chat'){const p=NS.players[m.id];if(p){p.say=m.text;p.sayT=5;p.lastSay=m.text}return}
    if(m.t==='bye'){delete NS.players[m.id];kickIfVisiting(m.id);refreshNet();return}
  }
  function sendMe(force){
    const s=myState(),k=JSON.stringify(s);
    if(NS.role==='host'){const me=upsert('H',{...prof(),...s});me.x=s.x;me.y=s.y}
    if(!force&&k===NS.lastSent&&Date.now()-NS.sendT<1500)return;NS.lastSent=k;NS.sendT=Date.now();
    if(NS.role==='guest')send({t:'st',s});
  }
  let acc=0;
  function tick(dt){
    for(const p of Object.values(NS.players)){p.t+=dt;p.rx+=(p.x-p.rx)*Math.min(1,dt*8);p.ry+=(p.y-p.ry)*Math.min(1,dt*8);p.walk=Math.hypot(p.x-p.rx,p.y-p.ry)>2;if(p.sayT>0){p.sayT-=dt;if(p.sayT<=0)p.say=''}}
    if(!NS.role)return;acc+=dt;if(acc<.1)return;acc=0;sendMe();
    if(NS.role==='host'){bcast(playersMsg());const now=Date.now();Object.entries(NS.conns).forEach(([id,c])=>{try{c.open&&c.send({t:'ping'})}catch(e){}if(NS.seen[id]&&now-NS.seen[id]>12000)hostLost(id)})}
    else if(NS.lastHost&&Date.now()-NS.lastHost>12000){toast(L('📶 Lost the connection to the host.','📶 Mistede forbindelsen til hosten.'));leave()}
  }
  async function host(){
    try{await loadPeer()}catch(e){toast(L('Could not load the multiplayer module. Are you online?','Kunne ikke hente multiplayer-delen. Er du online?'));return false}
    for(let k=0;k<3;k++){NS.code=code();try{NS.peer=await new Promise((res,rej)=>{const p=new Peer(PREFIX+NS.code,peerOpts());p.on('open',()=>res(p));p.on('error',e=>{p.destroy();rej(e)})});break}catch(e){if(k===2){toast(L('Could not open a game. Try again.','Kunne ikke åbne et spil. Prøv igen.'));return false}}}
    NS.role='host';NS.id='H';NS.players={};upsert('H',{...prof(),...myState()});NS.houses.H=S.rooms;
    NS.peer.on('connection',c=>{c.on('data',m=>onHostMsg(c,m));c.on('close',()=>hostLost(c.peer));c.on('error',()=>hostLost(c.peer))});
    NS.peer.on('disconnected',()=>{try{NS.peer.reconnect()}catch(e){}});
    return true;
  }
  async function join(cd){
    try{await loadPeer()}catch(e){toast(L('Could not load the multiplayer module. Are you online?','Kunne ikke hente multiplayer-delen. Er du online?'));return false}
    return new Promise(res=>{const p=new Peer(undefined,peerOpts());NS.peer=p;let tries=0;
      const go=()=>{const c=p.connect(PREFIX+cd,{reliable:true});const to=setTimeout(()=>{if(!c.open){toast(L('Could not reach the host. Are you on the same Wi-Fi?','Kunne ikke nå hosten. Er I på samme wifi?'));leave();res(false)}},20000);
        c.on('open',()=>{clearTimeout(to);NS.conn=c;NS.role='guest';NS.code=cd;NS.lastHost=Date.now();c.send({t:'hello',prof:prof(),house:S.rooms});res(true)});
        c.on('data',onGuestMsg);c.on('close',()=>{if(NS.role==='guest'){toast(L('📶 The host ended the game.','📶 Hosten afsluttede spillet.'));leave()}})};
      p.on('open',go);
      p.on('error',e=>{if(e.type==='peer-unavailable'&&++tries<4){setTimeout(go,2000);return}if(!NS.role){toast(e.type==='peer-unavailable'?L('No game found with that code. Same Wi-Fi?','Intet spil fundet med den kode. Samme wifi?'):L('Connection problem.','Forbindelsesproblem.'));leave();res(false)}})});
  }
  function leave(){const wasVisiting=SCENE.type==='home'&&SCENE.owner!=='me'&&!NPC_BY[SCENE.owner];
    try{NS.conn&&NS.conn.close()}catch(e){}try{NS.peer&&NS.peer.destroy()}catch(e){}
    Object.assign(NS,{role:null,peer:null,conns:{},conn:null,code:'',id:'solo',players:{},houses:{}});if(wasVisiting)goTown('home');refreshNet()}
  function others(){return Object.values(NS.players).filter(p=>p.id!==NS.id&&!(NS.role==='host'&&p.id==='H')).map(p=>({...p,x:p.rx,y:p.ry,me:false}))}
  function sortedOthers(){return others().sort((a,b)=>a.id<b.id?-1:1)}
  return{
    host,join,leave,tick,others,
    myId:()=>NS.id,role:()=>NS.role,code:()=>NS.code,
    lotOwner:lot=>sortedOthers()[lot-1]||null,
    visit:id=>{const p=NS.players[id],rooms=NS.houses[id];if(!p||!rooms){toast(L('Their house is still loading…','Huset indlæses stadig…'));return}visitHouse(id,rooms,p.name+L("'s House","s hus"))},
    scene:()=>sendMe(true),
    me:()=>{if(NS.role==='guest')send({t:'prof',prof:prof()});else if(NS.role==='host'){upsert('H',prof());bcast(playersMsg())}},
    houseChanged:()=>{if(NS.role==='guest')send({t:'house',rooms:S.rooms});else if(NS.role==='host'){NS.houses.H=S.rooms;bcast({t:'house',owner:'H',rooms:S.rooms})}},
    chat:text=>{ME.say=text;ME.sayT=5;if(NS.role==='guest')send({t:'chat',text});else if(NS.role==='host'){const me=NS.players.H;if(me){me.say=text}bcast({t:'chat',id:'H',text})}},
    count:()=>Object.keys(NS.players).length
  };
})();
function refreshNet(quiet){
  const on=!!net.role();$('#nChat').style.display=on?'':'none';if(!on)$('#chat').classList.remove('on');
  const d=$('#dNet');const n=net.others().length;d.textContent=n;d.classList.toggle('on',n>0);
  const box=$('#netBody');if(box&&!quiet)drawNet(box);else if(box)drawNetList(box);
}
const JOIN_CODE=(new URLSearchParams(location.search).get('join')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
function openNet(prefill){
  closeDlg();
  panel({title:L('📶 Play with friends','📶 Spil med venner'),render:b=>{b.innerHTML='<div id="netBody"></div>';drawNet($('#netBody',b),prefill)}});
}
function drawNet(box,prefill){
  if(!box)return;const role=net.role();
  if(!role){box.innerHTML=`<p>${L('Play together with up to 3 friends on the <b>same Wi-Fi</b>. You will see each other walk around town and can visit each other\'s homes!','Spil sammen med op til 3 venner på <b>samme wifi</b>. I kan se hinanden gå rundt i byen og besøge hinandens hjem!')}</p>
    <div class="split" style="grid-template-columns:1fr 1fr"><div class="goal" style="flex-direction:column;align-items:stretch"><b>🏠 ${L('Host a game','Host et spil')}</b><span class="hint">${L('Get a code to share.','Få en kode du kan dele.')}</span><button class="btn go" id="nHost">${L('Host','Host')}</button></div>
    <div class="goal" style="flex-direction:column;align-items:stretch"><b>🔑 ${L('Join a game','Join et spil')}</b><input class="tx" id="nCode" maxlength="4" placeholder="${L('CODE','KODE')}" style="text-transform:uppercase;text-align:center;letter-spacing:.3em;font-family:Lilita One" value="${prefill||''}"><button class="btn ok" id="nJoin">Join</button></div></div>
    <p class="hint">${L('A free matchmaking service only swaps the code – the game runs directly between your devices.','En gratis forbindelsestjeneste bytter kun koden – spillet kører direkte mellem jeres enheder.')}</p>`;
    $('#nHost',box).onclick=async()=>{$('#nHost',box).disabled=true;$('#nHost',box).textContent='⏳';if(await net.host()){toast(L('🏠 Your game is open! Share the code.','🏠 Dit spil er åbent! Del koden.'))}drawNet(box)};
    $('#nJoin',box).onclick=async()=>{const cd=($('#nCode',box).value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(cd.length!==4){toast(L('The code has 4 characters.','Koden har 4 tegn.'));return}$('#nJoin',box).disabled=true;$('#nJoin',box).textContent='⏳';await net.join(cd);drawNet(box)};
    return}
  box.innerHTML=`${role==='host'?`<p style="text-align:center;margin:0">${L('Your game code','Din spilkode')}</p><div class="code">${net.code()}</div><div class="row" style="justify-content:center;margin:8px 0"><button class="btn ok" id="nShare">📤 ${L('Invite','Inviter')}</button></div>`:`<p>✅ ${L('Connected to game','Forbundet til spil')} <b>${net.code()}</b></p>`}
    <h3 style="margin:10px 0 6px">${L('Players','Spillere')}</h3><div class="ppl" id="nList"></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn no" id="nLeave">${role==='host'?L('Close game','Luk spillet'):L('Leave','Forlad')}</button></div>`;
  drawNetList(box);
  const sh=$('#nShare',box);if(sh)sh.onclick=async()=>{const url=location.href.split(/[?#]/)[0]+'?join='+net.code(),text=L(`Come play Potato Ville with me! Code: ${net.code()}`,`Kom og spil Potato Ville med mig! Kode: ${net.code()}`);
    try{if(navigator.share){await navigator.share({title:'Potato Ville',text,url});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(text+' '+url);toast(L('📋 Invite link copied','📋 Invitationslink kopieret'))}catch(e){prompt('',url)}};
  $('#nLeave',box).onclick=()=>{net.leave();drawNet(box)};
}
function drawNetList(box){const l=$('#nList',box);if(!l)return;
  const rows=[{id:'me',name:S.name+L(' (you)',' (dig)'),look:S.look,outfit:S.outfit,lvl:S.lvl},...net.others()];
  l.innerHTML=rows.map(p=>`<div class="pp"><canvas data-p="${p.id}" width="92" height="104"></canvas><div class="tx">${esc(p.name)}<br><small class="hint">${L('Level','Niveau')} ${p.lvl||1} · ${p.scene==='town'?L('in town','i byen'):p.id==='me'?'':L('at home','hjemme')}</small></div>${p.id!=='me'?`<button class="btn sm go" data-v="${p.id}">🏡 ${L('Visit','Besøg')}</button>`:''}</div>`).join('');
  $$('canvas[data-p]',l).forEach(c=>{const p=rows.find(r=>String(r.id)===c.dataset.p);drawPet(c.getContext('2d'),46,100,.48,{look:p.look,outfit:p.outfit,t:0})});
  $$('[data-v]',l).forEach(b=>b.onclick=()=>{$$('.ov').forEach(o=>o._close&&o._close());net.visit(b.dataset.v)});
}
function playerMenu(o){
  panel({title:esc(o.name),sm:true,html:`<div style="text-align:center"><canvas id="pmC" width="240" height="260" style="width:120px;height:130px"></canvas><p>${L('Level','Niveau')} ${o.lvl||1}</p></div>`,render:b=>{drawPet($('#pmC',b).getContext('2d'),120,252,1.05,{look:o.look,outfit:o.outfit,t:0})},
    buttons:[{label:'👋 '+L('Wave','Vink'),v:'wave'},{label:'🏡 '+L('Visit house','Besøg hus'),cls:'go',v:'visit'}]}).then(v=>{if(v==='wave'){net.chat('👋');SFX.talk()}if(v==='visit')net.visit(o.id)});
}

/* =====================================================================
   MAIN LOOP & START
   ===================================================================== */
const KEYS={};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;KEYS[e.key.toLowerCase()]=true;
  if(e.key==='Escape'){const o=$$('.ov').pop();if(o){o._close();return}if(DLG)closeDlg();if(BUILD.on)endBuild()}});
addEventListener('keyup',e=>{KEYS[e.key.toLowerCase()]=false});
function keyMove(dt){if(anyPanel()||BUILD.on)return;let dx=(KEYS.arrowright||KEYS.d?1:0)-(KEYS.arrowleft||KEYS.a?1:0),dy=(KEYS.arrowdown||KEYS.s?1:0)-(KEYS.arrowup||KEYS.w?1:0);
  if(dx||dy){const l=Math.hypot(dx,dy);walkTo(ME.x+dx/l*60,ME.y+dy/l*60);closeDlgSoft()}}
let lastT=performance.now(),secAcc=0,started=false;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(started){
    keyMove(dt);updateMe(dt);updateNPCs(dt);updateHost(dt);checkPickups();net.tick(dt);
    secAcc+=dt;if(secAcc>=1){secAcc=0;tickStats(Date.now());hud();if(Math.random()<.2)goalsCheck()}
    if(DLG&&DLG.a&&Math.hypot(DLG.a.x-ME.x,DLG.a.y-ME.y)>(SCENE.type==='town'?220:420))closeDlg();
  }
  render(now);
  requestAnimationFrame(frame);
}
function startGame(first){
  started=true;$('#hud').style.display='';$('#nav').style.display='';$('.rbtns').style.display='';
  ensureDaily();goHome(0);hud();goalsCheck();applyStatic();
  if(first){setTimeout(()=>panel({title:L(`👋 Welcome to Potato Ville, ${esc(S.name)}!`,`👋 Velkommen til Potato Ville, ${esc(S.name)}!`),sm:true,html:`<p>${L('This is your new home! A few tips to get started:','Dette er dit nye hjem! Et par tips til at komme i gang:')}</p>
    <div class="goal"><div class="ic">🧊</div><div class="tx">${L('Tap the fridge to eat a snack.','Tryk på køleskabet for at få en snack.')}</div></div>
    <div class="goal"><div class="ic">🗺️</div><div class="tx">${L('Go to town to meet neighbours, shop and work jobs.','Gå til byen for at møde naboer, shoppe og tage jobs.')}</div></div>
    <div class="goal"><div class="ic">🎯</div><div class="tx">${L('Check Goals for rewards every day.','Tjek Mål for belønninger hver dag.')}</div></div>`,buttons:[{label:L("Let's play!",'Lad os spille!'),cls:'go'}]}).then(()=>{if(JOIN_CODE)openNet(JOIN_CODE)}),400)}
  else if(JOIN_CODE)setTimeout(()=>openNet(JOIN_CODE),500);
  else if(canClaimStreak())setTimeout(()=>{toast(L('🎁 Your daily reward is ready in 🎯 Goals!','🎁 Din daglige belønning venter i 🎯 Mål!'),3500)},900);
}
// buttons
$('#nHome').onclick=()=>{SFX.click();if(SCENE.type==='home'&&SCENE.owner==='me')return;goHome(0)};
$('#nTown').onclick=()=>{SFX.click();if(SCENE.type==='town')return;goTown(SCENE.type==='home'&&SCENE.owner!=='me'?(BLD.find(b=>b.npc===SCENE.owner)||{id:'home'}).id:'home')};
$('#nGoals').onclick=()=>{SFX.click();openGoals()};
$('#nWard').onclick=()=>{SFX.click();openWardrobe()};
$('#nBag').onclick=()=>{SFX.click();openBag(false)};
$('#nNet').onclick=()=>{SFX.click();openNet()};
$('#nBuild').onclick=()=>{SFX.click();BUILD.on?endBuild():startBuild()};
$('#nChat').onclick=()=>{SFX.click();$('#chat').classList.toggle('on');if($('#chat').classList.contains('on'))$('#chatIn').focus()};
const sendChat=()=>{const v=$('#chatIn').value.trim();if(!v)return;net.chat(v.slice(0,60));$('#chatIn').value='';SFX.talk()};
$('#chatGo').onclick=sendChat;$('#chatIn').onkeydown=e=>{if(e.key==='Enter')sendChat()};
$('#aL').onclick=()=>switchRoom(-1);$('#aR').onclick=()=>switchRoom(1);
$('#bLang').onclick=()=>{SFX.click();setLang(LANG==='da'?'en':'da')};
$('#bSnd').onclick=()=>{SFX.on=!SFX.on;$('#bSnd').textContent=SFX.on?'🔊':'🔇';savePref();SFX.click()};
$('#bSnd').textContent=SFX.on?'🔊':'🔇';
$('#bMenu').onclick=()=>{SFX.click();openMenu()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow()});
addEventListener('beforeunload',()=>{saveNow();net.leave()});
// boot
load();resize();tickStats(Date.now(),true);document.documentElement.lang=LANG;applyStatic();
if(!S.created){$('#hud').style.display='none';$('#nav').style.display='none';$('.rbtns').style.display='none';openCreator(false)}else startGame(false);
requestAnimationFrame(frame);
</script>

const OL='#3b2a20';
function shade(hex,f){ // f<0 darker, f>0 lighter
  let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  if(f<0){r*=1+f;g*=1+f;b*=1+f}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}
  return'#'+((1<<24)+(Math.round(r)<<16)+(Math.round(g)<<8)+Math.round(b)).toString(16).slice(1);
}
function RR(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function box(c,x,y,w,h,r,fill,lw=3){RR(c,x,y,w,h,r);c.fillStyle=fill;c.fill();if(lw){c.lineWidth=lw;c.strokeStyle=OL;c.stroke()}}
function ell(c,x,y,rx,ry,fill,lw=3,rot=0){c.beginPath();c.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill()}if(lw){c.lineWidth=lw;c.strokeStyle=OL;c.stroke()}}
function lg(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}
function poly(c,pts,fill,lw=3){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(lw){c.lineWidth=lw;c.strokeStyle=OL;c.stroke()}}
function line(c,x0,y0,x1,y1,col=OL,lw=3){c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.stroke()}

function bodyPath(c){c.beginPath();c.moveTo(0,-120);c.bezierCurveTo(31,-121,49,-96,48,-63);c.bezierCurveTo(47,-30,32,-7,0,-7);c.bezierCurveTo(-34,-7,-49,-31,-48,-65);c.bezierCurveTo(-47,-99,-29,-119,0,-120);c.closePath()}
// p = {look, outfit, t, walk, dir, mood, sleep}
function drawPet(c,x,y,sc,p){
  const lk=p.look||{},of=p.outfit||{},t=p.t||0,col=lk.color||'#f2c879',an=lk.animal||'bunny';

  c.translate(0,bob);

  if(of.top==='top_hero'){poly(c,[-30,-58,30,-58,46,-4,-46,-4],'#ffc93c')}

  const topCol=of.top&&CLOTH[of.top]?CLOTH[of.top].col:col;
  const sleeve=['top_tee','top_stripes','top_dress','top_vest'].includes(of.top)?col:topCol;
  c.save();c.translate(-44,-52);c.rotate(.5+wk*.35);ell(c,0,10,10,17,sleeve);c.restore();
  c.save();c.translate(44,-52);c.rotate(-.5-wk*.35);ell(c,0,10,10,17,sleeve);c.restore();
  // body
  bodyPath(c);const g=c.createRadialGradient(-16,-92,6,0,-64,62);g.addColorStop(0,lt);g.addColorStop(.6,col);g.addColorStop(1,dk);c.fillStyle=g;c.fill();
  // potato speckles
  if(!p.blank){c.fillStyle=shade(col,-.3);[[-26,-96,2.6],[29,-84,2.2],[-33,-40,2.4],[24,-30,2]].forEach(([sx,sy,r])=>{c.beginPath();c.arc(sx,sy,r,0,7);c.fill()})}
  // fur pattern
  if(lk.pattern&&lk.pattern!=='none'&&!p.blank){c.save();bodyPath(c);c.clip();const pc=shade(col,-.28),pl=shade(col,.45);
    if(lk.pattern==='freckles'){c.fillStyle=pc;[[-36,-64],[-30,-58],[-40,-56],[36,-64],[30,-58],[40,-56]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,2.2,0,7);c.fill()})}
    if(lk.pattern==='spots'){c.fillStyle=pc;[[-28,-100,9],[24,-108,7],[30,-40,10],[-34,-30,8],[8,-118,5]].forEach(([x,y,r])=>{c.beginPath();c.ellipse(x,y,r,r*.8,0,0,7);c.fill()})}
    if(lk.pattern==='stripes'){c.fillStyle=pc;for(let k=-2;k<=2;k++){c.beginPath();c.moveTo(k*18-4,-122);c.lineTo(k*18+4,-122);c.lineTo(k*16,-98);c.closePath();c.fill()}}
    if(lk.pattern==='belly'){c.fillStyle=pl;c.beginPath();c.ellipse(0,-34,30,28,0,0,7);c.fill()}
    if(lk.pattern==='heart'){c.fillStyle='#ff6f9f';c.save();c.translate(30,-100);c.scale(.5,.5);c.beginPath();c.moveTo(0,10);c.bezierCurveTo(-18,-2,-10,-16,0,-6);c.bezierCurveTo(10,-16,18,-2,0,10);c.fill();c.restore()}
    c.restore()}
  // clothes clipped to body
  c.save();bodyPath(c);c.clip();drawBottom(c,of.bottom);drawTop(c,of.top,col);c.restore();
  bodyPath(c);c.lineWidth=3.5;c.strokeStyle=OL;c.stroke();
  // skirts / dress flare outside body

  if(of.bottom==='bot_tutu'){for(let i=-3;i<=3;i++)ell(c,i*15,-14,14,9,CLOTH.bot_tutu.col,2)}
  drawEars(c,an,col,dk,lt,true,t);
  if(!p.blank)drawFace(c,lk,p);
  drawAcc(c,of.acc);
  if(of.glasses)drawGlasses(c,of.glasses);

}
function drawEars(c,an,col,dk,lt,front,t){
  const inner='#ffb3c7';
  if(!front){
    if(an==='bunny'){const w=Math.sin(t*1.7)*.05;[-1,1].forEach(s=>{c.save();c.translate(s*17,-108);c.rotate(s*(.18+w));ell(c,0,-40,14,44,col);ell(c,0,-38,7,32,inner,0);c.restore()})}
    if(an==='dog'){[-1,1].forEach(s=>{c.save();c.translate(s*40,-98);c.rotate(s*.35);ell(c,s*4,22,15,30,dk);c.restore()})}
    if(an==='elephant'){[-1,1].forEach(s=>{ell(c,s*52,-74,28,36,col);ell(c,s*52,-74,17,24,inner,0)})}
    if(an==='mouse'){[-1,1].forEach(s=>{ell(c,s*36,-112,24,24,col);ell(c,s*36,-112,14,14,inner,0)})}
    if(an==='bear'){[-1,1].forEach(s=>{ell(c,s*33,-110,15,15,col);ell(c,s*33,-110,8,8,dk,0)})}
    if(an==='panda'){[-1,1].forEach(s=>ell(c,s*34,-110,16,16,'#222'))}
    if(an==='koala'){[-1,1].forEach(s=>{ell(c,s*46,-102,28,26,col);ell(c,s*46,-102,16,15,'#f5f0e6',0)})}
    if(an==='frog'){[-1,1].forEach(s=>ell(c,s*22,-114,18,16,col))}
    if(an==='deer'){[-1,1].forEach(s=>{c.save();c.translate(s*40,-104);c.rotate(s*.9);ell(c,0,-12,9,18,col);ell(c,0,-12,4,11,inner,0);c.restore()})}
    if(an==='unicorn'){for(let i=0;i<5;i++)ell(c,-30+i*4,-112+i*14,13,15,['#ff9ccb','#a970ff','#7fd0ff','#9be37a','#ffe066'][i],2.5)}
  }else{
    if(an==='cat'){[-1,1].forEach(s=>{poly(c,[s*14,-117,s*44,-112,s*36,-150],col);poly(c,[s*21,-118,s*38,-116,s*34,-138],inner,0)})}
    if(an==='fox'){[-1,1].forEach(s=>{poly(c,[s*10,-118,s*44,-108,s*36,-158],col);poly(c,[s*25,-140,s*36,-158,s*30,-134],'#fff',0)})}
    if(an==='pig'){[-1,1].forEach(s=>{poly(c,[s*16,-116,s*42,-108,s*42,-132],shade(col,-.08))})}
    if(an==='deer'){[-1,1].forEach(s=>{line(c,s*14,-116,s*24,-150,'#a0672e',5);line(c,s*20,-138,s*34,-146,'#a0672e',4);line(c,s*24,-150,s*20,-164,'#a0672e',4);line(c,s*24,-150,s*36,-160,'#a0672e',4)})}
    if(an==='unicorn'){[-1,1].forEach(s=>poly(c,[s*20,-116,s*40,-108,s*36,-134],col));poly(c,[-9,-116,9,-116,0,-162],'#ffd23f');line(c,-6,-128,6,-132,'#e0a800',2);line(c,-4,-142,4,-146,'#e0a800',2)}
  }
}
function drawTail(c,an,col,dk,t){
  const w=Math.sin(t*6)*.25;
  c.save();c.translate(40,-28);c.rotate(w);
  if(an==='cat'){c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(30,-5,26,-40);c.lineWidth=10;c.strokeStyle=OL;c.lineCap='round';c.stroke();c.lineWidth=6;c.strokeStyle=col;c.stroke()}
  if(an==='fox'){ell(c,22,-18,16,30,col,3,-.6);ell(c,34,-38,8,10,'#fff',0,-.6)}
  if(an==='dog'){ell(c,14,-14,6,14,dk,3,-.8)}
  if(an==='pig'){c.beginPath();c.arc(12,-6,7,0,5.5);c.lineWidth=4;c.strokeStyle=shade(col,-.2);c.stroke()}
  if(an==='bunny'){ell(c,8,-2,10,10,'#fff')}
  if(an==='deer'){ell(c,8,-4,8,10,'#fff')}
  if(an==='panda'){ell(c,8,-2,9,9,'#222')}
  if(an==='unicorn'){for(let i=0;i<4;i++)ell(c,10+i*6,-6-i*10,9,12,['#ff9ccb','#a970ff','#7fd0ff','#ffe066'][i],2,-.5)}
  if(an==='bear'||an==='mouse'){if(an==='mouse'){c.beginPath();c.moveTo(0,0);c.bezierCurveTo(25,0,30,-25,45,-10);c.lineWidth=3;c.strokeStyle='#e7a0b4';c.stroke()}}
  c.restore();
}
// eyes follow the mouse (or the last touch on phones)
const PTRS={x:-1,y:-1,t:0};
addEventListener('pointermove',e=>{PTRS.x=e.clientX;PTRS.y=e.clientY;PTRS.t=performance.now()},{passive:true});
addEventListener('pointerdown',e=>{PTRS.x=e.clientX;PTRS.y=e.clientY;PTRS.t=performance.now()},{passive:true});
let RECT_F=-1;
function eyeLook(c){
  if(PTRS.t===0||!c.canvas||!c.canvas.isConnected)return{x:0,y:0};
  const cvs=c.canvas;if(cvs._rf!==RECT_F){cvs._r=cvs.getBoundingClientRect();cvs._rf=RECT_F}const r=cvs._r;if(!r.width)return{x:0,y:0};
  const m=c.getTransform(),ex=m.c*-80+m.e,ey=m.d*-80+m.f,kx=cvs.width/r.width,mx=(PTRS.x-r.left)*kx,my=(PTRS.y-r.top)*kx,sc=Math.abs(m.d)||1;
  const dx=(mx-ex)/sc,dy=(my-ey)/sc,d=Math.hypot(dx,dy)||1,f=Math.min(1,d/60);
  return{x:dx/d*f*3.2*Math.sign(m.a||1),y:dy/d*f*2.6}}
function drawFace(c,lk,p){
  const LK=p.blank?{x:0,y:0}:eyeLook(c);
  const blink=(p.t||0)%4>3.85||p.sleep;
  const sad=p.mood==='sad',iris=lk.eyeCol||'#3b2414';
  if(lk.animal==='panda')[-1,1].forEach(s=>ell(c,s*18,-78,16,19,'#222',0,s*-.3));
  [-1,1].forEach(s=>{
    const ex=s*17,ey=-80;
    if(lk.eyes==='happy'&&!sad){c.beginPath();c.arc(ex,ey+4,9,Math.PI+.3,-.3);c.lineWidth=3.5;c.strokeStyle=OL;c.stroke();return}
    if(lk.eyes==='wink'&&s<0&&!blink){c.beginPath();c.moveTo(ex-9,ey+1);c.quadraticCurveTo(ex,ey-6,ex+9,ey+1);c.lineWidth=3.5;c.strokeStyle=OL;c.stroke();return}
    if(blink){c.beginPath();c.arc(ex,ey+2,9,.2,Math.PI-.2);c.lineWidth=3;c.strokeStyle=OL;c.stroke();return}
    const big=lk.eyes==='cute'?1.25:1;ell(c,ex,ey,12.5*big,15*big,'#fff',3);
    const ix=ex+LK.x,iy=ey+LK.y;
    ell(c,ix,iy+2,7.5*big,9*big,iris,0);ell(c,ix,iy+2,4*big,5*big,'#111',0);if(big>1){c.fillStyle='#fff';c.beginPath();c.arc(ix+3,iy+6,2,0,7);c.fill()}
    c.fillStyle='#fff';c.beginPath();c.arc(ix-2.5,iy-2,2.6,0,7);c.fill();
    if(lk.eyes==='sparkle'){c.beginPath();c.arc(ix+3,iy+5,1.6,0,7);c.fill();c.beginPath();c.arc(ix-3,iy+6,1,0,7);c.fill()}
    if(lk.eyes==='lashes'){for(let k=0;k<3;k++)line(c,ex+s*(5+k*4),ey-13+k*2,ex+s*(9+k*5),ey-19+k*3,OL,2.5)}
    if(lk.eyes==='sleepy'){c.save();c.beginPath();c.ellipse(ex,ey,12.5,15,0,Math.PI,0);c.fillStyle=shade(lk.color||'#f2c879',-.1);c.fill();c.lineWidth=3;c.strokeStyle=OL;c.stroke();c.restore()}
    if(sad)line(c,ex-s*10,ey-21,ex+s*6,ey-17,OL,2.5);
  });
  // cheeks
  const ck=lk.cheek||'pink';
  if(ck==='pink'){c.fillStyle='rgba(255,105,140,.35)';[-31,31].forEach(cx=>{c.beginPath();c.ellipse(cx,-60,8,5,0,0,7);c.fill()})}
  else if(ck==='hearts'){c.fillStyle='rgba(255,90,140,.75)';[-31,31].forEach(cx=>{c.save();c.translate(cx,-62);c.scale(.42,.42);c.beginPath();c.moveTo(0,10);c.bezierCurveTo(-18,-2,-10,-16,0,-6);c.bezierCurveTo(10,-16,18,-2,0,10);c.fill();c.restore()})}
  else if(ck==='stars')[-31,31].forEach(cx=>star(c,cx,-61,6,2.6,'#ffd23f'));

}

let S=null;S=fresh();
function load(){let raw=null;try{raw=localStorage.getItem(saveKey());const d=JSON.parse(raw||'null');if(d&&d.v===1){const f=fresh();S=Object.assign(f,d);S.st=Object.assign(f.st,d.st);S.cnt=Object.assign(f.cnt,d.cnt);S.outfit=Object.assign(f.outfit,d.outfit);S.look=Object.assign(f.look,d.look);S.mig=d.mig||1;migrate();migrate3();if(!S.bagCap){const need=bagCount()+10;S.bagCap=need<=40?40:(BAG_UP.map(u=>u[1]).find(c=>c>=need)||Math.ceil(need/10)*10)}MYSV=S._sv||0}}catch(e){try{if(raw)localStorage.setItem(saveKey()+'_broken',raw)}catch(e2){}}}
function migrate(){
  if(S.mig>=2)return;
  S.uid=S.uid||1000;const all=()=>[...S.rooms.flatMap(r=>r.items)];
  all().forEach(it=>{if(!it.u)it.u=++S.uid});
  S.rooms.forEach((r,i)=>{r.st=r.st||0;r.n=r.n||(i===0?'living':'room')});
  const r0=S.rooms[0];
  if(!r0.items.some(i=>i.id==='door_exit'))r0.items.push(mk('door_exit',140,DOOR_Y));
  if(!S.rooms.some(r=>r.n==='bed'))S.rooms.push(BEDROOM());
  if(!S.rooms.some(r=>r.n==='bath'))S.rooms.push(BATHROOM());
  ['stove','counter'].forEach(id=>{if(!all().some(i=>i.id===id))S.inv[id]=(S.inv[id]||0)+1});
  S.mig=2;
}

/* Saving is only switched on once a character has been picked on the main menu (LIVE), so closing the page
   on the menu can never write an empty character over a real one. _sv counts saves: if another tab or window
   has saved something newer, this one stops saving instead of overwriting it. */
let LIVE=false,MYSV=0,STALE=false,SAVE_WARN=0;
function writeSave(){if(!LIVE||STALE||RESETTING)return;try{const k=saveKey(),raw=localStorage.getItem(k);
  if(raw){const sv=+((raw.match(/"_sv":(\d+)/)||[])[1]||0);if(sv>MYSV){STALE=true;staleWarn();return}if(!S.created&&/"created":true/.test(raw))return}
  S._sv=++MYSV;localStorage.setItem(k,JSON.stringify(S));backup()}catch(e){if(!SAVE_WARN++)toast(L('⚠️ Could not save – is the browser storage full?','⚠️ Kunne ikke gemme – er browserens lager fuldt?'),4000)}}
// a spare copy of each character, refreshed every few minutes, that settings and the main menu can restore
const bakKey=i=>slotKey(i)+'_bak',bakData=i=>{try{const b=JSON.parse(localStorage.getItem(bakKey(i))||'null');return b&&b.d&&b.d.created?b:null}catch(e){return null}};
function backup(force){const now=Date.now();if(!S.created||(!force&&now-(backup.t||0)<4*60e3))return;backup.t=now;try{localStorage.setItem(bakKey(SLOT),JSON.stringify({at:now,d:S}))}catch(e){}}

const DECAY={hunger:90,clean:120,fun:100}; // seconds per point

  for(const k in DECAY){let loss=dt/DECAY[k];if(offline)loss=Math.min(loss,S.st[k]*.5);S.st[k]=clamp(S.st[k]-loss,0,100)}
  S.stT=now;
  const me=maxEnergy(),per=90;
  if(S.energy<me){const gain=Math.floor((now-S.enT)/1000/per);if(gain>0){S.energy=Math.min(me,S.energy+gain);S.enT+=gain*per*1000}}else S.enT=now;
}

function panel({title,html='',buttons=[],sm,render,onClose,cls=''}){
  return new Promise(res=>{
    const ov=document.createElement('div');ov.className='ov';
    ov.innerHTML=`<div class="pn ${sm?'sm':''} ${cls}"><div class="ph"><h2>${title}</h2><button class="x" aria-label="Close">✕</button></div><div class="pb">${html}</div>${buttons.length?'<div class="pf"></div>':`<div class="pf mclose"><button class="btn" data-close="1">✕ ${L('Close','Luk')}</button></div>`}</div>`;
    document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('in'));
    let done=false;const close=v=>{if(done)return;done=true;ov.classList.remove('in');setTimeout(()=>ov.remove(),200);onClose&&onClose(v);res(v)};
    ov._close=close;$('.x',ov).onclick=()=>{SFX.click();close(null)};const mc=$('[data-close]',ov);if(mc)mc.onclick=()=>{SFX.click();close(null)};
    ov.addEventListener('pointerdown',e=>{if(e.target===ov)close(null)});
    const pf=$('.pf',ov);buttons.forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.cls||'');e.innerHTML=b.label;e.disabled=!!b.dis;e.onclick=()=>{SFX.click();close(b.v!==undefined?b.v:b.label)};pf.appendChild(e)});
    if(render)render($('.pb',ov),close,ov);
  });
}

function curMonth(){if(window.__MONTH)return window.__MONTH;try{return+new Intl.DateTimeFormat('en-GB',{timeZone:curTZ(),month:'numeric'}).format(new Date())}catch(e){return new Date().getMonth()+1}}
const season=()=>{const m=curMonth();return m===10?'halloween':m===12?'xmas':m===2?'valentine':null};
const isSnow=()=>curMonth()===12;
// gentle snowfall in screen space (cheap: fixed number of flakes)
const FLAKES=[...Array(70)].map(()=>({x:Math.random(),y:Math.random(),r:1.5+Math.random()*2.5,s:.02+Math.random()*.04,w:Math.random()*6}));
function drawSnow(g,dt){if(!isSnow())return;const W=cv.width,H=cv.height;g.save();g.setTransform(1,0,0,1,0,0);g.fillStyle='rgba(255,255,255,.9)';
  for(const f of FLAKES){f.y+=f.s*dt;f.w+=dt;if(f.y>1.02){f.y=-.02;f.x=Math.random()}const x=(f.x+Math.sin(f.w)*.01)*W,y=f.y*H;g.beginPath();g.arc(x,y,f.r*V.dpr,0,7);g.fill()}g.restore()}

/* ---------------- NPC actors ---------------- */
const ACTORS=NPCS.map((n,i)=>{const[x,y]=randomWalkable();return{id:n.id,npc:n,x,y,tx:null,ty:null,dir:1,walk:false,t:i,wait:rr(1,4),say:'',sayT:0}});
function updateNPCs(dt){
  for(const a of ACTORS){
    a.t+=dt;
    if(a.talking){a.walk=false;continue}
    if(a.tx==null){a.wait-=dt;a.walk=false;if(a.wait<=0){const[x,y]=randomWalkable();if(Math.hypot(x-a.x,y-a.y)<900){a.tx=x;a.ty=y}else a.wait=.5}
      if(Math.random()<dt*.05&&!a.say){a.say=L(pick(a.npc.lines)[0],pick(a.npc.lines)[1]).split(/[.!?]/)[0]+'!';a.sayT=3.5}}
    else{stepToward(a,a.tx,a.ty,90*dt,true);if(a.tx==null)a.wait=rr(2,7)}
    if(a.sayT>0){a.sayT-=dt;if(a.sayT<=0)a.say=''}
  }
}
function stepToward(o,tx,ty,d,town){
  const dx=tx-o.x,dy=ty-o.y,dist=Math.hypot(dx,dy);
  if(dist<=d){o.x=tx;o.y=ty;o.tx=null;o.ty=null;o.walk=false;return true}
  let nx=o.x+dx/dist*d,ny=o.y+dy/dist*d;
  if(town&&blocked(nx,ny)){if(!blocked(nx,o.y))ny=o.y;else if(!blocked(o.x,ny))nx=o.x;else{o.tx=null;o.ty=null;o.walk=false;return true}}
  if(Math.abs(dx)>2)o.dir=dx<0?-1:1;
  o.x=nx;o.y=ny;o.walk=true;return false;
}

const PUBLIC_USE=['sit','tv','music','read','play','fish','warm','toilet','wash'];
function useItem(it){
  const f=FURN[it.id];if(!f||!f.use)return;const own=SCENE.owner==='me';
  if(f.use==='exit'){leaveHouse();return}
  if(f.use==='yard'){goYard();return}
  if(f.use==='house'){leaveYard();return}
  if(f.use==='up'||f.use==='down'){goStorey(f.use==='up'?1:0);return}
  if(f.use==='lamp'){it.lit=!lampOn(it);SFX.tone(it.lit?900:500,.06,'square',.05);if(own){save();net.houseChanged()}return}
  if(!own&&['plant','bowlF','bowlW','egg','honey','hamster'].includes(f.use)){toast(L('That belongs to your host 🙂','Det tilhører værten 🙂'));return}
  if(f.use==='plant'){openPlanter(it);return}
  if(f.use==='honey'){harvestHoney(it);return}
  if(f.use==='hamster'){openHamster(it);return}
  if(f.use==='coffee'){drinkCoffee(it);return}
  if(f.use==='bowlF'||f.use==='bowlW'){fillBowl(it);return}
  if(f.use==='egg'){openIncubator(it);return}
  if(f.use==='eat'){if(own)openFood();return}
  if(f.use==='store'){if(own)openStorage(it);else toast(L('That belongs to your host 🙂','Det tilhører værten 🙂'));return}
  if(f.use==='ward'){if(own)openWardrobe();return}
  if(f.use==='mirror'){if(own)openCreator(true);return}
  if(f.use==='arcade'){jobPrompt('bubble');return}
  if(f.use==='cook'&&own){openCook(it);return}
  if(f.use==='pc'){if(own)openPC();else toast(L('That belongs to your host 🙂','Det tilhører værten 🙂'));return}
  if(['piano','drum_kit','guitar_wall'].includes(it.id)){arcadePrompt('rhythm');return}
  if(!own&&!PUBLIC_USE.includes(f.use)){toast(L('That belongs to your host 🙂','Det tilhører værten 🙂'));return}
  const u=USE[f.use];if(!u)return;
  if(u.cd){const k='use_'+f.use;if(S.cd[k]&&Date.now()<S.cd[k]){toast(L('Give it a minute…','Vent lige lidt…'));return}S.cd[k]=Date.now()+u.cd*1000}
  if(u.cost&&!useEnergy(u.cost))return;
  ME.act={type:f.use,u,item:it,t:0,tick:0};ME.say=L(u.en,u.da);ME.sayT=2.2;
  if(u.wash)bump('washed');if(u.sleep)bump('slept');if(f.use==='bath'||f.use==='shower'||f.use==='toilet')SFX.splash();
  const xk='xp_'+f.use;if(!S.cd[xk]||Date.now()>S.cd[xk]){S.cd[xk]=Date.now()+90000;addXP(u.xp||2,{sx:innerWidth/2,sy:innerHeight/2-60})}
}
function tickAction(dt){
  const a=ME.act,u=a.u;a.t+=dt;a.tick+=dt;
  if(a.tick>=1){a.tick-=1;
    if(u.fun)addStat('fun',u.fun);if(u.clean)addStat('clean',u.clean);if(u.hunger)addStat('hunger',u.hunger);
    if(u.energy){a.eAcc=(a.eAcc||0)+u.energy;if(a.eAcc>=1&&S.energy<maxEnergy()){a.eAcc-=1;S.energy++;hud()}}}

}

function toWorld(e){const r=cv.getBoundingClientRect(),z=V.s*zoom();return{x:(e.clientX-r.left)/z+cam.x,y:(e.clientY-r.top)/z+cam.y}}
cv.addEventListener('pointerdown',e=>{SFX.ac();if(anyPanel())return;const w=toWorld(e);PTR={x:w.x,y:w.y,sx:e.clientX,sy:e.clientY,t:Date.now()};
  if(BUILD.on){const room=curRoom(),h=hitItem(w.x,w.y,room);BUILD.lx=e.clientX;BUILD.ly=e.clientY;
    if(h){BUILD.sel=h.i;BUILD.drag={dx:w.x-h.it.x,dy:w.y-(h.it.y-(h.it.z||0))};BUILD.moved=false}else{BUILD.sel=-1;BUILD.pan={x:e.clientX,cx:BUILD.cx}}
    try{cv.setPointerCapture(e.pointerId)}catch(err){}drawBuildBar()}});
cv.addEventListener('pointermove',e=>{if(!BUILD.on||!PTR)return;BUILD.lx=e.clientX;BUILD.ly=e.clientY;
  if(BUILD.pan){BUILD.cx=BUILD.pan.cx-(e.clientX-BUILD.pan.x)/(V.s*zoom());return}
  if(BUILD.drag)dragTo(toWorld(e))});
cv.addEventListener('pointerup',e=>{
  if(BUILD.on){if(BUILD.drag&&BUILD.moved){SFX.place();bump('placed');save();net.houseChanged()}BUILD.drag=null;BUILD.pan=null;PTR=null;return}
  if(!PTR||anyPanel()){PTR=null;return}const w=toWorld(e);PTR=null;closeDlgSoft();
  const oth=hitOther(w);if(oth){FOLLOW=null;walkTo(oth.x+(ME.x<oth.x?-1:1)*(SCENE.type==='town'?70:130),oth.y,()=>playerMenu(oth));return}
  FOLLOW=null;if(hitMe(w)){pokeMe();return}
  if(SCENE.type==='home')clickHome(w);else if(SCENE.type==='shop')clickShop(w);else if(SCENE.type==='park')clickPark(w);else clickTown(w);
});
cv.addEventListener('pointercancel',()=>{BUILD.drag=null;BUILD.pan=null;PTR=null});
cv.addEventListener('wheel',e=>{if(!BUILD.on)return;e.preventDefault();BUILD.cx+=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)/V.s},{passive:false});
function clickHome(w){
  for(const c of petsHere()){const a=petActor(c.key);if(Math.abs(w.x-a.x)<60&&w.y>a.y-120&&w.y<a.y+15){walkTo(a.x+(ME.x<a.x?-95:95),a.y,()=>petPet(c,a));return}}
  const room=curRoom(),h=hitItem(w.x,w.y,room);
  if(h&&h.f.use){const it=h.it,f=h.f;
    if(f.kind==='door'){walkTo(it.x,FLOOR_MIN+28,()=>useItem(it));return}
    const ty=f.kind==='wall'||it.wl?FLOOR_MIN+40:Math.min(FLOOR_MAX,it.y+30);
    walkTo(it.x+(f.kind==='floor'&&['sit','sleep','bath','shower'].includes(f.use)?0:(ME.x<it.x?-f.w/2-20:f.w/2+20)),ty,()=>useItem(it));return}
  const host=SCENE.owner!=='me'&&NPC_BY[SCENE.owner];
  if(host&&Math.abs(w.x-HOST_ACTOR.x)<70&&w.y>HOST_ACTOR.y-220&&w.y<HOST_ACTOR.y+10){walkTo(HOST_ACTOR.x+(ME.x<HOST_ACTOR.x?-130:130),HOST_ACTOR.y,()=>talkTo(host.id));return}
  walkTo(w.x,Math.max(w.y,FLOOR_MIN+15));
}
function clickShop(w){
  const sec=curRoom(),inR=r=>w.x>=r.x&&w.x<=r.x+r.w&&w.y>=r.y&&w.y<=r.y+r.h;
  for(const a of shopArches(sec))if(inR({x:a.x-75,y:DOOR_Y-300,w:150,h:330})){walkTo(a.x,FLOOR_MIN+30,()=>switchRoom(a.d));return}
  const goSpot=sp=>walkTo(sp.wx+(Math.abs(ME.x-sp.wx)<30?0:ME.x<sp.wx?-40:40),sp.wy,sp.act);
  for(const sp of sec.spots)if(sp.sell&&inR(sp.r)){goSpot(sp);return}
  // things for sale stand in front of the shopkeepers, so they are tested first
  const gs=[...sec.goods].sort((a,b)=>b.y-a.y);
  for(const gd of gs)if(inR(gd.r)){walkTo(gd.x+(ME.x<gd.x?-70:70),gd.wy,()=>openBuy(gd));return}
  for(const sp of sec.spots)if(inR(sp.r)){goSpot(sp);return}
  walkTo(w.x,Math.max(w.y,FLOOR_MIN+15));
}
function clickTown(w){
  for(const a of ACTORS)if(Math.abs(w.x-a.x)<42&&w.y>a.y-110&&w.y<a.y+10){walkTo(a.x+(ME.x<a.x?-70:70),a.y,()=>talkTo(a.id));return}
  for(const o of net.others())if(o.scene==='town'&&Math.abs(w.x-o.x)<42&&w.y>o.y-110&&w.y<o.y+10){walkTo(o.x+(ME.x<o.x?-70:70),o.y,()=>playerMenu(o));return}
  for(const q of S.quests)if(q.type==='fetch'&&!q.found&&Math.hypot(w.x-q.x,w.y-q.y+30)<65){walkTo(q.x,q.y,()=>foundThing(q));return}
  for(const b of BLD)if(w.x>b.x&&w.x<b.x+b.w&&w.y>b.y&&w.y<b.y+b.h+30){walkTo(b.door.x,b.door.y,()=>enterBuilding(b));return}
  for(const s of SPOTS){const inS=s.r?Math.hypot((w.x-s.x),(w.y-s.y)/.55)<s.r+10:(w.x>s.x-10&&w.x<s.x+s.w+10&&w.y>s.y-30&&w.y<s.y+s.h+10);
    if(inS){const tx=s.r?s.x:s.x+s.w/2,ty=s.r?s.y+s.r*.55+20:s.y+s.h+22;walkTo(tx,Math.min(TOWN_MAXY,ty),()=>useSpot(s));return}}
  walkTo(w.x,w.y);
}
// fetch quests are found just by walking over them
function checkPickups(){if(SCENE.type!=='town')return;for(const q of S.quests)if(q.type==='fetch'&&!q.found&&Math.hypot(ME.x-q.x,ME.y-q.y)<60)foundThing(q)}
function enterBuilding(b){
  if(b.kind==='house'){goHome(0);return}
  if(b.kind==='npchouse'){visitNPC(b.npc);return}
  if(b.kind==='park'){enterPark();return}
  if(b.kind==='lot'){const o=net.lotOwner(b.lot);if(o)net.visit(o.id);else toast(L('🌱 An empty lot. When friends join your game on the same Wi-Fi, their houses appear here!','🌱 En ledig grund. Når venner joiner dit spil på samme wifi, kommer deres huse her!'),3600);return}
  enterShop(b.shop);
}
function useSpot(s){
  if(s.kind==='garden')jobPrompt('garden');
  else if(s.kind==='kiosk')jobPrompt('bubble');
  else if(s.kind==='board')openJobs();
  else if(s.kind==='pond')jobPrompt('fishing');
  else if(s.kind==='bus')openBus(s);
  else if(s.kind==='mail')openMailbox();
  else if(s.kind==='fountain'){
    if(S.coins<1){toast(L('You need 1 coin to make a wish.','Du skal bruge 1 mønt for at ønske.'));return}
    const k='wish';if(S.cd[k]&&Date.now()<S.cd[k]){toast(L('⛲ The fountain is resting. Try again later!','⛲ Springvandet hviler. Prøv igen senere!'));return}
    S.cd[k]=Date.now()+5*60000;S.coins-=1;SFX.splash();bump('wishes');addStat('fun',8);
    const r=Math.random();setTimeout(()=>{if(r<.15){addCoins(50);toast(L('⛲ Your wish came true! +50 coins!','⛲ Dit ønske gik i opfyldelse! +50 mønter!'))}else if(r<.5){addXP(10);toast(L('⛲ You feel lucky! +10 XP','⛲ Du føler dig heldig! +10 XP'))}else{S.energy=Math.min(maxEnergy(),S.energy+3);hud();toast(L('⛲ Refreshing! +3 ⚡','⛲ Forfriskende! +3 ⚡'))}},500)}
}

function visitNPC(id){const n=NPC_BY[id];HOST_ACTOR.x=860;HOST_ACTOR.y=650;HOST_ACTOR.say=L('Welcome! Make yourself at home!','Velkommen! Føl dig hjemme!');HOST_ACTOR.sayT=3;visitHouse(id,NPC_HOMES[id],n.name+L("'s House","s hus"),null)}
function updateHost(dt){const h=HOST_ACTOR;if(SCENE.owner==='me'||!NPC_BY[SCENE.owner])return;
  if(h.talking){h.walk=false}else if(h.tx==null){h.wait-=dt;if(h.wait<=0){h.tx=rr(200,1080);h.ty=rr(FLOOR_MIN+40,FLOOR_MAX)}}else{stepToward(h,h.tx,h.ty,80*dt,false);if(h.tx==null)h.wait=rr(3,8)}
  if(h.sayT>0){h.sayT-=dt;if(h.sayT<=0)h.say=''}}

/* ---------------- talking & quests ---------------- */
let DLG=null;
const questFor=id=>S.quests.find(q=>q.npc===id);
const questReady=q=>q.type==='fetch'?q.found:(S.food[q.food]||0)>0;
function npcState(id){return S.npc[id]=S.npc[id]||{h:0,day:0,offered:0,line:0}}
function talkTo(id){
  const n=NPC_BY[id],st=npcState(id),a=ACTORS.find(a=>a.id===id)||HOST_ACTOR;a.talking=true;a.dir=ME.x<a.x?-1:1;ME.dir=-a.dir;SFX.talk();
  let first='';
  if(st.day!==today()){st.day=today();const old=st.h;st.h=Math.min(10,st.h+1);bump('talks');addCoins(5);addXP(5);first=L(' (+1 ❤ friendship)',' (+1 ❤ venskab)');checkHeartGift(id,old)}
  const line=n.lines[st.line%n.lines.length];st.line++;
  showDlg(n,L(line[0],line[1])+first,a);save();
}
function showDlg(n,text,a){
  DLG={n,a};const st=npcState(n.id);
  $('#dlgN').innerHTML=`${esc(n.name)}<small>${'❤'.repeat(Math.min(10,st.h))}${'♡'.repeat(10-Math.min(10,st.h))}</small>`;$('#dlgT').innerHTML=text;
  const c=$('#dlgCv').getContext('2d');c.clearRect(0,0,180,200);drawPet(c,90,196,.9,{look:n.look,outfit:n.outfit,t:0});
  const q=questFor(n.id),B=$('#dlgB');B.innerHTML='';
  const btn=(l,cls,f)=>{const b=document.createElement('button');b.className='btn sm '+(cls||'');b.innerHTML=l;b.onclick=()=>{SFX.click();f()};B.appendChild(b)};
  btn(L('💬 Chat','💬 Snak'),'',()=>talkMore(n));
  if(q){if(questReady(q))btn(L('✅ Here you go!','✅ Værsgo!'),'ok',()=>completeQuest(q));else btn(L('📜 About the task…','📜 Om opgaven…'),'',()=>showDlg(n,questText(q,true),a))}
  else if(qActiveCount()<3)btn(L('🙋 Need help?','🙋 Brug for hjælp?'),'go',()=>offerQuest(n,a));
  const gifts=Object.keys(S.sup).filter(k=>S.sup[k]>0&&SUP[k]&&SUP[k].type==='gift');
  if(gifts.length&&st.gift!==today())btn('🎁 '+L('Give a gift','Giv en gave'),'',()=>{const k=gifts.sort((a,b)=>SUP[b].price-SUP[a].price)[0],old=st.h,hh={gift_flowers:1,gift_choco:2,gift_teddy:3}[k]||1;S.sup[k]--;st.gift=today();st.h=Math.min(10,st.h+hh);SFX.buy();bump('gifts');addXP(10);
    showDlg(n,L(`${SUP[k].e} For me? Oh, thank you so much! (+${hh} ❤)`,`${SUP[k].e} Til mig? Åh, tusind tak! (+${hh} ❤)`),a);checkHeartGift(n.id,old);save()});
  btn(L('👋 Bye','👋 Farvel'),'',closeDlg);
  $('#dlg').classList.add('on');
}
function talkMore(n){const st=npcState(n.id),line=n.lines[st.line%n.lines.length];st.line++;SFX.talk();showDlg(n,L(line[0],line[1]),DLG&&DLG.a)}
function closeDlg(){if(DLG&&DLG.a)DLG.a.talking=false;DLG=null;$('#dlg').classList.remove('on')}
function closeDlgSoft(){if(DLG)closeDlg()}
function questText(q,reminder){const n=NPC_BY[q.npc];
  if(q.type==='fetch'){const nb=nearPlace(q.x);return reminder?L(`I lost ${q.ic} ${q.en} in town, near ${nb[0]}. Look for the sparkle ✨!`,`Jeg har tabt ${q.ic} ${q.da} i byen, i nærheden af ${nb[1]}. Kig efter glimtet ✨!`):L(`Oh no, I lost ${q.ic} ${q.en} in town – I think it was near ${nb[0]}! Could you find it? Look for the sparkle ✨`,`Åh nej, jeg har tabt ${q.ic} ${q.da} i byen – jeg tror, det var ved ${nb[1]}! Kan du finde det? Kig efter glimtet ✨`)}
  const f=FOOD[q.food],b=foodShop(q.food),cook=RECIPES.find(r=>r[1]===q.food);
  const sh=b?L(`You can buy it at ${b.ic} ${b.en}`,`Du kan købe det i ${b.ic} ${b.da}`)+(b.shop==='cafe'?L(' (on the shelves)',' (på hylderne)'):''):cook?L('You can cook it on your stove at home','Du kan lave det på dit komfur derhjemme'):L('Check the 📖 wiki to see where to get it','Se i 📖 wikien, hvor du får det');
  return reminder?L(`Could you bring me ${f.e} ${f.en}? ${sh}.`,`Kan du give mig ${f.e} ${f.da}? ${sh}.`):L(`I'm craving ${f.e} ${f.en}! Could you bring me one? ${sh}.`,`Jeg har så meget lyst til ${f.e} ${f.da}! Kan du give mig en? ${sh}.`)}
// the closest building or place in town – for directions
function nearPlace(x){let best=null,bd=1e9;for(const b of BLD){if(b.kind==='lot')continue;const d=Math.abs(b.door.x-x);if(d<bd){bd=d;best=b}}const sp=[[SPOTS[0].x,'⛲ the fountain','⛲ springvandet'],[SPOTS[4].x,'🎣 the fishing pond','🎣 fiskesøen']].find(s=>Math.abs(s[0]-x)<bd);
  if(sp)return[sp[1],sp[2]];if(!best)return['the town','byen'];if(best.kind==='house')return['🏠 your house','🏠 dit hus'];if(best.kind==='npchouse'){const n=NPC_BY[best.npc].name;return[`${n}'s house`,`${n}s hus`]}return[(best.ic||'')+' '+best.en,(best.ic||'')+' '+best.da]}
// which shop in town sells a food (so quests never ask for something you can't buy)
function foodShop(id){for(const [k,sh] of Object.entries(SHOPDEF))if(sh.secs.some(s=>s.goods.some(g=>g.k==='food'&&g.id===id)))return BLD.find(b=>b.shop===k);return null}
function offerQuest(n,a){
  let q;
  if(Math.random()<.55){const th=pick(LOST_THINGS);let x,y,k=0;do{[x,y]=randomWalkable();k++}while((Math.hypot(x-(a.x||0),y-(a.y||0))<500||TREES.some(([tx,ty])=>Math.abs(tx-x)<80&&y<ty+10&&y>ty-170))&&k<60);q={type:'fetch',npc:n.id,thing:th[0],en:th[1],da:th[2],ic:th[3],x,y,found:false}}
  else{const opts=Object.values(FOOD).filter(f=>f.lvl<=S.lvl&&f.h>0&&foodShop(f.id)&&foodShop(f.id).shop!=='season');const f=pick(opts.length?opts:[FOOD.apple]);q={type:'deliver',npc:n.id,food:f.id}}
  S.quests.push(q);save();SFX.pop();showDlg(n,questText(q),a);
}
function foundThing(q){if(q.found)return;q.found=true;SFX.buy();toast(L(`✨ ${q.ic} Found it! Bring it back to ${NPC_BY[q.npc].name}.`,`✨ ${q.ic} Fundet! Giv det tilbage til ${NPC_BY[q.npc].name}.`));save()}
function completeQuest(q){
  if(q.type==='deliver'){S.food[q.food]--;if(!S.food[q.food])delete S.food[q.food]}
  S.quests=S.quests.filter(x=>x!==q);const st=npcState(q.npc),old=st.h;st.h=Math.min(10,st.h+2);
  addCoins(30+S.lvl*8);addXP(25+S.lvl*4);bump('quests');SFX.buy();
  showDlg(NPC_BY[q.npc],L('Thank you so much! You are the best neighbour! (+2 ❤)','Tusind tak! Du er den bedste nabo! (+2 ❤)'),DLG&&DLG.a);checkHeartGift(q.npc,old);save();
}
function checkHeartGift(id,old){const st=npcState(id);for(const m of [3,6,10]){if(old<m&&st.h>=m){
  const pool=[...Object.values(FURN).filter(f=>f.price>0&&!f.season&&['floor','wall','rug','small'].includes(f.kind)&&f.lvl<=S.lvl+2),...Object.values(CLOTH).filter(c=>c.price>0&&!SEASON_CLOTH.includes(c.id)&&!S.wardrobe.includes(c.id)&&c.lvl<=S.lvl+2)];
  const gift=pick(pool);if(!gift)return;
  if(CLOTH[gift.id])S.wardrobe.push(gift.id);else S.inv[gift.id]=(S.inv[gift.id]||0)+1;
  setTimeout(()=>panel({title:L('🎁 A gift!','🎁 En gave!'),sm:true,html:`<p style="text-align:center">${esc(NPC_BY[id].name)} ${L('likes you so much that they gave you','kan så godt lide dig, at du fik')}:</p><div style="display:flex;justify-content:center"><div class="card" style="width:150px" id="giftC"><div class="nm">${esc(nm(gift))}</div></div></div>`,render:b=>{$('#giftC',b).prepend(thumb(CLOTH[gift.id]?'cloth':'furn',gift.id))},buttons:[{label:L('Thank you!','Tak!'),cls:'go'}]}),900);save()}}}

function gThumb(k,id,w=110,h=86){return thumb(k==='furn'?'furn':k==='cloth'?'cloth':k==='food'?'food':k==='sup'?'sup':'pet',id,w,h)}
function openBuy(gd){

      if(k==='food')info=`${it.h?'🍎+'+it.h+' ':''}${it.c?'🧼+'+it.c+' ':''}${it.f?'🎈+'+it.f:''}`;

      else if(k==='furn'&&it.out)info=L('For your garden.','Til din have.');

function consume(id){const f=FOOD[id];if(!S.food[id])return;

      $$('.tabs button',b).forEach(x=>x.onclick=()=>{tab=x.dataset.t;SFX.click();draw()});
      $$('canvas[data-n]',b).forEach(c=>{const n=NPC_BY[c.dataset.n],g=c.getContext('2d');drawPet(g,36,78,.48,{look:n.look,outfit:n.outfit,t:0})});
      const st=$('#gStreak',b);if(st)st.onclick=()=>{const s=S.streak,cont=isYesterday(s.day)||s.day===today();s.n=cont?s.n+1:1;s.day=today();s.claimed=today();const r=STREAK_REWARD[(s.n-1)%7];addCoins(r,st);addXP(10);save();goalsCheck();draw()};
      $$('[data-p]',b).forEach(x=>x.onclick=()=>{const [k,i]=x.dataset.p.split(':'),t=perTasks(k).tasks[+i],[c,xp]=perReward(k);if(t.claimed||t.p<t.n)return;t.claimed=true;addCoins(c,x);addXP(xp);SFX.buy();save();goalsCheck();draw()});
      $$('[data-b]',b).forEach(x=>x.onclick=()=>{const P=perTasks(x.dataset.b);if(P.bonus)return;P.bonus=true;addCoins(perBonus(x.dataset.b),x);addXP(30);confetti();save();goalsCheck();draw()});
      $$('[data-g]',b).forEach(x=>x.onclick=()=>{const id=x.dataset.g,g=GOALS.find(g=>g[0]===id);
        if(g){if(S.goalsDone.includes(id)||!g[4]())return;S.goalsDone.push(id);addCoins(g[5],x);addXP(g[6])}
        else{const t=tierGoals().find(t=>t.id===id);if(!t||!t.ready)return;t.claim();addCoins(t.coins,x);if(t.xp)addXP(t.xp)}
        SFX.buy();save();goalsCheck();draw()});
    };draw();}});
}
function isYesterday(d){if(!d)return false;const y=new Date();y.setDate(y.getDate()-1);return d===y.getFullYear()*10000+(y.getMonth()+1)*100+y.getDate()}

const HONEY_MS=2*3600000; // a beehive fills up with honey every 2 hours (real time)
const honeyReady=it=>!it.hT||Date.now()-it.hT>=HONEY_MS;
function harvestHoney(it){
  if(!honeyReady(it)){toast(L(`🐝 The bees are busy… honey in ${fmtDur(it.hT+HONEY_MS-Date.now())}`,`🐝 Bierne har travlt… honning om ${fmtDur(it.hT+HONEY_MS-Date.now())}`));return}
  const flowers=((S.yard&&S.yard.items)||[]).filter(i=>['rose_bush','tulip_bed','flower_pot','garden_arch','tree_small'].includes(i.id)).length,n=1+Math.min(2,flowers);
  if(bagFull(n))return;S.food.honey=(S.food.honey||0)+n;it.hT=Date.now();bump('honey',n);addXP(6);SFX.buy();
  for(let i=0;i<4;i++)FX.push({x:it.x+rr(-40,40),y:it.y-140,t:-i*.12,txt:i%2?'🍯':'🐝'});
  toast(L(`🍯 +${n} honey! ${flowers<2?'Flowers in your garden give the bees more to do.':'Your flowers make the bees happy!'} Next batch in 2 hours.`,`🍯 +${n} honning! ${flowers<2?'Blomster i haven giver bierne mere at lave.':'Dine blomster gør bierne glade!'} Næste portion om 2 timer.`),3800);save();net.houseChanged()}

const QDEF={};
Q_CNT.forEach(([k,ic,en,da,base])=>['d','w','m'].forEach(p=>{const P=Q_PER[p];QDEF[p+'_'+k]={id:p+'_'+k,p,k,ic,en,da,base}}));
Q_SPECIAL.forEach(([id,ic,en,da,f,c,x,lvl])=>QDEF[id]={id,p:'s',ic,en,da,f,c,x,lvl});
Object.entries(Q_SEASON).forEach(([se,l])=>l.forEach(([id,ic,en,da,f,c,x])=>QDEF[id]={id,p:'e',se,ic,en,da,f,c,x,lvl:1}));
const Q_TOTAL=Object.keys(QDEF).length;
const seedR=k=>{let h=2166136261;for(const ch of String(k))h=Math.imul(h^ch.charCodeAt(0),16777619);return()=>{h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}};
function qTarget(d){if(d.f)return d.f()[1];const P=Q_PER[d.p],r=seedR(P.key()+d.id)();return Math.max(1,Math.round(d.base*(P.mul[0]+(P.mul[1]-P.mul[0])*r)))}
function qText(d,n){return L(d.en.replace('{n}',N(n)).replace(/^(.*)\b1 times$/,'$1once'),d.da.replace('{n}',N(n)).replace(/\b1 gange$/,'1 gang'))}
function qReward(d){return d.f?[d.c,d.x]:Q_PER[d.p].rw()}
// the quests on offer right now (period quests are picked fresh each day / week / month)
function qOffer(p){if(p==='s')return Object.values(QDEF).filter(d=>d.p==='s'&&!(S.qd||{})[d.id]&&S.lvl>=d.lvl);
  if(p==='e'){const se=season();return Object.values(QDEF).filter(d=>d.p==='e'&&d.se===se&&(S.qd||{})[d.id]!==Q_PER.e.key())}
  const P=Q_PER[p],r=seedR(P.key()),pool=Object.values(QDEF).filter(d=>d.p===p&&(d.k!=='hamster'||ownAny(i=>i.id==='hamster_cage'))&&(d.k!=='honey'||ownAny(i=>i.id==='beehive'))&&(d.k!=='hugs'||net.role()));
  return pool.map(d=>[r(),d]).sort((a,b)=>a[0]-b[0]).slice(0,P.n).map(x=>x[1]).filter(d=>(S.qd||{})[d.id]!==P.key())}
function qProg(a){const d=QDEF[a.id];if(!d)return[0,1];if(d.f){const[h,n]=d.f();return[Math.min(h,n),n]}return[Math.min(a.n,Math.max(0,(S.cnt[d.k]||0)-a.b)),a.n]}
const qActiveCount=()=>(S.qa||[]).length+S.quests.length;
function qAccept(id){const d=QDEF[id];if(!d||qActiveCount()>=3)return false;S.qa=S.qa||[];if(S.qa.some(a=>a.id===id))return false;
  S.qa.push({id,b:S.cnt[d.k]||0,n:qTarget(d),key:Q_PER[d.p].key()});SFX.pop();save();return true}
function qClaim(a){const[h,n]=qProg(a);if(h<n)return;const d=QDEF[a.id],[c,x]=qReward(d);S.qa=S.qa.filter(q=>q!==a);S.qd=S.qd||{};S.qd[a.id]=d.p==='s'?'done':Q_PER[d.p].key();
  addCoins(c);if(x)addXP(x);bump('qdone');SFX.buy();confetti();save()}
// expire period quests whose day / week / month is over, and announce quests that are ready
function qTick(){if(!S.created)return;S.qa=S.qa||[];const old=S.qa.length;S.qa=S.qa.filter(a=>{const d=QDEF[a.id];return d&&(d.p==='s'||a.key===Q_PER[d.p].key())});
  if(S.qa.length<old)toast(L('⌛ A quest ran out of time – pick a new one on the 📜 Quests board!','⌛ En opgave løb ud – vælg en ny på 📜 opgavetavlen!'),3600);
  let ready=0;for(const a of S.qa){const[h,n]=qProg(a);if(h>=n){ready++;if(!a.r){a.r=1;notify(QDEF[a.id].ic,L('Quest complete!','Opgave klaret!'),qText(QDEF[a.id],a.n)+' – '+L('tap to claim','tryk for at hente'),()=>openQuests('active'))}}}
  const ready2=ready+S.quests.filter(q=>questReady(q)).length,dq=$('#dQuest');if(dq){dq.textContent=ready2||qActiveCount();dq.classList.toggle('on',ready2>0||qActiveCount()<3);dq.style.background=ready2?'':'#2f8fe0'}}
function openQuests(start){let tab=start||'active';
  panel({title:'📜 '+L('Quests','Opgaver'),render:b=>{const draw=()=>{qTick();const act=qActiveCount();
    const T=[['active','🎯',L('Active','Aktive')+` ${act}/3`],['d',Q_PER.d.ic,L('Daily','Daglige')],['w',Q_PER.w.ic,L('Weekly','Ugentlige')],['m',Q_PER.m.ic,L('Monthly','Månedlige')],['s',Q_PER.s.ic,L('Special','Særlige')],...(season()?[['e','🎉',L('Season','Sæson')]]:[])];
    let h=`<div class="tabs">${T.map(([k,i,t])=>`<button data-t="${k}" class="${k===tab?'on':''}">${i} ${t}</button>`).join('')}</div>`;
    if(tab==='active'){
      h+=(S.qa||[]).map((a,i)=>{const d=QDEF[a.id],[p,n]=qProg(a),[c,x]=qReward(d),rd=p>=n;return`<div class="goal ${rd?'rdy':''}"><div class="ic">${d.ic}</div><div class="tx">${esc(qText(d,a.n))}<div class="prog"><b style="width:${p/n*100}%"></b></div><small>${N(p)}/${N(n)} · ${Q_PER[d.p].ic} ${L(Q_PER[d.p].en,Q_PER[d.p].da)}</small></div><div class="rw">+${N(c)} 🪙${x?' +'+x+' XP':''}</div>${rd?`<button class="btn sm go" data-c="${i}">${L('Claim','Hent')}</button>`:`<button class="btn sm" data-x="${i}" title="${L('Give up','Opgiv')}">✕</button>`}</div>`}).join('')+
        S.quests.map(q=>{const n=NPC_BY[q.npc];return`<div class="goal ${questReady(q)?'rdy':''}"><div class="ic">💬</div><div class="tx">${esc(n.name)}<small>${esc(questText(q,true))}</small></div><div class="rw">+${N(30+S.lvl*8)} 🪙</div></div>`}).join('')||`<p class="hint">${L('No quests yet – pick up to 3 from the tabs above, or ask a neighbour if they need help!','Ingen opgaver endnu – vælg op til 3 fra fanerne ovenfor, eller spørg en nabo, om de har brug for hjælp!')}</p>`;
      h+=`<p class="hint">📜 ${L(`${Q_TOTAL} quests in total · max 3 at a time (neighbour tasks count too) · daily quests end at midnight, weekly on Monday, monthly on the 1st.`,`${Q_TOTAL} opgaver i alt · max 3 ad gangen (naboopgaver tæller med) · daglige slutter ved midnat, ugentlige mandag, månedlige den 1.`)}</p>`}
    else{const list=qOffer(tab),full=act>=3;
      h+=`<p class="hint" style="margin:0 0 6px">${tab==='s'?L('One-time quests – they never run out of time.','Engangsopgaver – de løber aldrig ud.'):tab==='e'?L('Only while the season lasts!','Kun mens sæsonen varer!'):L('New quests on the board every '+(tab==='d'?'day':tab==='w'?'week':'month')+'.','Nye opgaver på tavlen hver '+(tab==='d'?'dag':tab==='w'?'uge':'måned')+'.')}${full?' <b style="color:#d0457e">'+L('You already have 3 quests.','Du har allerede 3 opgaver.')+'</b>':''}</p>`;
      h+=list.map(d=>{const on=(S.qa||[]).some(a=>a.id===d.id),n=qTarget(d),[c,x]=qReward(d);return`<div class="goal ${on?'done':''}"><div class="ic">${d.ic}</div><div class="tx">${esc(qText(d,n))}</div><div class="rw">+${N(c)} 🪙${x?' +'+x+' XP':''}</div>${on?'✅':`<button class="btn sm go" data-a="${d.id}" ${full?'disabled':''}>${L('Take','Tag')}</button>`}</div>`}).join('')||`<p class="hint">${L('All done here – great job!','Alt klaret her – godt gået!')}</p>`}
    b.innerHTML=h;
    $$('.tabs button',b).forEach(x=>x.onclick=()=>{tab=x.dataset.t;SFX.click();draw()});
    $$('[data-a]',b).forEach(x=>x.onclick=()=>{if(qAccept(x.dataset.a)){toast('📜 '+L('Quest accepted!','Opgave taget!'));draw()}});
    $$('[data-c]',b).forEach(x=>x.onclick=()=>{qClaim(S.qa[+x.dataset.c]);draw()});
    $$('[data-x]',b).forEach(x=>x.onclick=()=>{S.qa.splice(+x.dataset.x,1);SFX.click();save();draw()})};draw()}})}

/* =====================================================================
   BILLS – every 7 real days rent and electricity arrive in your mailbox.
   Pay within 3 days, or a reminder (with a late fee) comes. After 3 reminders
   you get one final warning – if you still don't pay: GAME OVER.
   ===================================================================== */
const BILL_EVERY=7*864e5,BILL_DUE=3*864e5,WH_PER_COIN=10;
const ALWAYS_ON={fridge:30,aquarium:20,fishbowl:5,arcade:40,gaming_pc:80,jukebox:40,hot_tub:150,coffee_bar:20,tv_flat:8,wall_tv:8,home_cinema:15,incubator:25,pantry:0};
const LAMP_W={chandelier:120,crystal_chandelier:200,disco_ball:80,lights:20,xmas_lights:25,xmas_tree:30,neon_heart:30,star_lamp:10,fireplace:0};
function homeWatts(){let w=0;for(const it of itemsAll()){const f=FURN[it.id];if(!f)continue;if(f.use==='lamp'&&lampOn(it))w+=LAMP_W[it.id]!=null?LAMP_W[it.id]:40;w+=ALWAYS_ON[it.id]||0}return w}
const rentNow=()=>80+Math.max(0,S.rooms.length-3)*40+(S.yard?60:0);
function initBills(){if(!S.bill)S.bill={next:Date.now()+BILL_EVERY,wh:0,list:[]}}
let BW={w:0,t:0};
function billTick(dt){if(!S.created||!LIVE)return;initBills();const B=S.bill,now=Date.now();
  if(now-BW.t>5000){BW={w:homeWatts(),t:now}}B.wh+=BW.w*dt/3600;
  if(now>=B.next){const power=Math.round(B.wh/WH_PER_COIN),rent=rentNow();B.list.push({id:now,rent,power,kwh:Math.round(B.wh)/1000,fee:0,at:now,due:now+BILL_DUE,rem:0,paid:false});B.wh=0;B.next=now+BILL_EVERY;
    SFX.talk();notify('🧾',L('You have a bill in your mailbox!','Du har en regning i postkassen!'),L(`Rent ${rent} 🪙 + power ${power} 🪙 – pay within 3 days`,`Husleje ${rent} 🪙 + strøm ${power} 🪙 – betal inden 3 dage`),openBills);save()}
  for(const bl of B.list){if(bl.paid||now<bl.due)continue;
    if(bl.rem<3){bl.rem++;bl.fee+=25+Math.round((bl.rent+bl.power)*.1);bl.due=now+BILL_DUE;if(bl.rem===3)bl.final=0;SFX.bad();
      notify('⚠️',L(`Reminder ${bl.rem} of 3!`,`Rykker ${bl.rem} af 3!`),bl.rem<3?L(`Pay your bill (+${bl.fee} 🪙 late fee) within 3 days`,`Betal din regning (+${bl.fee} 🪙 rykkergebyr) inden 3 dage`):L('Last chance – tap to see','Sidste chance – tryk og se'),openBills);
      if(bl.rem===3)setTimeout(finalWarning,800);save()}
    else if(bl.final&&now>bl.due){gameOver();return}
    else if(!bl.final)finalWarning()}}
const billTotal=bl=>bl.rent+bl.power+bl.fee;
function finalWarning(){const bl=(S.bill.list||[]).find(b=>!b.paid&&b.rem>=3);if(!bl||$('#fwarn'))return;if(!bl.final){bl.final=1;bl.due=Date.now()+BILL_DUE;save()}
  panel({title:'🚨 '+L('Final warning!','Sidste advarsel!'),sm:true,html:`<div id="fwarn" style="text-align:center"><div style="font-size:54px">🧾</div><p style="font-size:17px">${L(`You have had 3 reminders. Pay <b>${N(billTotal(bl))} 🪙</b> within <b>${fmtDur(bl.due-Date.now())}</b> –`,`Du har fået 3 rykkere. Betal <b>${N(billTotal(bl))} 🪙</b> inden <b>${fmtDur(bl.due-Date.now())}</b> –`)}</p><p style="font-size:20px;color:#d0457e"><b>${L('or it is GAME OVER!','ellers er det GAME OVER!')}</b></p></div>`,buttons:[{label:L('Later','Senere'),v:0},{label:'🧾 '+L('Pay now','Betal nu'),cls:'go',v:1}]}).then(v=>{if(v)openBills()})}
function payBill(bl){const t=billTotal(bl);if(S.coins<t){toast(L(`Not enough coins – you need ${N(t)} 🪙. Work a job!`,`Ikke nok mønter – du skal bruge ${N(t)} 🪙. Tag et job!`),3200);SFX.bad();return false}
  S.coins-=t;bl.paid=true;if(!bl.rem)bump('billsOnTime');bump('bills');SFX.buy();hud();S.bill.list=S.bill.list.filter(b=>!b.paid).concat([bl]).slice(-8);toast(L('✅ Bill paid – thank you!','✅ Regningen er betalt – tak!'));save();return true}
function openBills(){initBills();panel({title:'🧾 '+L('Bills','Regninger'),render:b=>{const draw=()=>{const B=S.bill,open=B.list.filter(x=>!x.paid),now=Date.now();
  b.innerHTML=(open.map((bl,i)=>`<div class="goal ${bl.rem?'rdy':''}" style="${bl.rem>=3?'border-color:#ef4444;background:#fee2e2':''}"><div class="ic">${bl.rem?'⚠️':'🧾'}</div><div class="tx">${L('Bill from','Regning fra')} ${new Date(bl.at).toLocaleDateString(LANG==='da'?'da-DK':'en-GB')}
    <small>🏠 ${L('Rent','Husleje')} ${N(bl.rent)} 🪙 · ⚡ ${L('Power','Strøm')} ${N(bl.power)} 🪙 (${bl.kwh} kWh)${bl.fee?` · ⚠️ ${L('Late fees','Gebyrer')} ${N(bl.fee)} 🪙`:''}</small>
    <small>${bl.rem?`<b style="color:#d0457e">${L(`Reminder ${bl.rem}/3`,`Rykker ${bl.rem}/3`)}</b> · `:''}${now<bl.due?L(`Pay within ${fmtDur(bl.due-now)}`,`Betal inden ${fmtDur(bl.due-now)}`):L('Overdue!','For sent!')}${bl.rem>=3?' · <b style="color:#d0457e">'+L('or GAME OVER','ellers GAME OVER')+'</b>':''}</small></div>
    <button class="btn sm go" data-p="${i}" ${S.coins<billTotal(bl)?'disabled':''}>${L('Pay','Betal')} ${N(billTotal(bl))} 🪙</button></div>`).join('')||`<p class="hint">✅ ${L('No bills to pay right now.','Ingen regninger at betale lige nu.')}</p>`)+
    `<div class="goal"><div class="ic">⚡</div><div class="tx">${L('Power used so far this period','Strøm brugt indtil nu i perioden')}: <b>${(B.wh/1000).toFixed(2)} kWh ≈ ${N(B.wh/WH_PER_COIN)} 🪙</b><small>${L(`Right now your home uses ${homeWatts()} W. Lamps that are on (and fridges, TVs, aquariums…) cost power while you are online – switch off lamps you don't need!`,`Lige nu bruger dit hjem ${homeWatts()} W. Tændte lamper (og køleskabe, tv, akvarier…) koster strøm, mens du er online – sluk de lamper, du ikke bruger!`)}</small></div></div>
    <div class="goal"><div class="ic">🏠</div><div class="tx">${L('Next bill','Næste regning')}: <b>${fmtDur(Math.max(0,B.next-now))}</b><small>${L(`Rent is ${rentNow()} 🪙 (more rooms and a garden cost more).`,`Huslejen er ${rentNow()} 🪙 (flere rum og en have koster mere).`)}</small></div></div>`;
  $$('[data-p]',b).forEach(x=>x.onclick=()=>{if(payBill(open[+x.dataset.p]))draw()})};draw()}})}
function billReminder(){initBills();const open=S.bill.list.filter(b=>!b.paid);if(!open.length)return;const now=Date.now(),tot=open.reduce((a,b)=>a+billTotal(b),0),worst=Math.max(...open.map(b=>b.rem));
  panel({title:'🧾 '+L('You have unpaid bills!','Du har ubetalte regninger!'),sm:true,html:`<div style="text-align:center"><div style="font-size:50px">📬🧾</div>
    <p style="font-size:17px">${L(`${open.length} bill${open.length>1?'s':''} waiting in your mailbox: <b>${N(tot)} 🪙</b>`,`${open.length} regning${open.length>1?'er':''} venter i din postkasse: <b>${N(tot)} 🪙</b>`)}</p>
    ${open.map(b=>`<p class="hint" style="margin:2px 0">${b.rem?`<b style="color:#d0457e">${L(`Reminder ${b.rem}/3`,`Rykker ${b.rem}/3`)}</b> · `:''}${now<b.due?L(`pay within ${fmtDur(b.due-now)}`,`betal inden ${fmtDur(b.due-now)}`):L('overdue!','for sent!')}</p>`).join('')}
    ${worst>=3?`<p style="color:#d0457e"><b>${L('Last chance – or it is GAME OVER!','Sidste chance – ellers er det GAME OVER!')}</b></p>`:''}</div>`,
    buttons:[{label:L('Later','Senere'),v:0},{label:'🧾 '+L('Pay now','Betal nu'),cls:'go',v:1}]}).then(v=>{if(v)openBills()})}
function gameOver(){if(gameOver.on)return;gameOver.on=true;$$('.ov').forEach(o=>o._close&&o._close());net.leave();

  const pos=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
  c.addEventListener('pointerdown',e=>{if(game.over)return;const p=pos(e);game.click&&game.click(p.x,p.y)});
  ({bubble:initBubble,cafe:initCafe,garden:initGarden,cashier:initCashier,pizza:initPizza,mail:initMail,library:initLibrary,fishing:initFishing,snake:initSnake,memory:initMemory,tower:initTower,rhythm:initRhythm})[id](game);
  // 3-2-1 countdown
  game.count=3;let last=performance.now();
  const loop=now=>{if(MINI!==game)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    if(game.count>0){game.count-=dt;game.draw(dt*0);g.fillStyle='rgba(10,30,60,.5)';g.fillRect(0,0,W,H);label(g,game.count>0?String(Math.ceil(game.count)):L('GO!','KØR!'),W/2,H/2,90);requestAnimationFrame(loop);return}

/* ---- Bubble Pop: tap groups of 2+ same-coloured bubbles ---- */
function initBubble(G){
  const COLS=10,ROWS=8,R=26,cols=['#ff5a7a','#ffc93c','#43c46b','#3fa0ff','#a970ff'],ox=(G.W-COLS*2*R)/2+R,oy=G.H-R-8;
  let grid=[...Array(COLS)].map(()=>[...Array(ROWS)].map(()=>rnd(5)));
  const parts=[];
  G.click=(x,y)=>{const ci=Math.round((x-ox)/(2*R)),ri=Math.round((oy-y)/(2*R));if(ci<0||ci>=COLS||ri<0||ri>=ROWS||grid[ci][ri]==null)return;
    const col=grid[ci][ri],seen=new Set(),stack=[[ci,ri]],grp=[];
    while(stack.length){const[a,b]=stack.pop(),k=a+','+b;if(seen.has(k)||a<0||b<0||a>=COLS||b>=ROWS||grid[a][b]!==col)continue;seen.add(k);grp.push([a,b]);stack.push([a+1,b],[a-1,b],[a,b+1],[a,b-1])}
    if(grp.length<2){SFX.bad();return}
    grp.forEach(([a,b])=>{parts.push({x:ox+a*2*R,y:oy-b*2*R,c:cols[col],t:0});grid[a][b]=null});
    const pts=grp.length*grp.length*2;G.score+=pts;parts.push({x:ox+ci*2*R,y:oy-ri*2*R-20,txt:'+'+pts,t:0});SFX.pop();if(grp.length>=6)SFX.coin();
    for(let a=0;a<COLS;a++){const col2=grid[a].filter(v=>v!=null);while(col2.length<ROWS)col2.push(rnd(5));grid[a]=col2}
  };
  G.draw=dt=>{const g=G.g;g.fillStyle=lg(g,0,0,0,G.H,[[0,'#bfe6ff'],[1,'#ffe0f0']]);g.fillRect(0,0,G.W,G.H);
    for(let a=0;a<COLS;a++)for(let b=0;b<ROWS;b++){const v=grid[a][b];if(v==null)continue;const x=ox+a*2*R,y=oy-b*2*R;ell(g,x,y,R-2,R-2,cols[v],2.5);ell(g,x-8,y-9,7,5,'rgba(255,255,255,.75)',0)}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>.6){parts.splice(i,1);continue}if(p.txt)label(g,p.txt,p.x,p.y-p.t*60,24,'#ffe066');else{g.globalAlpha=1-p.t/.6;g.beginPath();g.arc(p.x,p.y,R*(1+p.t*2),0,7);g.strokeStyle=p.c;g.lineWidth=4;g.stroke();g.globalAlpha=1}}};
}

/* ---- Garden Harvest: whack the veggies, not the weeds ---- */

    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>.7){parts.splice(i,1);continue}label(g,p.txt,p.x,p.y-p.t*50,26,p.good?'#ffe066':'#ff8a80')}

}

/* ---- Pizza Chef: add the toppings on the order, then bake ---- */

    if(Math.hypot(x-250,y-255)<110&&on.length){on.pop();SFX.click()}};

function initCashier(G){
  const GOODS=['🍎','🥕','🍌','🥛','🧀','🍞','🥪','🍰','🧃','🍦','🧼','🧴','🍟','🥔'],belt=[],parts=[];let spawn=.6,cust=null,custLeft=0,total=0,miss=0,done=0;
  const newCust=()=>{cust={n:pick(NPCS),items:3+rnd(4),t:0,miss:0};custLeft=cust.items};
  newCust();
  G.click=(x,y)=>{for(let i=belt.length-1;i>=0;i--){const b=belt[i];if(!b.scanned&&Math.abs(x-b.x)<38&&Math.abs(y-b.y)<40){
    if(b.bar){G.score=Math.max(0,G.score-5);SFX.bad();parts.push({x:b.x,y:b.y-40,txt:'-5',t:0,good:false});b.scanned=true;return}
    b.scanned=true;G.score+=8;total+=b.p;SFX.tone(1760,.07,'square',.05);parts.push({x:b.x,y:b.y-40,txt:'beep! +8',t:0,good:true});return}}};
  G.update=dt=>{const speed=90+G.t*2.2;spawn-=dt;
    if(spawn<=0){if(custLeft>0){belt.push({x:-40,y:270,e:pick(GOODS),p:2+rnd(9),scanned:false,c:cust});custLeft--;spawn=rr(.55,1.1)*90/speed}else{belt.push({x:-40,y:270,bar:true,scanned:false,c:cust});newCust();spawn=1.2}}
    for(let i=belt.length-1;i>=0;i--){const b=belt[i];b.x+=speed*dt;if(b.scanned&&!b.bar)b.y-=dt*30;
      if(b.x>G.W-110){if(b.bar){const c=b.c;if(!c.miss){G.score+=15;SFX.coin();parts.push({x:G.W-150,y:150,txt:L('Happy customer! +15','Glad kunde! +15'),t:0,good:true})}total=0}
        else if(!b.scanned){G.score=Math.max(0,G.score-8);b.c.miss++;miss++;SFX.bad();parts.push({x:G.W-150,y:230,txt:L('Missed! -8','Glemt! -8'),t:0,good:false})}
        belt.splice(i,1)}}
    if(cust)cust.t+=dt};
  G.draw=dt=>{const g=G.g;drawWall(g,'wp_lime',0,0,G.W,200);drawFloor(g,'fl_tiles',0,200,G.W,G.H-200);
    label(g,L('Tater Market – Checkout','Kartoffelmarkedet – Kasse'),G.W/2,26,24);

    const c=belt.length?belt[belt.length-1].c:cust;if(c)drawPet(g,G.W-60,230,.6,{look:c.n.look,outfit:c.n.outfit,t:G.t,dir:-1});
    // belt
    box(g,-10,232,G.W-90,80,10,'#334155');for(let k=0;k<20;k++){const x=((k*50+G.t*(90+G.t*2.2))%(G.W-60))-20;line(g,x,240,x,304,'#475569',3)}
    box(g,G.W-120,226,40,92,6,'#16a34a',3);g.font='bold 12px Nunito';g.fillStyle='#fff';g.textAlign='center';g.fillText(L('END','SLUT'),G.W-100,276);
    for(const b of belt){if(b.bar){box(g,b.x-30,b.y-14,60,20,4,b.scanned?'#94a3b8':'#ef4444',2);continue}
      ell(g,b.x,b.y+14,30,8,'rgba(0,0,0,.18)',0);g.globalAlpha=b.scanned?.5:1;g.font='46px serif';g.fillStyle='#000';g.textAlign='center';g.textBaseline='middle';g.fillText(b.e,b.x,b.y);g.globalAlpha=1;if(b.scanned)label(g,'✓',b.x+22,b.y-22,22,'#43c46b')}
    // register screen
    box(g,40,340,240,90,12,'#1f2937',4);g.font='20px Lilita One,Nunito';g.fillStyle='#22d3ee';g.textAlign='left';g.textBaseline='middle';g.fillText(L('TOTAL','I ALT'),60,368);g.font='34px Lilita One,Nunito';g.fillText(N(total)+' 🪙',60,404);
    g.font='bold 15px Nunito';g.fillStyle=OL;g.textAlign='right';g.fillText(L('Tap each item to scan it! Not the red dividers.','Tryk på hver vare for at scanne den! Ikke de røde skillepinde.'),G.W-14,380);
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>.9){parts.splice(i,1);continue}label(g,p.txt,p.x,p.y-p.t*50,20,p.good?'#ffe066':'#ff8a80')}};

// what friends see when they visit: rooms (+ the pets living there) and the garden
function houseData(){const pl=k=>S.pets.filter(p=>p.where==='home'&&p.room===k).map(p=>({type:p.type,name:p.name}));
  return{rooms:S.rooms.map((r,i)=>({...r,pets:pl(i)})),yard:S.yard&&{...S.yard,pets:pl('yard')}}}
const PEERJS='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',PREFIX='potato-ville-';
const peerOpts=()=>window.__PEER_OPTS||{config:{iceServers:[]},pingInterval:4000};
const net=(()=>{
  const NS={role:null,peer:null,conns:{},conn:null,code:'',id:'solo',players:{},houses:{},lastSent:'',sendT:0,seen:{}};
  const prof=()=>({name:S.name,look:S.look,outfit:S.outfit,lvl:S.lvl,flag:myFlag()});
  const myState=()=>({scene:sceneKey(),x:Math.round(ME.act?ME.act.item.x:ME.x),y:Math.round(ME.act?ME.act.item.y:ME.y),dir:ME.dir,walk:ME.walk&&!ME.act,say:ME.sayT>0?ME.say:''});
  const send=m=>{if(NS.role==='guest'&&NS.conn&&NS.conn.open)try{NS.conn.send(m)}catch(e){}};
  const bcast=(m,except)=>{Object.entries(NS.conns).forEach(([id,c])=>{if(id!==except&&c.open)try{c.send(m)}catch(e){}})};
  const loadPeer=()=>window.Peer?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src=PEERJS;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)});
  const code=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[rnd(32)]).join('');
  function upsert(id,data){const p=NS.players[id]=NS.players[id]||{id,x:0,y:0,rx:0,ry:0,dir:1,walk:false,t:rnd(9)};
    Object.assign(p,data);if(p.rx===0&&p.ry===0){p.rx=p.x;p.ry=p.y}return p}
  function playersMsg(){const list=Object.values(NS.players).map(p=>({id:p.id,name:p.name,flag:p.flag,look:p.look,outfit:p.outfit,lvl:p.lvl,scene:p.scene,x:p.x,y:p.y,dir:p.dir,walk:p.walk,say:p.say}));return{t:'players',list}}
  function houseUpdate(owner,h){NS.houses[owner]=h;if(SCENE.type==='home'&&SCENE.owner===owner&&OTHER_HOUSE&&h){OTHER_HOUSE.rooms=h.rooms;OTHER_HOUSE.yard=h.yard;if(SCENE.yard&&!h.yard)SCENE.yard=false}}
  function onHostMsg(c,m){if(!m||typeof m!=='object')return;NS.seen[c.peer]=Date.now();
    if(m.t==='hello'){if(Object.keys(NS.players).length>=4){c.send({t:'full'});setTimeout(()=>c.close(),300);return}
      NS.conns[c.peer]=c;upsert(c.peer,{...m.prof,scene:'town',x:BLD[0].door.x,y:520});if(m.house)NS.houses[c.peer]=m.house;
      c.send({t:'welcome',id:c.peer,houses:NS.houses});bcast(playersMsg());bcast({t:'house',owner:c.peer,rooms:NS.houses[c.peer]},c.peer);
      toast(L(`📶 ${esc(m.prof.name)} joined!`,`📶 ${esc(m.prof.name)} er med!`));SFX.buy();refreshNet();return}
    const p=NS.players[c.peer];if(!p)return;
    if(m.t==='st')Object.assign(p,m.s);
    else if(m.t==='prof'){Object.assign(p,m.prof);bcast(playersMsg())}
    else if(m.t==='house'){houseUpdate(c.peer,m.rooms);bcast({t:'house',owner:c.peer,rooms:m.rooms},c.peer)}
    else if(m.t==='chat'){p.say=String(m.text).slice(0,60);p.sayT=5;bcast({t:'chat',id:c.peer,text:p.say},c.peer)}
    else if(['ball','pev','duel','duelAns','duelScore','gift','act'].includes(m.t)){shared(m);bcast(m,c.peer)}
    else if(m.t==='away'){p.away=!!m.v}
  }
  function hostLost(id){if(!NS.players[id])return;const nmx=NS.players[id].name;delete NS.players[id];delete NS.conns[id];bcast({t:'bye',id});toast(L(`👋 ${esc(nmx)} left`,`👋 ${esc(nmx)} gik`));kickIfVisiting(id);refreshNet()}

    const len=c.sampleRate*2.8,ir=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);let lp=0;for(let i=0;i<len;i++){lp=lp*.7+(Math.random()*2-1)*.3;d[i]=lp*Math.pow(1-i/len,3)}}
    this.rev=c.createConvolver();this.rev.buffer=ir;this.wet=c.createGain();this.wet.gain.value=.55;this.rev.connect(this.wet).connect(this.out);return c},
  level(){return this.vol*.9},
  start(){if(!this.on||this.playing||document.visibilityState==='hidden')return;const c=this.init();if(!c)return;this.playing=true;this.newTrack();this.timer=setInterval(()=>this.sched(),100);this.fade(this.level(),3)},
  stop(){if(!this.playing)return;this.playing=false;clearInterval(this.timer);this.fade(0,.8)},
  fade(v,s){const g=this.out.gain,t=this.c.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(v,t+s)},
  setVol(v){this.vol=v;PREF.mvol=v;savePref();if(this.playing)this.fade(this.level(),.2)},
  toggle(){this.on=!this.on;PREF.music=this.on;savePref();if(this.on)this.start();else this.stop();updMusicBtn()},
  pickTrack(){const night=NIGHT>.55,dec=isSnow();let pool=TRACKS.filter(t=>(!t.xmas||dec)&&t!==this.track);if(night){const p2=pool.filter(t=>t.night||t.id==='cafe'||t.xmas);if(p2.length)pool=p2}return pick(pool)},
  newTrack(t){this.track=t||this.pickTrack();const tr=this.track;this.sd=60/tr.bpm/2;this.nextT=this.c.currentTime+.15;this.step=0;this.bar=0;this.bars=64;this.mot=null;this.prevV=null;
    const ttl=$('#musNow');if(ttl)ttl.textContent=L(tr.en,tr.da)},
  skip(){if(!this.playing)return;this.fade(0,.6);setTimeout(()=>{if(!this.playing)return;this.newTrack();this.fade(this.level(),1.5)},700)},
  sched(){if(!this.playing)return;const c=this.c;if(c.state!=='running')return;if(this.nextT<c.currentTime-1)this.nextT=c.currentTime+.05;
    while(this.nextT<c.currentTime+.5){this.play(this.nextT);this.step++;if(this.step%8===0){this.bar++;if(this.bar>=this.bars){this.bar=0;this.fade(0,4);const nt=this.pickTrack();setTimeout(()=>{if(this.playing){this.newTrack(nt);this.fade(this.level(),4)}},4200);this.nextT+=999;return}}this.nextT+=this.sd}},
  hz:m=>440*Math.pow(2,(m-69)/12),
  chordNow(){const tr=this.track,[o,q]=tr.prog[this.bar%tr.prog.length];return{root:tr.key+o,iv:CQ[q]}},
  // smooth voicing: chord tones (without the root) placed around middle C, close to the previous chord
  voicing(ch){const notes=ch.iv.slice(1).map(i=>{let m=ch.root+i;while(m<55)m+=12;while(m>69)m-=12;return m}).sort((a,b)=>a-b);this.prevV=notes;return notes},
  section(){return Math.floor(this.bar/8)%4}, // 0 intro · 1 verse · 2 chorus · 3 soft break
  // melody: a short motif per section, repeated with variations and a calm ending
  makeMotif(){const tr=this.track,P=[0,2,4,7,9],rh=pick([[0,3,4,6],[0,2,4],[0,3,6],[0,1,2,4,6],[0,4,6],[2,3,4,6]]);let d=rnd(3)+1;const notes=rh.map(s=>{d=clamp(d+pick([-1,0,1,1,-1,2,-2]),0,7);return[s,d]});return{rh,notes,P}},
  leadNote(deg){const tr=this.track,P=[0,2,4,7,9];return tr.key+12+P[((deg%5)+5)%5]+12*Math.floor(deg/5)},
  play(t){const tr=this.track,s=this.step%8,sw=s%2?this.sd*tr.swing*.6:0,T=t+sw,sec=this.section(),ch=this.chordNow(),bar8=this.bar%8;
    if(s===0&&bar8===0&&(!this.mot||Math.random()<.6))this.mot=this.makeMotif();
    const v=s===0?this.voicing(ch):this.prevV;
    // keys / comping
    if(tr.keys==='ep'){if(s===0)v.forEach((m,i)=>this.ep(T+i*.012,m,this.sd*5,.05));if(s===5&&tr.swing>.4)v.forEach(m=>this.ep(T,m,this.sd*2,.03))}
    if(tr.keys==='guitar'){if(s===0||s===3||s===6)v.forEach((m,i)=>this.guitar(T+i*.025,m,s===0?.06:.04));}
    if(tr.keys==='box'){const arp=[0,1,2,3,2,1,0,1];const m=v[arp[s]%v.length]+12;this.box(T,m,.035)}
    if((tr.pad||sec===0||sec===3)&&s===0)this.pad(T,v,this.sd*8);
    // bass (from the verse on)
    if(sec>0){const r=ch.root-24+(ch.root-24<36?12:0);if(tr.walk){const w=[0,ch.iv[1],ch.iv[2],ch.iv[1]+(ch.iv[1]>3?-2:2)];if(s%2===0)this.bass(T,r+w[s/2],this.sd*1.8,.11)}else{if(s===0)this.bass(T,r,this.sd*3.5,.13);if(s===5)this.bass(T,r+7,this.sd*1.5,.08);if(s===7&&bar8%2)this.bass(T,r+12,this.sd,.06)}}
    // drums: soft and clean (no hiss)
    const dr=tr.drums;if(dr&&sec>0&&sec<3){if(dr==='lofi'){if(s===0||s===5)this.kick(T,.11);if(s===2||s===6)this.rim(T,.05);if(s%2)this.tick(T,.012)}
      if(dr==='light'){if(s===0||s===4)this.kick(T,.09);if(s===2||s===6)this.clap(T,.03);if(s%2)this.tick(T,.012)}
      if(dr==='jazz'){if(s%2===0)this.tick(T,.02,4200);if(s===2||s===6)this.rim(T,.035);if(s===0)this.kick(T,.06)}
      if(dr==='sleigh'){if(s%2)this.jingle(T,.02);if(s===0)this.kick(T,.08)}}
    // lead melody in verse and chorus, gentle answer in the break
    if(this.mot&&(sec===1||sec===2||(sec===3&&bar8%2===0))&&bar8!==7){const off=[0,0,2,-1,0,0,1,0][bar8];
      for(const [st,dg] of this.mot.notes)if(st===s){let deg=dg+off+(sec===2?2:0);if(bar8===6&&st>=4)deg=Math.round(deg/5)*5;const m=this.leadNote(deg);this.lead(T,m,this.sd*(bar8===6?4:2))}}
    if(bar8===7&&s===0&&sec>0)this.lead(T,this.leadNote(sec===2?5:0),this.sd*6)},
  lead(t,m,dur){const tr=this.track,L2=tr.lead;if(L2==='flute')this.flute(t,m,dur,.05);else if(L2==='box')this.box(t,m+12,.05);else if(L2==='bell')this.bell(t,m,.045);else this.ep(t,m,dur,.07)},
  g(t,a,peak,dec,wet){const c=this.c,g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0004,t+a+dec);g.connect(this.out);if(wet)g.connect(this.rev);return g},
  osc(type,f,t,end,dest,det=0){const o=this.c.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=det;o.connect(dest);o.start(t);o.stop(end);return o},
  // electric piano: soft FM bell tone with a little tremolo
  ep(t,m,dur,v){const c=this.c,f=this.hz(m),d=Math.max(1,dur*1.8),g=this.g(t,.008,v,d,1),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;lp.connect(g);
    const car=this.osc('sine',f,t,t+d+.1,lp),mod=c.createOscillator(),mg=c.createGain();mod.frequency.value=f;mg.gain.setValueAtTime(f*1.2,t);mg.gain.exponentialRampToValueAtTime(f*.05,t+.6);mod.connect(mg).connect(car.frequency);mod.start(t);mod.stop(t+d+.1);
    this.osc('sine',f*.5,t,t+d*.6,this.g(t,.01,v*.25,d*.6,0))},
  guitar(t,m,v){const c=this.c,f=this.hz(m),g=this.g(t,.004,v,.9,1),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(3200,t);lp.frequency.exponentialRampToValueAtTime(700,t+.5);lp.connect(g);this.osc('triangle',f,t,t+1,lp);this.osc('sine',f*2,t,t+.5,lp,4)},
  box(t,m,v){const f=this.hz(m);this.osc('sine',f,t,t+1.4,this.g(t,.003,v,1.3,1));this.osc('sine',f*4,t,t+.3,this.g(t,.002,v*.18,.25,1))},
  bell(t,m,v){const f=this.hz(m);this.osc('sine',f,t,t+2,this.g(t,.004,v,1.9,1));this.osc('sine',f*2.01,t,t+1,this.g(t,.004,v*.3,.9,1))},
  flute(t,m,dur,v){const c=this.c,f=this.hz(m),d=Math.max(.4,dur),g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.08);g.gain.setValueAtTime(v,t+d*.7);g.gain.linearRampToValueAtTime(0,t+d+.15);g.connect(this.out);g.connect(this.rev);
    const o=this.osc('sine',f,t,t+d+.2,g),vib=c.createOscillator(),vg=c.createGain();vib.frequency.value=5;vg.gain.value=f*.006;vib.connect(vg).connect(o.frequency);vib.start(t+.15);vib.stop(t+d+.2);this.osc('triangle',f,t,t+d+.2,this.g(t,.08,v*.25,d,0))},
  pad(t,ms,dur){const c=this.c;ms.forEach(m=>[-6,6].forEach(cent=>{const g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.014,t+dur*.4);g.gain.linearRampToValueAtTime(0,t+dur*1.05);lp.connect(g);g.connect(this.out);g.connect(this.rev);this.osc('triangle',this.hz(m),t,t+dur*1.1,lp,cent)}))},
  bass(t,m,dur,v){const c=this.c,f=this.hz(m),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;const g=this.g(t,.015,v,Math.max(.35,dur),0);lp.connect(g);this.osc('sine',f,t,t+dur+.4,lp);this.osc('triangle',f,t,t+dur+.4,lp)},
  kick(t,v){const c=this.c,o=c.createOscillator(),g=this.g(t,.004,v,.28,0);o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(42,t+.16);o.connect(g);o.start(t);o.stop(t+.35)},
  rim(t,v){this.osc('triangle',1650,t,t+.06,this.g(t,.001,v,.05,1));this.osc('sine',820,t,t+.07,this.g(t,.001,v*.6,.06,0))},
  clap(t,v){[0,.012,.024].forEach(d=>this.osc('triangle',1200+rnd(200),t+d,t+d+.05,this.g(t+d,.001,v,.04,1)))},
  tick(t,v,f=6200){this.osc('sine',f,t,t+.03,this.g(t,.001,v,.025,0))},
  jingle(t,v){[2600,3100,3700].forEach((f,i)=>this.osc('sine',f+rnd(80),t+i*.01,t+.2,this.g(t+i*.01,.002,v,.15,1)))}};
function updMusicBtn(){const b=$('#bMus');if(b){b.textContent=MUSIC.on?'🎵':'🔕';b.title=MUSIC.on?L('Music on','Musik til'):L('Music off','Musik fra')}}
addEventListener('pointerdown',()=>{if(MUSIC.on&&!MUSIC.playing)MUSIC.start()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')MUSIC.stop();else if(MUSIC.on)setTimeout(()=>MUSIC.start(),300)});

/* ---------------- loading screen & main menu (3 character slots, each with its own save) ---------------- */
const slotData=i=>{try{const d=JSON.parse(localStorage.getItem(slotKey(i))||'null');return d&&d.created?d:null}catch(e){return null}};
async function boot(){
  const ld=$('#loading'),bar=$('#ldBar'),tip=$('#ldTip');
  const tips=[L('Tip: take the 🚌 bus to get around the big town!','Tip: tag 🚌 bussen for at komme rundt i den store by!'),L('Tip: fill your pets’ bowls every day for a bonus.','Tip: fyld dine kæledyrs skåle hver dag for en bonus.'),L('Tip: lamps make your home cozy at night.','Tip: lamper gør dit hjem hyggeligt om natten.'),L('Tip: cook with veggies from your own garden!','Tip: lav mad med grøntsager fra din egen have!'),L('Tip: challenge friends to a duel in the arcade.','Tip: udfordr venner til en duel i spillehallen.')];
  tip.textContent=pick(tips);
  const step=(p,txt)=>new Promise(r=>{bar.style.width=p+'%';$('#ldTxt').textContent=txt;setTimeout(r,60)});
  const t0=performance.now();
  await step(10,L('Waking up the potatoes…','Vækker kartoflerne…'));
  try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))])}catch(e){}
  await step(35,L('Opening the shops…','Åbner butikkerne…'));buildShops();
  await step(65,L('Building the town…','Bygger byen…'));buildTownBG();
  await step(90,L('Watering the flowers…','Vander blomsterne…'));resize();document.documentElement.lang=LANG;applyStatic();
  await new Promise(r=>setTimeout(r,Math.max(0,900-(performance.now()-t0))));
  await step(100,L('Ready!','Klar!'));
  ld.classList.add('out');setTimeout(()=>ld.remove(),450);
  showMainMenu();
}
function showMainMenu(){
  $('#hud').style.display='none';$('#nav').style.display='none';$('.rbtns').style.display='none';
  const wrap=document.createElement('div');wrap.className='creator mainmenu';
  const draw=()=>{
    wrap.innerHTML=`<div class="pn"><div class="ph"><h2>🏡 Potato Ville</h2><div class="langs"><button data-l="en">🇬🇧</button><button data-l="da">🇩🇰</button></div></div>
      <div class="pb"><div class="logo">Potato <b>Ville</b></div><p class="hint" style="text-align:center;margin:4px 0 12px">${L('Choose a character – each one has its own home, pets and coins.','Vælg en karakter – hver har sit eget hjem, kæledyr og mønter.')}</p>
      <div class="slots3">${[0,1,2].map(i=>{const d=slotData(i);return d?`<div class="slot"><canvas data-s="${i}" width="240" height="250"></canvas><b>${esc(d.name)}</b><small>${L('Level','Niveau')} ${d.lvl||1} · 🪙 ${N(d.coins||0)}</small>
        <button class="btn go" data-play="${i}">▶ ${L('Play','Spil')}</button><button class="btn sm no" data-del="${i}">🗑️ ${L('Delete','Slet')}</button></div>`:`<div class="slot empty"><div class="plus">＋</div><b>${L('Empty slot','Tom plads')}</b><small>${L('Slot','Plads')} ${i+1}</small><button class="btn ok" data-new="${i}">✨ ${L('New character','Ny karakter')}</button>${bakData(i)?`<button class="btn sm" data-bak="${i}">♻️ ${L('Restore','Gendan')} ${esc(bakData(i).d.name)}</button>`:''}</div>`}).join('')}</div></div>
      <div class="pf"><button class="btn" id="mmHelp">❓ ${L('How to play','Sådan spiller du')}</button><button class="btn" id="mmAll">← ${L('All games','Alle spil')}</button></div></div>`;
    $$('canvas[data-s]',wrap).forEach(c=>{const d=slotData(+c.dataset.s);const g=c.getContext('2d');g.setTransform(2,0,0,2,0,0);drawPet(g,60,118,.85,{look:d.look,outfit:d.outfit,t:0})});
    $$('.langs button',wrap).forEach(b=>{b.classList.toggle('on',b.dataset.l===LANG);b.onclick=()=>{setLang(b.dataset.l);draw()}});
    $$('[data-play]',wrap).forEach(b=>b.onclick=()=>chooseSlot(+b.dataset.play));
    $$('[data-new]',wrap).forEach(b=>b.onclick=()=>chooseSlot(+b.dataset.new));$$('[data-bak]',wrap).forEach(b=>b.onclick=()=>restoreBackup(+b.dataset.bak));
    $$('[data-del]',wrap).forEach(b=>b.onclick=async()=>{const i=+b.dataset.del,d=slotData(i);if(await panel({title:L('Delete character?','Slet karakter?'),sm:true,html:`<p>${L(`${esc(d.name)}, the home, pets and coins in this slot will be deleted for good.`,`${esc(d.name)} samt hjemmet, kæledyrene og mønterne på denne plads bliver slettet for altid.`)}</p>`,buttons:[{label:L('Cancel','Annuller'),v:0},{label:L('Delete','Slet'),cls:'no',v:1}]})){localStorage.removeItem(slotKey(i));draw()}});
    $('#mmHelp',wrap).onclick=()=>help();$('#mmAll',wrap).onclick=()=>{location.href='./'};
  };
  document.body.appendChild(wrap);draw();
}
function chooseSlot(i){SFX.click();SLOT=i;PREF.slot=i;savePref();S=fresh();load();LIVE=true;backup(true);tickStats(Date.now(),true);$('.mainmenu')&&$('.mainmenu').remove();
  if(!S.created)openCreator(false);else startGame(false)}
function toMainMenu(){saveNow();net.leave();RESETTING=true;location.reload()}

// boot
updMusicBtn();
$('#hud').style.display='none';$('#nav').style.display='none';$('.rbtns').style.display='none';
boot();
requestAnimationFrame(frame);
</script>

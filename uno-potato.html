<style>
:root{
  --cw:64px;--ch:96px;
  --ink:#1b120b;--txt:#fff6e4;--muted:#e2cfa9;--gold:#ffcb52;--goldD:#c98a1c;

  --r:#e23b3b;--y:#f2b01e;--g:#36a443;--p:#7c4dcc;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#140c06;color:var(--txt);font-family:Nunito,system-ui,sans-serif;font-weight:800;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
.hide{display:none!important}
.lil{font-family:'Lilita One',Nunito,sans-serif;font-weight:400;letter-spacing:.5px}

/* ===== TABLE ===== */
#room{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#3b2614,#160d06 70%);overflow:hidden}
#felt{position:absolute;left:6px;right:6px;top:calc(6px + var(--st));bottom:calc(6px + var(--sb));border-radius:42px;
  background:radial-gradient(ellipse at 50% 46%,#38a058 0%,#2b7d45 38%,#1d5a31 72%,#143f22 100%);
  border:12px solid var(--wood);
  box-shadow:inset 0 0 0 3px #2b170a,inset 0 0 60px rgba(0,0,0,.55),0 0 0 3px #2b170a,0 10px 40px rgba(0,0,0,.6);
  border-image:none}
#felt::before{content:"";position:absolute;inset:-12px;border-radius:42px;pointer-events:none;
  background:repeating-linear-gradient(100deg,rgba(255,255,255,.05) 0 3px,transparent 3px 11px),linear-gradient(180deg,rgba(255,220,170,.18),transparent 30%,rgba(0,0,0,.25));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:12px}
#felt::after{content:"";position:absolute;inset:0;border-radius:30px;pointer-events:none;opacity:.22;
  background:repeating-radial-gradient(circle at 30% 30%,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
.logoFelt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:min(16vw,120px);color:rgba(0,0,0,.09);white-space:nowrap;pointer-events:none}

#cards{position:absolute;inset:0;pointer-events:none;z-index:10}
#seats{position:absolute;inset:0;pointer-events:none;z-index:12}
#room.idle #deck,#room.idle #ring,#room.idle #colorDot,#room.idle #status{display:none}
.card{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);transition:transform .46s cubic-bezier(.2,.8,.25,1),opacity .35s,filter .2s;will-change:transform;pointer-events:none}
.card.mine{pointer-events:auto;cursor:pointer}
.noanim .card,.noanim .card .ci{transition:none!important}
.ci{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .42s ease}
.card.down .ci{transform:rotateY(180deg)}
.fr,.bk{position:absolute;inset:0;border-radius:calc(var(--cw)*.13);-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 2px 3px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.35)}
.bk{transform:rotateY(180deg);background:#fff;padding:calc(var(--cw)*.055)}
.bk>i{position:absolute;inset:calc(var(--cw)*.055);border-radius:calc(var(--cw)*.09);overflow:hidden;
  background:radial-gradient(circle at 50% 50%,#6b3a1c,#3a1e0d 70%),#3a1e0d}
.bk>i::before{content:"";position:absolute;left:50%;top:50%;width:72%;height:92%;transform:translate(-50%,-50%) rotate(24deg);border-radius:50%;background:#e23b3b;box-shadow:0 0 0 calc(var(--cw)*.03) #f8d36a}
.bk>i::after{content:"UNO\APotato";white-space:pre;position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:'Lilita One';font-size:calc(var(--cw)*.2);line-height:.95;color:#ffe08a;transform:rotate(-18deg);text-shadow:0 2px 0 #5a1010,0 0 3px #000}
.fr{background:#fff}
.fr>.in{position:absolute;inset:calc(var(--cw)*.055);border-radius:calc(var(--cw)*.09);background:var(--cc);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),inset 0 calc(var(--cw)*-.12) calc(var(--cw)*.2) rgba(0,0,0,.18)}
.oval{position:absolute;left:50%;top:50%;width:74%;height:90%;transform:translate(-50%,-50%) rotate(24deg);border-radius:50%;background:#fff8ea;box-shadow:inset 0 0 0 calc(var(--cw)*.018) rgba(0,0,0,.25)}
.num{position:absolute;inset:0;display:grid;place-items:center;font-family:'Lilita One';font-size:calc(var(--cw)*.66);line-height:1;color:var(--cc);
  -webkit-text-stroke:calc(var(--cw)*.028) #1b120b;paint-order:stroke fill;text-shadow:calc(var(--cw)*.035) calc(var(--cw)*.035) 0 #1b120b}
.num.sm{font-size:calc(var(--cw)*.5)}
.num u{text-decoration:underline;text-decoration-thickness:calc(var(--cw)*.045);text-underline-offset:calc(var(--cw)*.03)}
.crn{position:absolute;font-family:'Lilita One';font-size:calc(var(--cw)*.24);line-height:1;color:#fff;-webkit-text-stroke:calc(var(--cw)*.014) #1b120b;paint-order:stroke fill;text-shadow:0 1px 0 #1b120b}
.crn.tl{left:9%;top:5%}.crn.br{right:9%;bottom:5%;transform:rotate(180deg)}
.ico{position:absolute;left:12%;right:12%;top:18%;bottom:18%}
.ico svg,.mini svg{width:100%;height:100%;display:block}
.mini{position:absolute;width:26%;height:18%;left:14%;bottom:16%}
.cname{position:absolute;left:8%;right:30%;bottom:3%;text-align:left;overflow:hidden;font-size:calc(var(--cw)*.085);color:#fff;text-shadow:0 1px 1px #000;white-space:nowrap;display:none}
.bigc .cname{display:block}
.wildbg{background:conic-gradient(var(--r) 0 25%,var(--y) 0 50%,var(--g) 0 75%,var(--p) 0)!important}
.card.ok{filter:drop-shadow(0 0 calc(var(--cw)*.08) #fff6a0) drop-shadow(0 0 2px #ffd84a)}
.card.dim .fr{filter:brightness(.62) saturate(.7)}
.card.mine:active{filter:brightness(1.1)}

/* piles */
#deck{position:absolute;width:var(--cw);height:var(--ch);cursor:pointer;z-index:3}
#deck .stk{position:absolute;inset:0;border-radius:calc(var(--cw)*.13);background:#fff;box-shadow:0 1px 0 #ccc,0 2px 0 #999,0 3px 0 #ddd,0 4px 0 #888,0 6px 0 #ccc,0 7px 0 #777,0 10px 12px rgba(0,0,0,.45);padding:calc(var(--cw)*.055)}
#deck .stk>i{position:absolute;inset:calc(var(--cw)*.055);border-radius:calc(var(--cw)*.09);overflow:hidden;background:radial-gradient(circle,#6b3a1c,#3a1e0d 70%)}
#deck .stk>i::before{content:"";position:absolute;left:50%;top:50%;width:72%;height:92%;transform:translate(-50%,-50%) rotate(24deg);border-radius:50%;background:#e23b3b;box-shadow:0 0 0 calc(var(--cw)*.03) #f8d36a}
#deck .stk>i::after{content:"UNO\APotato";white-space:pre;position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:'Lilita One';font-size:calc(var(--cw)*.2);line-height:.95;color:#ffe08a;transform:rotate(-18deg);text-shadow:0 2px 0 #5a1010}
#deck .dn{position:absolute;left:-10px;top:-10px;min-width:28px;height:28px;display:grid;place-items:center;font-size:12px;color:#fff;background:#1b120b;border:2px solid #ffcb52;padding:0 5px;border-radius:999px;white-space:nowrap;z-index:2}
#deck.go .stk{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 1px 0 #ccc,0 2px 0 #999,0 4px 0 #888,0 7px 0 #777,0 0 0 0 rgba(255,230,120,.9)}50%{box-shadow:0 1px 0 #ccc,0 2px 0 #999,0 4px 0 #888,0 7px 0 #777,0 0 0 calc(var(--cw)*.14) rgba(255,230,120,0)}}
#deck .tip{position:absolute;left:50%;top:-26px;transform:translateX(-50%);font-size:12px;background:#ffcb52;color:#3a2410;border:2px solid #1b120b;padding:1px 8px;border-radius:999px;white-space:nowrap;display:none}
#deck.go .tip{display:block}
#ring{position:absolute;pointer-events:none;z-index:1;transition:color .4s}
#ring svg{width:100%;height:100%;overflow:visible}
#ring .el{animation:flow 3s linear infinite}
#ring.ccw .el{animation-direction:reverse}
#ring.flip .el{animation-duration:.5s}
#ring .arw{transform-origin:100px 60px;transition:transform .4s}
#ring.ccw .arw{transform:scaleX(-1)}
@keyframes flow{to{stroke-dashoffset:-60}}
#colorDot{position:absolute;z-index:2;width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #1b120b,0 3px 8px rgba(0,0,0,.5);transition:background .3s;display:grid;place-items:center;font-size:15px}
#status{position:absolute;z-index:14;left:50%;transform:translate(-50%,-50%);max-width:calc(100% - 32px);text-align:center;font-size:clamp(13px,3.6vw,17px);
  background:rgba(14,30,18,.72);border:2px solid rgba(255,255,255,.18);padding:5px 14px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:background .3s}
#status.me{background:#ffcb52;color:#2a1a0a;border-color:#1b120b;box-shadow:0 0 18px rgba(255,210,80,.6)}
#status.warn{background:#e8453c;color:#fff;border-color:#1b120b}

/* seats */
.seat{position:absolute;z-index:20;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.av{position:relative;width:var(--av);height:var(--av);border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3d0,#e9c98f);border:3px solid #1b120b;box-shadow:0 4px 10px rgba(0,0,0,.45);transition:box-shadow .3s,transform .3s}
.av svg{position:absolute;inset:8%;width:84%;height:84%}
.av .hat{position:absolute;left:50%;top:-30%;transform:translateX(-50%);font-size:calc(var(--av)*.48)}
.seat.turn .av{box-shadow:0 0 0 4px #ffcb52,0 0 22px 6px rgba(255,210,80,.75);transform:scale(1.08)}
.seat.off .av{filter:grayscale(1) brightness(.7)}
.nm{margin-top:3px;font-size:12px;background:rgba(0,0,0,.5);padding:1px 8px;border-radius:999px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.seat.turn .nm{background:#ffcb52;color:#2a1a0a}
.cnt{position:absolute;right:-8px;bottom:-4px;min-width:22px;height:22px;border-radius:11px;background:#fff;color:#1b120b;border:2px solid #1b120b;font-size:12px;display:grid;place-items:center;padding:0 4px}
.cnt.one{background:#e8453c;color:#fff;animation:bop .6s infinite alternate}
@keyframes bop{to{transform:scale(1.15)}}
.sp{position:absolute;left:-12px;top:-6px;font-size:10px;background:#ffcb52;color:#2a1a0a;border:2px solid #1b120b;border-radius:8px;padding:0 4px;transform:rotate(-12deg)}
.catch{pointer-events:auto;position:absolute;top:calc(100% + 2px);left:50%;transform:translateX(-50%);background:#e8453c;color:#fff;border:2px solid #1b120b;border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap;animation:bop .4s infinite alternate;box-shadow:0 3px 0 #1b120b;z-index:5}
.bub{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) scale(.3);opacity:0;background:#fff;color:#1b120b;border:2px solid #1b120b;border-radius:14px;padding:3px 10px;font-size:20px;white-space:nowrap;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;z-index:9}
.bub.on{transform:translateX(-50%) scale(1);opacity:1}
.bub.spud{font-family:'Lilita One';background:#ffcb52;font-size:22px}
.seat.B .bub{bottom:auto;top:calc(-100% - 6px)}
.seat.L .nm,.seat.R .nm{max-width:calc(var(--av) + 30px)}
.dis{font-size:10px;color:#ffd0c0}

/* game hud */
#hud{position:absolute;inset:0;pointer-events:none;z-index:30}
#hud>*{pointer-events:auto}
.tbtn{position:absolute;top:calc(14px + var(--st));width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.2);font-size:18px;display:grid;place-items:center}
#bMenu{left:16px}#bSnd{right:16px}
#roundTag{position:absolute;top:calc(20px + var(--st));left:64px;font-size:12px;color:#cfe8d3;background:rgba(0,0,0,.35);padding:3px 10px;border-radius:999px;pointer-events:none}
#netTag{position:absolute;top:calc(20px + var(--st));right:64px;font-size:12px;color:#cfe8d3;background:rgba(0,0,0,.35);padding:3px 10px;border-radius:999px;pointer-events:none}
.abtn{position:absolute;transform:translate(-50%,-50%);border:3px solid #1b120b;border-radius:999px;box-shadow:0 4px 0 #1b120b;font-size:15px;padding:8px 14px;white-space:nowrap}
.abtn:active{transform:translate(-50%,-46%);box-shadow:0 2px 0 #1b120b}
#bSpud{background:radial-gradient(circle at 40% 35%,#ffe08a,#f2a81e);color:#3a1d06;font-family:'Lilita One';font-size:20px;letter-spacing:1px;padding:10px 16px}
#bSpud.hot{animation:wig .5s infinite}
@keyframes wig{0%,100%{rotate:-5deg}50%{rotate:5deg}}
#bPass{background:#f4ecd5;color:#1b120b}
#bEmo{background:rgba(255,255,255,.9);color:#1b120b;width:44px;height:44px;padding:0;font-size:22px}
#emoBar{position:absolute;display:flex;gap:4px;background:#fff;border:3px solid #1b120b;border-radius:16px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.5);transform:translate(0,-100%)}
#emoBar button{font-size:24px;width:40px;height:40px;border-radius:10px}
#emoBar button:hover{background:#f1e5c8}
#banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.4);opacity:0;z-index:60;pointer-events:none;font-family:'Lilita One';font-size:clamp(26px,8vw,56px);color:#fff;-webkit-text-stroke:2px #1b120b;paint-order:stroke fill;text-shadow:0 4px 0 #1b120b,0 0 30px rgba(0,0,0,.4);white-space:nowrap;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .25s;text-align:center}
#banner.on{transform:translate(-50%,-50%) scale(1);opacity:1}
#banner small{display:block;font-family:Nunito;font-size:clamp(13px,3.6vw,18px);-webkit-text-stroke:0;text-shadow:0 2px 3px #000}
.conf{position:fixed;top:-40px;z-index:70;pointer-events:none;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#toast{position:fixed;left:50%;bottom:calc(30% + var(--sb));transform:translateX(-50%);z-index:65;background:rgba(20,12,6,.92);border:2px solid #ffcb52;color:#fff6e4;padding:7px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}

/* ===== SCREENS ===== */
.screen{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-y:auto;overflow-x:hidden;padding:calc(16px + var(--st)) 16px calc(16px + var(--sb))}
#loading{background:radial-gradient(ellipse at 50% 40%,#2b7d45,#123d22 80%);z-index:99;transition:opacity .4s}
#loading.out{opacity:0;pointer-events:none}
.ldPot{width:110px;height:110px;animation:hop .7s infinite alternate cubic-bezier(.5,0,.5,1)}
@keyframes hop{to{transform:translateY(-22px) rotate(8deg)}}
.ldBar{width:min(260px,70vw);height:14px;border-radius:7px;background:rgba(0,0,0,.35);border:2px solid #1b120b;margin-top:22px;overflow:hidden}
.ldBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcb52,#f2a81e);transition:width .25s}
.ldTxt{margin-top:10px;color:#d9f2dd;font-size:14px}
#menu{background:radial-gradient(ellipse at 50% 30%,rgba(56,160,88,.92),rgba(18,61,34,.97) 80%);justify-content:flex-start}
.mwrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;margin:auto 0}
.mtop{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.homeL{color:#e2f3e5;text-decoration:none;font-size:14px;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.25)}
.langSeg{display:flex;gap:4px}
.langSeg button{padding:5px 10px;border-radius:999px;border:2px solid #1b120b;background:#f4ecd5;font-size:13px;color:#1b120b}
.langSeg button.on{background:#1b120b;color:#fff}
.fanDeco{position:relative;height:120px;width:240px;margin:6px 0 -8px}
.fanDeco .card{transition:none}
.title{font-family:'Lilita One';font-size:clamp(46px,14vw,74px);line-height:.95;text-align:center;margin:4px 0 2px;color:#ffcb52;-webkit-text-stroke:3px #1b120b;paint-order:stroke fill;text-shadow:0 6px 0 #1b120b,0 10px 24px rgba(0,0,0,.4);transform:rotate(-3deg)}
.title span{display:block;color:#fff;font-size:.62em;margin-top:2px}
.chip{display:inline-block;background:#ffcb52;color:#3a2410;border:2px solid #1b120b;border-radius:999px;padding:3px 12px;font-size:13px;margin:12px 0 14px;transform:rotate(-1deg)}
.mbtns{display:flex;flex-direction:column;gap:10px;width:100%}
.btn{display:block;width:100%;padding:13px 16px;border-radius:16px;border:3px solid #1b120b;background:#f4ecd5;color:#1b120b;font-size:17px;box-shadow:0 5px 0 #1b120b;text-align:center;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1b120b}
.btn.go{background:linear-gradient(#ffd96a,#f2a81e)}
.btn.blue{background:linear-gradient(#9fd7ff,#4aa3e8)}
.btn.green{background:linear-gradient(#a6e7a0,#4fb85b)}

<body>
<noscript><div style="padding:24px;background:#fff8ec;color:#1b120b;font-family:sans-serif"><h1>UNO Potato – free potato card game</h1><p>UNO Potato is a free potato-themed card game in your browser: match colours and numbers, play action cards like Double Fry and Hash Brown Flip, and shout SPUD! when you have one card left. Play against 1–3 computer players or with up to 4 friends on the same Wi-Fi. Works on PC and mobile, in English and Danish.</p><p>Please turn on JavaScript to play. <a href="./">More free games from Potato Team Games</a></p></div></noscript>

<script>
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ================= art ================= */
const COLORS=[
  {k:'r',hex:'#e23b3b',en:'Red Ruby',da:'Rød Rubin'},
  {k:'y',hex:'#f2b01e',en:'Golden Yukon',da:'Gylden Yukon'},

function potato(o={}){

  else{eyes=`<circle cx="38" cy="45" r="7" fill="#fff" stroke="${s}" stroke-width="2"/><circle cx="62" cy="45" r="7" fill="#fff" stroke="${s}" stroke-width="2"/><circle cx="39.5" cy="46" r="3.6" fill="#1b120b"/><circle cx="63.5" cy="46" r="3.6" fill="#1b120b"/><circle cx="40.5" cy="44.5" r="1.2" fill="#fff"/><circle cx="64.5" cy="44.5" r="1.2" fill="#fff"/>`;mouth=`<path d="M39 61q11 11 22 0" stroke="${s}" stroke-width="4" fill="#a8432b" stroke-linecap="round"/>`}
  return`<path d="M50 7c24-1 40 15 41 38 1 25-14 47-41 48C24 94 9 78 9 53 9 27 25 8 50 7z" fill="${b}" stroke="${s}" stroke-width="4"/>
  <ellipse cx="34" cy="22" rx="10" ry="5" fill="#fff" opacity=".25" transform="rotate(-25 34 22)"/>
  <circle cx="72" cy="27" r="2.6" fill="${s}" opacity=".45"/><circle cx="24" cy="70" r="2.4" fill="${s}" opacity=".45"/><circle cx="76" cy="72" r="2" fill="${s}" opacity=".45"/><circle cx="58" cy="84" r="1.8" fill="${s}" opacity=".45"/>
  <ellipse cx="28" cy="58" rx="6" ry="4" fill="#f07a6a" opacity=".55"/><ellipse cx="72" cy="58" rx="6" ry="4" fill="#f07a6a" opacity=".55"/>${eyes}${mouth}${o.extra||''}`;
}
const potSVG=o=>`<svg viewBox="0 0 100 100">${potato(o)}</svg>`;
const AVATARS=[{b:'#d9a35e',hat:'🎩'},{b:'#c9814a',hat:'👑'},{b:'#e3b873',hat:'🧢'},{b:'#b8743f',hat:'🎀'},{b:'#dcae6a',hat:'🌻'},{b:'#c68f55',hat:'🕶️'}];
const AI_NAMES=['Spudrick','Tater Tina','Mashley','Chip','Yukon Yolanda','Baked Benny','Rösti Rita','Fry Guy'];
function avHTML(av,mood){const a=AVATARS[av%AVATARS.length];return`<div class="av">${potSVG({body:a.b,mood:mood||'happy'})}<span class="hat">${a.hat}</span></div>`}
const ARW=c=>`<svg viewBox="0 0 100 100"><g fill="${c}" stroke="#1b120b" stroke-width="5" stroke-linejoin="round"><path d="M22 58 C18 30 46 16 66 26 L70 14 L86 42 L56 48 L62 37 C48 31 33 39 36 58 Z"/><path d="M78 42 C82 70 54 84 34 74 L30 86 L14 58 L44 52 L38 63 C52 69 67 61 64 42 Z"/></g></svg>`;
const QUAD=`<svg viewBox="0 0 100 100"><g stroke="#1b120b" stroke-width="4"><path d="M50 50L50 8A42 42 0 0 1 92 50Z" fill="#e23b3b"/><path d="M50 50L92 50A42 42 0 0 1 50 92Z" fill="#f2b01e"/><path d="M50 50L50 92A42 42 0 0 1 8 50Z" fill="#36a443"/><path d="M50 50L8 50A42 42 0 0 1 50 8Z" fill="#7c4dcc"/></g></svg>`;
const FRIES=`<svg viewBox="0 0 100 100"><g stroke="#1b120b" stroke-width="3.5" stroke-linejoin="round"><path d="M30 40l-4-28 9-2 4 30M43 40l-1-34 9 0-1 34M56 40l4-30 9 2-4 28M36 40l-6-22 8-3 6 25M60 40l7-24 8 3-7 21" fill="#ffd34d"/><path d="M22 38h56l-8 54H30z" fill="#e23b3b"/><path d="M38 60q12 10 24 0" stroke="#fff" fill="none" stroke-width="4" stroke-linecap="round"/></g></svg>`;
const FLAME=`<path d="M50 2c6 12 18 16 14 30 6-4 8-10 7-15 10 10 9 26-2 32-6 3-30 3-36-2-9-8-6-22 3-28 0 6 2 9 5 10-2-12 4-20 9-27z" fill="#ff8a1c" stroke="#1b120b" stroke-width="3"/><path d="M50 22c3 7 9 9 7 17-2 5-12 5-14 0-2-6 4-10 7-17z" fill="#ffe14d"/>`;
const SYM={skip:'⊘',rev:'⇄',d2:'+2',wild:'★',w4:'+4',hot:'🔥',peel:'⇆'};
const FACE={};
function cardFace(c){
  const key=c.c+':'+c.v;if(FACE[key])return FACE[key];
  const col=c.c<4?COLORS[c.c].hex:'#2b1a10',wild=c.c===4;
  const crn=SYM[c.v]||c.v;let mid='';
  if(/^\d$/.test(c.v)){mid=`<div class="oval"></div><div class="num">${c.v==='6'||c.v==='9'?`<u>${c.v}</u>`:c.v}</div><div class="mini">${potSVG({mood:c.v==='0'?'wow':'happy'})}</div>`}
  else if(c.v==='skip')mid=`<div class="oval"></div><div class="ico">${potSVG({mood:'sleep',extra:'<text x="66" y="24" font-family="Lilita One,sans-serif" font-size="22" fill="#1b120b">z</text><text x="80" y="12" font-family="Lilita One,sans-serif" font-size="15" fill="#1b120b">z</text><circle cx="50" cy="50" r="46" fill="none" stroke="'+col+'" stroke-width="6" opacity=".9"/><path d="M18 82L82 18" stroke="'+col+'" stroke-width="6" opacity=".9"/>'})}</div>`;
  else if(c.v==='rev')mid=`<div class="oval"></div><div class="ico">${ARW(col)}</div>`;
  else if(c.v==='d2')mid=`<div class="oval"></div><div class="mini" style="left:auto;right:12%;top:10%;bottom:auto;width:34%;height:28%">${FRIES}</div><div class="num sm">+2</div>`;
  else if(c.v==='wild')mid=`<div class="oval wildbg"></div><div class="ico" style="left:22%;right:22%">${potSVG({mood:'happy'})}</div>`;
  else if(c.v==='w4')mid=`<div class="oval wildbg"></div><div class="num sm" style="--cc:#fff">+4</div><div class="mini" style="width:28%;height:20%;left:auto;right:14%;top:12%;bottom:auto">${potSVG({mood:'mad'})}</div>`;

  else if(c.v==='peel')mid=`<div class="oval wildbg"></div><div class="ico">${potSVG({body:'#f1d39a',mood:'cool',extra:'<path d="M8 80q20 14 34 2" stroke="#b07a3a" stroke-width="7" fill="none" stroke-linecap="round"/>'})}</div><div class="mini" style="left:8%;right:auto;top:8%;bottom:auto;width:36%;height:26%">${ARW('#fff')}</div>`;

function cardEl(c,down){
  const e=document.createElement('div');e.className='card'+(down?' down':'');
  e.innerHTML=`<div class="ci">${c?cardFace(c):''}<div class="bk"><i></i></div></div>`;
  if(c){const n=e.querySelector('.cname');if(n&&CARDN[c.v])n.textContent=cardName(c)}
  return e;

/* ================= sound (WebAudio, procedural) ================= */
const SFX={ctx:null,on:PREF.snd!==false,
  ac(){if(!this.on)return null;try{if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx}catch(e){return null}},
  tone(f,d,type='sine',v=.18,slide=0,delay=0){const a=this.ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)},
  noise(d,v=.2,f=3000,delay=0,q=1){const a=this.ac();if(!a)return;const t=a.currentTime+delay,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;g.gain.value=v;s.connect(fl).connect(g).connect(a.destination);s.start(t)},
  flick(){this.noise(.07,.35,4200,0,.8)},
  play(){this.noise(.06,.4,2600);this.tone(140,.12,'sine',.25,-60)},
  draw(){this.noise(.12,.22,5200,0,.6)},
  deal(n){for(let i=0;i<Math.min(n,10);i++)this.noise(.05,.25,4500,i*.06,.8)},
  skip(){this.tone(500,.12,'square',.08,-200);this.tone(300,.18,'square',.07,-150,.12)},
  rev(){this.tone(300,.25,'triangle',.15,500);this.tone(800,.25,'triangle',.12,-500,.2)},
  plus(){this.tone(110,.35,'sawtooth',.1,-40);this.tone(165,.35,'sawtooth',.06,-50,.05)},
  wild(){[523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.18,'triangle',.12,0,i*.06))},

  err(){this.tone(130,.18,'square',.08)},

  catch(){this.tone(900,.15,'sawtooth',.07,-500);this.tone(900,.15,'sawtooth',.07,-500,.17)},
  hot(){this.noise(.4,.25,900,0,.5);this.tone(200,.4,'sawtooth',.06,600)},
  pop(){this.tone(600,.08,'sine',.14,300)},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>this.tone(f,.22,'triangle',.14,0,i*.11))},
  lose(){[392,349,311,262].forEach((f,i)=>this.tone(f,.3,'triangle',.12,0,i*.18))}
};

/* ================= engine (runs on host / local) ================= */
let G=null;
const VAL=v=>/^\d$/.test(v)?+v:(v==='wild'||v==='w4'?50:v==='peel'||v==='hot'?30:20);
function buildDeck(rules){
  let id=0;const d=[],add=(c,v)=>d.push({id:id++,c,v});
  for(let c=0;c<4;c++){add(c,'0');for(let n=1;n<=9;n++){add(c,''+n);add(c,''+n)}for(const v of['skip','rev','d2']){add(c,v);add(c,v)}if(rules.special)add(c,'hot')}
  for(let k=0;k<4;k++){add(4,'wild');add(4,'w4')}
  if(rules.special){add(4,'peel');add(4,'peel')}

}
const N=()=>G.players.length;
const topC=()=>G.discard[G.discard.length-1];
const nextSeat=(s,n=1)=>((s+G.dir*n)%N()+N()*4)%N();
function canPlayRaw(card,tp,color,pending,pendKind,drawnId){
  if(drawnId!=null&&card.id!==drawnId)return false;
  if(pending>0)return (card.v==='d2'&&pendKind==='d2')||card.v==='w4';
  if(card.c===4)return true;
  return card.c===color||card.v===tp.v;

const EVC=window.__evc={};

}
function swapHands(a,b){const t=G.players[a].hand;G.players[a].hand=G.players[b].hand;G.players[b].hand=t;G.players.forEach(p=>p.spud=p.hand.length===1)}
// every action from any seat goes through here; returns true if it was valid
function act(seat,a){
  if(!G||!a)return false;const p=G.players[seat];if(!p)return false;
  if(a.k==='emote'){if(typeof a.e!=='string'||a.e.length>8)return false;ev('emote',{seat,e:a.e});return true}
  if(a.k==='next'){if(G.phase!=='over'||seat!==G.me)return false;if(G.result&&G.result.match)G.players.forEach(q=>q.score=0);newRound();return true}

  if(a.k==='spud'){if(p.hand.length>2||p.spud||(p.hand.length===2&&G.turn!==seat))return false;p.spud=true;ev('spud',{seat});return true}
  if(a.k==='catch'){const t=+a.t,q=G.players[t];if(!q||t===seat||q.hand.length!==1||q.spud)return false;drawCards(t,2);ev('catch',{seat,t});return true}

    if(G.drawnId!=null)return false;
    if(G.pending>0){const n=G.pending;G.pending=0;G.pendKind=null;drawCards(seat,n);ev('draw',{seat,n,forced:1});advance(1);return true}
    let got=[],last=null;

function endRound(seat){

/* ================= AI ================= */
function aiChooseColor(hand,diff){
  if(diff==='easy')return rnd(4);
  const cnt=[0,0,0,0],val=[0,0,0,0];hand.forEach(c=>{if(c.c<4){cnt[c.c]++;val[c.c]+=VAL(c.v)}});
  let b=0;for(let i=1;i<4;i++)if(cnt[i]*10+val[i]/10>cnt[b]*10+val[b]/10)b=i;
  return cnt[b]?b:rnd(4);
}
function aiDecide(seat){
  const p=G.players[seat],diff=p.ai||'normal',hand=p.hand,n=N();
  // call SPUD before playing your second-last card
  if(hand.length===2&&!p.spud){const ch={easy:.55,normal:.88,hard:1}[diff];const opts=hand.filter(c=>canPlay(seat,c));
    if(opts.length&&Math.random()<ch)return{k:'spud'}}
  const opts=hand.filter(c=>canPlay(seat,c));
  if(G.drawnId!=null){
    const c=hand.find(c=>c.id===G.drawnId);
    if(c&&canPlay(seat,c)&&!(diff==='hard'&&c.c===4&&hand.length>4&&Math.random()<.6))return withChoice(seat,c,diff);
    return{k:'pass'};
  }
  if(!opts.length)return{k:'draw'};
  if(G.pending>0&&diff==='easy'&&Math.random()<.4)return{k:'draw'};
  if(diff==='easy'){const nw=opts.filter(c=>c.c<4);const pick=(nw.length&&Math.random()<.7?nw:opts);return withChoice(seat,pick[rnd(pick.length)],diff)}
  const nx=nextSeat(seat),nxN=G.players[nx].hand.length,minOpp=Math.min(...G.players.filter((q,i)=>i!==seat).map(q=>q.hand.length));
  const threat=nxN<=2,cnt=[0,0,0,0];hand.forEach(c=>{if(c.c<4)cnt[c.c]++});
  const prev=G.players[nextSeat(seat,-1)].hand.length;
  const score=c=>{
    let s=0;const num=/^\d$/.test(c.v);
    if(num)s=1+(+c.v)/10+cnt[c.c]*.15;
    if(c.v==='skip'||c.v==='rev')s=threat?(diff==='hard'?6:4):(diff==='hard'?.8:1.5);
    if(c.v==='rev'&&n>2&&G.players[nextSeat(seat,-1)].hand.length<=2)s-=3;
    if(c.v==='d2')s=threat?(diff==='hard'?7:4.5):(diff==='hard'?1.2:1.8);
    if(c.v==='wild')s=diff==='hard'?(hand.length<=2?5:-3):-1;
    if(c.v==='w4')s=diff==='hard'?((threat||hand.length<=3)?7.5:-4):(threat?3:-1.5);
    if(c.v==='hot')s=(hand.length-1-prev)*0.9+(diff==='hard'?0:1);
    if(c.v==='peel')s=(hand.length-1-minOpp)-1;
    if(c.v==='7'&&G.rules.sevenO)s+=(hand.length-1-minOpp)*.5;
    if(c.v==='0'&&G.rules.sevenO)s+=(hand.length-1-prev)*.5;
    if(G.pending>0)s+=5;
    if(c.c<4&&c.c!==G.color)s+=cnt[c.c]*.25; // switching to a colour we hold a lot of
    return s+Math.random()*(diff==='hard'?.2:.8);
  };
  opts.sort((a,b)=>score(b)-score(a));
  return withChoice(seat,opts[0],diff);
}
function withChoice(seat,c,diff){
  const p=G.players[seat],rest=p.hand.filter(x=>x!==c);

}
const AI_EMO={hit:['😠','😱','😤','🥔'],win:['😎','🎉','🥳'],spud:['😏','🥔']};

/* ================= host driver ================= */
let aiT=0,catchT=0,me=0,VIEW=null;
const isHost=()=>NET.role!=='guest';
function view(seat){
  const g=G;
  return{ver:g.ver,me:seat,phase:g.phase,dir:g.dir,turn:g.turn,color:g.color,pending:g.pending,pendKind:g.pendKind,
    drawnId:g.turn===seat?g.drawnId:null,deckN:g.deck.length,discard:g.discard.slice(-6),round:g.round,rules:g.rules,
    evs:g.evs.slice(-14),result:g.result,code:NET.code||null,lan:!!NET.role,
    players:g.players.map((p,i)=>({name:p.name,av:p.av,ai:!!p.ai,bot:p.ctl==='ai',disc:p.disc,n:p.hand.length,spud:p.spud,score:p.score,hand:i===seat?p.hand:null}))};
}
function commit(){

function schedule(){

  const p=G.players[G.turn];
  const auto=p.ai||(AUTO&&G.turn===G.me);

    const d=(G.drawnId!=null?650:900+rnd(500))*SPEED;

  const t=G.players.findIndex(q=>q.hand.length===1&&!q.spud);
  if(t>=0){
    const cands=G.players.map((q,i)=>({q,i})).filter(o=>o.i!==t&&(o.q.ai||(AUTO&&o.i===G.me)));
    let best=null;
    cands.forEach(o=>{const d=o.q.ai||'normal';const ch={easy:.3,normal:.6,hard:.97}[d];if(Math.random()<ch){const ms={easy:4200,normal:2600,hard:1300}[d]+rnd(900);if(!best||ms<best.ms)best={i:o.i,ms}}});
    if(best)catchT=setTimeout(()=>{if(act(best.i,{k:'catch',t})){commit()}},best.ms*Math.max(SPEED,.05));

function aiReact(s,a){

  if(e&&e.k==='plus'&&!G.rules.stack&&G.players[e.t]&&G.players[e.t].ai&&Math.random()<.5)ev('emote',{seat:e.t,e:AI_EMO.hit[rnd(4)]});

let W=0,H=0,CW=64,CH=96,SAFEB=0,AVS=48;

function measure(){

  const pr=document.createElement('div');pr.style.cssText='position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px)';document.body.appendChild(pr);SAFEB=pr.offsetHeight||0;pr.remove();

function slotKinds(n){return n===2?['B','T']:n===3?['B','TL','TR']:['B','L','T','R']}
function layout(V){
  const n=V.players.length,kinds=slotKinds(n),hand=V.players[V.me].hand||[];
  const pad=16;

  const maxW=W-pad*2,raise=CH*.16;
  let rows=1;const sp1=(maxW-CW)/Math.max(1,hand.length-1);
  if(hand.length>8&&sp1<CW*.42)rows=2;

  const topY=14+40+(n===2||n===4?AVS*.5+AVS*.5+18:AVS+18);
  const cy=Math.max(topY+CH*.55+(n===4?10:0),Math.min((topY+handTop-40)/2+8,H*.52));
  const cx=W/2;
  const land=W>H*1.3&&H<560;

  const hm=Math.max(1,hand.length),hsp=Math.min(CW*.7,(W-pad*2-CW)/Math.max(1,(rows===2?Math.ceil(hm/2):hm)-1)),halfW=hsp*((rows===2?Math.ceil(hm/2):hm)-1)/2+CW/2;

      case'T':return{k,x:W/2,y:avY};

const slotOf=(V,seat)=>(seat-V.me+V.players.length)%V.players.length;
const hash=n=>{let x=(n+1)*2654435761%4294967296;x^=x>>>13;return(x%1000)/1000};
const COL_ORDER=c=>c.c*20+(/^\d$/.test(c.v)?+c.v:{skip:10,rev:11,d2:12,hot:13,wild:14,w4:15,peel:16}[c.v]);
function handPositions(LY,hand){
  const out=[],n=hand.length,rows=LY.rows;
  const rowsArr=rows===2?[hand.slice(0,Math.ceil(n/2)),hand.slice(Math.ceil(n/2))]:[hand];
  rowsArr.forEach((row,r)=>{
    const m=row.length,y0=LY.baseY-(rows===2&&r===0?CH*.45:0);

    row.forEach((c,i)=>{const t=m>1?(i-(m-1)/2)/((m-1)/2):0;out.push({c,x:x0+sp*i,y:y0+t*t*CH*.07,r:t*Math.min(10,m*1.3),z:200+r*60+i})});
  });

function backPositions(kind,sx,sy,n){

/* ================= LAN (WebRTC via PeerJS, host-authoritative) ================= */
// Devices on the same Wi-Fi reach each other directly, so no STUN/TURN servers are used.
const PEER_PREFIX='uno-potato-ptg-',PEERJS='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const ICE={sdpSemantics:'unified-plan',iceServers:[]};
const peerOpts=()=>window.__PEER_OPTS||{config:ICE,pingInterval:4000};
const NET={role:null,peer:null,conns:{},conn:null,code:null,lobby:[],started:false,seen:{},aiN:1,aiDiff:'normal'};
NET.cid=(()=>{try{let c=sessionStorage.getItem('up_cid');if(!c){c=Math.random().toString(36).slice(2,12);sessionStorage.setItem('up_cid',c)}return c}catch(e){return Math.random().toString(36).slice(2,12)}})();
let WAKE=null;async function wake(){try{if(NET.role&&navigator.wakeLock&&!WAKE){WAKE=await navigator.wakeLock.request('screen');WAKE.addEventListener('release',()=>{WAKE=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!NET.role)return;wake();
  if(NET.peer&&NET.peer.disconnected&&!NET.peer.destroyed){try{NET.peer.reconnect()}catch(e){}}
  if(NET.role==='guest'&&NET.started&&!NET.ended&&!(NET.conn&&NET.conn.open))guestReconnect();
});
setInterval(()=>{
  const now=Date.now();
  if(NET.role==='host'){
    Object.entries(NET.conns).forEach(([peer,c])=>{if(!NET.seen[peer])NET.seen[peer]=now;try{c.open&&c.send({t:'ping'})}catch(e){}
      if(now-NET.seen[peer]>12000){delete NET.seen[peer];try{c.close()}catch(e){}hostLost(peer)}});
  }else if(NET.role==='guest'&&NET.conn&&NET.conn.open&&!NET.ended){
    if(!NET.lastHost)NET.lastHost=now;
    if(now-NET.lastHost>15000){NET.lastHost=now;const c=NET.conn;NET.conn=null;try{c.close()}catch(e){}if(NET.started)guestReconnect();else guestLost()}
  }
},3000);
function bcast(m){Object.values(NET.conns).forEach(c=>{try{c.open&&c.send(m)}catch(x){}})}
function loadPeer(){return window.Peer?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=PEERJS;sc.onload=res;sc.onerror=()=>rej(new Error(L('Could not load the network module. Check your internet connection.','Kunne ikke hente netværksdelen. Tjek din internetforbindelse.')));document.head.appendChild(sc)})}
const newCode=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[rnd(32)]).join('');
function quitNet(){NET.leaving=true;try{if(NET.role==='host')bcast({t:'end'});else if(NET.conn&&NET.conn.open)NET.conn.send({t:'bye'})}catch(e){}setTimeout(()=>{try{NET.peer&&NET.peer.destroy()}catch(e){}},150)}
addEventListener('beforeunload',()=>{if(NET.role&&!NET.leaving)quitNet()});

const lanBox=()=>$('#lanBox');
/* ---- host ---- */
async function hostGame(){
  const box=lanBox();box.innerHTML=L('<p>⏳ Opening a table…</p>','<p>⏳ Åbner et bord…</p>');
  try{await loadPeer()}catch(e){box.innerHTML=`<p class="err">${esc(e.message)}</p>`;return}
  const tryOpen=()=>new Promise((res,rej)=>{NET.code=newCode();const pr=new Peer(PEER_PREFIX+NET.code,peerOpts());pr.on('open',()=>res(pr));pr.on('error',e=>{pr.destroy();rej(e)})});
  let pr;for(let k=0;k<3&&!pr;k++){try{pr=await tryOpen()}catch(e){if(k===2){box.innerHTML=`<p class="err">${L('Could not open a table','Kunne ikke åbne et bord')} (${esc(e.type||e.message)}). ${L('Try again in a moment.','Prøv igen om lidt.')}</p>`;return}}}
  NET.role='host';NET.peer=pr;NET.lobby=[];NET.aiN=1;
  pr.on('connection',c=>{c.on('data',m=>hostMsg(c,m));c.on('close',()=>hostLost(c.peer));c.on('error',()=>hostLost(c.peer))});
  pr.on('disconnected',()=>{let n=0;const t=setInterval(()=>{if(pr.destroyed||!pr.disconnected||n++>40){clearInterval(t);return}try{pr.reconnect()}catch(e){}},2500);try{pr.reconnect()}catch(e){}});
  pr.on('error',()=>{});
  wake();drawHostLobby();
}
function hostMsg(c,m){
  if(!m||typeof m!=='object')return;
  NET.seen[c.peer]=Date.now();if(m.t==='pong')return;
  if(m.t==='hello'){
    const cid=String(m.cid||c.peer).slice(0,24),name=String(m.name||'Guest').slice(0,14);
    if(NET.started){
      const i=G?G.players.findIndex(p=>p.cid===cid):-1;
      if(i>=0){const p=G.players[i];if(p.ctl&&p.ctl!==c.peer)delete NET.conns[p.ctl];p.ctl=c.peer;p.ai=null;p.disc=false;NET.conns[c.peer]=c;ev('back',{seat:i,name:p.name});c.send({t:'start',seat:i});commit();return}
      c.send({t:'full',why:L('The game has already started.','Spillet er allerede i gang.')});setTimeout(()=>c.close(),300);return;
    }
    const again=NET.lobby.find(g=>g.cid===cid);
    if(again){delete NET.conns[again.peer];again.peer=c.peer;NET.conns[c.peer]=c;drawHostLobby();return}
    if(1+NET.lobby.length>=4){c.send({t:'full',why:L('The table is full.','Bordet er fuldt.')});setTimeout(()=>c.close(),300);return}
    NET.conns[c.peer]=c;NET.lobby.push({peer:c.peer,cid,name});NET.aiN=Math.min(NET.aiN,3-NET.lobby.length);SFX.pop();drawHostLobby();return;
  }
  if(m.t==='bye'){hostLost(c.peer,true);try{c.close()}catch(e){}return}
  if(m.t==='act'&&NET.started&&G){const seat=G.players.findIndex(p=>p.ctl===c.peer);if(seat<0||!m.a||m.a.k==='next')return;if(act(seat,m.a))commit();return}
}
function hostLost(peer,final){
  if(!NET.conns[peer]&&!NET.lobby.some(g=>g.peer===peer))return;
  delete NET.conns[peer];
  if(!NET.started){NET.lobby=NET.lobby.filter(g=>g.peer!==peer);drawHostLobby();return}
  const i=G?G.players.findIndex(p=>p.ctl===peer):-1;if(i<0)return;const p=G.players[i];
  // a computer player takes over the seat at once; if they come back they get it again
  p.ai='normal';p.disc=!final;p.ctl='ai';if(final)p.cid=null;
  ev('left',{seat:i,name:p.name});commit();
}
function drawHostLobby(){
  if(NET.started)return;const box=lanBox();if(!box)return;
  const names=AI_NAMES;
  const seats=[{name:PREF.name||'Host',host:1,av:0},...NET.lobby.map((g,k)=>({name:g.name,av:k+1})),...Array.from({length:NET.aiN},(_,k)=>({name:names[k],cpu:1,av:NET.lobby.length+k+1}))];
  const free=4-seats.length;
  box.innerHTML=`<div class="codeBox"><small>${L('Table code','Bordkode')}</small><span class="code">${NET.code}</span><small>${L('Friends on the <b>same Wi-Fi</b> open UNO Potato, choose <b>Play on Wi-Fi</b> and type this code.','Venner på <b>samme wifi</b> åbner UNO Potato, vælger <b>Spil på wifi</b> og skriver koden.')}</small></div>
   <div class="lob">${seats.map(s=>`<div class="lobRow"><span class="mav">${avHTML(s.av)}</span><b>${esc(s.name)}</b><small>${s.host?L('🏠 You (host)','🏠 Dig (host)'):s.cpu?'🤖 '+DIFFL()[['easy','normal','hard'].indexOf(NET.aiDiff)]:L('🌐 Joined','🌐 Med')}</small></div>`).join('')}${Array.from({length:free},()=>`<div class="lobRow empty"><span class="mav"></span><b>${L('Empty seat…','Tom plads…')}</b></div>`).join('')}</div>
   <div class="opt">${L('🤖 Computer players','🤖 Computerspillere')}${segHTML('hAI',[0,1,2,3].filter(n=>n<=3-NET.lobby.length),NET.aiN)}</div>
   <div class="opt">${L('Difficulty','Sværhedsgrad')}${segHTML('hDiff',['easy','normal','hard'],NET.aiDiff,DIFFL())}</div>
   <p class="hint">${L('House rules','Husregler')}: ${rulesSummary()}</p>
   <button class="btn go" id="hStart" ${seats.length<2?'disabled':''}>🃏 ${L('Start game','Start spillet')} (${seats.length})</button>`;
  wireSeg(box,'hAI',v=>{NET.aiN=+v;drawHostLobby()});
  wireSeg(box,'hDiff',v=>{NET.aiDiff=v;drawHostLobby()});
  box.querySelector('#hStart').onclick=hostStart;
  bcast({t:'lobby',code:NET.code,seats:seats.map(s=>({name:s.name,av:s.av,cpu:!!s.cpu,host:!!s.host}))});
}
function hostStart(){
  if(NET.started)return;const n=1+NET.lobby.length+NET.aiN;if(n<2)return;
  const avs=[0,1,2,3];
  const players=[{name:PREF.name||'Host',av:0,ctl:'local'},...NET.lobby.map((g,k)=>({name:g.name,av:k+1,ctl:g.peer,cid:g.cid})),...Array.from({length:NET.aiN},(_,k)=>({name:AI_NAMES[k],av:NET.lobby.length+k+1,ai:NET.aiDiff,ctl:'ai'}))];
  NET.started=true;newMatch(players,RULES);G.me=0;
  G.players.forEach((p,i)=>{const c=NET.conns[p.ctl];if(c&&c.open)c.send({t:'start',seat:i})});

async function joinGame(raw){
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');const box=lanBox();
  if(code.length!==4){$('#lErr').textContent=L('The code has 4 characters.','Koden har 4 tegn.');return}

  try{await loadPeer()}catch(e){box.innerHTML=`<p class="err">${esc(e.message)}</p>`;return}
  const pr=new Peer(undefined,peerOpts());NET.peer=pr;NET.code=code;let tries=0;
  const fail=html=>{if(!NET.started&&lanBox())lanBox().innerHTML=`<p class="err">${html}</p><button class="btn" onclick="location.href=location.pathname">${L('↩ Back','↩ Tilbage')}</button>`};
  pr.on('disconnected',()=>{if(!pr.destroyed)try{pr.reconnect()}catch(e){}});
  pr.on('error',e=>{
    if(e.type==='peer-unavailable'&&!NET.started&&++tries<6){if(lanBox())lanBox().innerHTML=L(`<p>⏳ Looking for table <b>${esc(code)}</b>… (try ${tries+1}/6)</p>`,`<p>⏳ Leder efter bord <b>${esc(code)}</b>… (forsøg ${tries+1}/6)</p>`);setTimeout(()=>guestConnect(code,fail),2500);return}
    if(NET.started)return;
    fail(e.type==='peer-unavailable'?L('No table found with code <b>'+esc(code)+'</b>. Check the code, that the host is still waiting, and that you are on the same Wi-Fi.','Intet bord fundet med koden <b>'+esc(code)+'</b>. Tjek koden, at hosten stadig venter, og at I er på samme wifi.'):L('Connection problem: ','Forbindelsesproblem: ')+esc(e.type||e.message));
  });
  pr.on('open',id=>{NET.role='guest';NET.id=id;wake();guestConnect(code,fail)});
}
function guestConnect(code,fail){
  const pr=NET.peer;if(!pr||pr.destroyed)return;
  const c=pr.connect(PEER_PREFIX+code,{reliable:true});
  const to=setTimeout(()=>{if(!c.open&&!NET.started&&fail)fail(L('Could not reach the host. Make sure both devices are on the same Wi-Fi, then try again.','Kunne ikke få forbindelse til hosten. Tjek at begge enheder er på samme wifi, og prøv igen.'))},25000);
  c.on('open',()=>{clearTimeout(to);NET.conn=c;NET.lastHost=Date.now();c.send({t:'hello',cid:NET.cid,name:PREF.name||L('Guest','Gæst')});
    if(!NET.started&&lanBox())lanBox().innerHTML=L('<p>✅ Connected! Waiting for the host…</p>','<p>✅ Forbundet! Venter på hosten…</p>');
    if(NET.started){NET.reconn=false;$$('.ov.reconn').forEach(o=>o._close('x'))}});
  c.on('data',m=>{if(c!==NET.conn)return;NET.lastHost=Date.now();if(m&&m.t==='ping'){try{c.send({t:'pong'})}catch(e){}return}guestMsg(m)});
  c.on('close',()=>{if(c===NET.conn){if(NET.started)guestReconnect();else guestLost()}});
}
function guestReconnect(){
  if(NET.reconn||NET.ended||NET.leaving)return;NET.reconn=true;
  modal({title:L('📶 Reconnecting…','📶 Forbinder igen…'),cls:'reconn',sticky:true,html:L('<p>The connection to the host dropped. Trying to get you back to your seat…</p>','<p>Forbindelsen til hosten blev afbrudt. Prøver at få dig tilbage på din plads…</p>')});
  const t0=Date.now();
  const tick=()=>{
    if(!NET.reconn)return;if(NET.conn&&NET.conn.open){NET.reconn=false;$$('.ov.reconn').forEach(o=>o._close('x'));return}
    if(Date.now()-t0>45000){NET.reconn=false;$$('.ov.reconn').forEach(o=>o._close('x'));guestLost();return}
    const pr=NET.peer;
    if(!pr||pr.destroyed){NET.peer=new Peer(undefined,peerOpts());NET.peer.on('open',id=>{NET.id=id;guestConnect(NET.code)});NET.peer.on('error',()=>{})}
    else if(pr.disconnected){try{pr.reconnect()}catch(e){}}else guestConnect(NET.code);
    setTimeout(tick,4000);
  };tick();
}
function guestLost(){
  if(NET.leaving||NET.ended)return;NET.ended=true;
  modal({title:L('🔌 Game ended','🔌 Spillet er slut'),sticky:true,html:L('<p>The connection to the host was lost.</p>','<p>Forbindelsen til hosten blev afbrudt.</p>'),buttons:[{k:'r',label:L('↩ Back to menu','↩ Tilbage til menuen'),cls:'go'}]}).then(()=>location.href=location.pathname);
}
function guestMsg(m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case'full':if(lanBox())lanBox().innerHTML=`<p class="err">${esc(m.why)}</p><button class="btn" onclick="location.href=location.pathname">${L('↩ Back','↩ Tilbage')}</button>`;break;
    case'lobby':if(!NET.started&&lanBox()){const free=4-m.seats.length;
      lanBox().innerHTML=`<div class="codeBox"><small>${L('Table','Bord')}</small><span class="code">${esc(NET.code)}</span><small>${L("✅ You're in! The host starts the game.",'✅ Du er med! Hosten starter spillet.')}</small></div>
      <div class="lob">${m.seats.map(s=>`<div class="lobRow"><span class="mav">${avHTML(s.av)}</span><b>${esc(s.name)}</b><small>${s.host?'🏠 Host':s.cpu?'🤖':'🌐'}</small></div>`).join('')}${Array.from({length:free},()=>`<div class="lobRow empty"><span class="mav"></span><b>${L('Empty seat…','Tom plads…')}</b></div>`).join('')}</div>
      <p class="hint">⏳ ${L('Waiting for the host to start…','Venter på at hosten starter…')}</p>`}break;
    case'start':NET.seat=m.seat;if(!NET.started){NET.started=true;enterGame()}break;
    case'state':if(!NET.started){NET.started=true;enterGame()}render(m.V);if(AUTO)guestAuto(m.V);break;
    case'end':if(!NET.ended){NET.ended=true;modal({title:L('🏁 The host left','🏁 Hosten er gået'),sticky:true,html:L('<p>The host has left, so the game has ended.</p>','<p>Hosten er gået, så spillet er slut.</p>'),buttons:[{k:'r',label:L('↩ Back to menu','↩ Tilbage til menuen'),cls:'go'}]}).then(()=>location.href=location.pathname)}break;
  }
}
// test helper: let a guest play automatically
let gaT=0;function guestAuto(V){clearTimeout(gaT);if(V.phase!=='play'||V.turn!==V.me)return;gaT=setTimeout(()=>{
  const h=V.players[V.me].hand,tp=V.discard[V.discard.length-1];
  if(h.length===2&&!V.players[V.me].spud){doMy({k:'spud'})}
  const ok=h.filter(c=>canPlayRaw(c,tp,V.color,V.pending,V.pendKind,V.drawnId));
  if(ok.length)doMy({k:'play',id:ok[0].id,color:rnd(4),t:(V.me+1)%V.players.length});else doMy({k:V.drawnId!=null?'pass':'draw'});
},500*SPEED)}

/* ================= boot ================= */
window.__UNO={speed:v=>{SPEED=v},auto:v=>{AUTO=!!v;if(G&&isHost())schedule();else if(VIEW&&AUTO)guestAuto(VIEW)},G:()=>G,V:()=>VIEW,act:a=>doMy(a),net:()=>NET,rules:RULES,stats:STATS,startLocal:cfg=>startLocal(cfg)};
(function boot(){
  document.documentElement.lang=LANG;
  $('.ldPot').innerHTML=potato({mood:'happy'});
  measure();
  const tips=[L('Peeling potatoes…','Skræller kartofler…'),L('Shuffling the spuds…','Blander kartoflerne…'),L('Polishing the table…','Pudser bordet…')];
  let p=0;const bar=$('.ldBar i');
  const iv=setInterval(()=>{p=Math.min(100,p+18+rnd(14));bar.style.width=p+'%';$('#ldTxt').textContent=tips[Math.min(2,Math.floor(p/34))];
    if(p>=100){clearInterval(iv);setTimeout(()=>{$('#loading').classList.add('out');setTimeout(()=>$('#loading').remove(),450);showMenu();
      if(new URLSearchParams(location.search).get('join'))lanSetup()},150)}},110);
})();
</script>

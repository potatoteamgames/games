<style>
:root{
  --pink:#ff4fa8; --pinkD:#d4317f; --grape:#8b5cf6; --grapeD:#6d35d6;
  --cream:#fff6fb; --ink:#2a1159; --ink2:#6b5a8e;
  --mint:#5fe3b0; --mintD:#22a97c; --sun:#ffcf4a; --sunD:#e0a412;
  --red:#ff4d6d; --deep:#3c1b85; --deep2:#2a1159;
  --orange:#ffb224; --orangeD:#e07e0a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;font-weight:800;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 50% 0,#7b4fd9,#4b2596 45%,#2a1159)}
button{font-family:inherit;font-weight:900;cursor:pointer;border:none;color:inherit}
h1,h2,h3{font-family:'Lilita One',sans-serif;font-weight:400;margin:0}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ===== shared bits ===== */
.btn{background:linear-gradient(#fff,#efe6ff);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:10px 16px;font-size:16px;box-shadow:0 4px 0 var(--ink);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.5;box-shadow:0 4px 0 var(--ink);transform:none;cursor:not-allowed}
.btn.go{background:linear-gradient(#8bf0c6,var(--mintD));color:#06331f}
.btn.pink{background:linear-gradient(#ff9ed2,var(--pinkD));color:#fff}
.btn.sun{background:linear-gradient(#ffe9a8,var(--orange));color:#4a2600}
.btn.sm{padding:6px 10px;font-size:13px;border-width:2px;border-radius:10px;box-shadow:0 3px 0 var(--ink)}
.hint{color:var(--ink2);font-size:13px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ===== top bar ===== */
#bar{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:nowrap;overflow:hidden;background:linear-gradient(180deg,#8a5cf0,#6a3cc4);border-bottom:4px solid var(--deep2);z-index:5;flex:0 0 auto}
#bar .logo{font-family:'Lilita One',sans-serif;font-size:22px;color:#fff;white-space:nowrap;text-shadow:2px 2px 0 var(--deep2);min-width:0;overflow:hidden;text-overflow:ellipsis}
#bar .logo b{color:#ffd54a;font-weight:400}
.pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);border:3px solid var(--deep2);border-radius:999px;padding:3px 11px;font-size:15px;white-space:nowrap}
.ibtn{width:40px;height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:19px;background:linear-gradient(#fff,#efe6ff);border:3px solid var(--deep2);border-radius:12px;box-shadow:0 3px 0 var(--deep2)}
.ibtn:active{transform:translateY(3px);box-shadow:none}
.ibtn.round{border-radius:50%;background:radial-gradient(circle at 35% 28%,#ffe9a8,var(--orange) 55%,var(--orangeD));border:3px solid #7a3c00;box-shadow:0 3px 0 #52280a;color:#fff}
.lvlbox{min-width:120px}
.xpbar{height:7px;background:#e3d6f7;border-radius:999px;overflow:hidden;margin-top:2px}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--grape),var(--pink));width:0;transition:width .3s}

/* ===== screens ===== */
.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding:14px}
.screen.on{display:block}
#scGame.on{display:flex;flex-direction:column;padding:0;overflow:hidden}

/* menu */
.hero{text-align:center;padding:6px 0 4px;color:#fff}
.hero h1{font-size:clamp(34px,9vw,60px);color:#fff;text-shadow:3px 3px 0 var(--deep2),0 6px 14px rgba(0,0,0,.35);line-height:1.02}
.hero h1 span{color:#ffd54a}
.hero canvas{width:min(330px,86vw);height:auto;display:block;margin:0 auto}
.hero p{margin:6px auto 0;max-width:470px;color:#e7dcff}
.menu{display:grid;gap:10px;width:min(440px,100%);margin:12px auto 0}
.mbig{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 16px;border-radius:20px;border:4px solid var(--deep2);box-shadow:0 5px 0 var(--deep2);color:#fff;position:relative}
.mbig:active{transform:translateY(3px);box-shadow:0 2px 0 var(--deep2)}
.mbig .ic{font-size:36px;flex:0 0 auto;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.mbig b{display:block;font-family:'Lilita One',sans-serif;font-weight:400;font-size:22px;text-shadow:2px 2px 0 rgba(0,0,0,.25)}
.mbig small{display:block;font-size:12.5px;font-weight:800;line-height:1.35;opacity:.92}
.mbig.play{background:linear-gradient(#ff9ed2,var(--pinkD))}
.mbig.heroes{background:linear-gradient(#ffd77a,var(--orangeD));color:#4a2600}
.mbig.heroes b{text-shadow:none}
.mbig.endless{background:linear-gradient(#7fd6ff,#2c7fe0)}
.m4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.m4 button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px;font-size:11.5px;border-radius:14px;border:3px solid var(--deep2);box-shadow:0 4px 0 var(--deep2);background:linear-gradient(#fff,#efe6ff);position:relative}
.m4 button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep2)}
.m4 button i{font-style:normal;font-size:23px}
.dot{position:absolute;top:-7px;right:-6px;min-width:20px;height:20px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;line-height:17px;border:2px solid var(--deep2);text-align:center}

/* level map */
.maphead{display:flex;align-items:center;gap:8px;margin-bottom:10px;width:min(460px,100%);margin-left:auto;margin-right:auto}
.path{width:min(460px,100%);margin:0 auto;display:flex;flex-direction:column-reverse;gap:9px;padding-bottom:16px}
.node{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--deep2);border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 var(--deep2);cursor:pointer}
.node.lock{opacity:.6;filter:grayscale(.7)}
.node.cur{box-shadow:0 4px 0 var(--deep2),0 0 0 4px #ffd54a;animation:pulse 1.5s infinite}
.node.boss{background:linear-gradient(90deg,#ffe3ec,#fff)}
@keyframes pulse{50%{transform:scale(1.02)}}
.node .n{width:46px;height:46px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:'Lilita One',sans-serif;font-size:20px;color:#fff;border-radius:50%;border:3px solid var(--deep2);background:radial-gradient(circle at 35% 30%,#ffb6dd,var(--pinkD))}
.node.done .n{background:radial-gradient(circle at 35% 30%,#b8f7da,var(--mintD));color:#06331f}
.node.boss .n{background:radial-gradient(circle at 35% 30%,#ff9aa8,#c4162f)}
.node.lock .n{background:radial-gradient(circle at 35% 30%,#eee,#999)}
.node .tx{flex:1;min-width:0}
.node .tx b{display:block;font-size:14.5px}
.node .tx small{display:block;color:var(--ink2);font-size:12px;font-weight:700}
.stars{font-size:15px;letter-spacing:1px;white-space:nowrap}
.off{opacity:.3;filter:grayscale(1)}
.chapter{color:#fff;text-align:center;font-family:'Lilita One',sans-serif;font-size:18px;text-shadow:2px 2px 0 var(--deep2);margin:4px 0}

/* battle screen */
#bhead{display:flex;align-items:center;gap:7px;padding:6px 10px;background:linear-gradient(180deg,#6a3cc4,#4b2596);border-bottom:4px solid var(--deep2);flex:0 0 auto}
#bTitle{font-family:'Lilita One',sans-serif;color:#fff;font-size:18px;text-shadow:2px 2px 0 var(--deep2);white-space:nowrap}
#bWave{color:#ffd54a;font-size:13px;white-space:nowrap}
.bst{position:relative;width:40px;height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:12px;border:3px solid var(--deep2);box-shadow:0 3px 0 #22104a;background:linear-gradient(180deg,#8f5cf0,#6a33c8)}
.bst:active{transform:translateY(3px);box-shadow:none}
.bst.on{background:linear-gradient(180deg,#ffd76e,#e09a12);animation:pulse .9s infinite}
.bst .num{position:absolute;top:-8px;right:-7px;min-width:20px;height:20px;border-radius:999px;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--orange));color:#5a2a00;font-size:11px;line-height:15px;border:2px solid var(--deep2);text-align:center}
.bst:disabled{filter:grayscale(.8);opacity:.7}
#stageWrap{flex:1;min-height:0;position:relative}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* panels */
.ov{position:fixed;inset:0;background:rgba(20,8,48,.62);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:60;opacity:0;transition:opacity .18s}
.ov.in{opacity:1}
.pn{width:min(480px,100%);max-height:90vh;display:flex;flex-direction:column;background:var(--cream);border:4px solid var(--deep2);border-radius:22px;box-shadow:0 12px 0 rgba(20,8,48,.5);overflow:hidden;transform:scale(.9);transition:transform .2s cubic-bezier(.2,1.5,.4,1)}
.ov.in .pn{transform:scale(1)}
.pn.sm{width:min(370px,100%)}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(#ff9ed2,var(--pinkD));border-bottom:4px solid var(--deep2);color:#fff}
.ph h2{font-size:21px;flex:1;text-shadow:2px 2px 0 rgba(0,0,0,.2)}
.ph .x{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--pinkD);border:3px solid var(--deep2);font-size:15px;line-height:1}
.pb{padding:12px;overflow-y:auto}
.pf{padding:10px 12px;border-top:3px dashed rgba(42,17,89,.15);display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.task{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--deep2);border-radius:16px;padding:8px 10px;margin-bottom:8px;box-shadow:0 3px 0 rgba(42,17,89,.15)}
.task .ic{font-size:26px;flex:0 0 auto;width:34px;text-align:center}
.task .tx{flex:1;min-width:0;font-size:14px}
.task .tx small{display:block;color:var(--ink2);font-size:12px;font-weight:700}
.task.rdy{background:#e8fff5;border-color:var(--mintD)}
.prog{height:9px;background:#e6dcf7;border-radius:999px;overflow:hidden;margin-top:4px}
.prog>b{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--mintD));width:0}
.shopg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px}
.sitem{background:#fff;border:3px solid var(--deep2);border-radius:16px;padding:9px;text-align:center;box-shadow:0 3px 0 rgba(42,17,89,.15)}
.sitem .e{font-size:30px}
.sitem b{display:block;font-size:14px}
.sitem small{display:block;color:var(--ink2);font-size:11.5px;font-weight:700;min-height:28px;line-height:1.25;margin:2px 0 5px}
.big1{text-align:center;font-family:'Lilita One',sans-serif;font-size:30px;color:var(--pinkD)}
.starsBig{font-size:44px;text-align:center;letter-spacing:4px;line-height:1.1}

/* hero cards in the hero shop */
.hcard{display:grid;grid-template-columns:76px 1fr;gap:10px;background:#fff;border:3px solid var(--deep2);border-radius:18px;padding:9px;margin-bottom:9px;box-shadow:0 3px 0 rgba(42,17,89,.15)}
.hcard.team{background:linear-gradient(90deg,#fff8d6,#fff);border-color:#e0a412}
.hcard.lock{opacity:.6}
.hcard canvas{width:76px;height:76px;border-radius:14px;background:radial-gradient(circle at 50% 35%,#8a5cf0,#3c1b85)}
.hcard h3{font-size:18px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hcard .tag{font-family:Nunito,sans-serif;font-size:11px;font-weight:900;border-radius:999px;padding:1px 8px;color:#fff}
.hcard .stats{display:flex;gap:10px;font-size:12.5px;color:var(--ink2);margin:3px 0;flex-wrap:wrap}
.hcard .ab{font-size:12px;color:var(--ink);background:#f3ecff;border-radius:10px;padding:5px 8px;margin:4px 0 6px;line-height:1.35}
.teambar{display:flex;gap:8px;justify-content:center;margin:2px 0 10px}
.teambar .slot{width:62px;height:62px;border-radius:16px;border:3px dashed #b9a6e6;background:#f3ecff;display:flex;align-items:center;justify-content:center;color:#b9a6e6;font-size:22px;overflow:hidden}
.teambar .slot canvas{width:58px;height:58px}

/* toast + banner */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:62px;display:flex;flex-direction:column;gap:6px;z-index:80;pointer-events:none;width:min(92vw,380px)}
.toast{background:rgba(20,8,48,.88);color:#fff;border-radius:14px;padding:7px 13px;font-size:14px;text-align:center;animation:tin .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes tin{from{transform:translateY(-14px) scale(.9);opacity:0}}
.toast.out{opacity:0;transition:opacity .3s}
#banner{position:fixed;left:0;right:0;top:36%;text-align:center;z-index:70;pointer-events:none;font-family:'Lilita One',sans-serif;font-size:clamp(30px,9vw,58px);color:#fff;text-shadow:0 0 14px var(--pink),4px 4px 0 var(--deep2);opacity:0}
#banner.on{animation:bpop 1.6s ease-out}
@keyframes bpop{0%{opacity:0;transform:scale(.4) rotate(-8deg)}20%{opacity:1;transform:scale(1.12) rotate(2deg)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:75}
/* loading */
#load{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;
  background:radial-gradient(circle at 50% 30%,#8a5cf0,#4b2596 60%,#2a1159)}
#load.out{opacity:0;transition:opacity .45s;pointer-events:none}
#load .cone{font-size:84px;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-5deg)}}
#ldBarW{width:min(300px,70vw);height:16px;border:3px solid var(--deep2);border-radius:999px;background:#fff;overflow:hidden}
#ldBar{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9ed2,#ffd36e,#9be7ff);transition:width 1.9s ease-in-out}
#ldTip{max-width:320px;text-align:center;color:#e7dcff}
@media (max-width:560px){#bar .logo{display:none}}
@media (max-width:430px){
  #bar{padding:6px 6px;gap:5px}
  .pill{font-size:13px;padding:2px 7px;border-width:2px}
  .ibtn{width:34px;height:34px;font-size:16px;border-width:2px}
  .lvlbox{min-width:78px}
  #bhead{padding:5px 7px;gap:5px}
  #bTitle{font-size:16px}
  .bst{width:36px;height:36px;font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="load">
  <div class="cone">🍭</div>
  <h1 style="font-size:30px;text-shadow:2px 2px 0 #2a1159">Potato Candy Floss</h1>
  <div id="ldBarW"><b id="ldBar"></b></div>
  <p id="ldTxt" class="hint" style="margin:0;color:#fff">Loading…</p>
  <p id="ldTip" class="hint"></p>
</div>

<div id="app">
  <header id="bar">
    <a class="ibtn" href="./" id="homeBtn" title="All games" aria-label="All games" style="text-decoration:none">🏠</a>
    <span class="logo">Potato <b>Candy Floss</b></span>
    <div class="spacer"></div>
    <div class="pill lvlbox"><b style="font-size:13px">Lv <span id="plLvl">1</span></b><div style="flex:1"><div class="xpbar"><i id="xpFill"></i></div></div></div>
    <div class="pill">🪙 <b id="coins">0</b></div>
    <button class="ibtn" id="langBtn" title="Language">🇩🇰</button>
    <button class="ibtn" id="musBtn" title="Music">🎵</button>
    <button class="ibtn" id="sndBtn" title="Sound">🔊</button>
  </header>

  <!-- MENU -->
  <section class="screen on" id="scMenu">
    <div class="hero">
      <canvas id="heroArt" width="660" height="230"></canvas>
      <h1>Potato <span>Candy Floss</span></h1>
      <p id="heroTxt">Swap candies so your potato heroes fight the sour monsters!</p>
    </div>
    <div class="menu">
      <button class="mbig play" id="mPlay"><span class="ic">⚔️</span><span class="tx"><b id="mPlayT">Campaign</b><small id="mPlayS">Level 1 of 100</small></span></button>
      <button class="mbig heroes" id="mHeroes"><span class="ic">🥔</span><span class="tx"><b id="mHeroT">Heroes</b><small id="mHeroS">Buy and upgrade your team</small></span><span class="dot" id="heroDot" style="display:none">!</span></button>
      <button class="mbig endless" id="mEndless"><span class="ic">♾️</span><span class="tx"><b id="mEndT">Endless battle</b><small id="mEndS">Best: wave 0</small></span></button>
      <div class="m4">
        <button id="mMis"><i>📋</i><span id="mMisT">Missions</span><span class="dot" id="misDot" style="display:none">0</span></button>
        <button id="mQue"><i>📜</i><span id="mQueT">Quests</span><span class="dot" id="queDot" style="display:none">0</span></button>
        <button id="mShop"><i>🛒</i><span id="mShopT">Shop</span></button>
        <button id="mHelp"><i>❓</i><span id="mHelpT">How to play</span></button>
      </div>
      <div class="m4">
        <button id="mTro"><i>🏆</i><span id="mTroT">Trophies</span></button>
        <button id="mStats"><i>📊</i><span id="mStatsT">Stats</span></button>
        <button id="mLog"><i>📖</i><span id="mLogT">What's new</span><span class="dot" id="logDot" style="display:none">!</span></button>
        <button id="mDisc"><i>💬</i><span>Discord</span></button>
      </div>
    </div>
    <p class="hint" style="text-align:center;margin:14px 0 6px;color:#cbb8f2">🍭 Potato Team Games</p>
  </section>

  <!-- LEVEL MAP -->
  <section class="screen" id="scMap">
    <div class="maphead">
      <button class="btn sm" id="mapBack">← <span id="mapBackT">Menu</span></button>
      <button class="btn sm sun" id="mapHeroes">🥔 <span id="mapHeroT">Heroes</span></button>
      <div class="spacer"></div>
      <span class="pill">⭐ <b id="totStars">0</b></span>
    </div>
    <div class="path" id="path"></div>
  </section>

  <!-- BATTLE -->
  <section class="screen" id="scGame">
    <div id="bhead">
      <button class="ibtn round" id="gQuit" title="Pause">⏸</button>
      <div style="min-width:0"><div id="bTitle">Level 1</div><div id="bWave">Wave 1/1</div></div>
      <div class="spacer"></div>

<script>
'use strict';
/* =====================================================================
   POTATO CANDY FLOSS  –  a match-3 battle game. Swap candies; every
   match makes your potato heroes attack the sour monsters at the top.
   Monsters hit back every few turns. Beat all waves to win a level;
   if every hero falls, the level starts over. 100-level campaign with
   bosses (and more after that), endless mode, hero shop + upgrades,
   missions, quests and trophies. Everything is in this one file.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=n=>{n=Math.floor(n);return n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e4?Math.round(n/1e3)+'K':n>=1000?(n/1000).toFixed(1)+'K':''+n};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// a seeded random, so level 37 looks the same for everyone
const seeded=s=>{let a=(s*1664525+1013904223)>>>0;return()=>{a^=a<<13;a>>>=0;a^=a>>17;a^=a<<5;a>>>=0;return a/4294967296}};

/* ---------------- language ---------------- */
const LANG_KEY='potato_floss_lang';
let LANG=(()=>{try{const v=localStorage.getItem(LANG_KEY);if(v)return v}catch(e){}
  return(navigator.language||'').toLowerCase().startsWith('da')?'da':'en'})();
const L=(en,da)=>LANG==='da'?da:en;
const nm=o=>L(o.en,o.da);

/* ---------------- sound effects ---------------- */
let AC=null;
const SFX={
  on:true,
  tone(f,d,t,v,slide,delay){if(!this.on)return;try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=t||'sine';o.frequency.setValueAtTime(f,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t0+d);
    g.gain.setValueAtTime(v||.07,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.03);
  }catch(e){}},
  noise(d,v,f){if(!this.on)return;try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);
    for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const s2=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();
    fl.type='lowpass';fl.frequency.value=f||1800;s2.buffer=b;g.gain.value=v||.12;
    s2.connect(fl).connect(g).connect(AC.destination);s2.start();
  }catch(e){}},
  click(){this.tone(620,.05,'triangle',.05)},
  pick(){this.tone(760,.05,'sine',.05)},
  swap(){this.tone(420,.1,'triangle',.05,1.6)},
  no(){this.tone(200,.12,'sawtooth',.045,.6)},
  pop(n){this.tone(540+Math.min(9,n||0)*70,.08,'sine',.07,1.6)},
  coin(){this.tone(900,.07,'square',.04);this.tone(1300,.1,'square',.035,1,.06)},
  spec(){[520,720,940,1240].forEach((f,i)=>this.tone(f,.1,'triangle',.05,1,i*.045))},
  shoot(){this.tone(880,.08,'square',.025,.5)},
  hit(){this.noise(.12,.13,2400);this.tone(160,.12,'sine',.06,.6)},
  hurt(){this.noise(.18,.16,900);this.tone(120,.2,'sawtooth',.05,.5)},
  enemyShot(){this.tone(300,.18,'sawtooth',.035,.35)},
  die(){[500,380,260,160].forEach((f,i)=>this.tone(f,.14,'triangle',.05,.8,i*.07))},
  skill(){[392,523,659,784,1047].forEach((f,i)=>this.tone(f,.14,'triangle',.05,1,i*.06))},
  heal(){[660,880,1100].forEach((f,i)=>this.tone(f,.2,'sine',.05,1.2,i*.08))},
  shield(){this.tone(300,.3,'triangle',.05,2.2)},
  ready(){this.tone(1046,.08,'sine',.05);this.tone(1568,.12,'sine',.05,1,.08)},
  win(){[523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.22,'triangle',.06,1,i*.11))},
  lose(){[400,330,260,200].forEach((f,i)=>this.tone(f,.25,'sawtooth',.045,.7,i*.14))},
  boss(){[110,98,87].forEach((f,i)=>this.tone(f,.5,'sawtooth',.06,.9,i*.25))},
  land(){this.tone(130+rnd(40),.08,'sine',.04,.7)}
};

/* ---------------- cosy background music ----------------
   A slow, soft loop made in the browser: a warm pad, a gentle bass and
   sparkly pentatonic notes. A little brighter while you are in battle. */
const MUSIC={
  on:true,id:null,bus:null,next:0,step:0,battle:false,
  CH:[[131,[262,330,392]],[110,[220,262,330]],[87.3,[175,220,262]],[98,[196,247,294]]],
  SCALE:[523,587,659,784,880,1047],
  ensure(){
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    if(!this.bus){this.bus=AC.createGain();this.bus.gain.value=0;this.bus.connect(AC.destination)}
  },
  note(f,t,dur,vol,type){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*.25);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(this.bus);o.start(t);o.stop(t+dur+.05);
  },
  tick(){
    if(!this.on)return;this.ensure();
    const beat=this.battle?.4:.52;
    while(this.next<AC.currentTime+.4){
      const t=Math.max(this.next,AC.currentTime+.02),s2=this.step,bar=Math.floor(s2/8)%4,[bass,chord]=this.CH[bar];
      if(s2%8===0){chord.forEach(f=>this.note(f,t,beat*7,.015,'sine'));this.note(bass,t,beat*3.4,.03,'triangle')}
      if(s2%8===4)this.note(bass*1.5,t,beat*2.4,.018,'triangle');
      if(this.battle&&s2%2===1)this.note(bass*2,t,beat*.5,.012,'triangle');
      if(s2%2===0&&Math.random()<.55){const f=pick(this.SCALE);this.note(f,t,beat*1.5,.02,'sine');this.note(f*2,t+.14,beat*.9,.007,'sine')}
      this.next=t+beat;this.step++;
    }
  },
  start(){if(this.id)return;this.ensure();this.next=AC.currentTime+.1;
    this.bus.gain.cancelScheduledValues(AC.currentTime);this.bus.gain.setTargetAtTime(this.on?1:0,AC.currentTime,.8);
    this.id=setInterval(()=>this.tick(),120);this.tick()},
  set(v){this.on=v;try{localStorage.setItem('potato_floss_mus',v?'1':'0')}catch(e){}
    if(v)this.start();else if(this.bus)this.bus.gain.setTargetAtTime(0,AC.currentTime,.4)}
};

/* ---------------- save ---------------- */
const KEY='potato_floss_v1';
function defCnt(){return{cleared:0,matches:0,specials:0,levels:0,swaps:0,cascades:0,endless:0,stars:0,coins:0,kills:0,bosses:0,skills:0,dmg:0,heroes:2,upgrades:0,waves:0}}
function defState(){return{
  v:2,coins:300,xp:0,lvl:1,
  maxLevel:1,stars:{},cycle:0,campaignDone:false,bestWave:0,
  heroes:{knight:{lvl:1},medic:{lvl:1}},team:['knight','medic'],
  items:{hammer:2,shuffle:2,potion:1},
  cnt:defCnt(),daily:null,quests:[],qDone:[],ach:{},seenLog:'',newV2:false
}}
let S=defState();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;
  if(d.v===2){S=Object.assign(defState(),d,{cnt:Object.assign(defCnt(),d.cnt||{}),items:Object.assign(defState().items,d.items||{})});return}
  // the first version was a different game – keep coins, XP and player level, start the new campaign fresh
  S=defState();S.coins=(d.coins||0)+300;S.xp=d.xp||0;S.lvl=d.lvl||1;S.newV2=true;
}catch(e){}}
const today=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};

/* ---------------- tiny UI helpers ---------------- */
function toast(msg,ms){const el=document.createElement('div');el.className='toast';el.innerHTML=msg;$('#toasts').appendChild(el);
  const all=$('#toasts').children;while(all.length>3)all[0].remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320)},ms||2200)}
function banner(txt){const b=$('#banner');b.textContent=txt;b.classList.remove('on');void b.offsetWidth;b.classList.add('on')}
function panel({title='',html='',buttons=[],sm,render,onClose,noX}){
  return new Promise(res=>{
    const ov=document.createElement('div');ov.className='ov';
    ov.innerHTML=`<div class="pn ${sm?'sm':''}"><div class="ph"><h2>${title}</h2>${noX?'':'<button class="x" aria-label="Close">✕</button>'}</div><div class="pb">${html}</div>${buttons.length?'<div class="pf"></div>':''}</div>`;
    document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('in'));
    let done=false;const close=v=>{if(done)return;done=true;ov.classList.remove('in');setTimeout(()=>ov.remove(),200);onClose&&onClose(v);res(v)};
    ov._close=close;const x=$('.x',ov);if(x)x.onclick=()=>{SFX.click();close(null)};
    if(!noX)ov.addEventListener('pointerdown',e=>{if(e.target===ov)close(null)});
    const pf=$('.pf',ov);
    buttons.forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.cls||'');e.innerHTML=b.label;e.disabled=!!b.dis;
      e.onclick=()=>{SFX.click();close(b.v!==undefined?b.v:true)};pf.appendChild(e)});
    if(render)render($('.pb',ov),close,ov);
  });
}
const anyPanel=()=>!!$('.ov');
const closePanels=()=>$$('.ov').forEach(o=>o._close&&o._close(null));

/* confetti + sparkles on a canvas above everything */
const fx=$('#fx'),fctx=fx.getContext('2d');let FP=[];
function fxSize(){const d=Math.min(2,devicePixelRatio||1);fx.width=innerWidth*d;fx.height=innerHeight*d;fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px';fctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fxSize);fxSize();
const CONF=['#ff4fa8','#ffd21f','#2ccf6a','#2fb6ff','#ff9a1f','#d81e3c','#fff','#a24bff'];
function confetti(n=90){for(let i=0;i<n&&FP.length<700;i++)FP.push({k:'c',x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*7,c:pick(CONF),a:Math.random()*6,s:(Math.random()-.5)*.3,l:3})}
function sparkle(x,y,col,n=10){for(let i=0;i<n&&FP.length<700;i++){const a=Math.random()*6.3,sp=1+Math.random()*4;FP.push({k:'s',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,r:2+Math.random()*4,c:col||pick(CONF),l:.5+Math.random()*.4})}}
function fxTick(dt){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=FP.length-1;i>=0;i--){const p=FP[i];p.l-=dt;if(p.l<=0){FP.splice(i,1);continue}
    const al=clamp(p.l*2,0,1);fctx.globalAlpha=al;
    if(p.k==='c'){p.vy+=.12;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.fillStyle=p.c;fctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66);fctx.restore()}
    else{p.vy+=.18;p.x+=p.vx;p.y+=p.vy;fctx.fillStyle=p.c;fctx.beginPath();fctx.arc(p.x,p.y,p.r*al,0,7);fctx.fill()}
  }
  fctx.globalAlpha=1;
}

/* ---------------- player level / coins ---------------- */
const xpFor=l=>Math.floor(80*Math.pow(l,1.35));
function addXP(n){if(!n)return;S.xp+=n;let up=false;
  while(S.xp>=xpFor(S.lvl)){S.xp-=xpFor(S.lvl);S.lvl++;up=true}
  if(up){const r=100+S.lvl*25;S.coins+=r;SFX.win();confetti(140);toast(L(`🎉 You reached player level ${S.lvl}! +${r} 🪙`,`🎉 Du nåede spillerlevel ${S.lvl}! +${r} 🪙`),3200)}
  hud();save()}
function addCoins(n){if(!n)return;S.coins=Math.max(0,Math.round(S.coins+n));if(n>0)S.cnt.coins+=n;hud();save()}

function ensureDaily(){
  const d=today();if(S.daily&&S.daily.day===d)return;
  const r=seeded(d),pool=[...MIS_POOL].sort(()=>r()-.5).slice(0,3);
  S.daily={day:d,t:pool.map(([k,n,en,da,e])=>({k,n,en,da,e,p:0,got:false})),bonus:false};save();
}
function dailyProg(k,n){if(!S.daily)return;S.daily.t.forEach(t=>{if(t.k===k&&!t.got)t.p=Math.min(t.n,t.p+n)})}
const misReady=()=>S.daily?S.daily.t.filter(t=>t.p>=t.n&&!t.got).length+(!S.daily.bonus&&S.daily.t.every(t=>t.got)?1:0):0;

/* ---- levels are built from the level number (and how many times you have gone round) ---- */
const HP_BASE=125,ATK_BASE=21;
function mkEnemy(def,n,r,cyc,boss){
  const f=(1+.037*(n-1))*(1+.35*cyc),af=(1+.033*(n-1))*(1+.3*cyc),wob=.9+r()*.2;
  const hp=Math.round(HP_BASE*(boss?5:def.hp)*f*wob);
  return{def,boss:!!boss,maxHp:hp,hp,atk:Math.round(ATK_BASE*(boss?1.35:def.atk)*af),cd:boss?3:def.cd,
    cdLeft:(boss?3:def.cd)+(r()<.5?1:0),tier:tierFor(n),flash:0,shake:0,dead:false,deadT:0,x:0,y:0,sz:0,frozen:0};
}
function genLevel(n,cyc){
  cyc=cyc==null?S.cycle:cyc;
  const r=seeded(n*7919+13+cyc*101),boss=n%10===0;
  const pool=MONSTERS.filter(m=>m.from<=n);
  // newest monster kinds show up a little more often
  const pickM=()=>r()<.35&&pool.length>2?pool[pool.length-1-Math.floor(r()*2)]:pool[Math.floor(r()*pool.length)];
  const waveN=boss?2:n<5?1:n<25?(r()<.5?1:2):(r()<.25?3:2);
  const waves=[];
  for(let w=0;w<waveN;w++){
    const last=w===waveN-1;
    if(boss&&last){
      const b=BOSSES[(Math.floor(n/10)-1)%BOSSES.length],list=[mkEnemy(b,n,r,cyc,true)];
      if(n>=40)list.push(mkEnemy(pickM(),n,r,cyc));
      waves.push(list);continue}
    const cnt=n<4?1:n<12?1+(r()<.5?1:0):n<45?2+(r()<.25?1:0):2+(r()<.6?1:0);
    const list=[];for(let k=0;k<cnt;k++)list.push(mkEnemy(pickM(),n,r,cyc));
    waves.push(list);
  }
  return{n,boss,waves,cyc,endless:false};
}
// endless: the waves keep coming, a little harder each time, with a boss every tenth wave
function genWave(w){
  const n=Math.round(1+w*1.8),r=seeded(Date.now()+w),boss=w%10===0;
  const pool=MONSTERS.filter(m=>m.from<=Math.max(n,8));
  if(boss)return[mkEnemy(BOSSES[(w/10-1)%BOSSES.length],n,r,0,true)];
  const cnt=w<3?1:w<8?2:2+(r()<.5?1:0),list=[];
  for(let k=0;k<cnt;k++)list.push(mkEnemy(pool[Math.floor(r()*pool.length)],n,r,0));
  return list;
}


/* =====================================================================
   ART – everything is drawn with code, so it stays sharp at any size
   ===================================================================== */
function shade(hex,f){const n=parseInt(hex.slice(1),16),r=n>>16,gg=(n>>8)&255,b=n&255;
  const k=v=>clamp(Math.round(f<0?v*(1+f):v+(255-v)*f),0,255);return`rgb(${k(r)},${k(gg)},${k(b)})`}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function ballFill(g,R,col){
  const gr=g.createRadialGradient(-R*.34,-R*.42,R*.06,0,0,R*1.12);
  gr.addColorStop(0,'#fff');gr.addColorStop(.2,shade(col,.5));gr.addColorStop(.6,col);gr.addColorStop(1,shade(col,-.5));
  g.fillStyle=gr;g.beginPath();g.arc(0,0,R,0,7);g.fill();
  g.strokeStyle=shade(col,-.6);g.lineWidth=Math.max(1.4,R*.08);g.stroke();
}
function gloss(g,R){g.save();g.globalAlpha=.8;g.fillStyle='#fff';
  g.beginPath();g.ellipse(-R*.34,-R*.45,R*.32,R*.18,-.55,0,7);g.fill();
  g.globalAlpha=.35;g.beginPath();g.ellipse(R*.32,R*.44,R*.22,R*.1,-.55,0,7);g.fill();g.restore()}
// the six candies – lollipop, rose, planet, berry bubble, lemon and mint
function drawCandy(g,type,cx,cy,sz,sc,rot){
  const R=sz*.4,col=PIECES[type].c;
  g.save();g.translate(cx,cy);if(rot)g.rotate(rot);if(sc!=null&&sc!==1)g.scale(sc,sc);
  if(type===0){ // pink lollipop on a stick
    g.fillStyle='#fff';g.strokeStyle='#c9b8d8';g.lineWidth=Math.max(1,R*.06);
    roundRect(g,-R*.11,R*.2,R*.22,R*1.02,R*.1);g.fill();g.stroke();
    ballFill(g,R*.86,col);
    g.save();g.beginPath();g.arc(0,0,R*.84,0,7);g.clip();
    g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=R*.17;g.lineCap='round';g.beginPath();
    for(let a=0;a<8;a+=.12){const rr=R*.06+a*R*.098;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.stroke();g.restore();
    gloss(g,R*.86);
  }else if(type===1){ // rose candy
    ballFill(g,R,col);
    g.strokeStyle=shade(col,-.45);g.lineWidth=R*.09;g.lineCap='round';
    for(const[k,a0]of[[.82,.4],[.62,2.4],[.44,4.1],[.26,1.2]]){g.beginPath();g.arc(0,0,R*k,a0,a0+3.9);g.stroke()}
    g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=R*.06;
    for(const[k,a0]of[[.72,3.6],[.52,5.6]]){g.beginPath();g.arc(0,0,R*k,a0,a0+1.6);g.stroke()}
    gloss(g,R);
  }else if(type===2){ // orange planet with a ring
    g.strokeStyle='#ffe7b0';g.lineWidth=R*.2;
    g.beginPath();g.ellipse(0,R*.05,R*1.16,R*.32,-.25,Math.PI*1.02,Math.PI*1.98);g.stroke();
    ballFill(g,R*.9,col);
    g.save();g.beginPath();g.arc(0,0,R*.88,0,7);g.clip();
    g.fillStyle='rgba(255,255,255,.22)';g.beginPath();g.ellipse(0,-R*.25,R,R*.14,-.25,0,7);g.fill();g.restore();
    g.strokeStyle='#ffe7b0';g.lineWidth=R*.2;
    g.beginPath();g.ellipse(0,R*.05,R*1.16,R*.32,-.25,Math.PI*.02,Math.PI*.98);g.stroke();
    g.strokeStyle=shade(col,-.35);g.lineWidth=R*.05;
    g.beginPath();g.ellipse(0,R*.05,R*1.16,R*.32,-.25,Math.PI*.02,Math.PI*.98);g.stroke();
    gloss(g,R*.9);
  }else if(type===3){ // blueberry bubble with sprinkles
    ballFill(g,R,col);
    g.fillStyle='#3a1d8a';
    for(let k=0;k<16;k++){const a=k*2.399,rr=R*(.18+.68*((k*53)%17)/17);g.beginPath();g.arc(Math.cos(a)*rr,Math.sin(a)*rr,R*.07,0,7);g.fill()}
    gloss(g,R);
  }else if(type===4){ // lemon drop slice
    ballFill(g,R,col);
    g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(0,0,R*.68,0,7);g.fill();
    g.fillStyle=shade(col,.15);
    for(let k=0;k<8;k++){g.beginPath();g.moveTo(0,0);g.arc(0,0,R*.6,k*Math.PI/4+.09,(k+1)*Math.PI/4-.09);g.closePath();g.fill()}
    g.fillStyle='#fff';g.beginPath();g.arc(0,0,R*.1,0,7);g.fill();
    gloss(g,R);
  }else{ // mint ball with stripes
    ballFill(g,R,col);
    g.save();g.beginPath();g.arc(0,0,R*.97,0,7);g.clip();g.rotate(-.6);
    g.fillStyle='rgba(255,255,255,.88)';for(const o of[-.75,-.25,.25,.75])g.fillRect(R*o-R*.11,-R*1.2,R*.22,R*2.4);g.restore();
    gloss(g,R);
  }
  g.restore();
}
function drawSpecial(g,sp,col,cx,cy,sz,sc){
  const R=sz*.4;g.save();g.translate(cx,cy);if(sc!=null)g.scale(sc,sc);

    g.fillStyle='#fff';const a=R*.32;
    if(sp==='row'){g.beginPath();g.moveTo(-R*1.08,0);g.lineTo(-R*.72,-a);g.lineTo(-R*.72,a);g.fill();g.beginPath();g.moveTo(R*1.08,0);g.lineTo(R*.72,-a);g.lineTo(R*.72,a);g.fill()}

/* =====================================================================
   BATTLE – layout, board, heroes, monsters, shots
   ===================================================================== */
const COLS=7,ROWS=7;
const cv=$('#stage'),ctx=cv.getContext('2d');
let B=null;                                   // the running battle
let W=0,H=0,DPR=1,CELL=48,BX=0,BY=0,COLX=0,COLW=0,EH=0,HH=0,HY=0;
let SPR={};
function candySprite(type,sz){
  const k=type+'_'+Math.round(sz);let c=SPR[k];
  if(!c){c=document.createElement('canvas');const d=Math.min(2,devicePixelRatio||1);c.width=c.height=Math.ceil(sz*1.3*d);
    const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);drawCandy(g,type,sz*.65,sz*.65,sz);SPR[k]=c}
  return c;
}
function layout(){
  const r=$('#stageWrap').getBoundingClientRect();if(!r.width)return;
  W=r.width;H=r.height;DPR=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  COLW=Math.min(W-12,640);COLX=(W-COLW)/2;
  EH=clamp(H*.25,112,230);HH=clamp(H*.19,96,165);
  const availH=H-EH-HH-14;
  CELL=Math.max(26,Math.floor(Math.min(COLW/COLS,availH/ROWS)));
  BX=Math.round((W-CELL*COLS)/2);BY=Math.round(EH+(availH-CELL*ROWS)/2+7);HY=H-HH;
  SPR={};placeEnemies();
}
function placeEnemies(){
  if(!B)return;const list=B.enemies,n=Math.max(1,list.length),slot=COLW/n;
  list.forEach((e,i)=>{e.sz=Math.min(EH*.78,slot*.85,e.boss?200:165)*(e.boss?1.12:1);e.x=COLX+slot*(i+.5);e.y=EH*.46});
}
const heroSlot=i=>{const sw=COLW/4;return{x:COLX+sw*i+4,y:HY+6,w:sw-8,h:HH-12}};

/* ---- start a battle ---- */
function teamHeroes(){
  return S.team.filter(id=>HERO(id)&&S.heroes[id]).slice(0,4).map((id,i)=>{const d=HERO(id),st=heroStat(d,S.heroes[id].lvl);
    return{def:d,lvl:S.heroes[id].lvl,maxHp:st.hp,hp:st.hp,atk:st.atk,arm:st.arm,charge:0,chMax:d.ch,shield:0,dead:false,flash:0,hurt:0,ph:i*.7}});
}
function startBattle(lv){
  closePanels();
  const endless=!!lv.endless;
  B={lv,endless,wave:0,waves:endless?null:lv.waves,enemies:[],heroes:teamHeroes(),g:[],target:0,busy:true,over:false,sel:null,drag:null,
     combo:0,turn:0,proj:[],floats:[],shake:0,tool:null,hint:null,showHint:false,idleT:performance.now(),dmgTotal:0,kills:0,endWave:0};
  makeBoard();
  show('scGame');requestAnimationFrame(()=>{layout();nextWave(true)});
  MUSIC.battle=true;
  bhead();
  if(!S.cnt.swaps)setTimeout(()=>toast(L('👆 Tap a candy, then the one next to it. Matching a hero\'s colour makes that hero attack! ⚡ When a hero glows, tap it for a super attack.','👆 Tryk på et slik og så på det ved siden af. Matcher du en helts farve, angriber helten! ⚡ Når en helt lyser, så tryk på den for et superangreb.'),7000),1400);
}
function makeBoard(){
  const g=[];for(let i=0;i<COLS*ROWS;i++)g.push(newCell());B.g=g;
  for(let k=0;k<80;k++){const m=findMatches();if(!m.all.size)break;m.all.forEach(i=>{B.g[i].c=rnd(NC)})}
  if(!hasMove())reshuffle();
}
function newCell(){return{c:rnd(NC),sp:null,sc:1,dx:0,dy:0}}
async function nextWave(first){
  B.wave++;
  B.enemies=B.endless?genWave(B.wave):B.waves[B.wave-1].map(e=>Object.assign({},e));
  B.enemies.forEach((e,i)=>{e.ph=i*1.3;e.enter=1});
  B.target=0;placeEnemies();bhead();
  const boss=B.enemies.some(e=>e.boss);
  if(boss){SFX.boss();banner('👑 '+L('BOSS!','BOSS!'))}
  else banner(B.endless?L('WAVE ','BØLGE ')+B.wave:(B.waves.length>1?L('WAVE ','BØLGE ')+B.wave:(B.lv.endless?'':L('LEVEL ','BANE ')+B.lv.n)));
  await tween(520,p=>B.enemies.forEach(e=>e.enter=1-easeOut(p)));
  B.busy=false;B.idleT=performance.now();findHint();
}
function bhead(){
  if(!B)return;
  $('#bTitle').textContent=B.endless?L('Endless battle','Endeløs kamp'):(L('Level ','Bane ')+B.lv.n+(B.lv.boss?' 👑':''));
  $('#bWave').textContent=B.endless?L(`Wave ${B.wave}`,`Bølge ${B.wave}`):L(`Wave ${B.wave}/${B.waves.length}`,`Bølge ${B.wave}/${B.waves.length}`);
  [['bHammer','hammer'],['bShuffle','shuffle'],['bPotion','potion']].forEach(([id,k])=>{const b=$('#'+id);$('.num',b).textContent=S.items[k]||0;
    b.disabled=!(S.items[k]>0);b.classList.toggle('on',B.tool===k)});
}

/* ---- the match-3 board ---- */
const XY=i=>[i%COLS,Math.floor(i/COLS)];
const at=(x,y)=>(x<0||y<0||x>=COLS||y>=ROWS)?null:B.g[y*COLS+x];
function findMatches(){
  const all=new Set(),runs=[];
  for(let y=0;y<ROWS;y++){let run=[];
    for(let x=0;x<=COLS;x++){const c=at(x,y),p=run.length?B.g[run[run.length-1]]:null;
      if(c&&p&&c.c===p.c&&c.sp!=='cloud'&&p.sp!=='cloud')run.push(y*COLS+x);
      else{if(run.length>=3){runs.push({cells:[...run],dir:'h'});run.forEach(i=>all.add(i))}run=c&&c.sp!=='cloud'?[y*COLS+x]:[]}}}
  for(let x=0;x<COLS;x++){let run=[];
    for(let y=0;y<=ROWS;y++){const c=at(x,y),p=run.length?B.g[run[run.length-1]]:null;
      if(c&&p&&c.c===p.c&&c.sp!=='cloud'&&p.sp!=='cloud')run.push(y*COLS+x);
      else{if(run.length>=3){runs.push({cells:[...run],dir:'v'});run.forEach(i=>all.add(i))}run=c&&c.sp!=='cloud'?[y*COLS+x]:[]}}}
  return{all,runs};
}
function swapCells(a,b){const t=B.g[a];B.g[a]=B.g[b];B.g[b]=t}
const adjacent=(a,b)=>{const[ax,ay]=XY(a),[bx,by]=XY(b);return Math.abs(ax-bx)+Math.abs(ay-by)===1};
function hasMove(){
  for(let i=0;i<B.g.length;i++){const[x,y]=XY(i);
    if(B.g[i]&&B.g[i].sp==='cloud')return true;
    for(const j of[x<COLS-1?i+1:-1,y<ROWS-1?i+COLS:-1]){if(j<0)continue;
      swapCells(i,j);const ok=findMatches().all.size>0;swapCells(i,j);if(ok)return true}}
  return false;
}
function findHint(){
  B.hint=null;let best=null,bs=-1;
  for(let i=0;i<B.g.length;i++){const[x,y]=XY(i);
    for(const j of[x<COLS-1?i+1:-1,y<ROWS-1?i+COLS:-1]){if(j<0)continue;
      swapCells(i,j);const m=findMatches();swapCells(i,j);
      if(!m.all.size)continue;
      // a good tip feeds a hero who is alive
      let sc=m.all.size;m.all.forEach(k=>{const c=B.g[k===i?j:k===j?i:k];if(c&&B.heroes.some(h=>!h.dead&&h.def.c===c.c))sc+=.6});
      sc+=Math.random()*.5;if(sc>bs){bs=sc;best=[i,j]}}}
  B.hint=best;return!!best;
}
function reshuffle(){
  let guard=40;
  do{const cs=B.g.filter(c=>c&&!c.sp);for(let i=cs.length-1;i>0;i--){const j=rnd(i+1);const t=cs[i].c;cs[i].c=cs[j].c;cs[j].c=t}}
  while(guard--&&(findMatches().all.size||!hasMove()));
}

/* ---- tweening ---- */
function tween(ms,fn){return new Promise(res=>{const t0=performance.now();
  const step=()=>{const p=clamp((performance.now()-t0)/ms,0,1);fn(p);if(p<1)requestAnimationFrame(step);else res()};step()})}
const easeOut=p=>1-Math.pow(1-p,3);
const easeBack=p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};

/* ---- swapping ---- */
function animSwap(a,b){
  const ca=B.g[a],cb=B.g[b],[ax,ay]=XY(a),[bx,by]=XY(b),dx=(bx-ax)*CELL,dy=(by-ay)*CELL;
  return tween(150,p=>{const e=easeOut(p);ca.dx=dx*e;ca.dy=dy*e;cb.dx=-dx*e;cb.dy=-dy*e}).then(()=>{ca.dx=ca.dy=cb.dx=cb.dy=0});
}
async function trySwap(a,b){
  if(!B||B.busy||B.over)return;
  B.busy=true;B.sel=null;B.showHint=false;B.idleT=performance.now();
  await animSwap(a,b);swapCells(a,b);
  const ca=B.g[a],cb=B.g[b];
  let pre=null;
  // floss cloud: swap it with a candy to clear every candy of that colour
  if(ca.sp==='cloud'||cb.sp==='cloud'){
    const cloud=ca.sp==='cloud'?a:b,other=cloud===a?b:a,oc=B.g[other],set=new Set([cloud]);
    if(oc.sp==='cloud')B.g.forEach((c,i)=>set.add(i));
    else{B.g.forEach((c,i)=>{if(c&&c.c===oc.c)set.add(i)});}
    B.g[cloud].sp=null;pre=set;cloudFx(cloud);
  }else if(ca.sp&&cb.sp){ // two specials together go off at once
    pre=new Set([a,b]);
  }
  if(!pre&&!findMatches().all.size){
    SFX.no();await animSwap(a,b);swapCells(a,b);B.busy=false;return;
  }
  SFX.swap();bump('swaps');B.turn++;B.last=[a,b];
  await resolve(pre);
  await afterPlayer();
}
async function afterPlayer(){
  await waitShots();
  if(B.over)return;
  if(await waveCheck())return;
  await enemyTurn();
  if(B.over)return;
  B.busy=false;B.idleT=performance.now();findHint();bhead();
}

/* ---- clearing, specials, damage ---- */
async function resolve(pre){
  B.combo=0;let loops=0;
  if(pre){B.combo=1;await clearSet(pre,[]);await gravity()}
  while(loops++<40&&!B.over){
    const m=findMatches();if(!m.all.size)break;
    B.combo++;
    if(B.combo>1){bump('cascades');floatText(BX+CELL*COLS/2,BY+CELL*1.2,L('COMBO x','KOMBO x')+B.combo,'#ffd54a',26)}
    bump('matches',m.runs.length);
    const place=[],used=new Set();
    m.runs.forEach(run=>{
      const crossed=run.cells.find(i=>m.runs.some(o=>o!==run&&o.dir!==run.dir&&o.cells.includes(i)));
      let sp=crossed!==undefined?'bomb':run.cells.length>=5?'cloud':run.cells.length===4?(run.dir==='h'?'row':'col'):null;
      if(!sp)return;
      let spot=crossed!==undefined?crossed:(B.last&&run.cells.find(i=>B.last.includes(i)));
      if(spot==null)spot=run.cells[Math.floor(run.cells.length/2)];
      if(used.has(spot))return;used.add(spot);
      place.push({i:spot,sp,c:B.g[run.cells[0]].c});
    });
    await clearSet(m.all,place);
    await gravity();
  }
  if(!B.over&&!hasMove()){toast(L('🔀 No moves – shuffling!','🔀 Ingen træk – blander!'));reshuffle()}
}
function burst(i,out){
  const c=B.g[i];if(!c||!c.sp||out.has(i))return;out.add(i);
  const[x,y]=XY(i),sp=c.sp;c.sp=null;SFX.spec();
  const add=j=>{if(j==null||!B.g[j])return;if(B.g[j].sp&&!out.has(j))burst(j,out);out.add(j)};
  if(sp==='row'){for(let k=0;k<COLS;k++)add(y*COLS+k);beamFx(BX,BY+y*CELL+CELL/2,BX+COLS*CELL,BY+y*CELL+CELL/2)}
  if(sp==='col'){for(let k=0;k<ROWS;k++)add(k*COLS+x);beamFx(BX+x*CELL+CELL/2,BY,BX+x*CELL+CELL/2,BY+ROWS*CELL)}
  if(sp==='bomb'){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<COLS&&ny<ROWS)add(ny*COLS+nx)}boomFx(i)}
  if(sp==='cloud'){const col=c.c;B.g.forEach((o,j)=>{if(o&&o.c===col)add(j)});cloudFx(i)}
}
async function clearSet(set,place){
  const keep=new Set(place.map(p=>p.i)),extra=new Set();
  set.forEach(i=>{const c=B.g[i];if(c&&c.sp&&!keep.has(i))burst(i,extra)});
  extra.forEach(i=>set.add(i));
  const per=Array(NC).fill(0);let n=0;
  set.forEach(i=>{const c=B.g[i];if(!c||keep.has(i))return;per[c.c]++;n++});
  bump('cleared',n);SFX.pop(n);
  // every cleared candy powers the hero of that colour; other colours still do a little damage
  const mult=1+.25*(B.combo-1),alive=B.heroes.filter(h=>!h.dead);
  const neutral=alive.length?alive.reduce((a,h)=>a+h.atk,0)/alive.length*.28:3;
  let free=0;
  per.forEach((cnt,col)=>{if(!cnt)return;
    const hs=alive.filter(h=>h.def.c===col);
    if(!hs.length){free+=cnt*neutral*mult;return}
    hs.forEach(h=>{const before=h.charge;h.charge=Math.min(h.chMax,h.charge+cnt);if(before<h.chMax&&h.charge>=h.chMax){SFX.ready();h.readyT=1}
      heroShot(h,h.atk*cnt/3*mult)})});
  if(free>0)boardShot(set,free);
  await tween(150,p=>set.forEach(i=>{const c=B.g[i];if(c&&!keep.has(i))c.sc=1-easeOut(p)}));
  set.forEach(i=>{const c=B.g[i];if(!c)return;if(keep.has(i)){c.sc=1;return}
    const[x,y]=XY(i);popFx(BX+x*CELL+CELL/2,BY+y*CELL+CELL/2,PIECES[c.c].c);B.g[i]=null});
  place.forEach(pl=>{const c=B.g[pl.i];if(!c)return;c.sp=pl.sp;c.c=pl.c;c.sc=0;bump('specials')});
  if(place.length){SFX.spec();await tween(200,p=>place.forEach(pl=>{const c=B.g[pl.i];if(c)c.sc=easeBack(p)}))}
}
async function gravity(){
  const falls=[];
  for(let x=0;x<COLS;x++){
    let write=ROWS-1;
    for(let y=ROWS-1;y>=0;y--){const i=y*COLS+x;if(B.g[i]){if(write!==y){const ni=write*COLS+x;B.g[ni]=B.g[i];B.g[i]=null;B.g[ni].dy=-(write-y)*CELL;falls.push(B.g[ni])}write--}}
    for(let y=write;y>=0;y--){const c=newCell();c.dy=-(write+1)*CELL-CELL*.4;B.g[y*COLS+x]=c;falls.push(c)}
  }
  if(!falls.length)return;
  falls.forEach(c=>c.dy0=c.dy);
  await tween(190,p=>falls.forEach(c=>{c.dy=c.dy0*(1-easeOut(p))}));
  falls.forEach(c=>{c.dy=0;delete c.dy0});SFX.land();
}

/* ---- shots: heroes fire candy at the monsters, monsters fire their weapons back ---- */
const curTarget=()=>{const al=B.enemies.filter(e=>!e.dead);if(!al.length)return null;
  const t=B.enemies[B.target];return t&&!t.dead?t:al[0]};
function heroPos(h){const i=B.heroes.indexOf(h),s=heroSlot(i);return[s.x+s.w/2,s.y+s.h*.38]}
function heroShot(h,dmg,o){
  const t=(o&&o.to)||curTarget();if(!t||dmg<=0)return;
  h.atkT=1;const[x,y]=heroPos(h);shoot({from:[x,y],to:t,dmg,kind:'hero',col:h.def.c,big:o&&o.big,hero:h});
}
function boardShot(set,dmg){
  const t=curTarget();if(!t)return;let sx=0,sy=0,n=0;
  set.forEach(i=>{const[x,y]=XY(i);sx+=BX+x*CELL+CELL/2;sy+=BY+y*CELL+CELL/2;n++});
  shoot({from:[sx/n,sy/n],to:t,dmg,kind:'spark'});
}
function shoot(o){
  o.t=0;o.dur=o.dur||(o.kind==='enemy'?.55:.42);o.done=new Promise(r=>o.res=r);
  B.proj.push(o);if(o.kind!=='enemy')SFX.shoot();return o.done;
}
const waitShots=()=>Promise.all(B.proj.map(p=>p.done));
function landShot(p){
  if(p.kind==='enemy')return hurtHero(p.to,p.dmg,p.src);
  let t=p.to;if(!t||t.dead){t=curTarget();if(!t)return}
  hitEnemy(t,p.dmg,p.big);
}
function hitEnemy(e,dmg,big){
  if(e.dead||B.over)return;dmg=Math.max(1,Math.round(dmg));
  e.hp=Math.max(0,e.hp-dmg);e.flash=1;e.shake=big?1:.5;B.dmgTotal+=dmg;bump('dmg',dmg);
  floatText(e.x+(Math.random()-.5)*e.sz*.5,e.y-e.sz*.3,'-'+N(dmg),big?'#ffd54a':'#fff',big?30:22);
  SFX.hit();
  if(e.hp<=0){e.dead=true;e.deadT=0;B.kills++;bump('kills');if(e.boss)bump('bosses');SFX.die();
    sparkleStage(e.x,e.y,e.def.body,24);
    if(B.enemies[B.target]===e){const nx=B.enemies.findIndex(o=>!o.dead);if(nx>=0)B.target=nx}}
}
function hurtHero(h,dmg,src){
  if(!h||h.dead||B.over)return;
  dmg=dmg*(1-Math.min(.6,h.arm/100));dmg=Math.max(1,Math.round(dmg*(.9+Math.random()*.2)));
  if(h.shield>0){const a=Math.min(h.shield,dmg);h.shield-=a;dmg-=a;if(a)floatText(...heroPos(h),'🛡️-'+a,'#9be7ff',18)}
  if(dmg>0){h.hp=Math.max(0,h.hp-dmg);floatText(heroPos(h)[0],heroPos(h)[1]-10,'-'+dmg,'#ff6b81',22)}
  h.flash=1;h.hurt=1;B.shake=.5;SFX.hurt();
  if(h.hp<=0&&!h.dead){h.dead=true;h.charge=0;h.shield=0;toast(L(`💔 ${nm(h.def)} has fallen!`,`💔 ${nm(h.def)} er faldet!`))}
}

/* ---- the monsters' turn ---- */
async function enemyTurn(){
  for(const e of B.enemies){
    if(e.dead||B.over)continue;
    if(e.frozen>0)e.frozen--;
    e.cdLeft--;
    if(e.cdLeft>0)continue;
    e.cdLeft=e.cd;
    const al=B.heroes.filter(h=>!h.dead);if(!al.length)break;
    e.attackT=1;SFX.enemyShot();
    const tiers=1+e.tier*.12;
    if(e.boss){ // bosses hit the whole team
      const shots=al.map((h,k)=>{const[x,y]=heroPos(h);return shoot({from:[e.x,e.y],to:h,dmg:e.atk*.62*tiers,kind:'enemy',wpn:e.def.wpn,tier:e.tier,src:e,dur:.6+k*.05})});
      await Promise.all(shots);
    }else{
      const h=pick(al);await shoot({from:[e.x,e.y],to:h,dmg:e.atk*tiers,kind:'enemy',wpn:e.def.wpn,tier:e.tier,src:e});
    }
    await sleep(120);
    if(B.heroes.every(h=>h.dead)){await loseBattle();return}
  }
}

/* ---- hero skills ---- */
async function useSkill(h){
  if(!B||B.busy||B.over||h.dead||h.charge<h.chMax)return;
  B.busy=true;h.charge=0;bump('skills');SFX.skill();
  const ab=ABIL[h.def.ab];banner(ab[0]+' '+L(ab[1],ab[2]));
  const al=()=>B.enemies.filter(e=>!e.dead);
  switch(h.def.ab){
    case'heal':B.heroes.forEach(o=>{if(o.dead)return;const v=Math.round(o.maxHp*.35);o.hp=Math.min(o.maxHp,o.hp+v);floatText(...heroPos(o),'+'+v,'#7dffb0',22)});SFX.heal();heroShot(h,h.atk*2,{big:true});break;
    case'slash':heroShot(h,h.atk*4.5,{big:true});break;
    case'frost':al().forEach(e=>{heroShot(h,h.atk*1.2,{to:e});e.cdLeft+=2;e.frozen=2});break;
    case'arrows':for(let k=0;k<6;k++){const a=al();if(!a.length)break;heroShot(h,h.atk*1.1,{to:pick(a)});await sleep(90)}break;
    case'barrage':al().forEach(e=>heroShot(h,h.atk*2.2,{to:e,big:true}));break;
    case'shield':B.heroes.forEach(o=>{if(!o.dead)o.shield+=Math.round(o.maxHp*.35)});SFX.shield();heroShot(h,h.atk*2,{big:true});break;
    case'storm':{al().forEach(e=>heroShot(h,h.atk*1.2,{to:e}));const spots=[];let g=60;while(spots.length<6&&g--){const i=rnd(B.g.length);if(B.g[i]&&!B.g[i].sp&&!spots.includes(i))spots.push(i)}
      spots.forEach(i=>{B.g[i].sp=pick(['row','col','bomb']);B.g[i].sc=0});await tween(260,p=>spots.forEach(i=>{if(B.g[i])B.g[i].sc=easeBack(p)}));break}
    case'royal':heroShot(h,h.atk*7,{big:true});B.heroes.forEach(o=>{if(o.dead)return;const v=Math.round(o.maxHp*.15);o.hp=Math.min(o.maxHp,o.hp+v);floatText(...heroPos(o),'+'+v,'#7dffb0',20)});SFX.heal();break;
  }
  await waitShots();
  if(!(await waveCheck())){B.busy=false;B.idleT=performance.now();findHint()}
}

/* ---- waves, winning and losing ---- */
async function waveCheck(){
  if(B.over)return true;
  if(B.enemies.some(e=>!e.dead))return false;
  B.busy=true;await sleep(450);
  if(B.endless){
    B.endWave=B.wave;bump('waves');addCoins(20+B.wave*6);
    B.heroes.forEach(h=>{if(!h.dead)h.hp=Math.min(h.maxHp,h.hp+Math.round(h.maxHp*.15))});
    toast(L(`♾️ Wave ${B.wave} cleared! Your heroes rest a little.`,`♾️ Bølge ${B.wave} klaret! Dine helte hviler lidt.`));
    await nextWave();return true;
  }
  if(B.wave<B.waves.length){await nextWave();return true}
  await winBattle();return true;
}

/* ---- little effects on the stage ---- */
let SP=[];
function floatText(x,y,txt,col,size){if(!B)return;B.floats.push({x,y,txt,col,size:size||20,t:0})}
function sparkleStage(x,y,col,n){for(let i=0;i<n&&SP.length<500;i++){const a=Math.random()*6.3,sp=60+Math.random()*220;SP.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,r:2+Math.random()*4,c:col,l:.5+Math.random()*.4})}}
function popFx(x,y,col){sparkleStage(x,y,col,5)}
function beamFx(x1,y1,x2,y2){if(B)B.beams=(B.beams||[]).concat([{x1,y1,x2,y2,t:0}])}
function boomFx(i){const[x,y]=XY(i);if(B)B.rings=(B.rings||[]).concat([{x:BX+x*CELL+CELL/2,y:BY+y*CELL+CELL/2,t:0,col:'#ffd54a'}])}
function cloudFx(i){const[x,y]=XY(i);if(B)B.rings=(B.rings||[]).concat([{x:BX+x*CELL+CELL/2,y:BY+y*CELL+CELL/2,t:0,col:'#fff',big:1}]);SFX.spec()}

/* ---- drawing the battle ---- */
function drawStage(dt){
  const g=ctx,t=performance.now()/1000;
  g.save();
  if(B.shake>0){g.translate((Math.random()-.5)*B.shake*10,(Math.random()-.5)*B.shake*10);B.shake=Math.max(0,B.shake-dt*2.5)}
  // sky + candy hills behind the monsters
  let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2a1259');gr.addColorStop(.3,'#5a2aa8');gr.addColorStop(.31,'#3a1a86');gr.addColorStop(1,'#1b0b45');
  g.fillStyle=gr;g.fillRect(-20,-20,W+40,H+40);
  for(let k=0;k<26;k++){const sx=(k*137.5)%W,sy=(k*61.3)%(EH*.6);g.globalAlpha=.25+.25*Math.sin(t*1.5+k);g.fillStyle='#fff';g.beginPath();g.arc(sx,sy,1.3+(k%3)*.5,0,7);g.fill()}
  g.globalAlpha=1;
  const hill=(yy,col,amp,ph)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,EH);for(let x=0;x<=W;x+=12)g.lineTo(x,yy+Math.sin(x/70+ph)*amp);g.lineTo(W,EH);g.closePath();g.fill()};
  hill(EH*.72,'#7b3fd1',8,0);hill(EH*.84,'#ff7ac2',6,2);
  g.fillStyle='#e05aa8';g.fillRect(0,EH*.9,W,EH*.1+2);
  // monsters
  const alive=B.enemies.filter(e=>!e.dead).length;
  B.enemies.forEach((e,i)=>{
    e.flash=Math.max(0,e.flash-dt*4);e.shake=Math.max(0,e.shake-dt*3);if(e.attackT)e.attackT=Math.max(0,e.attackT-dt*2.5);
    if(e.dead)e.deadT+=dt;if(e.dead&&e.deadT>.7)return;
    const ey=e.y-(e.enter||0)*EH-(e.attackT?Math.sin(e.attackT*Math.PI)*-12:0);
    g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(e.x,EH*.86,e.sz*.36,e.sz*.07,0,0,7);g.fill();
    if(e.flash>0)g.filter=`brightness(${1+e.flash*1.2})`;
    drawMonster(g,e,e.x,ey,e.sz,{ph:e.ph||0});g.filter='none';
    if(e.frozen>0){g.globalAlpha=.35;g.fillStyle='#bfefff';g.beginPath();g.arc(e.x,ey,e.sz*.45,0,7);g.fill();g.globalAlpha=1;
      g.font=`${Math.round(e.sz*.22)}px sans-serif`;g.textAlign='center';g.fillText('❄️',e.x+e.sz*.3,ey-e.sz*.3)}
    if(e.dead)return;
    // target arrow
    if(alive>1&&B.enemies[B.target]===e){g.fillStyle='#ffd54a';g.strokeStyle='#2a1159';g.lineWidth=2;const ay=ey-e.sz*.6+Math.sin(t*5)*3;
      g.beginPath();g.moveTo(e.x,ay+10);g.lineTo(e.x-9,ay-4);g.lineTo(e.x+9,ay-4);g.closePath();g.fill();g.stroke()}
    // health bar + name
    const bw=Math.max(56,e.sz*.9),bx=e.x-bw/2,by=EH*.9;
    roundRect(g,bx,by,bw,11,6);g.fillStyle='#2a1159';g.fill();
    const p=e.hp/e.maxHp;if(p>0){roundRect(g,bx+2,by+2,(bw-4)*p,7,4);g.fillStyle=p>.5?'#4ee07c':p>.25?'#ffc53a':'#ff4d5e';g.fill()}
    g.font=`900 ${Math.max(9,Math.min(12,bw/8))}px Nunito,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';
    g.fillText(N(e.hp)+'/'+N(e.maxHp),e.x,by+5.5);
    // attack countdown
    const cx=e.x+e.sz*.4,cy=ey-e.sz*.32,danger=e.cdLeft<=1;
    g.beginPath();g.arc(cx,cy,12,0,7);g.fillStyle=danger?'#ff3b4e':'#2a1159';g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();
    g.fillStyle='#fff';g.font='900 13px Nunito,sans-serif';g.fillText(e.cdLeft,cx,cy+1);
    if(e.boss){g.font=`900 11px Nunito,sans-serif`;g.fillStyle='#ffd54a';g.strokeStyle='#2a1159';g.lineWidth=3;g.strokeText(nm(e.def),e.x,by-8);g.fillText(nm(e.def),e.x,by-8)}
  });
  // board frame + sockets
  const bw=CELL*COLS,bh=CELL*ROWS;
  roundRect(g,BX-8,BY-8,bw+16,bh+16,18);gr=g.createLinearGradient(0,BY,0,BY+bh);gr.addColorStop(0,'#2c4fc9');gr.addColorStop(1,'#1a2c86');g.fillStyle=gr;g.fill();
  g.lineWidth=4;g.strokeStyle='#9fb6ff';g.stroke();
  for(let i=0;i<COLS*ROWS;i++){const[x,y]=XY(i);g.fillStyle=(x+y)%2?'rgba(10,20,70,.45)':'rgba(10,20,70,.3)';
    g.beginPath();g.arc(BX+x*CELL+CELL/2,BY+y*CELL+CELL/2,CELL*.44,0,7);g.fill()}
  // hint after a while
  const idle=!B.busy&&performance.now()-B.idleT>6000;
  if(idle&&B.hint){B.hint.forEach(i=>{const[x,y]=XY(i);g.globalAlpha=.35+.3*Math.sin(t*6);g.fillStyle='#fff';g.beginPath();g.arc(BX+x*CELL+CELL/2,BY+y*CELL+CELL/2,CELL*.47,0,7);g.fill()});g.globalAlpha=1}
  if(B.sel!=null){const[x,y]=XY(B.sel);g.strokeStyle='#ffd54a';g.lineWidth=4;g.shadowColor='#ffd54a';g.shadowBlur=12;
    roundRect(g,BX+x*CELL+3,BY+y*CELL+3,CELL-6,CELL-6,12);g.stroke();g.shadowBlur=0}
  g.save();g.beginPath();g.rect(BX-8,BY-8,bw+16,bh+16);g.clip();
  B.g.forEach((c,i)=>{if(!c)return;const[x,y]=XY(i),cx=BX+x*CELL+CELL/2+(c.dx||0),cy=BY+y*CELL+CELL/2+(c.dy||0);
    let sc=c.sc==null?1:c.sc;if(B.sel===i)sc*=1.08+.04*Math.sin(t*8);if(sc<=.01)return;
    if(c.sp==='cloud'){drawSpecial(g,'cloud',c.c,cx,cy,CELL,sc);return}
    const spr=candySprite(c.c,CELL),s2=CELL*1.3*sc;g.drawImage(spr,cx-s2/2,cy-s2/2,s2,s2);
    if(c.sp)drawSpecial(g,c.sp,c.c,cx,cy,CELL,sc)});
  g.restore();
  // tool hint
  if(B.tool==='hammer'){g.fillStyle='rgba(255,213,74,.95)';g.font='900 13px Nunito,sans-serif';g.textAlign='center';g.fillText('🔨 '+L('Tap a candy to smash it','Tryk på et slik for at smadre det'),W/2,BY-14)}
  // heroes
  g.fillStyle='rgba(20,8,48,.55)';g.fillRect(0,HY,W,HH);
  B.heroes.forEach((h,i)=>{
    const s=heroSlot(i),col=PIECES[h.def.c].c,ready=!h.dead&&h.charge>=h.chMax;
    h.flash=Math.max(0,h.flash-dt*3);h.hurt=Math.max(0,h.hurt-dt*2);h.atkT=Math.max(0,(h.atkT||0)-dt*3);
    roundRect(g,s.x,s.y,s.w,s.h,14);
    gr=g.createLinearGradient(0,s.y,0,s.y+s.h);gr.addColorStop(0,h.dead?'#555':shade(col,.15));gr.addColorStop(1,h.dead?'#333':shade(col,-.45));g.fillStyle=gr;g.fill();
    g.lineWidth=ready?4:3;g.strokeStyle=ready?'#ffd54a':'#2a1159';if(ready){g.shadowColor='#ffd54a';g.shadowBlur=14+6*Math.sin(t*6)}g.stroke();g.shadowBlur=0;
    if(h.flash>0){g.globalAlpha=h.flash*.5;g.fillStyle='#ff3b4e';g.fill();g.globalAlpha=1}
    const hs=Math.min(s.w*.8,s.h*.62);
    drawHero(g,h.def,s.x+s.w/2+(h.hurt?Math.sin(t*50)*3:0),s.y+hs*.5+2-Math.sin((h.atkT||0)*Math.PI)*hs*.22,hs,{dead:h.dead,ph:h.ph});
    if(h.shield>0){g.globalAlpha=.3+.1*Math.sin(t*4);g.strokeStyle='#9be7ff';g.lineWidth=3;g.beginPath();g.arc(s.x+s.w/2,s.y+hs*.5+2,hs*.48,0,7);g.stroke();g.globalAlpha=1}
    // bars
    const bx=s.x+5,bw2=s.w-10;let by=s.y+s.h-27;
    roundRect(g,bx,by,bw2,11,5);g.fillStyle='#2a1159';g.fill();
    if(h.hp>0){roundRect(g,bx+1.5,by+1.5,(bw2-3)*h.hp/h.maxHp,8,4);g.fillStyle=h.hp/h.maxHp>.35?'#4ee07c':'#ff4d5e';g.fill()}
    if(h.shield>0){roundRect(g,bx+1.5,by+1.5,Math.min(1,h.shield/h.maxHp)*(bw2-3),3,2);g.fillStyle='#9be7ff';g.fill()}
    g.fillStyle='#fff';g.font=`900 ${s.w<80?8.5:10}px Nunito,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(h.dead?'💀':Math.ceil(h.hp)+'/'+h.maxHp,s.x+s.w/2,by+6);
    by+=13;roundRect(g,bx,by,bw2,11,5);g.fillStyle='#2a1159';g.fill();
    if(h.charge>0){roundRect(g,bx+1.5,by+1.5,(bw2-3)*Math.min(1,h.charge/h.chMax),8,4);g.fillStyle=ready?'#ffd54a':col;g.fill()}
    if(!h.dead){g.fillStyle='#fff';g.font=`900 ${s.w<80?8:9.5}px Nunito,sans-serif`;g.textAlign='center';g.fillText('⚡'+Math.min(h.charge,h.chMax)+'/'+h.chMax,s.x+s.w/2,by+6)}
    // armour + level
    g.font='900 10px Nunito,sans-serif';g.textAlign='left';g.fillStyle='#fff';g.fillText('🛡️'+h.arm,s.x+4,s.y+10);
    g.textAlign='right';g.fillText('Lv'+h.lvl,s.x+s.w-4,s.y+10);
    {const cs=Math.min(22,s.w*.24);g.drawImage(candySprite(h.def.c,cs),s.x+1,s.y+16,cs*1.3,cs*1.3)}
    if(ready){g.textAlign='center';g.font=`900 ${s.w<80?10:12}px Nunito,sans-serif`;g.fillStyle='#ffd54a';g.strokeStyle='#2a1159';g.lineWidth=3;
      const tx=ABIL[h.def.ab][0]+' '+L('TAP!','TRYK!');g.strokeText(tx,s.x+s.w/2,s.y+s.h*.5);g.fillText(tx,s.x+s.w/2,s.y+s.h*.5)}
  });
  for(let i=B.heroes.length;i<4;i++){const s=heroSlot(i);roundRect(g,s.x,s.y,s.w,s.h,14);g.setLineDash([6,6]);g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=2;g.stroke();g.setLineDash([])}
  // beams + rings
  (B.beams||[]).forEach(b=>{b.t+=dt*3;g.globalAlpha=Math.max(0,1-b.t);g.strokeStyle='#fff';g.lineWidth=CELL*.5*(1-b.t);g.shadowColor='#fff';g.shadowBlur=20;
    g.beginPath();g.moveTo(b.x1,b.y1);g.lineTo(b.x2,b.y2);g.stroke();g.shadowBlur=0});
  B.beams=(B.beams||[]).filter(b=>b.t<1);
  (B.rings||[]).forEach(r=>{r.t+=dt*2.5;g.globalAlpha=Math.max(0,1-r.t);g.strokeStyle=r.col;g.lineWidth=6;g.beginPath();g.arc(r.x,r.y,CELL*(r.big?4:1.6)*r.t,0,7);g.stroke()});
  B.rings=(B.rings||[]).filter(r=>r.t<1);g.globalAlpha=1;
  // shots
  for(let k=B.proj.length-1;k>=0;k--){const p=B.proj[k];p.t+=dt/p.dur;
    const to=p.kind==='enemy'?heroPos(p.to):[p.to.x,p.to.y],q=Math.min(1,p.t),e=p.kind==='enemy'?q*q:easeOut(q);
    const x=p.from[0]+(to[0]-p.from[0])*e,y=p.from[1]+(to[1]-p.from[1])*e-Math.sin(q*Math.PI)*(p.kind==='enemy'?30:60);
    if(p.kind==='enemy'){const w=WEAPONS[p.wpn]||WEAPONS.drop,r=6+p.tier*1.5;
      g.fillStyle=w.col;g.shadowColor=w.col;g.shadowBlur=10+p.tier*3;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.shadowBlur=0;
      if(Math.random()<.6)SP.push({x,y,vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40,r:2+p.tier*.6,c:w.col,l:.3})}
    else if(p.kind==='spark'){g.fillStyle='#fff';g.shadowColor='#fff';g.shadowBlur=12;star(g,x,y,8,3.5);g.fill();g.shadowBlur=0}
    else{const c=PIECES[p.col].c,r=p.big?11:6.5;g.fillStyle=c;g.shadowColor=c;g.shadowBlur=14;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.shadowBlur=0;
      g.fillStyle='rgba(255,255,255,.8)';g.beginPath();g.arc(x-r*.3,y-r*.3,r*.35,0,7);g.fill();
      if(Math.random()<.5)SP.push({x,y,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,r:2,c,l:.3})}
    if(p.t>=1){B.proj.splice(k,1);landShot(p);p.res()}}
  // sparks + floating numbers
  for(let k=SP.length-1;k>=0;k--){const p=SP[k];p.l-=dt;if(p.l<=0){SP.splice(k,1);continue}
    p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;g.globalAlpha=Math.min(1,p.l*2.5);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}
  g.globalAlpha=1;g.textAlign='center';g.textBaseline='middle';
  for(let k=B.floats.length-1;k>=0;k--){const f=B.floats[k];f.t+=dt;if(f.t>1){B.floats.splice(k,1);continue}
    g.globalAlpha=Math.min(1,(1-f.t)*2.5);g.font=`900 ${f.size}px 'Lilita One',Nunito,sans-serif`;g.lineWidth=4;g.strokeStyle='#2a1159';
    const fy=f.y-f.t*40;g.strokeText(f.txt,f.x,fy);g.fillStyle=f.col;g.fillText(f.txt,f.x,fy)}
  g.globalAlpha=1;g.restore();
}

/* ---- input: tap one candy, then the one next to it (or just drag) ---- */
function cellAt(px,py){const x=Math.floor((px-BX)/CELL),y=Math.floor((py-BY)/CELL);return x>=0&&y>=0&&x<COLS&&y<ROWS?y*COLS+x:-1}
function evPos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{
  if(!B||B.over)return;const[px,py]=evPos(e);
  if(py<EH){ // pick which monster to attack
    let best=-1,bd=1e9;B.enemies.forEach((m,i)=>{if(m.dead)return;const d=Math.abs(m.x-px);if(d<bd){bd=d;best=i}});
    if(best>=0&&best!==B.target){B.target=best;SFX.pick()}return}
  if(py>=HY){const i=B.heroes.findIndex((h,k)=>{const s=heroSlot(k);return px>=s.x&&px<=s.x+s.w});
    const h=B.heroes[i];if(!h)return;
    if(!h.dead&&h.charge>=h.chMax){useSkill(h);return}
    const ab=ABIL[h.def.ab];toast(`${ab[0]} <b>${nm(h.def)}</b>: ${L(ab[3],ab[4])}<br><small>${L(`Charges from ${nm(PIECES[h.def.c])} candies (${h.charge}/${h.chMax}).`,`Lader op af ${nm(PIECES[h.def.c]).toLowerCase()} (${h.charge}/${h.chMax}).`)}</small>`,3000);return}
  if(B.busy)return;
  const i=cellAt(px,py);if(i<0){B.sel=null;return}
  if(B.tool==='hammer'){useHammer(i);return}
  B.idleT=performance.now();
  if(B.sel!=null&&B.sel!==i&&adjacent(B.sel,i)){trySwap(B.sel,i);return}
  if(B.sel===i){B.sel=null;return}
  B.sel=i;SFX.pick();B.drag={i,x:px,y:py};
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!B||!B.drag||B.busy)return;const[px,py]=evPos(e),dx=px-B.drag.x,dy=py-B.drag.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<CELL*.38)return;
  const[x,y]=XY(B.drag.i);let nx=x,ny=y;if(Math.abs(dx)>Math.abs(dy))nx+=Math.sign(dx);else ny+=Math.sign(dy);
  const from=B.drag.i;B.drag=null;
  if(nx>=0&&ny>=0&&nx<COLS&&ny<ROWS)trySwap(from,ny*COLS+nx);
});
addEventListener('pointerup',()=>{if(B)B.drag=null});

/* ---- boosters ---- */
async function useHammer(i){
  if(!(S.items.hammer>0)){B.tool=null;bhead();return}
  S.items.hammer--;save();B.tool=null;B.busy=true;B.sel=null;bhead();SFX.hit();
  B.last=[i];B.combo=1;await clearSet(new Set([i]),[]);await gravity();await resolve(null);
  await waitShots();if(await waveCheck())return;
  B.busy=false;B.idleT=performance.now();findHint();
}
$('#bHammer').onclick=()=>{if(!B||B.over||B.busy)return;SFX.click();B.tool=B.tool==='hammer'?null:'hammer';bhead()};
$('#bShuffle').onclick=()=>{if(!B||B.over||B.busy||!(S.items.shuffle>0))return;S.items.shuffle--;save();SFX.swap();B.sel=null;reshuffle();findHint();bhead();toast('🔀 '+L('Shuffled!','Blandet!'))};
$('#bPotion').onclick=()=>{if(!B||B.over||B.busy||!(S.items.potion>0))return;S.items.potion--;save();SFX.heal();
  B.heroes.forEach(h=>{if(h.dead){h.dead=false;h.hp=Math.round(h.maxHp*.3)}else h.hp=Math.min(h.maxHp,h.hp+Math.round(h.maxHp*.4));floatText(...heroPos(h),'💖','#7dffb0',24)});bhead()};
$('#gQuit').onclick=async()=>{if(!B||B.over)return;SFX.click();
  const v=await panel({title:'⏸ '+L('Paused','Pause'),sm:true,html:`<p style="text-align:center">${L('Leave this battle? The level starts over next time.','Forlad kampen? Banen starter forfra næste gang.')}</p>`,
    buttons:[{label:'🏳️ '+L('Give up','Giv op'),v:'quit',cls:'pink'},{label:'▶ '+L('Keep playing','Spil videre'),v:'go',cls:'go'}]});
  if(v==='quit'&&B&&!B.over){B.over=true;MUSIC.battle=false;if(B.endless){const w=B.wave-1;if(w>S.bestWave)S.bestWave=w;save();show('scMenu')}else openMap()}};

function lvlDesc(n){const lv=genLevel(n),last=lv.waves[lv.waves.length-1];
  if(lv.boss){const b=last.find(e=>e.boss);return'👑 '+nm(b.def)}
  const kinds=[...new Set(lv.waves.flat().map(e=>nm(e.def)))];
  return(lv.waves.length>1?L(`${lv.waves.length} waves · `,`${lv.waves.length} bølger · `):'')+kinds.slice(0,2).join(', ')+(kinds.length>2?'…':'')}
const CHAP=[['Gummy Meadow','Vingummi-engen'],['Licorice Woods','Lakridsskoven'],['Toast Canyon','Toastkløften'],['Broccoli Keep','Broccoliborgen'],['Chili Volcano','Chilivulkanen'],
  ['Onion Swamp','Løgsumpen'],['Carrot Fortress','Gulerodsfæstningen'],['Lemon Desert','Citronørkenen'],['Gumball Factory','Tyggegummifabrikken'],["Dragon's Sugar Peak","Dragens Sukkertop"]];
function openMap(){
  show('scMap');
  const top=Math.max(CAMPAIGN,S.maxLevel+4),cur=S.maxLevel;let html='';
  for(let n=1;n<=top;n++){
    if((n-1)%10===0){const c=Math.floor((n-1)/10);html+=`<div class="chapter">${n>CAMPAIGN?'🌌 '+L('Beyond','Hinsides')+' '+(c-9):'📍 '+L(...CHAP[c]).replace(/^/,(c+1)+'. ')}</div>`}
    const lock=n>cur,boss=n%10===0,st=S.stars[n]||0,done=n<cur;
    html+=`<div class="node ${lock?'lock':''} ${n===cur?'cur':''} ${boss?'boss':''} ${done?'done':''}" data-n="${n}">
      <span class="n">${lock?'🔒':n}</span><span class="tx"><b>${boss?'👑 ':''}${L('Level ','Bane ')+n}</b><small>${lock?L('Win the level before to unlock','Vind banen før for at låse op'):esc(lvlDesc(n))}</small></span>
      <span class="stars">${done?[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">⭐</span>`).join(''):n===cur?'▶':''}</span></div>`;
  }
  // column-reverse puts level 1 at the bottom, so add the chapter labels after their nodes
  const path=$('#path');path.innerHTML='';
  const tmp=document.createElement('div');tmp.innerHTML=html;
  let group=[];[...tmp.children].forEach(el=>{if(el.classList.contains('chapter')){flush();group=[el]}else group.push(el)});flush();
  function flush(){if(!group.length)return;const[h,...rest]=group;rest.forEach(x=>path.appendChild(x));path.appendChild(h);group=[]}
  $$('.node',path).forEach(el=>el.onclick=()=>{const n=+el.dataset.n;if(n>cur){SFX.no();toast(L('🔒 Locked – win the level before first.','🔒 Låst – vind banen før først.'));return}SFX.click();preBattle(n)});
  const c=$('.node.cur',path);if(c)setTimeout(()=>c.scrollIntoView({block:'center'}),30);
}
async function preBattle(n){
  const lv=genLevel(n),tier=tierFor(n);
  if(!$('#scMap').classList.contains('on'))openMap();
  const kinds={};lv.waves.flat().forEach(e=>{const k=e.def.id;kinds[k]=kinds[k]||{e,c:0};kinds[k].c++});
  const v=await panel({title:(lv.boss?'👑 ':'⚔️ ')+L('Level ','Bane ')+n,
    html:`<p class="hint" style="margin-top:0">${lv.waves.length>1?L(`${lv.waves.length} waves of monsters.`,`${lv.waves.length} bølger med monstre.`):L('One wave of monsters.','Én bølge med monstre.')}
      ${tier?' '+L(`Their weapons are <b>${TIER_N[tier][0].trim()}</b> now!`,`Deres våben er <b>${TIER_N[tier][1].replace(/-$/,'').trim()}</b> nu!`):''}</p>
      ${Object.values(kinds).map(({e,c})=>`<div class="task"><span class="ic">${e.boss?'👑':'👾'}</span><span class="tx"><b>${c>1?c+'× ':''}${esc(nm(e.def))}</b>
        <small>❤️ ${N(e.maxHp)} · ⚔️ ${e.atk} · ⏱️ ${L('attacks every','angriber hver')} ${e.cd} ${L('turns','tur')} · ${TIER_N[e.tier][LANG==='da'?1:0]}${nm(WEAPONS[e.def.wpn])}${e.boss?' · '+L('hits all heroes','rammer alle helte'):''}</small></span></div>`).join('')}
      <p style="margin:10px 0 4px"><b>${L('Your team','Dit hold')}</b></p><div class="teambar" id="pbTeam"></div>`,
    render:b=>drawTeam($('#pbTeam',b)),
    buttons:[{label:'🥔 '+L('Heroes','Helte'),v:'heroes',cls:'sun'},{label:'⚔️ '+L('Fight!','Kæmp!'),v:'go',cls:'go'}]});
  if(v==='go'){if(!S.team.length){toast(L('Pick at least one hero!','Vælg mindst én helt!'));return openHeroes()}startBattle(lv)}
  else if(v==='heroes'){await openHeroes();preBattle(n)}
}

      drawTeam($('#hTeam',b));

            S.coins-=d.price;S.heroes[d.id]={lvl:1};S.cnt.heroes=Object.keys(S.heroes).length;if(S.team.length<4)S.team.push(d.id);

        }else{
          if(lvl<HERO_MAX)btn(`⬆️ 🪙 ${N(cost)}`,'sun',()=>{if(S.coins<cost){SFX.no();toast(L('Not enough coins','Ikke nok mønter'));return}

          else btn('MAX','',null,true);
          if(inTeam)btn(L('Remove from team','Fjern fra hold'),'',()=>{if(S.team.length<=1){SFX.no();toast(L('You need at least one hero.','Du skal have mindst én helt.'));return}

    ['📋 Daily missions, 📜 quests, 🏆 trophies and your own player level.','📋 Daglige missioner, 📜 opgaver, 🏆 trofæer og dit eget spillerlevel.']]}
];
$('#mLog').onclick=()=>{SFX.click();openLog()};
function openLog(){
  S.seenLog=CHANGELOG[0].v;save();hud();
  return panel({title:'📖 '+L("What's new","Nyheder"),html:CHANGELOG.map((c,k)=>`<div class="task" style="display:block"><b>v${c.v} – ${L(c.t[0],c.t[1])}</b>
    <small class="hint">${L(c.d[0],c.d[1])}${k===0?' · <span style="color:#d64f99">'+L('NEW','NYT')+'</span>':''}</small>
    <ul style="margin:6px 0 0;padding-left:20px;font-size:13.5px;line-height:1.5">${c.i.map(x=>`<li>${L(x[0],x[1])}</li>`).join('')}</ul></div>`).join('')});
}
$('#mDisc').onclick=()=>{SFX.click();open('https://discord.gg/kZa6F4s5f9','_blank','noopener')};

/* ---- language + sound ---- */
const STATIC=[
  ['#mPlayT','Campaign','Kampagne'],['#mHeroT','Heroes','Helte'],['#mEndT','Endless battle','Endeløs kamp'],
  ['#mMisT','Missions','Missioner'],['#mQueT','Quests','Opgaver'],['#mShopT','Shop','Butik'],['#mHelpT','How to play','Sådan spiller du'],
  ['#mTroT','Trophies','Trofæer'],['#mStatsT','Stats','Statistik'],['#mLogT',"What's new",'Nyheder'],
  ['#mapBackT','Menu','Menu'],['#mapHeroT','Heroes','Helte'],
  ['#heroTxt','Swap candies so your potato heroes fight the sour monsters!','Byt slik, så dine kartoffelhelte kæmper mod de sure monstre!']
];
function applyLang(){
  document.documentElement.lang=LANG;
  STATIC.forEach(([sel,en,da])=>{const el=$(sel);if(el)el.textContent=L(en,da)});
  $('#langBtn').textContent=LANG==='da'?'🇬🇧':'🇩🇰';$('#langBtn').title=LANG==='da'?'English':'Dansk';
  $('#bHammer').title=L('Hammer','Hammer');$('#bShuffle').title=L('Shuffle','Bland');$('#bPotion').title=L('Potion','Trylledrik');
  if($('#scMap').classList.contains('on'))openMap();
  if(B&&!B.over)bhead();
  hud();
}
$('#langBtn').onclick=()=>{LANG=LANG==='da'?'en':'da';try{localStorage.setItem(LANG_KEY,LANG)}catch(e){}
  SFX.click();closePanels();$('#toasts').innerHTML='';applyLang()};
$('#sndBtn').onclick=()=>{SFX.on=!SFX.on;$('#sndBtn').textContent=SFX.on?'🔊':'🔇';
  try{localStorage.setItem('potato_floss_snd',SFX.on?'1':'0')}catch(e){}if(SFX.on)SFX.click()};
$('#musBtn').onclick=()=>{MUSIC.set(!MUSIC.on);$('#musBtn').textContent=MUSIC.on?'🎵':'🔈';
  $('#musBtn').style.opacity=MUSIC.on?1:.55;SFX.click()};
addEventListener('pointerdown',()=>{if(MUSIC.on)MUSIC.start()},{once:true});

/* ---- main loop ---- */
let lastT=performance.now(),artT=0;
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  fxTick(dt);
  if(B&&$('#scGame').classList.contains('on')&&W)drawStage(dt);
  if($('#scMenu').classList.contains('on')&&now-artT>33){artT=now;drawMenuArt()}
  requestAnimationFrame(loop);
}

/* =====================================================================
   BOOT
   ===================================================================== */
const TIPS=[
  ['Tip: match the colour of a hero to make them attack and charge their skill.','Tip: match en helts farve for at få den til at angribe og lade sin evne op.'],
  ['Tip: tap a monster to choose who your heroes attack.','Tip: tryk på et monster for at vælge, hvem dine helte angriber.'],
  ['Tip: the red number on a monster shows when it attacks next.','Tip: det røde tal på et monster viser, hvornår det angriber næste gang.'],
  ['Tip: upgrade your heroes between levels in the hero shop.','Tip: opgradér dine helte mellem banerne i heltebutikken.'],
  ['Tip: Mint Guard has lots of armour – great against bosses.','Tip: Mintvagten har masser af rustning – god mod bosser.']
];
async function boot(){
  load();ensureDaily();fillQuests();
  if(!S.team.length)S.team=Object.keys(S.heroes).slice(0,4);
  S.cnt.heroes=Object.keys(S.heroes).length;
  try{SFX.on=localStorage.getItem('potato_floss_snd')!=='0';MUSIC.on=localStorage.getItem('potato_floss_mus')!=='0'}catch(e){}
  $('#sndBtn').textContent=SFX.on?'🔊':'🔇';
  $('#musBtn').textContent=MUSIC.on?'🎵':'🔈';$('#musBtn').style.opacity=MUSIC.on?1:.55;
  applyLang();hud();requestAnimationFrame(loop);
  const tip=pick(TIPS);$('#ldTip').textContent=L(tip[0],tip[1]);
  const bar=$('#ldBar'),t0=performance.now(),until=ms=>sleep(Math.max(0,ms-(performance.now()-t0)));
  const step=(p,txt)=>{bar.style.width=p+'%';$('#ldTxt').textContent=txt};
  step(15,L('Waking up the potato heroes…','Vækker kartoffelheltene…'));
  await until(1800);step(45,L('Polishing the candies…','Polerer slikket…'));
  await until(3800);step(70,L('Sharpening sour weapons…','Sliber de sure våben…'));
  await until(5800);step(92,L('Lining up the monsters…','Stiller monstrene op…'));
  await until(7400);step(100,L('Ready!','Klar!'));
  await until(8000);
  const ld=$('#load');ld.classList.add('out');setTimeout(()=>ld.remove(),500);
  if(S.newV2){S.newV2=false;save();setTimeout(()=>panel({title:'🎉 '+L('Candy Floss 2.0!','Candy Floss 2.0!'),sm:true,
    html:`<p>${L('The game has become a candy battle! Your coins and player level came along – plus 300 bonus coins to buy your first new hero.','Spillet er blevet til en slikkamp! Dine mønter og dit spillerlevel er med – plus 300 bonusmønter til at købe din første nye helt.')}</p>`,
    buttons:[{label:'📖 '+L("What's new","Nyheder"),cls:'go'}]}).then(v=>{if(v)openLog()}),600)}
  else if(S.seenLog!==CHANGELOG[0].v)setTimeout(openLog,600);
}
boot();

</script>

<script>
'use strict';
/* =====================================================================
   POTATO CANDY FLOSS  –  a match-3 where you TWIST four candies at a
   time instead of swapping two. Endless generated levels, an endless
   mode, missions, quests, boosters, trophies and a player level.
   Everything lives in this one file and saves to localStorage.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e4?(n/1e3).toFixed(0)+'K':n>=1000?(n/1000).toFixed(1)+'K':''+Math.floor(n);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// a seeded random so every player gets the very same level 37
const seeded=s=>{let a=s*1664525+1013904223>>>0;return()=>{a^=a<<13;a>>>=0;a^=a>>17;a^=a<<5;a>>>=0;return a/4294967296}};

/* ---------------- language ---------------- */
const LANG_KEY='potato_floss_lang';
let LANG=(()=>{try{const v=localStorage.getItem(LANG_KEY);if(v)return v}catch(e){}
  return(navigator.language||'').toLowerCase().startsWith('da')?'da':'en'})();
const L=(en,da)=>LANG==='da'?da:en;
const nm=o=>L(o.en,o.da);

/* ---------------- sound ---------------- */
let AC=null;
const SFX={
  on:true,
  tone(f,d,t,v,slide,delay){if(!this.on)return;try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=t||'sine';o.frequency.setValueAtTime(f,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t0+d);
    g.gain.setValueAtTime(v||.07,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.03);
  }catch(e){}},
  click(){this.tone(620,.05,'triangle',.05)},
  twist(){this.tone(380,.12,'triangle',.05,2.2)},
  no(){this.tone(170,.14,'sawtooth',.05,.6)},
  pop(n){this.tone(520+Math.min(8,n||0)*70,.09,'sine',.07,1.6)},
  coin(){this.tone(900,.07,'square',.045);this.tone(1300,.1,'square',.04,1,.06)},
  spec(){[500,700,900,1200].forEach((f,i)=>this.tone(f,.1,'triangle',.05,1,i*.05))},
  win(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.2,'triangle',.06,1,i*.11))},
  lose(){[400,330,260].forEach((f,i)=>this.tone(f,.22,'sawtooth',.05,.7,i*.13))},
  floss(){[300,500,800,1100,1500].forEach((f,i)=>this.tone(f,.14,'sine',.05,1.3,i*.05))},
  land(){this.tone(130+rnd(40),.09,'sine',.045,.7)},
  star(){[784,1047,1319].forEach((f,i)=>this.tone(f,.26,'triangle',.06,1,i*.08))},
  glaze(){this.tone(1500,.07,'triangle',.035);this.tone(2100,.09,'sine',.03,1,.04)}
};

/* ---------------- cosy background music ----------------
   A slow, soft loop built in the browser: a warm pad, a gentle bass and
   a few sparkly notes from a pentatonic scale. No files to download. */
const MUSIC={
  on:true,id:null,bus:null,next:0,step:0,
  CH:[[131,[262,311,392]],[110,[220,262,330]],[87.3,[175,220,262]],[98,[196,247,294]]],
  SCALE:[523,587,659,784,880,1047],
  ensure(){
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    if(!this.bus){this.bus=AC.createGain();this.bus.gain.value=0;this.bus.connect(AC.destination)}
  },
  note(f,t,dur,vol,type,pan){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*.25);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(this.bus);o.start(t);o.stop(t+dur+.05);
  },
  tick(){
    if(!this.on)return;
    this.ensure();
    const beat=.52;                         // slow and calm
    while(this.next<AC.currentTime+.4){
      const t=Math.max(this.next,AC.currentTime+.02),s2=this.step,bar=Math.floor(s2/8)%4,[bass,chord]=this.CH[bar];
      if(s2%8===0){chord.forEach((f,i)=>this.note(f,t,beat*7,.016,'sine'));this.note(bass,t,beat*3.4,.03,'triangle')}
      if(s2%8===4)this.note(bass*1.5,t,beat*2.4,.018,'triangle');
      if(s2%2===0&&Math.random()<.55){const f=pick(this.SCALE);
        this.note(f,t,beat*1.5,.022,'sine');this.note(f*2,t+.14,beat*.9,.008,'sine')}
      this.next=t+beat;this.step++;
    }
  },
  start(){if(this.id)return;this.ensure();
    this.next=AC.currentTime+.1;
    this.bus.gain.cancelScheduledValues(AC.currentTime);
    this.bus.gain.setTargetAtTime(this.on?1:0,AC.currentTime,.8);
    this.id=setInterval(()=>this.tick(),120);this.tick()},
  set(v){this.on=v;try{localStorage.setItem('potato_floss_mus',v?'1':'0')}catch(e){}
    if(v){this.start()}else if(this.bus)this.bus.gain.setTargetAtTime(0,AC.currentTime,.4)}
};

/* ---------------- save ---------------- */
const KEY='potato_floss_v1';
function defState(){return{

let S=defState();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const today=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};

/* ---------------- tiny UI helpers ---------------- */
function toast(msg,ms){const el=document.createElement('div');el.className='toast';el.innerHTML=msg;$('#toasts').appendChild(el);
  const all=$('#toasts').children;while(all.length>3)all[0].remove();

function panel({title='',html='',buttons=[],sm,render,onClose,noX}){

}

/* confetti + sparkles on the fx canvas */
const fx=$('#fx'),fctx=fx.getContext('2d');let FP=[];
function fxSize(){const d=Math.min(2,devicePixelRatio||1);fx.width=innerWidth*d;fx.height=innerHeight*d;fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px';fctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fxSize);fxSize();
const CONF=['#ff7ec2','#ffcf4a','#7ddc6a','#6c8cff','#b07cff','#ff5a7a','#5fe3b0','#fff'];
function confetti(n=90){for(let i=0;i<n&&FP.length<700;i++)FP.push({k:'c',x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*7,c:pick(CONF),a:Math.random()*6,s:(Math.random()-.5)*.3,l:3})}
function sparkle(x,y,col,n=10){for(let i=0;i<n&&FP.length<700;i++){const a=Math.random()*6.3,sp=1+Math.random()*4;FP.push({k:'s',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,r:2+Math.random()*4,c:col||pick(CONF),l:.5+Math.random()*.4})}}
function floatTxt(x,y,t,c){FP.push({k:'t',x,y,vx:0,vy:-1.4,t,c:c||'#fff',l:1.1,r:20})}
function fxTick(dt){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=FP.length-1;i>=0;i--){const p=FP[i];p.l-=dt;if(p.l<=0){FP.splice(i,1);continue}
    const al=clamp(p.l*2,0,1);fctx.globalAlpha=al;
    if(p.k==='c'){p.vy+=.12;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.fillStyle=p.c;fctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66);fctx.restore()}
    else if(p.k==='s'){p.vy+=.18;p.x+=p.vx;p.y+=p.vy;fctx.fillStyle=p.c;fctx.beginPath();fctx.arc(p.x,p.y,p.r*al,0,7);fctx.fill()}
    else{p.y+=p.vy;fctx.font='900 '+p.r+'px Nunito,sans-serif';fctx.textAlign='center';fctx.lineWidth=4;fctx.strokeStyle='rgba(74,31,61,.85)';fctx.strokeText(p.t,p.x,p.y);fctx.fillStyle=p.c;fctx.fillText(p.t,p.x,p.y)}
  }
  fctx.globalAlpha=1;
}

/* ---------------- player level / coins ---------------- */
const xpFor=l=>Math.floor(60*Math.pow(l,1.35));
function addXP(n){if(!n)return;S.xp+=n;let up=false;
  while(S.xp>=xpFor(S.lvl)){S.xp-=xpFor(S.lvl);S.lvl++;up=true}
  if(up){const r=120+S.lvl*25;S.coins+=r;SFX.win();confetti(140);banner(L('LEVEL ','LEVEL ')+S.lvl+'!');toast(L(`🎉 You reached level ${S.lvl}! +${r} 🪙`,`🎉 Du nåede level ${S.lvl}! +${r} 🪙`),3200)}
  hud();save()}
function addCoins(n){if(!n)return;S.coins=Math.max(0,S.coins+n);if(n>0)S.cnt.coins+=n;hud();save()}

const OBJ_ICON={score:'🏆',color:null,glaze:'🧁',ing:'🥔',spec:'💥'};
function genLevel(n){
  const r=seeded(n*7919+13),d=Math.min(1,(n-1)/60); // d = how hard, 0..1
  const cols=n<4?7:(n<12?7:8),rows=n<4?7:8;
  const nc=n<6?4:n<16?5:6;                          // how many candy colours
  let moves=Math.round(28-8*d+(r()<.5?2:0));
  const base=Math.round(moves*200+n*60);    // about 20 good moves to reach 1 star
  const obj=[];
  const kinds=[];
  if(n>=3)kinds.push('color');
  if(n>=6)kinds.push('glaze');
  if(n>=10)kinds.push('ing');
  if(n>=16)kinds.push('spec');
  // every level has a score target; from level 3 it gets one or two extra jobs
  obj.push({t:'score',n:base});
  const want=n<3?0:n<20?1:(r()<.45?2:1);
  const used=[];
  for(let k=0;k<want&&kinds.length;k++){
    let t=kinds[Math.floor(r()*kinds.length)];let guard=6;
    while(used.includes(t)&&guard--)t=kinds[Math.floor(r()*kinds.length)];
    if(used.includes(t))break;used.push(t);
    if(t==='color')obj.push({t:'color',c:Math.floor(r()*nc),n:Math.round(moves*4.2/nc*(1+d*.25))});
    else if(t==='glaze')obj.push({t:'glaze',n:Math.round(moves*.38+2+r()*3)});
    else if(t==='ing'){obj.push({t:'ing',n:2+Math.round(d)});moves+=8}     // potatoes need time to fall
    else obj.push({t:'spec',n:Math.round(2+2*d)});
  }
  const glazeN=obj.some(o=>o.t==='glaze')?obj.find(o=>o.t==='glaze').n:Math.round(r()*6*d);
  return{n,cols,rows,nc,moves,obj,glazeN,double:n>=25&&r()<.4,seed:n*7919+13};
}
const starFor=(lv,score)=>{const t=lv.obj[0].n;return score>=t*2.1?3:score>=t*1.5?2:score>=t?1:0};

/* =====================================================================
   BOARD ENGINE
   ===================================================================== */
const cv=$('#board'),ctx=cv.getContext('2d');
let G=null;          // the running game
let CELL=48,OX=0,OY=0,DPR=1;

function newCell(nc,r){return{c:Math.floor((r||Math.random)()*nc),sp:null,glaze:0,ing:false,sc:1,dx:0,dy:0,rot:0,born:0}}
function makeBoard(lv,endless){
  const r=seeded(lv.seed||Date.now());
  const B={cols:lv.cols,rows:lv.rows,nc:lv.nc,g:[]};
  for(let y=0;y<B.rows;y++)for(let x=0;x<B.cols;x++)B.g[y*B.cols+x]=newCell(B.nc,r);
  // sticky sugar glaze on random tiles (needs a match on top of it to clean)
  let left=lv.glazeN||0,guard=400;
  while(left>0&&guard--){const i=Math.floor(r()*B.g.length);if(!B.g[i].glaze){B.g[i].glaze=lv.double&&r()<.4?2:1;left--}}
  // clear any matches that happened to be there at the start
  for(let k=0;k<60;k++){const m=findMatches(B);if(!m.all.size)break;m.all.forEach(i=>{B.g[i].c=Math.floor(r()*B.nc)})}
  return B;
}
const at=(B,x,y)=>(x<0||y<0||x>=B.cols||y>=B.rows)?null:B.g[y*B.cols+x];
const XY=(B,i)=>[i%B.cols,Math.floor(i/B.cols)];

// find every row/column of three or more of the same colour
function findMatches(B){
  const all=new Set(),runs=[];
  for(let y=0;y<B.rows;y++){let run=[];
    for(let x=0;x<=B.cols;x++){const c=at(B,x,y),prev=run.length?B.g[run[run.length-1]]:null;
      if(c&&!c.ing&&prev&&c.c===prev.c)run.push(y*B.cols+x);
      else{if(run.length>=3){runs.push({cells:[...run],dir:'h'});run.forEach(i=>all.add(i))}run=c&&!c.ing?[y*B.cols+x]:[]}}}
  for(let x=0;x<B.cols;x++){let run=[];
    for(let y=0;y<=B.rows;y++){const c=at(B,x,y),prev=run.length?B.g[run[run.length-1]]:null;
      if(c&&!c.ing&&prev&&c.c===prev.c)run.push(y*B.cols+x);
      else{if(run.length>=3){runs.push({cells:[...run],dir:'v'});run.forEach(i=>all.add(i))}run=c&&!c.ing?[x+y*B.cols]:[]}}}
  return{all,runs};
}
// which special (if any) a run should leave behind
function specFor(run,crossed){
  if(crossed)return'bomb';
  if(run.cells.length>=5)return'cloud';
  if(run.cells.length===4)return run.dir==='h'?'row':'col';
  return null;
}

/* =====================================================================
   RENDERING – bright, colourful candies
   ===================================================================== */
function layout(){
  const B=G&&G.B;if(!B)return;
  const w=$('#boardWrap').clientWidth-16,h=$('#boardWrap').clientHeight-16;
  CELL=Math.max(26,Math.floor(Math.min(w/B.cols,h/B.rows)));
  DPR=Math.min(2,devicePixelRatio||1);
  const pw=CELL*B.cols,ph=CELL*B.rows;
  cv.width=pw*DPR;cv.height=ph*DPR;cv.style.width=pw+'px';cv.style.height=ph+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
// every candy is a glossy ball with its own pattern on top
function candyBall(g,R,col){
  const gr=g.createRadialGradient(-R*.34,-R*.4,R*.08,0,0,R*1.15);
  gr.addColorStop(0,'#ffffff');gr.addColorStop(.22,shade(col,.45));gr.addColorStop(.62,col);gr.addColorStop(1,shade(col,-.45));
  g.fillStyle=gr;g.beginPath();g.arc(0,0,R,0,7);g.fill();
  g.strokeStyle=shade(col,-.55);g.lineWidth=Math.max(1.5,R*.09);g.stroke();
}
function candyGloss(g,R){
  g.save();g.globalAlpha=.75;g.fillStyle='#fff';
  g.beginPath();g.ellipse(-R*.32,-R*.44,R*.33,R*.2,-.5,0,7);g.fill();
  g.globalAlpha=.3;g.beginPath();g.ellipse(R*.3,R*.42,R*.26,R*.12,-.5,0,7);g.fill();g.restore();
}
function drawCandy(g,type,cx,cy,sz,rot,scale){
  const R=sz*.42,p=PIECES[type],col=p.c;
  g.save();g.translate(cx,cy);if(rot)g.rotate(rot);if(scale!=null)g.scale(scale,scale);
  candyBall(g,R,col);
  g.save();g.beginPath();g.arc(0,0,R*.97,0,7);g.clip();
  if(type===0){ // pink lollipop swirl
    g.strokeStyle='rgba(255,255,255,.92)';g.lineWidth=R*.2;g.lineCap='round';g.beginPath();
    for(let a=0;a<7.6;a+=.14){const rr=R*.12+a*R*.11;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.stroke();
  }else if(type===1){ // rose candy
    g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=R*.13;
    for(const k of[.3,.58,.86]){g.beginPath();g.arc(0,0,R*k,k*3,k*3+4.6);g.stroke()}
    g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.arc(0,0,R*.14,0,7);g.fill();
  }else if(type===2){ // caramel candy with a cross wrap
    g.strokeStyle='rgba(255,246,224,.9)';g.lineWidth=R*.2;g.lineCap='round';
    g.beginPath();g.moveTo(-R*.8,-R*.3);g.lineTo(R*.8,-R*.3);g.moveTo(-R*.8,R*.35);g.lineTo(R*.8,R*.35);g.stroke();
    g.strokeStyle=shade(col,-.35);g.lineWidth=R*.07;
    g.beginPath();g.moveTo(-R*.8,-R*.3);g.lineTo(R*.8,-R*.3);g.moveTo(-R*.8,R*.35);g.lineTo(R*.8,R*.35);g.stroke();
  }else if(type===3){ // dotted berry
    g.fillStyle=shade(col,-.4);
    for(let k=0;k<13;k++){const a=k*2.4,rr=R*(.2+.65*((k*37)%10)/10);g.beginPath();g.arc(Math.cos(a)*rr,Math.sin(a)*rr,R*.1,0,7);g.fill()}
  }else if(type===4){ // saturn candy with a ring
    g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=R*.19;
    g.beginPath();g.ellipse(0,R*.06,R*1.15,R*.3,-.22,0,7);g.stroke();
    g.strokeStyle=shade(col,-.35);g.lineWidth=R*.07;g.beginPath();g.ellipse(0,R*.06,R*1.15,R*.3,-.22,0,7);g.stroke();
  }else if(type===5){ // striped ball
    g.fillStyle='rgba(255,255,255,.9)';
    for(const o of[-.62,-.12,.38])g.fillRect(R*o,-R,R*.26,R*2);
  }else{ // star candy
    g.fillStyle='rgba(255,255,255,.95)';g.beginPath();
    for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?R*.3:R*.72;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}
    g.closePath();g.fill();
  }
  g.restore();candyGloss(g,R);g.restore();
}
function drawPiece(g,c,cx,cy,sz){
  drawCandy(g,c.c,cx,cy,sz,c.rot||0,c.sc==null?1:c.sc);
  const R=sz*.42,sp=c.sp;if(!sp)return;
  g.save();g.translate(cx,cy);g.scale(c.sc==null?1:c.sc,c.sc==null?1:c.sc);
  if(sp==='row'||sp==='col'){
    g.save();g.beginPath();g.arc(0,0,R*.97,0,7);g.clip();
    g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=R*.17;
    for(const o of[-R*.5,0,R*.5]){g.beginPath();if(sp==='row'){g.moveTo(-R,o);g.lineTo(R,o)}else{g.moveTo(o,-R);g.lineTo(o,R)}g.stroke()}
    g.restore();
    g.fillStyle='#fff';g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=R*.08;g.font=`900 ${Math.round(R*.95)}px Nunito,sans-serif`;
    g.textAlign='center';g.textBaseline='middle';g.strokeText(sp==='row'?'↔':'↕',0,0);g.fillText(sp==='row'?'↔':'↕',0,0);
  }
  if(sp==='bomb'){g.fillStyle='rgba(0,0,0,.72)';g.beginPath();g.arc(0,0,R*.66,0,7);g.fill();
    g.strokeStyle='#ffcf4a';g.lineWidth=R*.12;g.stroke();
    g.font=`${Math.round(R*.78)}px serif`;g.textAlign='center';g.textBaseline='middle';g.fillText('💥',0,R*.04)}
  if(sp==='cloud'){const t=performance.now()/340;g.rotate(t);
    for(let i=0;i<7;i++){g.rotate(Math.PI*2/7);g.fillStyle=PIECES[i].c;g.beginPath();g.arc(0,-R*.58,R*.3,0,7);g.fill()}
    g.rotate(-t);g.fillStyle='#fff';g.beginPath();g.arc(0,0,R*.3,0,7);g.fill()}
  g.restore();
}
// the potato you must bring to the bottom – big, bright and easy to spot
function drawIngredient(g,cx,cy,sz,sc){
  const R=sz*.40,t=performance.now()/600;
  g.save();g.translate(cx,cy);g.scale(sc,sc);
  g.save();g.rotate(t);g.setLineDash([R*.4,R*.3]);g.strokeStyle='rgba(255,213,74,.95)';g.lineWidth=Math.max(2,R*.13);
  g.beginPath();g.arc(0,0,R*1.08,0,7);g.stroke();g.restore();
  const gr=g.createRadialGradient(-R*.3,-R*.4,R*.1,0,0,R*1.2);
  gr.addColorStop(0,'#ffeccb');gr.addColorStop(.4,'#d79a56');gr.addColorStop(1,'#8a5523');
  g.fillStyle=gr;g.strokeStyle='#5e360f';g.lineWidth=Math.max(2,R*.1);
  g.beginPath();g.ellipse(0,0,R*.92,R*.76,-.2,0,7);g.fill();g.stroke();
  g.fillStyle='#8a5523';[[-.4,-.15],[.2,-.38],[.38,.2],[-.15,.36],[.05,-.02]].forEach(([a,b2])=>{
    g.beginPath();g.ellipse(R*a,R*b2,R*.1,R*.07,.4,0,7);g.fill()});
  g.globalAlpha=.6;g.fillStyle='#fff';g.beginPath();g.ellipse(-R*.3,-R*.4,R*.26,R*.14,-.5,0,7);g.fill();g.globalAlpha=1;
  g.strokeStyle='#2fcf63';g.lineWidth=Math.max(2,R*.11);g.lineCap='round';
  g.beginPath();g.moveTo(0,-R*.72);g.quadraticCurveTo(R*.12,-R*1.05,R*.34,-R*1.1);g.stroke();
  g.fillStyle='#2fcf63';g.beginPath();g.ellipse(R*.44,-R*1.08,R*.2,R*.11,-.4,0,7);g.fill();
  g.fillStyle='rgba(255,213,74,.95)';g.font=`900 ${Math.round(R*.6)}px Nunito,sans-serif`;
  g.textAlign='center';g.textBaseline='middle';g.fillText('↓',0,R*1.05);
  g.restore();
}
function glazeTop(x,y,lvl){
  const gx=x*CELL,gy=y*CELL;ctx.save();
  ctx.globalAlpha=.42;ctx.fillStyle=lvl>1?'#ff8fd0':'#ffffff';
  roundRect(ctx,gx+2,gy+2,CELL-4,CELL-4,CELL*.22);ctx.fill();
  ctx.globalAlpha=.95;ctx.strokeStyle=lvl>1?'#d64f99':'#7cc9ff';ctx.lineWidth=Math.max(3,CELL*.08);
  ctx.setLineDash([CELL*.16,CELL*.11]);ctx.stroke();ctx.setLineDash([]);
  ctx.globalAlpha=.85;ctx.fillStyle='#fff';
  for(let k=0;k<3;k++)ctx.fillRect(gx+CELL*(.18+k*.28),gy+CELL*.1,CELL*.07,CELL*.12);
  ctx.restore();
}
function shade(hex,f){const n=parseInt(hex.slice(1),16),r=n>>16,gg=(n>>8)&255,b=n&255;
  const k=v=>clamp(Math.round(f<0?v*(1+f):v+(255-v)*f),0,255);
  return`rgb(${k(r)},${k(gg)},${k(b)})`}
function draw(){
  const B=G&&G.B;if(!B)return;
  const w=CELL*B.cols,h=CELL*B.rows;
  ctx.clearRect(0,0,w,h);
  // deep candy board with a socket under every candy
  const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#5b2fb0');bg.addColorStop(1,'#3a1a80');
  ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
  for(let y=0;y<B.rows;y++)for(let x=0;x<B.cols;x++){
    ctx.fillStyle=(x+y)%2?'rgba(255,255,255,.07)':'rgba(0,0,0,.12)';
    roundRect(ctx,x*CELL+2,y*CELL+2,CELL-4,CELL-4,CELL*.26);ctx.fill()}
  // glaze under the candies
  for(let y=0;y<B.rows;y++)for(let x=0;x<B.cols;x++){const c=at(B,x,y);if(!c||!c.glaze)continue;
    const gx=x*CELL,gy=y*CELL;
    ctx.fillStyle=c.glaze>1?'rgba(255,150,210,.75)':'rgba(255,255,255,.7)';
    roundRect(ctx,gx+2,gy+2,CELL-4,CELL-4,CELL*.26);ctx.fill()}
  // the candies
  for(let y=0;y<B.rows;y++)for(let x=0;x<B.cols;x++){const c=at(B,x,y);if(!c)continue;
    const cx=x*CELL+CELL/2+(c.dx||0),cy=y*CELL+CELL/2+(c.dy||0);
    if(c.glaze)glazeTop(x,y,c.glaze);
    if(c.ing){drawIngredient(ctx,cx,cy,CELL,c.sc==null?1:c.sc);continue}
    drawPiece(ctx,c,cx,cy,CELL);
  }
  for(let y=0;y<B.rows;y++)for(let x=0;x<B.cols;x++){const c=at(B,x,y);if(c&&c.glaze&&!c.ing)glazeTop(x,y,c.glaze)}
  // hint ring
  if(G.hint&&!G.busy&&G.showHint){const t=(performance.now()%1100)/1100,a=.55+.45*Math.sin(t*6.28),[hx,hy]=G.hint;
    ctx.save();ctx.setLineDash([]);ctx.shadowColor='#ffd54a';ctx.shadowBlur=14;
    ctx.strokeStyle='rgba(255,213,74,'+a+')';ctx.lineWidth=6;
    roundRect(ctx,hx*CELL+4,hy*CELL+4,CELL*2-8,CELL*2-8,CELL*.34);ctx.stroke();ctx.restore()}
  // the twist pointer follows your finger
  if(G.pt&&!G.busy){const[px,py]=G.pt;ctx.save();ctx.translate((px+1)*CELL,(py+1)*CELL);
    ctx.rotate(performance.now()/500);ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=4;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.arc(0,0,CELL*.62,0,7);ctx.stroke();ctx.restore()}
}
let lastT=performance.now();
function frame(t){const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  if(G&&!G.busy&&!G.over&&!G.showHint&&t-G.idleT>9000&&G.hint)G.showHint=true;
  draw();fxTick(dt);requestAnimationFrame(frame)}
requestAnimationFrame(frame);

// simple tween helper used for all board animations
function tween(ms,fn){return new Promise(res=>{const t0=performance.now();
  const step=()=>{const p=clamp((performance.now()-t0)/ms,0,1);fn(p);if(p<1)requestAnimationFrame(step);else res()};step()})}
const easeOut=p=>1-Math.pow(1-p,3);
const easeBack=p=>{const c=1.7;return 1+ (c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};


/* =====================================================================
   PLAYING A GAME
   ===================================================================== */
const FLOSS_MAX=60;
function startGame(lv,endless){
  G={lv,endless:!!endless,B:makeBoard(lv,endless),moves:lv.moves,score:0,floss:0,busy:false,over:false,
     got:{color:{},glaze:0,ing:0,spec:0},pt:null,hint:null,showHint:false,idleT:performance.now(),tool:null,combo:0,ingOut:0,ingNeed:0};
  const io=lv.obj.find(o=>o.t==='ing');G.ingNeed=io?io.n:0;G.starShown=0;
  if(S.items.cloud>0&&!endless){ // a booster you bought: start with a floss cloud on the board
    const i=rnd(G.B.g.length);G.B.g[i].sp='cloud';S.items.cloud--;save();toast(L('🍥 You started with a floss cloud!','🍥 Du startede med en spindsky!'))}
  show('scGame');layout();objBar();gameHud();drawBoosters();
  banner(endless?L('ENDLESS!','ENDELØS!'):L('LEVEL ','BANE ')+lv.n);
  if(G.ingNeed)spawnIng(Math.min(2,G.ingNeed),4);
}
function gameHud(){
  $('#moves').textContent=G.moves;
  $('#movesW').classList.toggle('low',G.moves<=5);
  $('#flossBar').firstElementChild.style.width=(G.floss/FLOSS_MAX*100)+'%';
  $('#flossW').classList.toggle('full',G.floss>=FLOSS_MAX);
  // the star bar fills towards 1, 2 and 3 stars
  const t=G.lv.obj[0].n,max=G.endless?Math.max(1,G.score):t*2.1;
  $('#starFill').style.width=clamp(G.score/max*100,0,100)+'%';
  const st=G.endless?0:starFor(G.lv,G.score);
  if(st>(G.starShown||0)){G.starShown=st;SFX.star();const b=$('#starBar .s'+st);if(b){const r=b.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/2,'#ffd54a',18)}}
  [1,2,3].forEach(k=>$('#starBar .s'+k).classList.toggle('on',st>=k));
}
function objBar(){
  const box=$('#objs');box.innerHTML='';
  if(G.endless){box.innerHTML=`<div class="obj"><i>🏆</i>${N(G.score)}</div>`;return}
  G.lv.obj.forEach(o=>{
    const el=document.createElement('div');el.className='obj';
    let now=0;
    if(o.t==='score')now=G.score;else if(o.t==='color')now=G.got.color[o.c]||0;
    else if(o.t==='glaze')now=G.got.glaze;else if(o.t==='ing')now=G.got.ing;else now=G.got.spec;
    if(now>=o.n)el.classList.add('done');
    const txt=now>=o.n?'✔':(o.t==='score'?N(now)+'/'+N(o.n):Math.min(now,o.n)+'/'+o.n);
    if(o.t==='color'){ // show the real candy, not an emoji
      const c=document.createElement('canvas');c.width=c.height=52;const g=c.getContext('2d');
      drawCandy(g,o.c,26,26,58);el.appendChild(c);
      el.insertAdjacentHTML('beforeend',txt);
    }else el.innerHTML=`<i>${o.t==='score'?'🏆':o.t==='glaze'?'🧁':o.t==='ing'?'🥔':'💥'}</i>${txt}`;
    box.appendChild(el)});
}
const objDone=()=>G.lv.obj.every(o=>o.t==='score'?G.score>=o.n:o.t==='color'?(G.got.color[o.c]||0)>=o.n:o.t==='glaze'?G.got.glaze>=o.n:o.t==='ing'?G.got.ing>=o.n:G.got.spec>=o.n);

/* ---- the twist: rotate four candies clockwise ---- */
async function doTwist(x,y,silent){
  const B=G.B;if(G.busy||G.over)return;
  const idx=[y*B.cols+x,y*B.cols+x+1,(y+1)*B.cols+x+1,(y+1)*B.cols+x];
  if(idx.some(i=>!B.g[i]||B.g[i].ing)){SFX.no();shake(idx);return} // potatoes are too heavy to twist
  G.busy=true;G.hint=null;
  await animTwist(idx);
  const cells=idx.map(i=>B.g[i]);
  B.g[idx[1]]=cells[0];B.g[idx[2]]=cells[1];B.g[idx[3]]=cells[2];B.g[idx[0]]=cells[3];
  idx.forEach(i=>{B.g[i].dx=0;B.g[i].dy=0;B.g[i].rot=0});
  const m=findMatches(B);
  if(!m.all.size){ // no match: the candies simply stay turned and it costs you nothing,
    SFX.click();   // so you can keep twisting to line something up
    bump('twists');G.busy=false;G.showHint=false;findHint();return;
  }
  SFX.twist();bump('twists');G.moves--;G.combo=0;G.last=idx;G.showHint=false;
  gameHud();
  await resolve();
  G.busy=false;endCheck();
}
function shake(idx){const B=G.B;idx.forEach(i=>{const c=B.g[i];if(!c)return;let t=0;
  const id=setInterval(()=>{t++;c.dx=Math.sin(t)*3;if(t>7){clearInterval(id);c.dx=0}},16)})}
function animTwist(idx,back){
  const B=G.B,[x0,y0]=XY(B,idx[0]),cx=(x0+1)*CELL,cy=(y0+1)*CELL;
  const start=idx.map(i=>{const[x,y]=XY(B,i);return{c:B.g[i],ax:x*CELL+CELL/2-cx,ay:y*CELL+CELL/2-cy}});
  const dir=back?-1:1;
  return tween(190,p=>{const a=easeOut(p)*Math.PI/2*dir;
    start.forEach(o=>{const s=Math.sin(a),c2=Math.cos(a);
      o.c.dx=o.ax*c2-o.ay*s-o.ax;o.c.dy=o.ax*s+o.ay*c2-o.ay;o.c.rot=a*.5})});
}

/* ---- clear matches, drop candies, repeat ---- */
async function resolve(){
  const B=G.B;let loops=0;
  while(loops++<40){
    const m=findMatches(B);
    if(!m.all.size)break;
    G.combo++;
    if(G.combo>1){bump('cascades');floatBoard(L('CASCADE x','KÆDE x')+G.combo,'#ffcf4a')}
    bump('matches',m.runs.length);
    if(m.runs.some(r=>r.cells.length>=4))bump('big');
    // work out which specials this set of runs leaves behind
    const place=[];const counted=new Set();
    m.runs.forEach(run=>{
      const crossed=run.cells.find(i=>m.runs.some(o=>o!==run&&o.dir!==run.dir&&o.cells.includes(i)));
      const sp=specFor(run,crossed!=null&&run.cells.length>=3&&crossed!==undefined);
      if(!sp)return;
      let spot=crossed!=null?crossed:(G.last&&run.cells.find(i=>G.last.includes(i)));
      if(spot==null)spot=run.cells[Math.floor(run.cells.length/2)];
      if(counted.has(spot))return;counted.add(spot);
      place.push({i:spot,sp,c:B.g[run.cells[0]].c})});
    await clearSet(B,m.all,place);
    await gravity();
  }
  // the floss meter pays you back with free specials
  if(G.floss>=FLOSS_MAX){G.floss=0;bump('floss');await flossSpin()}
  endlessRamp();
  objBar();gameHud();findHint();
}
async function clearSet(B,set,place){
  const keep=new Set(place.map(p=>p.i));
  const pend=[];
  set.forEach(i=>{const c=B.g[i];if(!c)return;
    if(c.sp&&!keep.has(i))pend.push(i);});
  // chain: specials inside the match go off too
  let extra=new Set();
  pend.forEach(i=>burst(B,i,extra));
  extra.forEach(i=>set.add(i));
  let n=0;
  set.forEach(i=>{const c=B.g[i];if(!c||c.ing)return;n++;
    scorePop(i,60*Math.min(6,G.combo));
    if(c.glaze){c.glaze--;G.got.glaze++;sparkleAt(i,'#fff');SFX.glaze()}
    G.got.color[c.c]=(G.got.color[c.c]||0)+1});
  G.score+=n*60*Math.min(6,G.combo);G.floss=Math.min(FLOSS_MAX,G.floss+n);
  bump('cleared',n);SFX.pop(n);
  if(G.endless&&n>=4)G.moves++; // endless: big matches give a move back
  // pop animation
  await tween(170,p=>{set.forEach(i=>{const c=B.g[i];if(c&&!c.ing&&!keep.has(i))c.sc=1-easeOut(p)})});
  set.forEach(i=>{const c=B.g[i];if(!c||c.ing)return;if(keep.has(i)){c.sc=1;return}B.g[i]=null});
  place.forEach(pl=>{const c=B.g[pl.i];if(!c)return;c.sp=pl.sp;c.sc=0;c.c=pl.c;G.got.spec++;bump('specials');SFX.spec();
    sparkleAt(pl.i,PIECES[pl.c].c,16)});
  if(place.length)await tween(220,p=>place.forEach(pl=>{const c=B.g[pl.i];if(c)c.sc=easeBack(p)}));
}
// a special going off, and anything it hits
function burst(B,i,out){
  const c=B.g[i];if(!c||!c.sp||out.has(i))return;out.add(i);
  const[x,y]=XY(B,i),sp=c.sp;c.sp=null;
  SFX.spec();
  const add=j=>{if(j==null||!B.g[j])return;out.add(j);if(B.g[j].sp)burst(B,j,out)};
  if(sp==='row'){for(let k=0;k<B.cols;k++)add(y*B.cols+k);lineFx(0,y*CELL+CELL/2,B.cols*CELL,y*CELL+CELL/2)}
  if(sp==='col'){for(let k=0;k<B.rows;k++)add(k*B.cols+x);lineFx(x*CELL+CELL/2,0,x*CELL+CELL/2,B.rows*CELL)}
  if(sp==='bomb'){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<B.cols&&ny<B.rows)add(ny*B.cols+nx)}sparkleAt(i,'#ffcf4a',26)}
  if(sp==='cloud'){const col=c.c;B.g.forEach((o,j)=>{if(o&&!o.ing&&o.c===col)add(j)});sparkleAt(i,PIECES[col].c,30)}
}
async function gravity(){
  const B=G.B;let moved=true,guard=0;
  while(moved&&guard++<40){
    moved=false;const falls=[];
    for(let x=0;x<B.cols;x++){
      let empty=[];
      for(let y=B.rows-1;y>=0;y--){const i=y*B.cols+x;
        if(!B.g[i])empty.push(y);
        else if(empty.length){const ny=empty.shift();const ni=ny*B.cols+x;
          B.g[ni]=B.g[i];B.g[i]=null;B.g[ni].dy=(y-ny)*-CELL;falls.push(B.g[ni]);empty.push(y);moved=true}}
      // new candies drop in from above
      const r=Math.random;
      for(const y of empty){const i=y*B.cols+x;
        B.g[i]=newCell(B.nc,r);
        B.g[i].dy=-(B.rows)*CELL*.5-CELL;falls.push(B.g[i]);moved=true}
    }
    if(falls.length){falls.forEach(c=>c.dy0=c.dy);
      await tween(200,p=>falls.forEach(c=>{c.dy=c.dy0*(1-easeOut(p))}))}
    falls.forEach(c=>{c.dy=0;delete c.dy0});
    if(falls.length>2)SFX.land();
    // potatoes reaching the bottom row are collected
    let got=false;
    for(let x=0;x<B.cols;x++){const i=(B.rows-1)*B.cols+x,c=B.g[i];
      if(c&&c.ing){G.got.ing++;B.g[i]=null;got=true;
        sparkleAt(i,'#c98a4b',24);scorePop(i,500);G.score+=500;SFX.coin();floatBoard('🥔 +500','#ffcf4a');
        // send the next potato in, a few rows up, so there is always one to work on
        if(G.got.ing+ingOnBoard()<G.ingNeed)spawnIng(1,3)}}
    if(got){moved=true;objBar()}
  }
}
const ingOnBoard=()=>G.B.g.filter(c=>c&&c.ing).length;
function spawnIng(n,lowRow){const B=G.B;if(!G.ingNeed)return;
  const cols=[...Array(B.cols).keys()].sort(()=>Math.random()-.5);
  for(let k=0;k<n;k++){const x=cols[k%B.cols],y=(lowRow||4)+rnd(2),i=Math.min(B.g.length-1,y*B.cols+x);
    if(B.g[i]&&!B.g[i].ing){B.g[i].ing=true;B.g[i].sp=null}}
}
async function flossSpin(){
  SFX.floss();banner(L('FLOSS SPIN!','SPINDSNURR!'));confetti(80);
  const B=G.B,spots=[];let guard=60;
  while(spots.length<2&&guard--){const i=rnd(B.g.length);const c=B.g[i];if(c&&!c.ing&&!c.sp&&!spots.includes(i))spots.push(i)}
  spots.forEach(i=>{B.g[i].sp=pick(['row','col','bomb']);B.g[i].sc=0;sparkleAt(i,'#fff',20)});
  await tween(320,p=>spots.forEach(i=>{if(B.g[i])B.g[i].sc=easeBack(p)}));
  toast(L('🍥 The floss machine spun up two special candies!','🍥 Spindmaskinen lavede to specialslik!'));
}
/* little visual helpers tied to board cells */
function cellScreen(i){const B=G.B,[x,y]=XY(B,i),r=cv.getBoundingClientRect();

function sparkleAt(i,col,n){const[x,y]=cellScreen(i);sparkle(x,y,col,n||10)}
function scorePop(i,v){if(Math.random()<.22){const[x,y]=cellScreen(i);floatTxt(x,y,'+'+v,'#fff')}}
function floatBoard(t,c){const r=cv.getBoundingClientRect();floatTxt(r.left+r.width/2,r.top+r.height*.4,t,c)}
function lineFx(x1,y1,x2,y2){const r=cv.getBoundingClientRect();

/* ---- is there a twist that works? (hint + shuffle check) ---- */
function findHint(){
  const B=G.B;G.hint=null;
  const wantC=G.lv.obj.find(o=>o.t==='color'),wantI=G.lv.obj.find(o=>o.t==='ing'),wantG=G.lv.obj.find(o=>o.t==='glaze');
  // where is there a potato, and in which column?
  const ingRow={};B.g.forEach((c,i)=>{if(c&&c.ing){const x=i%B.cols,y=Math.floor(i/B.cols);if(ingRow[x]==null||y>ingRow[x])ingRow[x]=y}});
  const found=[];
  for(let y=0;y<B.rows-1;y++)for(let x=0;x<B.cols-1;x++){
    const idx=[y*B.cols+x,y*B.cols+x+1,(y+1)*B.cols+x+1,(y+1)*B.cols+x];
    if(idx.some(i=>!B.g[i]||B.g[i].ing))continue;
    const keep=idx.map(i=>B.g[i]);let hit=0;
    for(let t=0;t<3&&!hit;t++){
      const c=idx.map(i=>B.g[i]);
      B.g[idx[1]]=c[0];B.g[idx[2]]=c[1];B.g[idx[3]]=c[2];B.g[idx[0]]=c[3];
      const m=findMatches(B);if(m.all.size)hit=m.all.size;
    }
    idx.forEach((i,k)=>B.g[i]=keep[k]);
    if(!hit)continue;
    // a good tip helps with the job this level asks for
    let sc=1+Math.min(4,hit/3);
    if(wantI&&(ingRow[x]!=null&&y+1>ingRow[x]||ingRow[x+1]!=null&&y+1>ingRow[x+1]))sc+=6;
    if(wantG&&idx.some(i=>B.g[i].glaze))sc+=4;
    if(wantC&&idx.some(i=>B.g[i].c===wantC.c))sc+=2;
    found.push({x,y,sc:sc+Math.random()});
  }
  if(!found.length)return false;
  found.sort((a,b)=>b.sc-a.sc);
  G.hint=[found[0].x,found[0].y];
  return true;
}
async function shuffleBoard(quiet){
  const B=G.B;let guard=30;
  do{const cells=B.g.filter(c=>c&&!c.ing&&!c.sp);
    for(let i=cells.length-1;i>0;i--){const j=rnd(i+1);const a=cells[i].c;cells[i].c=cells[j].c;cells[j].c=a}
  }while(guard--&&(findMatches(B).all.size||!findHint()));
  if(!quiet)toast(L('🔀 The board was shuffled!','🔀 Brættet blev blandet!'));
  await tween(240,p=>B.g.forEach(c=>{if(c)c.sc=.6+.4*easeOut(p)}));
  B.g.forEach(c=>{if(c)c.sc=1});
}

const STAR=(k,n)=>'⭐'.repeat(k)+`<span class="off">${'⭐'.repeat(n-k)}</span>`;
async function winLevel(){
  const lv=G.lv,st=starFor(lv,G.score);
  // leftover moves pop as free specials, like a sugar rush
  if(G.moves>0){banner(L('SUGAR RUSH!','SUKKERRUS!'));
    for(let k=0;k<Math.min(8,G.moves);k++){const B=G.B,i=rnd(B.g.length);
      if(B.g[i]&&!B.g[i].ing){B.g[i].sp=pick(['row','col','bomb']);sparkleAt(i,'#ffcf4a',12);SFX.spec();await sleep(90)}}
    const B=G.B,all=new Set();B.g.forEach((c,i)=>{if(c&&c.sp)burst(B,i,all)});

function nodeEl(n){
  const lv=genLevel(n),st=S.stars[n]||0,lock=n>S.maxLevel,cur=n===S.maxLevel;
  const el=document.createElement('div');
  el.className='node'+(lock?' lock':'')+(st?' done':'')+(cur?' cur':'');
  el.innerHTML=`<div class="n">${n}</div><div class="tx"><b>${objText(lv)}</b><small>${lv.moves} ${L('moves','træk')} · ${lv.nc} ${L('colours','farver')}</small></div>
    <div class="stars">${lock?'🔒':STAR(st,3)}</div>`;
  if(!lock)el.onclick=()=>{SFX.click();startGame(lv)};
  else el.onclick=()=>toast(L('Finish the level before this one first!','Klar banen før denne først!'));
  return el;
}
function objText(lv){
  return lv.obj.map(o=>o.t==='score'?`🏆 ${N(o.n)}`:o.t==='color'?`${PIECES[o.c].e} ${o.n}`:o.t==='glaze'?`🧁 ${o.n}`:o.t==='ing'?`🥔 ${o.n}`:`💥 ${o.n}`).join(' · ');
}
$('#mapBack').onclick=()=>{SFX.click();show('scMenu')};
$('#moreLv').onclick=()=>{SFX.click();const path=$('#path'),have=path.children.length;
  for(let n=have+1;n<=have+8;n++)path.appendChild(nodeEl(n))};
$('#mPlay').onclick=()=>{SFX.click();openMap()};
$('#mEndless').onclick=()=>{SFX.click();startEndless()};
$('#gQuit').onclick=async()=>{SFX.click();
  if(G&&!G.over&&await panel({title:L('Leave the level?','Forlad banen?'),sm:true,html:`<p>${L('Your progress in this level is lost.','Din fremgang på banen går tabt.')}</p>`,
    buttons:[{label:L('Stay','Bliv'),v:0},{label:L('Leave','Forlad'),cls:'pink',v:1}]})!==1)return;
  if(G)G.over=true;show(G&&G.endless?'scMenu':'scMap');if(G&&!G.endless)openMap()};

/* ---- missions ---- */
$('#mMis').onclick=()=>{SFX.click();openMissions()};
function openMissions(){
  ensureDaily();
  panel({title:'📋 '+L('Daily missions','Daglige missioner'),render:(b)=>{const draw=()=>{
    const all=S.daily.t.every(t=>t.got);
    b.innerHTML=`<p class="hint">${L('Three new missions every day. Finish all three for a bonus!','Tre nye missioner hver dag. Klar alle tre og få en bonus!')}</p>`+
      S.daily.t.map((t,i)=>{const done=t.p>=t.n,rew=60+i*40;
        return`<div class="task ${done&&!t.got?'rdy':''}"><div class="ic">${t.e}</div><div class="tx">${L(t.en,t.da).replace('{n}',t.n)}
          <small>${Math.min(t.p,t.n)}/${t.n} · 🪙 ${rew}</small><div class="prog"><b style="width:${Math.min(100,t.p/t.n*100)}%"></b></div></div>
          ${t.got?'<span style="font-size:22px">✅</span>':done?`<button class="btn sm go" data-c="${i}">${L('Claim','Hent')}</button>`:''}</div>`}).join('')+
      `<div class="task ${all&&!S.daily.bonus?'rdy':''}"><div class="ic">🎁</div><div class="tx">${L('All three missions','Alle tre missioner')}<small>🪙 300 + 150 XP</small></div>
        ${S.daily.bonus?'<span style="font-size:22px">✅</span>':all?`<button class="btn sm go" data-c="bonus">${L('Claim','Hent')}</button>`:'<span style="font-size:20px">🔒</span>'}</div>`;
    $$('[data-c]',b).forEach(x=>x.onclick=()=>{const k=x.dataset.c;
      if(k==='bonus'){S.daily.bonus=true;addCoins(300);addXP(150)}
      else{const t=S.daily.t[+k];t.got=true;addCoins(60+ +k*40);addXP(40)}
      SFX.coin();confetti(50);save();draw();hud()})};draw()}});
}
/* ---- quests ---- */
$('#mQue').onclick=()=>{SFX.click();openQuests()};
function openQuests(){
  fillQuests();save();
  panel({title:'📜 '+L('Quests','Opgaver'),render:(b)=>{const draw=()=>{
    fillQuests();
    b.innerHTML=`<p class="hint">${L(`Three quests at a time – ${QUESTS.length} in total. A new one starts when you finish one.`,`Tre opgaver ad gangen – ${QUESTS.length} i alt. Der kommer en ny, når du klarer en.`)}</p>`+
      (S.quests.length?S.quests.map((x,i)=>{const q=Q(x.id);if(!q)return'';const p=qProg(x),done=p>=q[5];
        return`<div class="task ${done?'rdy':''}"><div class="ic">${q[1]}</div><div class="tx">${L(q[2],q[3])}
          <small>${Math.min(p,q[5])}/${q[5]} · 🪙 ${q[6]}</small><div class="prog"><b style="width:${Math.min(100,p/q[5]*100)}%"></b></div></div>
          ${done?`<button class="btn sm go" data-q="${i}">${L('Claim','Hent')}</button>`:`<button class="btn sm" data-skip="${i}" title="${L('Swap this quest','Byt denne opgave')}">🔄</button>`}</div>`}).join('')
        :`<p class="hint">${L('All quests done – you are a true floss master! 🍥','Alle opgaver klaret – du er en rigtig spindmester! 🍥')}</p>`)+
      `<p class="hint">${L('Finished','Klaret')}: ${S.qDone.length}/${QUESTS.length}</p>`;
    $$('[data-q]',b).forEach(x=>x.onclick=()=>{const i=+x.dataset.q,it=S.quests[i],q=Q(it.id);
      S.qDone.push(it.id);S.quests.splice(i,1);addCoins(q[6]);addXP(Math.round(q[6]/3));SFX.coin();confetti(60);
      toast(`📜 ${L('Quest done','Opgave klaret')}: +${q[6]} 🪙`);save();draw();hud()});
    $$('[data-skip]',b).forEach(x=>x.onclick=()=>{const i=+x.dataset.skip;S.quests.splice(i,1);SFX.click();fillQuests();save();draw()})};draw()}});
}
/* ---- shop ---- */
$('#mShop').onclick=()=>{SFX.click();openShop()};
function openShop(){
  panel({title:'🛒 '+L('Candy shop','Slikbutikken'),render:(b)=>{const draw=()=>{
    b.innerHTML=`<p class="hint">${L('Earn coins by finishing levels, missions and quests.','Tjen mønter ved at klare baner, missioner og opgaver.')}</p>
      <div class="shopg">${BOOST.map((x,i)=>`<div class="sitem"><div class="e">${x.e}</div><b>${L(x.en,x.da)}</b><small>${L(x.d[0],x.d[1])}</small>
        <div class="hint" style="margin-bottom:5px">${L('You have','Du har')}: <b>${S.items[x.k]||0}</b></div>
        <button class="btn sm go" data-b="${i}" ${S.coins<x.price?'disabled':''}>🪙 ${x.price}</button></div>`).join('')}</div>`;
    $$('[data-b]',b).forEach(x=>x.onclick=()=>{const it=BOOST[+x.dataset.b];if(S.coins<it.price)return;
      addCoins(-it.price);S.items[it.k]=(S.items[it.k]||0)+1;SFX.coin();save();draw();if(G&&!G.over)drawBoosters()})};draw()}});
}
/* ---- trophies, stats, help, changelog ---- */
$('#mTro').onclick=()=>{SFX.click();
  panel({title:'🏆 '+L('Trophies','Trofæer'),html:`<p class="hint">${L('Little goals to chase while you play.','Små mål at jagte, mens du spiller.')}</p>`+
    ACH.map(a=>{const got=S.ach[a[0]];return`<div class="task ${got?'rdy':''}" style="${got?'':'opacity:.65'}"><div class="ic">${got?a[1]:'🔒'}</div>
      <div class="tx">${L(a[2],a[3])}<small>${L(a[4],a[5])}</small></div>${got?'<span style="font-size:20px">✅</span>':''}</div>`}).join('')})};
$('#mStats').onclick=()=>{SFX.click();const c=S.cnt;
  const rows=[['⭐',L('Stars','Stjerner'),Object.values(S.stars).reduce((a,b)=>a+b,0)],['🏁',L('Levels finished','Baner klaret'),c.levels],
    ['🗺️',L('Highest level','Højeste bane'),S.maxLevel],['♾️',L('Best endless score','Bedste endeløse score'),N(S.best)],
    ['🍬',L('Candies cleared','Slik fjernet'),N(c.cleared)],['✨',L('Matches','Kombinationer'),N(c.matches)],
    ['🔄',L('Twists','Drejninger'),N(c.twists)],['💥',L('Specials made','Specialslik lavet'),N(c.specials)],
    ['⛓️',L('Cascades','Kædereaktioner'),N(c.cascades)],['🍥',L('Floss spins','Spindsnurr'),N(c.floss)],
    ['🪙',L('Coins earned','Mønter tjent'),N(c.coins)],['🏆',L('Trophies','Trofæer'),Object.keys(S.ach).length+'/'+ACH.length]];
  panel({title:'📊 '+L('Stats','Statistik'),sm:true,html:rows.map(r=>`<div class="task"><div class="ic">${r[0]}</div><div class="tx">${r[1]}</div><b>${r[2]}</b></div>`).join('')})};
$('#mHelp').onclick=()=>{SFX.click();openHelp()};
function openHelp(){
  panel({title:'❓ '+L('How to play','Sådan spiller du'),html:L(`
    <div class="task"><div class="ic">🔄</div><div class="tx"><b>Twist, don't swap!</b><small>Tap between four candies and they all spin one step clockwise. That is the big difference from other match-3 games.</small></div></div>
    <div class="task"><div class="ic">✅</div><div class="tx"><b>Free tries</b><small>Keep twisting the same spot to turn the candies further. Only a twist that makes a match costs a move – all the others are free.</small></div></div>
    <div class="task"><div class="ic">💥</div><div class="tx"><b>Special candies</b><small>Match 4 in a line for a candy stick (clears a row or column), match 5 for a floss cloud (clears a whole colour), and make an L or T shape for a sugar bomb.</small></div></div>
    <div class="task"><div class="ic">🍥</div><div class="tx"><b>The floss meter</b><small>Every candy you clear fills the meter at the top. When it is full the floss machine spins two free specials onto the board.</small></div></div>
    <div class="task"><div class="ic">🧁</div><div class="tx"><b>Sugar glaze</b><small>Match on top of a glazed tile to clean it. Pink glaze needs two matches.</small></div></div>
    <div class="task"><div class="ic">🥔</div><div class="tx"><b>Potatoes</b><small>Some levels ask you to bring potatoes all the way down to the bottom row. You cannot twist a potato, so clear the candies under it.</small></div></div>
    <div class="task"><div class="ic">⭐</div><div class="tx"><b>Stars</b><small>Beat the target score for 1 star, and score much more for 2 and 3 stars. Levels never run out!</small></div></div>`,`
    <div class="task"><div class="ic">🔄</div><div class="tx"><b>Drej i stedet for at bytte!</b><small>Tryk mellem fire slik, så drejer de alle ét trin med uret. Det er den store forskel fra andre match-3-spil.</small></div></div>
    <div class="task"><div class="ic">✅</div><div class="tx"><b>Gratis forsøg</b><small>Bliv ved med at dreje samme sted for at dreje slikkene videre rundt. Kun en drejning, der giver tre ens, koster et træk – alle de andre er gratis.</small></div></div>
    <div class="task"><div class="ic">💥</div><div class="tx"><b>Specialslik</b><small>Fire på stribe giver en slikstang (rydder en række eller kolonne), fem giver en spindsky (rydder en hel farve), og en L- eller T-form giver en sukkerbombe.</small></div></div>
    <div class="task"><div class="ic">🍥</div><div class="tx"><b>Spindmåleren</b><small>Hvert slik, du fjerner, fylder måleren øverst. Når den er fuld, snurrer spindmaskinen to gratis specialslik frem.</small></div></div>
    <div class="task"><div class="ic">🧁</div><div class="tx"><b>Sukkerglasur</b><small>Lav tre ens oven på et glaseret felt for at rense det. Lyserød glasur skal rammes to gange.</small></div></div>
    <div class="task"><div class="ic">🥔</div><div class="tx"><b>Kartofler</b><small>Nogle baner beder dig føre kartofler helt ned i nederste række. Du kan ikke dreje en kartoffel, så fjern slikket under den.</small></div></div>
    <div class="task"><div class="ic">⭐</div><div class="tx"><b>Stjerner</b><small>Nå målscoren for 1 stjerne, og få meget mere for 2 og 3 stjerner. Banerne slipper aldrig op!</small></div></div>`)});
}
const CHANGELOG=[
  {v:'1.0',d:['1 Nov 2026','1. nov. 2026'],t:['Welcome to Potato Candy Floss!','Velkommen til Potato Candy Floss!'],i:[
    ['🔄 A brand new match-3 twist: tap between four candies to spin them around instead of swapping two. Twisting is free – only a twist that makes a match costs a move.','🔄 En helt ny match-3-drejning: tryk mellem fire slik for at dreje dem rundt i stedet for at bytte to. Det er gratis at dreje – kun en drejning, der rammer, koster et træk.'],
    ['🗺️ Endless levels with score targets, candy colours to collect, sugar glaze to clean and potatoes to rescue.','🗺️ Uendeligt mange baner med målscore, slikfarver at samle, sukkerglasur at rense og kartofler at redde.'],
    ['♾️ Endless mode where big matches give your moves back.','♾️ Endeløs tilstand, hvor store kombinationer giver træk tilbage.'],
    ['📋 Daily missions, 📜 quests, 🏆 trophies, a 🛒 booster shop and your own player level.','📋 Daglige missioner, 📜 opgaver, 🏆 trofæer, en 🛒 butik med boosters og dit eget spillerlevel.'],
    ['🇬🇧🇩🇰 English and Danish.','🇬🇧🇩🇰 Engelsk og dansk.']]}
];
$('#mLog').onclick=()=>{SFX.click();openLog()};
function openLog(){
  S.seenLog=CHANGELOG[0].v;save();hud();
  panel({title:'📖 '+L("What's new","Nyheder"),html:CHANGELOG.map((c,k)=>`<div class="task" style="display:block"><b>v${c.v} – ${L(c.t[0],c.t[1])}</b>
    <small class="hint">${L(c.d[0],c.d[1])}${k===0?' · <span style="color:#d64f99">'+L('NEW','NYT')+'</span>':''}</small>
    <ul style="margin:6px 0 0;padding-left:20px;font-size:13.5px;line-height:1.5">${c.i.map(x=>`<li>${L(x[0],x[1])}</li>`).join('')}</ul></div>`).join('')});
}
$('#mDisc').onclick=()=>{SFX.click();open('https://discord.gg/kZa6F4s5f9','_blank','noopener')};

/* ---- language + sound ---- */
const STATIC=[
  ['#mPlayT','Play levels','Spil baner'],['#mEndT','Endless floss','Endeløst spind'],
  ['#mMisT','Missions','Missioner'],['#mQueT','Quests','Opgaver'],['#mShopT','Shop','Butik'],['#mHelpT','How to play','Sådan spiller du'],
  ['#mTroT','Trophies','Trofæer'],['#mStatsT','Stats','Statistik'],['#mLogT',"What's new",'Nyheder'],
  ['#mapBackT','Menu','Menu'],['#moreLvT','More levels','Flere baner'],['#movesL','MOVES','TRÆK'],
  ['#heroTxt','Twist four candies around instead of swapping them!','Drej fire slik rundt i stedet for at bytte dem!']
];
function applyLang(){
  document.documentElement.lang=LANG;
  STATIC.forEach(([sel,en,da])=>{const el=$(sel);if(el)el.textContent=L(en,da)});
  $('#langBtn').textContent=LANG==='da'?'🇬🇧':'🇩🇰';
  $('#langBtn').title=LANG==='da'?'English':'Dansk';
  if(G&&!G.over){objBar();drawBoosters()}
  if($('#scMap').classList.contains('on'))openMap();
  hud();
}
$('#langBtn').onclick=()=>{LANG=LANG==='da'?'en':'da';try{localStorage.setItem(LANG_KEY,LANG)}catch(e){}
  SFX.click();$$('.ov').forEach(o=>o._close&&o._close(null));$('#toasts').innerHTML='';applyLang()};
$('#sndBtn').onclick=()=>{SFX.on=!SFX.on;$('#sndBtn').textContent=SFX.on?'🔊':'🔇';
  try{localStorage.setItem('potato_floss_snd',SFX.on?'1':'0')}catch(e){}if(SFX.on)SFX.click()};
$('#musBtn').onclick=()=>{MUSIC.set(!MUSIC.on);$('#musBtn').textContent=MUSIC.on?'🎵':'🔈';
  $('#musBtn').style.opacity=MUSIC.on?1:.55;SFX.click()};
// browsers only allow sound after the first tap
addEventListener('pointerdown',()=>{if(MUSIC.on)MUSIC.start()},{once:true});

/* =====================================================================
   BOOT
   ===================================================================== */
const TIPS=[
  ['Tip: twisting is free – only a twist that makes a match costs a move.','Tip: det er gratis at dreje – kun en drejning, der rammer, koster et træk.'],
  ['Tip: match 5 in a line for a floss cloud that clears a whole colour.','Tip: fem på stribe giver en spindsky, der rydder en hel farve.'],
  ['Tip: two specials next to each other make a huge mess. The good kind!','Tip: to specialslik ved siden af hinanden giver et kæmpe rod. Det gode slags!'],
  ['Tip: leftover moves turn into free specials when you win.','Tip: træk, du har tilbage, bliver til gratis specialslik, når du vinder.'],
  ['Tip: daily missions give coins for boosters.','Tip: daglige missioner giver mønter til boosters.']
];
async function boot(){
  load();ensureDaily();fillQuests();
  try{SFX.on=localStorage.getItem('potato_floss_snd')!=='0';MUSIC.on=localStorage.getItem('potato_floss_mus')!=='0'}catch(e){}
  $('#sndBtn').textContent=SFX.on?'🔊':'🔇';
  $('#musBtn').textContent=MUSIC.on?'🎵':'🔈';$('#musBtn').style.opacity=MUSIC.on?1:.55;
  applyLang();hud();
  const tip=pick(TIPS);$('#ldTip').textContent=L(tip[0],tip[1]);
  const bar=$('#ldBar'),t0=performance.now(),until=ms=>sleep(Math.max(0,ms-(performance.now()-t0)));
  const step=(p,txt)=>{bar.style.width=p+'%';$('#ldTxt').textContent=txt};
  step(15,L('Warming up the floss machine…','Varmer spindmaskinen op…'));
  await until(1800);step(45,L('Rolling the candies…','Ruller slikkene…'));
  await until(3800);step(70,L('Mixing the colours…','Blander farverne…'));
  await until(5800);step(92,L('Sprinkling sugar…','Drysser sukker…'));
  await until(7400);step(100,L('Ready!','Klar!'));
  await until(8000);
  const ld=$('#load');ld.classList.add('out');setTimeout(()=>ld.remove(),500);
  if(S.seenLog!==CHANGELOG[0].v)setTimeout(openLog,600);
}
boot();

</script>

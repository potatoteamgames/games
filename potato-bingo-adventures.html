<style>
:root{
  --bg:#1b1440; --bg2:#251a56; --card:#2e2266; --card2:#3a2c7c; --line:rgba(255,255,255,.12);
  --txt:#fff8ec; --muted:#c7bdf0; --gold:#ffcf4a; --goldD:#d9962a; --pink:#ff5fa2; --mint:#4fe0a6; --sky:#5cc2ff; --red:#ff5a5a;
  --ink:#1a1033; --c1:#2f8f4e; --c2:#14402a;
  --B:#ff5a5a; --I:#ffb52e; --N:#3fcf6b; --G:#4aa3ff; --O:#b36bff;
  --daub:#ff5fa2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{color:var(--txt);font-family:Nunito,system-ui,sans-serif;font-weight:800;background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;font-weight:900;cursor:pointer;border:none;color:inherit;background:none}
button:disabled{cursor:not-allowed}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh}
.lil{font-family:'Lilita One',Nunito,sans-serif;font-weight:400;letter-spacing:.3px}

/* ===== TOP BAR ===== */
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(180deg,#2d1f6e,#1f1650);border-bottom:3px solid #120b2e;box-shadow:0 4px 14px #0007;z-index:5}
.home{display:flex;align-items:center;gap:4px;height:38px;padding:0 10px;border-radius:12px;background:var(--card2);border:2px solid var(--line);text-decoration:none;color:var(--txt);font-size:13px;white-space:nowrap}
.home:hover{background:#4a3a96}
.logo{font-family:'Lilita One',sans-serif;font-size:22px;line-height:1;white-space:nowrap;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.logo small{display:block;font-size:12px;color:var(--txt);letter-spacing:2px}
.res{margin-left:auto;display:flex;gap:6px;align-items:center;min-width:0}
.pill{display:flex;align-items:center;gap:4px;height:34px;padding:0 10px;border-radius:999px;background:#0006;border:2px solid var(--line);font-size:15px;white-space:nowrap}
.pill b{font-weight:900}
.lvl{position:relative;width:96px;height:34px;border-radius:999px;background:#0006;border:2px solid var(--line);overflow:hidden;font-size:13px;display:flex;align-items:center;justify-content:center}
.lvl i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4fe0a6,#2bb38a);transition:width .3s}
.lvl span{position:relative;text-shadow:1px 1px 0 #000a}
.ibtn{width:36px;height:36px;border-radius:12px;background:var(--card2);border:2px solid var(--line);font-size:17px;flex-shrink:0}

/* ===== VIEW ===== */
#view{overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
.pad{padding:16px;max-width:1100px;margin:0 auto}
h2.t{font-family:'Lilita One',sans-serif;font-weight:400;font-size:28px;margin:4px 0 4px}
.subt{color:var(--muted);font-size:14px;margin:0 0 14px}
.sec{margin:22px 0 10px;font-family:'Lilita One',sans-serif;font-weight:400;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.box{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:12px;font-size:14px;background:linear-gradient(#ffd86a,#e0a42a);color:var(--ink);box-shadow:0 3px 0 #8a5a12;transition:transform .1s,filter .1s;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn:disabled{background:#4a4170;color:#a99fd0;box-shadow:0 3px 0 #2a2350}
.btn.g{background:linear-gradient(#6ff0b8,#2bb38a);box-shadow:0 3px 0 #11684e}
.btn.p{background:linear-gradient(#ff8cc0,#e0427f);color:#fff;box-shadow:0 3px 0 #82204a}
.btn.b{background:linear-gradient(#7fd2ff,#3b8fe0);color:#fff;box-shadow:0 3px 0 #1d4f85}
.btn.dk{background:var(--card2);color:var(--txt);box-shadow:0 3px 0 #120b2e;border:2px solid var(--line)}
.btn.big{font-family:'Lilita One',sans-serif;font-weight:400;font-size:24px;padding:14px 28px;border-radius:16px}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.bar{height:10px;background:#0006;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9b3a);border-radius:999px}

/* ===== NAV ===== */
#nav{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#120b2e;border-top:2px solid var(--line);z-index:5}
#nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:12px;font-size:11px;color:var(--muted)}
#nav button .e{font-size:22px;line-height:1.1}
#nav button.on{background:var(--card2);color:var(--txt)}
#nav button.mid .e{font-size:28px}
#nav.lock{display:none}
.dot{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;display:none;align-items:center;justify-content:center;border:2px solid #120b2e}
.dot.on{display:flex}
@media (max-width:820px){#nav .dk-only{display:none}}

/* ===== DESKTOP LAYOUT: sidebar menu instead of the mobile bottom bar ===== */
@media (min-width:821px){
  #app{grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "nav view"}
  #app.inround{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "view"}
  #top{grid-area:top;padding:10px 20px}
  #view{grid-area:view}
  #nav{grid-area:nav;display:flex;flex-direction:column;gap:6px;padding:16px 12px;border-top:none;border-right:2px solid var(--line);background:linear-gradient(180deg,#160e38,#120b2e);overflow-y:auto}
  #nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:14px;font-size:16px;color:var(--muted);transition:background .15s,color .15s}
  #nav button .e,#nav button.mid .e{font-size:24px}
  #nav button:hover{background:#ffffff12;color:var(--txt)}
  #nav button.on{background:linear-gradient(90deg,var(--card2),#4a3a96);color:var(--txt);box-shadow:inset 4px 0 0 var(--gold)}
  #nav button.mid{order:-1;margin-bottom:8px;background:linear-gradient(#ff8cc0,#e0427f);color:#fff;box-shadow:0 4px 0 #82204a;font-family:'Lilita One',sans-serif;font-size:20px;letter-spacing:.5px}
  #nav button.mid.on{box-shadow:0 4px 0 #82204a,0 0 0 3px var(--gold)}
  #nav button.mid:hover{filter:brightness(1.08)}
  .dot{position:static;margin-left:auto}
  #nav button{order:var(--o)}
  #nav button[data-t=more]{margin-top:auto}
  .pad{padding:24px 28px}
}

/* ===== MAP ===== */
.journey{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;counter-reset:land}
.land{position:relative;border-radius:20px;padding:14px;min-height:150px;border:3px solid #0005;overflow:hidden;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 20px #0005;text-align:left}
.land .num{position:absolute;top:10px;right:12px;font-size:12px;background:#0005;border-radius:999px;padding:2px 8px}
.land .le{font-size:46px;line-height:1;filter:drop-shadow(0 4px 4px #0006)}
.land h3{margin:0;font-family:'Lilita One',sans-serif;font-weight:400;font-size:22px;text-shadow:2px 2px 0 #0006}
.land p{margin:0;font-size:12px;color:#fff;opacity:.9}
.land.locked{filter:grayscale(.85) brightness(.55)}
.land.here{outline:4px solid var(--gold);outline-offset:-3px}
.land .pbar{height:8px;background:#0006;border-radius:9px;overflow:hidden;margin-top:auto}
.land .pbar i{display:block;height:100%;background:var(--gold)}

/* ===== TOWN ===== */
.scene{position:relative;border-radius:22px;overflow:hidden;padding:18px;min-height:150px;display:flex;align-items:center;gap:16px;border:3px solid #0006;box-shadow:0 10px 26px #0006}
.scene .bigE{font-size:78px;line-height:1;filter:drop-shadow(0 6px 6px #0006);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.scene h2{margin:0;font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(26px,4vw,38px);text-shadow:2px 3px 0 #0007}
.scene .skyline{position:absolute;right:10px;bottom:4px;font-size:30px;opacity:.85;letter-spacing:4px;pointer-events:none}
.bld{display:flex;flex-direction:column;gap:6px}
.bld .top{display:flex;gap:10px;align-items:center}
.bld .be{font-size:38px;width:54px;height:54px;border-radius:14px;background:#0004;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bld h4{margin:0;font-size:16px}
.stars{color:var(--gold);font-size:12px;letter-spacing:1px}
.bld .eff{font-size:12px;color:var(--muted);min-height:32px}
.bld.lm{grid-column:1/-1;background:linear-gradient(135deg,#4a3410,#2e2266 60%);border-color:#ffcf4a66}
.req{font-size:12px;color:var(--muted)}
.req b.ok{color:var(--mint)}
.req b.no{color:#ff9a9a}

/* ===== ITEMS ===== */
.item{position:relative;display:flex;gap:10px;align-items:center;text-align:left;border-radius:16px;padding:10px;background:var(--card);border:2px solid var(--line);width:100%;color:var(--txt)}
.item .ie{font-size:32px;width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#0004;border:2px solid currentColor}
.item .in{font-size:14px}
.item .is{font-size:11px;color:var(--muted)}
.item.eq::after{content:'EQUIPPED';position:absolute;top:6px;right:8px;font-size:9px;background:var(--mint);color:#063;padding:2px 6px;border-radius:999px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:#0004;border:2px dashed var(--line);font-size:11px;color:var(--muted);text-align:center;min-width:0}
.slot .se{font-size:34px;line-height:1.1}
.slot.f{border-style:solid}
.rar{font-size:10px;padding:1px 7px;border-radius:999px;color:#160c2b}
.chest{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.chest .ce{font-size:50px;line-height:1}

/* ===== PAGE PARTS ===== */
.phead{display:flex;gap:14px;align-items:center;margin:2px 0 16px}
.phead .phe{font-size:40px;width:64px;height:64px;border-radius:18px;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phead h2{margin:0;font-family:'Lilita One',sans-serif;font-weight:400;font-size:28px}
.phead p{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.4;font-weight:700}
.seg{display:flex;gap:4px;background:#0005;border:2px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;padding:9px 10px;border-radius:10px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 2px 0 #0006}
.wallet{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.wallet span{background:#0005;border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.note{font-size:13px;color:var(--muted);font-weight:700;line-height:1.45;margin:0 0 12px}
.note b{color:var(--txt)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .ee{font-size:46px}
/* shop cards */
.scard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 12px;border-radius:18px;background:var(--card);border:2px solid var(--line);position:relative}
.scard .sce{font-size:44px;width:76px;height:76px;border-radius:20px;background:#0004;display:flex;align-items:center;justify-content:center;border:3px solid currentColor}
.scard h4{margin:2px 0 0;font-size:16px}
.scard .sd{font-size:12px;color:var(--muted);font-weight:700;min-height:30px}
.scard .owned{position:absolute;top:8px;right:8px;font-size:10px;background:var(--mint);color:#063;padding:2px 7px;border-radius:999px}
.odds{display:flex;height:8px;border-radius:9px;overflow:hidden;width:100%;background:#0005}
.odds i{display:block;height:100%}
.landchips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.landchips button{padding:6px 12px;border-radius:999px;background:#0005;border:2px solid var(--line);font-size:13px;white-space:nowrap}
.landchips button.on{background:var(--card2);border-color:var(--gold)}
/* bag */
.equip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto}
.eslot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1;border-radius:20px;background:#0004;border:3px dashed var(--line);font-size:11px;color:var(--muted);padding:4px;text-align:center;min-width:0}
.eslot .se{font-size:36px;line-height:1.1}
.eslot.f{border-style:solid;background:radial-gradient(circle at 50% 40%,#ffffff14,#0004)}
.eslot.lk{opacity:.45}
.eslot b{color:var(--txt);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.avatar{display:flex;align-items:center;justify-content:center;font-size:72px;filter:drop-shadow(0 8px 10px #0008);animation:bob 3s ease-in-out infinite}
.bonus{display:flex;flex-wrap:wrap;gap:6px}
.bonus span{background:#4fe0a622;border:2px solid #4fe0a666;border-radius:999px;padding:4px 10px;font-size:12px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.itile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:16px;background:var(--card);border:3px solid currentColor;color:var(--txt);min-width:0}
.itile .te{font-size:36px;line-height:1.1}
.itile .tn{font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.itile .tl{font-size:10px;color:var(--muted)}
.itile .tq{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--mint);color:#063;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.itile:hover{transform:translateY(-2px)}
.statline{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;background:#0004;border-radius:10px;margin:4px 0;font-size:14px;text-align:left}
.statline em{font-style:normal;color:var(--mint)}
/* upgrades */
.hcard{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;background:var(--card);border:2px solid var(--line);margin-bottom:10px}
.hcard .hce{font-size:36px;width:60px;height:60px;border-radius:16px;background:#0004;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hcard h4{margin:0 0 2px;font-size:17px}
.hcard p{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700;line-height:1.4}
.lvdots{display:flex;gap:3px;margin:4px 0 8px}
.lvdots i{width:14px;height:6px;border-radius:3px;background:#ffffff22}
.lvdots i.on{background:var(--gold)}
/* more */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 8px;border-radius:18px;background:var(--card);border:2px solid var(--line);font-size:15px;text-align:center}
.tile .te{font-size:40px}
.tile small{color:var(--muted);font-size:11px;font-weight:700}
.tile .dot{top:6px;right:8px}

/* ===== BINGO LOBBY ===== */
.lobby{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:start}
.opt{display:flex;gap:6px;flex-wrap:wrap}
.opt button{min-width:52px;padding:10px 12px;border-radius:12px;background:#0005;border:2px solid var(--line);font-size:16px}
.opt button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.opt button:disabled{opacity:.4}
.pw{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pw:last-child{border:none}
.pw .pe{font-size:28px;width:44px;text-align:center}

.lhero{flex-wrap:wrap}
.lhero .lh-txt{flex:1;min-width:200px;position:relative;z-index:1}
.lhero .lh-play{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-left:auto}
.playbtn{font-size:30px;padding:16px 34px;background:linear-gradient(#ff8cc0,#e0427f);color:#fff;box-shadow:0 5px 0 #82204a;text-shadow:2px 2px 0 #0004;animation:glow 1.6s ease-in-out infinite}
.goal{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:15px;border-color:#ffcf4a55;background:linear-gradient(90deg,#3a2c7c,var(--card))}
.goal .ge{font-size:30px}
.lobby{margin-top:14px}
.bh{margin:0 0 10px;font-size:20px;font-weight:400}
.set{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.set:last-child{border:none}
.set .sl{display:flex;flex-direction:column;gap:2px}
.set .sl span{font-size:12px;color:var(--muted);font-weight:700}
.set .opt button{font-size:14px;padding:8px 10px;min-width:44px}
.howto summary{cursor:pointer;list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto summary::after{content:' ▾';color:var(--muted)}
.howto:not([open]) summary{margin:0}
.steps{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;font-weight:700;color:var(--muted);counter-increment:st}
.steps li b{color:var(--txt)}
.steps li span{flex-shrink:0;width:38px;height:38px;border-radius:12px;background:#0004;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative}
.steps li span::after{content:counter(st);position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:11px;display:flex;align-items:center;justify-content:center}
.c-ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cb{height:34px;min-width:34px;padding:0 10px;border-radius:10px;background:#0005;border:2px solid var(--line);font-size:15px}
.cb:hover:not(:disabled){background:#ffffff18}
.cb:disabled{opacity:.35}
.cb.on{border-color:var(--mint)}
.cb .cl{font-style:normal;font-size:13px}
.cb.leave{background:#ff5a5a33;border-color:#ff5a5a88}
.spd{display:flex;align-items:center;gap:4px;font-size:13px;white-space:nowrap}
.spd .cb{font-size:20px;padding:0;width:34px;line-height:1}

/* ===== BINGO ROUND ===== */
#round{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;padding:12px;min-height:100%;position:relative}
.caller{display:flex;flex-direction:column;gap:10px}
.cbox{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px}
.ballwrap{display:flex;align-items:center;gap:12px}
.ball{width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;
  background:radial-gradient(circle at 50% 50%,#fff 0 34%,var(--bc,#888) 35% 100%);box-shadow:inset -8px -10px 18px #0006,0 6px 14px #0008;color:#1a1033}
.ball .bl{font-family:'Lilita One',sans-serif;font-size:18px;line-height:1;margin-top:6px}
.ball .bn{font-family:'Lilita One',sans-serif;font-size:36px;line-height:1}
.ball.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-90deg)}100%{transform:scale(1) rotate(0deg)}}
.ball.gold{--bc:#ffd34a!important;box-shadow:inset -8px -10px 18px #0005,0 0 26px #ffd34a}
.hist{display:flex;gap:4px;flex-wrap:wrap}
.mb{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#1a1033;background:radial-gradient(circle at 50% 50%,#fff 0 45%,var(--bc) 47%)}
.rstat{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}
.rstat div{background:#0004;border-radius:10px;padding:6px 8px}
.rstat b{display:block;font-size:17px}
.pool b{color:var(--gold)}
.feed{font-size:12px;color:var(--muted);min-height:34px;line-height:1.4}
.pwbtn{width:100%;padding:12px;border-radius:14px;font-size:16px;background:#0005;border:2px solid var(--line);position:relative;overflow:hidden}
.pwbtn i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4a3aa0,#7a5cff);transition:width .25s}
.pwbtn span{position:relative}
.pwbtn.ready{background:linear-gradient(#ffe27a,#ffad2a);color:var(--ink);border-color:#fff;animation:glow 1s ease-in-out infinite}
.pwbtn.ready i{display:none}
@keyframes glow{50%{box-shadow:0 0 22px #ffd34a;transform:scale(1.02)}}
.combo{font-family:'Lilita One',sans-serif;font-size:20px;color:var(--gold);text-align:center;min-height:24px}

.cards{display:grid;gap:12px;align-content:start;justify-content:center}
.cards.n1{grid-template-columns:minmax(0,440px)}
.cards.n2{grid-template-columns:repeat(2,minmax(0,380px))}
.cards.n3,.cards.n4{grid-template-columns:repeat(2,minmax(0,330px))}
.card{background:#fff8ec;border-radius:18px;padding:8px;border:4px solid #0006;box-shadow:0 8px 20px #0006;color:var(--ink)}
.chd{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:4px}
.chd span{font-family:'Lilita One',sans-serif;font-size:clamp(16px,2.6vw,24px);text-align:center;border-radius:8px;color:#fff;text-shadow:1px 1px 0 #0005}
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.cell{position:relative;aspect-ratio:1;border-radius:9px;background:#efe3cb;border:2px solid #d9c7a5;font-family:'Lilita One',sans-serif;font-size:clamp(14px,2.4vw,24px);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;transition:transform .08s}
.cell:active{transform:scale(.92)}
.cell .sq{position:absolute;top:1px;right:2px;font-size:clamp(9px,1.3vw,13px);line-height:1}
.cell.d{color:#fff}
.cell.d::before{content:'';position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7 0 12%,var(--daub) 13%);box-shadow:0 2px 0 #0003;animation:daub .25s cubic-bezier(.2,1.6,.4,1)}
.cell.d span{position:relative;text-shadow:1px 1px 0 #0006}
@keyframes daub{from{transform:scale(0)}}
.cell.free{font-size:clamp(16px,2.6vw,26px)}
.cell.hint{background:#fff1c2;border-color:#f2cf7a;box-shadow:inset 0 0 0 2px #ffcf4a66}
.cell.won{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.cell.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cell.magic::before{background:radial-gradient(circle at 35% 30%,#fff9 0 12%,#7a5cff 13%)}
.bingo{display:block;width:100%;margin-top:8px;padding:10px;border-radius:12px;font-family:'Lilita One',sans-serif;font-size:22px;letter-spacing:2px;background:#d8ccb4;color:#9c8d72}
.bingo.ready{background:linear-gradient(#ff8cc0,#e0427f);color:#fff;animation:glow .8s ease-in-out infinite;text-shadow:2px 2px 0 #0004}
.card .cinfo{display:flex;justify-content:space-between;font-size:11px;color:#7a6a50;margin-top:4px}

/* ===== EVENTS / FX ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.float{position:absolute;font-weight:900;font-size:18px;color:#fff;text-shadow:2px 2px 0 #000a,-1px -1px 0 #000a;pointer-events:none;animation:fl 1.2s ease-out forwards;white-space:nowrap;z-index:41}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
.conf{position:absolute;width:10px;height:14px;border-radius:2px;animation:cf 1.6s ease-in forwards}
@keyframes cf{to{transform:translate(var(--dx),110vh) rotate(var(--r));}}
.ev{position:absolute;pointer-events:auto;cursor:pointer;font-size:58px;filter:drop-shadow(0 0 14px #ffd34a);user-select:none;padding:6px;line-height:1}
.ev.fly{animation:fly var(--dur,3.4s) linear forwards}
@keyframes fly{from{transform:translateX(-90px) rotate(-10deg)}25%{margin-top:-30px}50%{margin-top:20px}75%{margin-top:-30px}to{transform:translateX(calc(100vw + 90px)) rotate(10deg)}}
.ev.rise{animation:rise var(--dur,4s) linear forwards}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-100vh - 120px))}}
.ev.fall{font-size:42px;animation:fall var(--dur,3s) linear forwards}
@keyframes fall{from{transform:translateY(-80px)}to{transform:translateY(calc(100vh + 80px))}}
.evp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:auto;background:linear-gradient(#3a2c7c,#241a5a);border:4px solid var(--gold);border-radius:22px;padding:16px 20px;text-align:center;box-shadow:0 0 0 9999px #0006,0 20px 50px #000a;min-width:280px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.evp h3{margin:0 0 6px;font-family:'Lilita One',sans-serif;font-weight:400;font-size:26px;color:var(--gold)}
.evp .tmr{height:8px;background:#0006;border-radius:9px;overflow:hidden;margin:10px 0 0}
.evp .tmr i{display:block;height:100%;background:var(--pink);width:100%}
.mash{font-size:80px;line-height:1;padding:10px 20px;border-radius:22px;background:#0004;transition:transform .05s}
.mash:active{transform:scale(.88)}
.chs{display:flex;gap:10px;justify-content:center}
.chs button{font-size:56px;padding:6px 10px;border-radius:16px;background:#0004;border:2px solid var(--line)}
.chs button:hover{transform:scale(1.08)}
.bigtxt{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:'Lilita One',sans-serif;font-size:clamp(54px,12vw,120px);color:var(--gold);text-shadow:4px 5px 0 var(--ink),-2px -2px 0 var(--ink),0 0 30px #ff5fa2;animation:bt 1.3s ease-out forwards;white-space:nowrap;z-index:42}
@keyframes bt{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}

/* ===== TOAST / MODAL ===== */
#toasts{position:fixed;left:50%;top:64px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:60;pointer-events:none;width:min(92vw,420px)}
.toast{background:#120b2ef2;border:2px solid var(--gold);border-radius:14px;padding:8px 14px;font-size:14px;box-shadow:0 8px 20px #000a;animation:tin .3s ease-out;text-align:center}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
#modal{position:fixed;inset:0;background:#0b0620cc;display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
#modal.on{display:flex}
.mbox{background:linear-gradient(#33267a,#221858);border:3px solid var(--gold);border-radius:24px;padding:20px;width:min(460px,100%);max-height:90vh;overflow:auto;text-align:center;box-shadow:0 30px 60px #000c;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.mbox h2{margin:0 0 8px;font-family:'Lilita One',sans-serif;font-weight:400;font-size:30px;color:var(--gold)}
.mbox .me{font-size:64px;line-height:1.1}
.mbox p{color:var(--muted);font-size:15px;line-height:1.45}
.mbox .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.rl{display:flex;justify-content:space-between;padding:6px 10px;background:#0004;border-radius:10px;margin:4px 0;font-size:15px}

/* ===== DAILY ===== */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:12px;padding:8px 2px;text-align:center;background:#0004;border:2px solid var(--line);font-size:11px}
.day .de{font-size:24px}
.day.done{background:#2bb38a44;border-color:var(--mint)}
.day.today{border-color:var(--gold);box-shadow:0 0 14px #ffcf4a88}
.quest{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border:none}
.wheelw{position:relative;width:260px;height:260px;margin:10px auto}
.wheel{width:100%;height:100%;border-radius:50%;border:6px solid var(--gold);box-shadow:0 0 0 4px var(--ink),0 10px 30px #000a;transition:transform 4s cubic-bezier(.15,.9,.2,1);position:relative}
.wheel span{position:absolute;left:50%;top:50%;font-size:24px;transform-origin:0 0}
.wptr{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:32px;z-index:2;filter:drop-shadow(0 3px 2px #000a)}
.whub{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border-radius:50%;background:var(--gold);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:26px}

/* ===== ALBUM / TROPHIES ===== */
.alb{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.sv{aspect-ratio:1;border-radius:12px;background:#0004;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3vw,30px);position:relative}
.sv.no{filter:grayscale(1) brightness(.3)}
.sv small{position:absolute;bottom:1px;right:4px;font-size:10px;color:var(--gold)}
.ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.ach.no{opacity:.5}
.ach .ae{font-size:28px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stats div{background:#0004;border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted)}
.stats b{display:block;color:var(--txt);font-size:16px}

@media (max-width:820px){
  .lobby{grid-template-columns:1fr}
  .lhero .lh-play{width:100%;margin:6px 0 0}
  .playbtn{width:100%}
  #round{grid-template-columns:1fr;padding:8px;gap:8px}
  .caller{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px}
  .caller .cbox{padding:6px;border-radius:14px}
  .caller .c-pw{grid-column:1/-1;display:flex;align-items:center;gap:8px}
  .caller .c-ctl{grid-column:1/-1;justify-content:space-between}
  .cb .cl{display:none}
  .c-pw .combo{font-size:15px;min-height:0;white-space:nowrap}
  .c-pw .combo:empty{display:none}
  .pwbtn{padding:8px;font-size:14px}
  .ball{width:64px;height:64px}.ball .bn{font-size:24px}.ball .bl{font-size:12px;margin-top:4px}
  .hist .mb{width:24px;height:24px;font-size:10px}
  .hist .mb:nth-child(n+7){display:none}
  .rstat{grid-template-columns:repeat(4,1fr);gap:4px;font-size:10px;margin-top:4px!important}
  .rstat div{padding:3px 5px}.rstat b{font-size:13px}
  .feed{display:none}
  .cards.n2,.cards.n3,.cards.n4{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .cards.n2 .card,.cards.n3 .card,.cards.n4 .card{padding:4px;border-width:3px;border-radius:12px}
  .cards.n2 .cg,.cards.n3 .cg,.cards.n4 .cg,.cards.n2 .chd,.cards.n3 .chd,.cards.n4 .chd{gap:2px}
  .cards.n2 .cell,.cards.n3 .cell,.cards.n4 .cell{border-radius:6px;border-width:1px;font-size:clamp(11px,3.4vw,18px)}
  .cards.n2 .bingo,.cards.n3 .bingo,.cards.n4 .bingo{font-size:16px;padding:7px;margin-top:4px}
  .cards .cinfo{display:none}
}
@media (max-width:560px){
  .logo{display:none}
  .home .hl{display:none}
  .pill{font-size:13px;padding:0 8px}
  .lvl{width:70px;font-size:12px}
  .ibtn{width:32px;height:32px;font-size:15px}
  #top{gap:6px;padding:8px}
  .slots{grid-template-columns:repeat(3,1fr)}
  .alb{grid-template-columns:repeat(5,1fr)}
  .scene .bigE{font-size:56px}
  .scene .skyline{display:none}
  #nav button{font-size:9px}
  #nav button .e{font-size:20px}
}
@media (prefers-reduced-motion:reduce){.scene .bigE,.ball.pop{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <a class="home" href="./" aria-label="Back to all games">🏠<span class="hl">Games</span></a>
    <div class="logo">🥔 Potato Bingo<small>ADVENTURES</small></div>
    <div class="res">
      <div class="pill" title="Coins">🪙 <b id="hCoins">0</b></div>

    </div>

  <main id="view"></main>

    <button data-a="tab" data-t="town" style="--o:2"><span class="e">🏘️</span>Town<span class="dot" id="dTown"></span></button>
    <button data-a="tab" data-t="map" class="dk-only" style="--o:3"><span class="e">🗺️</span>Map</button>

  </nav>
</div>
<div id="fx"></div>
<div id="toasts"></div>
<div id="modal"><div class="mbox" id="mbox"></div></div>

<script>
'use strict';
/* =========================================================
   POTATO BINGO ADVENTURES – Potato Team Games
   ========================================================= */
const $=s=>document.querySelector(s);
const SAVE_KEY='potato_bingo_adventures_v1';
const rnd=Math.random, ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)), pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid'];
function fmt(n){n=Math.floor(n);if(n<1000)return ''+n;let e=Math.min(SUF.length-1,Math.floor(Math.log10(n)/3));let v=n/Math.pow(10,e*3);if(v>=999.5&&e<SUF.length-1){e++;v/=1000}return (v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2))+SUF[e]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wpick(ws){let t=ws.reduce((a,b)=>a+b,0),r=rnd()*t;for(let i=0;i<ws.length;i++){r-=ws[i];if(r<0)return i}return ws.length-1}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const yesterday=()=>{const d=new Date(Date.now()-864e5);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

/* ---------- DATA ---------- */
const RAR=[{n:'Common',c:'#b9c3cf',max:10},{n:'Rare',c:'#4aa3ff',max:15},{n:'Epic',c:'#b36bff',max:20},{n:'Legendary',c:'#ffb52e',max:25},{n:'Mythic',c:'#ff4f8b',max:30}];
const SLOTS=[{k:'hat',e:'🎩',n:'Hat',lv:1},{k:'dauber',e:'🖍️',n:'Dauber',lv:1},{k:'charm',e:'🍀',n:'Charm',lv:1},{k:'outfit',e:'👕',n:'Outfit',lv:4},{k:'pet',e:'🐾',n:'Pet',lv:8}];
const STAT={coin:['Bingo coins','%'],xp:['XP','%'],auto:['Auto-daub','%'],charge:['Power charge','%'],event:['Event rewards','%'],gem:['Gem luck','%'],luck:['Lucky pre-daubs','/card'],special:['Special squares','%'],souv:['Souvenir luck','%'],balls:['Extra balls',''],rival:['Rival slowdown','%'],idle:['Farm income','%'],claim:['Auto-BINGO','']};
// building types: stat per level
const BT=[
  {k:'farm',d:l=>`Earns coins every minute, even offline`},
  {k:'hall',d:l=>`+${l*4}% bingo coins (+4%/lvl)`},
  {k:'market',d:l=>`+${l*3}% special squares, +${l*4}% souvenirs`},
  {k:'inn',d:l=>`+${l*5}% XP (+5%/lvl)`},
  {k:'workshop',d:l=>`+${l*4}% power-up charge`},
  {k:'shrine',d:l=>`+${l*4}% gem luck`},
  {k:'festival',d:l=>`+${l*6}% event rewards`},
  {k:'landmark',d:l=>`+${l*10}% ALL coins (global)`}
];
const BCOST=[0.8,1.2,1,1,1.4,1.6,1.4];
// Lands
const LANDS=[
 {n:'Ireland',e:'☘️',sub:'The Emerald Isle – where your spud journey begins',c1:'#3aa35c',c2:'#14532d',sky:'🏰🌈🐑',
  b:[['🌱','Potato Field'],['🎱','Village Bingo Hall'],['🛒','Farmers Market'],['🏡','Cottage Inn'],['🔨','Blacksmith'],['🍀','Clover Shrine'],['🎻','Céilí Festival'],['🏰','Blarney Castle']],
  s:[['☘️','Shamrock'],['🍀','Four-Leaf Clover'],['🌈','Rainbow'],['🪙','Pot of Gold'],['🎻','Fiddle'],['🐑','Fluffy Sheep'],['🏰','Castle Stone'],['🥧','Shepherd\'s Pie'],['🧚','Lucky Fairy']],
  g:[['hat','🎩','Leprechaun Hat',{coin:5}],['dauber','🖍️','Shamrock Dauber',{auto:8}],['charm','🍀','Clover Charm',{gem:8}],['outfit','🧶','Wool Sweater',{xp:8}],['pet','🐑','Sheep Buddy',{idle:15}]]},
 {n:'Peru',e:'🦙',sub:'Birthplace of the potato, high in the Andes',c1:'#d9763a',c2:'#5b2410',sky:'🏔️🦙🌞',

function itemStat(it,lv){const o={};for(const k in it.st){const b=it.st[k];o[k]=k==='claim'?1:(k==='luck'||k==='balls')?+(b*(1+0.1*(lv-1))).toFixed(2):Math.round(b*(1+0.2*(lv-1)))}return o}
function calc(){
  const s={coin:0,xp:0,auto:0,charge:0,event:0,gem:0,luck:0,special:0,souv:0,balls:0,rival:0,idle:0,claim:0,lm:0,farm:0};
  LANDS.forEach((L,i)=>{const b=S.b[i];s.farm+=b[0]*0.15*Bv(i);s.coin+=b[1]*4;s.special+=b[2]*3;s.souv+=b[2]*4;s.xp+=b[3]*5;s.charge+=b[4]*4;s.gem+=b[5]*4;s.event+=b[6]*6;s.lm+=b[7];if(S.colDone[i])s.coin+=5});
  for(const sl in S.eq){const id=S.eq[sl];if(id&&S.gear[id]){const o=itemStat(ITEMS[id],S.gear[id]);for(const k in o)s[k]+=o[k]}}
  s.coin+=(S.level-1);
  s.auto=Math.min(100,s.auto);s.rival=Math.min(70,s.rival);
  s.all=(1+0.1*s.lm)*(1+0.75*S.tours);
  s.cm=(1+s.coin/100)*s.all;                      // coin multiplier on bingos
  s.farmMin=s.farm*s.all*(1+s.idle/100);           // coins per minute
  ST=s;
}
const maxCards=()=>S.level>=12?4:S.level>=7?3:S.level>=3?2:1;
const SPEEDS=[{n:'Very slow',e:'🐌',t:4.2},{n:'Slow',e:'🐢',t:3.2},{n:'Normal',e:'🥔',t:2.4},{n:'Fast',e:'🐇',t:1.8},{n:'Very fast',e:'🏎️',t:1.3},{n:'Turbo',e:'🚀',t:0.9}];
const xpNeed=l=>Math.floor(40*Math.pow(l,1.55));

/* ---------- AUDIO ---------- */
let AC=null;
const ac=()=>AC=AC||new (window.AudioContext||window.webkitAudioContext)();
function tone(f,d=0.1,type='sine',v=0.12,delay=0){if(!S.sound)return;try{ac();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const SFX={
  ball:()=>{tone(660,.08,'triangle',.1);tone(880,.1,'triangle',.08,.07)},
  daub:()=>tone(420+rnd()*80,.07,'square',.05),
  bad:()=>tone(140,.15,'sawtooth',.06),
  coin:()=>{tone(988,.07,'square',.06);tone(1319,.12,'square',.06,.06)},
  bingo:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.08)),
  event:()=>[880,660,880,660].forEach((f,i)=>tone(f,.09,'square',.07,i*.1)),
  power:()=>[300,450,600,900].forEach((f,i)=>tone(f,.12,'sawtooth',.06,i*.05)),
  level:()=>[523,784,1047,784,1047,1568].forEach((f,i)=>tone(f,.16,'triangle',.11,i*.1)),
  buy:()=>{tone(523,.08,'triangle',.1);tone(784,.14,'triangle',.1,.08)}
};
/* ---------- COZY BACKGROUND MUSIC ----------
   Generated live with WebAudio: soft lo-fi chords, a warm bass, a gentle music-box
   melody that wanders over the chords, a quiet shaker and a little echo. ~70 BPM. */
const MZ={on:false,next:0,step:0,timer:null,out:null,fx:null,noise:null,last:76};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const STEP=60/70/2;                                   // eighth note
const PROG=[[48,[60,64,67,71]],[45,[60,64,67,69]],[41,[57,60,64,65]],[43,[59,62,65,67]],
            [48,[60,64,67,71]],[45,[60,64,67,69]],[38,[57,60,62,65]],[43,[55,59,62,65]]];
const MEL=[67,69,72,74,76,79,81,84];                  // C major pentatonic
function musicInit(){const a=ac();if(MZ.out)return;
  MZ.out=a.createGain();MZ.out.gain.value=0;
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;MZ.out.connect(lp);lp.connect(a.destination);
  // soft echo send
  MZ.fx=a.createGain();MZ.fx.gain.value=0.35;const d=a.createDelay(1);d.delayTime.value=STEP*3;const fb=a.createGain();fb.gain.value=0.32;const dl=a.createBiquadFilter();dl.type='lowpass';dl.frequency.value=1400;
  MZ.fx.connect(d);d.connect(dl);dl.connect(fb);fb.connect(d);dl.connect(MZ.out);
  const len=a.sampleRate*0.2,buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);MZ.noise=buf}
function mVoice(type,f,t,dur,vol,att,cut,send){const a=AC,o=a.createOscillator(),g=a.createGain(),fl=a.createBiquadFilter();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=cut;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.setTargetAtTime(0.0001,t+Math.max(att,dur-att),dur/4);
  o.connect(fl);fl.connect(g);g.connect(MZ.out);if(send)g.connect(MZ.fx);o.start(t);o.stop(t+dur*1.6+1)}
function mStep(k,t){
  const [root,ch]=PROG[Math.floor(k/16)%PROG.length],b=k%16;
  if(b===0)ch.forEach((n,i)=>{mVoice('sine',mtof(n),t+i*0.03,STEP*16,0.045,1.4,900,false);mVoice('triangle',mtof(n)*1.004,t+i*0.03,STEP*16,0.018,1.6,700,false)});
  if(b===0||b===8)mVoice('sine',mtof(root),t,STEP*6,0.13,0.04,400,false);
  if(b===6||b===14)mVoice('sine',mtof(root+(b===6?7:12)),t,STEP*2,0.07,0.04,400,false);
  // melody: drifts stepwise, rests often, leans on chord tones
  if(rnd()<(b%2?0.18:0.42)){let i=MEL.indexOf(MZ.last);if(i<0)i=3;i=clamp(i+pick([-2,-1,-1,1,1,2,0]),0,MEL.length-1);let n=MEL[i];
    if(b%4===0){const tones=ch.map(x=>x+12).filter(x=>Math.abs(x-n)<=4);if(tones.length)n=pick(tones)}MZ.last=n;
    const v=0.05+rnd()*0.025;mVoice('triangle',mtof(n),t,STEP*3,v,0.008,2400,true);mVoice('sine',mtof(n*1)*2,t,STEP*1.5,v*0.25,0.005,3000,true)}
  // quiet shaker on the off-beats
  if(b%4===2||(b%4===3&&rnd()<0.3)){const a=AC,src=a.createBufferSource(),hp=a.createBiquadFilter(),g=a.createGain();src.buffer=MZ.noise;hp.type='highpass';hp.frequency.value=6000;g.gain.value=b%4===2?0.035:0.018;src.connect(hp);hp.connect(g);g.connect(MZ.out);src.start(t)}
}
function musicStart(){if(MZ.on||!S.music)return;try{musicInit();if(AC.state==='suspended')AC.resume();MZ.on=true;MZ.next=AC.currentTime+0.15;
  MZ.out.gain.cancelScheduledValues(AC.currentTime);MZ.out.gain.setTargetAtTime(0.42,AC.currentTime,1.5);
  MZ.timer=setInterval(()=>{if(!MZ.on)return;while(MZ.next<AC.currentTime+0.4){mStep(MZ.step++,MZ.next);MZ.next+=STEP}},100)}catch(e){}}
function musicStop(){if(!MZ.on)return;MZ.on=false;clearInterval(MZ.timer);try{MZ.out.gain.cancelScheduledValues(AC.currentTime);MZ.out.gain.setTargetAtTime(0,AC.currentTime,0.3)}catch(e){}}
// browsers only allow audio after the first tap/key press
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,e=>{if(S.music&&!document.hidden&&!(e.target.closest&&e.target.closest('[data-a=music]')))musicStart()},{passive:true}));

function speak(t){if(!S.call||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=R&&R.speed<1.6?1.35:1.0;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}

/* ---------- FX / UI HELPERS ---------- */
const fxEl=$('#fx');
function floatTxt(x,y,t,c){const d=document.createElement('div');d.className='float';d.textContent=t;d.style.left=(x-20)+'px';d.style.top=(y-20)+'px';if(c)d.style.color=c;fxEl.appendChild(d);setTimeout(()=>d.remove(),1200)}
function floatAt(el,t,c){const r=el.getBoundingClientRect();floatTxt(r.left+r.width/2,r.top,t,c)}
function confetti(n=60){for(let i=0;i<n;i++){const d=document.createElement('div');d.className='conf';d.style.left=(rnd()*100)+'vw';d.style.top=(-20-rnd()*80)+'px';d.style.background=pick(LCOL.concat(['#fff','#ffcf4a']));d.style.setProperty('--dx',(rnd()*200-100)+'px');d.style.setProperty('--r',(rnd()*900)+'deg');d.style.animationDelay=(rnd()*.4)+'s';d.style.animationDuration=(1.2+rnd()*1)+'s';fxEl.appendChild(d);setTimeout(()=>d.remove(),2800)}}
function bigTxt(t){const d=document.createElement('div');d.className='bigtxt';d.textContent=t;fxEl.appendChild(d);setTimeout(()=>d.remove(),1300)}
function toast(t){const d=document.createElement('div');d.className='toast';d.innerHTML=t;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),2600);while($('#toasts').children.length>4)$('#toasts').firstChild.remove()}
let modalQ=[],modalOn=false;

/* ---------- ECONOMY ---------- */
function addCoins(n,src){n=Math.floor(n);if(n<=0)return 0;S.coins+=n;S.st.coins+=n;if(src!=='idle')track('coins',n);return n}
function addGems(n){S.gems+=n;S.st.gems+=n}
function addXP(n){n=Math.ceil(n*(1+ST.xp/100));S.xp+=n;let up=false;while(S.xp>=xpNeed(S.level)){S.xp-=xpNeed(S.level);S.level++;up=true;levelUp()}if(up)calc()}
function levelUp(){const g=5+Math.floor(S.level/2);addGems(g);const c=addCoins(Bv(S.unlocked-1)*2*ST.cm);SFX.level();
  const un=[];if(S.level===3)un.push('🎱 2 bingo cards');if(S.level===7)un.push('🎱 3 bingo cards');if(S.level===12)un.push('🎱 4 bingo cards');if(S.level===5)un.push('⏩ Fast speed');if(S.level===15)un.push('🚀 Turbo speed');if(S.level===4)un.push('👕 Outfit slot');if(S.level===8)un.push('🐾 Pet slot');
  toast(`🎓 <b>LEVEL ${S.level}!</b> +${g} 💎 +${fmt(c)} 🪙 · +1% bingo coins${un.length?'<br>Unlocked: '+un.join(', '):''}`);if(un.length)confetti(40)}

function quests(){const t=today();if(!S.daily||S.daily.day!==t){const ks=shuffle(QUESTS.slice()).slice(0,3);S.daily={day:t,spins:0,bonus:false,q:ks.map(q=>({k:q.k,n:Math.ceil(q.b*(q.max?1+S.level/40:1+S.level/12)),p:0,c:false}))}}return S.daily}
function track(k,n=1){const d=quests();d.q.forEach(q=>{if(q.k===k){const def=QUESTS.find(x=>x.k===k);q.p=def.max?Math.max(q.p,n):q.p+n}});}
function checkAch(){let n=0;ACH.forEach(a=>{if(!S.ach[a.id]&&a.f()){S.ach[a.id]=1;addGems(a.g);n++;toast(`🏆 <b>${a.n}</b> unlocked! +${a.g} 💎`)}});if(n){calc();updDots()}}

/* ---------- IDLE ---------- */
let idleAcc=0;
function idleTick(dt){if(!ST.farmMin)return;idleAcc+=ST.farmMin*dt/60;if(idleAcc>=1){const n=Math.floor(idleAcc);idleAcc-=n;addCoins(n,'idle')}}
function offline(quiet){const ms=Date.now()-(S.last||Date.now());if(ms<60000||!ST.farmMin)return;const mins=Math.min(ms/60000,8*60);const c=addCoins(ST.farmMin*mins,'idle');S.last=Date.now();
  if(quiet){toast(`🌾 Your farms earned <b>+${fmt(c)} 🪙</b> while you were away`);return}
  modal(`<div class="me">🌾</div><h2>Welcome back!</h2><p>Your farms worked hard for <b>${mins>=60?(mins/60).toFixed(1)+' hours':Math.floor(mins)+' minutes'}</b> while you were away.</p><div class="rl"><span>Farm income</span><b>+${fmt(c)} 🪙</b></div><p class="small">Farms store up to 8 hours of income.</p><div class="acts"><button class="btn big" data-a="close">Collect!</button></div>`)}

function updHUD(){$('#hCoins').textContent=fmt(S.coins);$('#hGems').textContent=fmt(S.gems);$('#hLvl').textContent='Lv '+S.level;$('#hXp').style.width=(S.xp/xpNeed(S.level)*100)+'%';$('#sndBtn').textContent=S.sound?'🔊':'🔇';const mb=$('#musBtn');mb.style.opacity=S.music?1:0.4;mb.title=S.music?'Music on':'Music off'}

function build(k){const i=S.cur,lv=S.b[i][k];if(lv>=bMax(k))return;if(k===7&&!lmReady(i))return;const c=bCost(i,k,lv);if(S.coins<c)return;

function genCard(){
  const cells=[];const cols=[0,1,2,3,4].map(c=>shuffle([...Array(15)].map((_,k)=>c*15+k+1)).slice(0,5));

  const ch=Math.min(0.35,0.12*(1+ST.special/100));
  cells.forEach(cl=>{if(cl.free||rnd()>=ch)return;cl.sp=['coin','souv','charge','gem','chest'][wpick([50,22*(1+ST.souv/100),15,8*(1+ST.gem/100),5])]});

  let k=Math.floor(ST.luck)+(rnd()<ST.luck%1?1:0);const idx=shuffle(cells.map((c,j)=>j).filter(j=>!cells[j].free));
  const card={cells,claimed:new Set(),bingos:0};
  for(let j=0;j<k&&j<idx.length;j++){cells[idx[j]].d=true;cells[idx[j]].magic=true;cells[idx[j]].pre=true}
  return card;
}

  if(n){const l=ballLetter(n);b.style.setProperty('--bc',LCOL[l]);b.innerHTML=`<span class="bl">${LET[l]}</span><span class="bn">${n}</span>`}
  $('#hist').innerHTML=R.hist.slice(1,9).map(n=>`<span class="mb" style="--bc:${LCOL[ballLetter(n)]}">${n}</span>`).join('');
  $('#rBall').textContent=R.idx+'/'+R.maxBalls;$('#rPool').textContent=R.pool+(R.frozen?' 🧊':'');$('#rWon').textContent='🪙 '+fmt(R.coins);
  $('#rCombo').textContent=R.combo>=3?`🔥 ${R.combo}× COMBO (+${Math.round(Math.min(R.combo,40)*1.25)}%)`:R.dbl?`✖️ Next bingo ×${R.dblM.toFixed(2)}`:'';
}
function updCtl(){const c=$('#ctl');if(!c)return;const sp=SPEEDS[S.spd];
  c.innerHTML=`<button class="cb leave" data-a="leave" title="Leave the bingo hall">🚪 Leave</button>
   <div class="spd"><button class="cb" data-a="spdDown" ${S.spd<=0?'disabled':''} title="Slower">−</button><span title="${sp.t}s per number">${sp.e} ${sp.n}</span><button class="cb" data-a="spdUp" ${S.spd>=SPEEDS.length-1?'disabled':''} title="Faster">+</button></div>
   <button class="cb ${S.call?'on':''}" data-a="call" title="Read numbers aloud">${S.call?'🗣️':'🤐'}<i class="cl"> Voice</i></button>${S.spot?`<button class="cb ${S.spotOn?'on':''}" data-a="spotToggle" title="Number Spotter">🔍<i class="cl"> Spotter</i></button>`:''}${hasAutoB()?`<button class="cb ${S.autoBOn?'on':''}" data-a="autoBToggle" title="Auto-BINGO">🤖<i class="cl"> Auto</i></button>`:''}`}
function updPw(){const btn=$('#pwBtn');if(!btn)return;const ready=R.charge>=R.need;btn.classList.toggle('ready',ready);$('#pwFill').style.width=Math.min(100,R.charge/R.need*100)+'%';$('#pwTxt').textContent=ready?'⚡ USE POWER-UP!':`⚡ Power ${Math.floor(Math.min(100,R.charge/R.need*100))}%`}
function updClaim(ci){const el=document.getElementById('bg'+ci);if(!el)return;const has=newLines(ci).length>0;el.classList.toggle('ready',has);const cb=document.getElementById('cb'+ci);if(cb)cb.textContent=R.cards[ci].bingos}
function feed(t){R.feed.unshift(t);R.feed=R.feed.slice(0,2);const f=$('#feed');if(f)f.innerHTML=R.feed.join('<br>')}
function newLines(ci){const cd=R.cards[ci];return LINES.map((ln,k)=>k).filter(k=>!cd.claimed.has(k)&&LINES[k].every(j=>cd.cells[j].d))}

function callBall(){
  if(R.idx>=R.maxBalls){if(!R.endAt)R.endAt=R.time+2.5;return}
  const n=R.order[R.idx++];R.called.add(n);R.hist.unshift(n);
  const gold=R.goldNext;R.goldNext=false;
  R.cards.forEach((cd,ci)=>cd.cells.forEach((cl,j)=>{if(cl.n===n&&!cl.free){cl.ca=R.idx;if(!cl.d&&rnd()*100<ST.auto)R.pending.push({ci,j,at:R.time+0.55+rnd()*0.4});if(gold)cl.gold=R.time+2.5}}));
  // combo breaker: a number called 3 balls ago is still not daubed
  if(R.idx>3){const old=R.hist[3];let missed=false;R.cards.forEach(cd=>cd.cells.forEach(cl=>{if(cl.n===old&&!cl.d)missed=true}));if(missed&&R.combo>0){if(R.combo>=5)feed(`💔 Combo lost at ${R.combo}×`);R.combo=0}}
  // rivals
  if(R.frozen>0)R.frozen--;else if(R.idx>8){const x=0.016*(R.idx-8)*(1-ST.rival/100)*(R.poolTotal/13)*Math.min(1,0.6+S.level*0.04);let k=Math.floor(x)+(rnd()<x%1?1:0);while(k-->0&&R.pool>0){R.pool--;feed(`🏆 ${pick(RIVALS)} got BINGO!`)}if(R.pool<=0){endRound('All bingos have been claimed!');return}}
  // events
  R.evCd--;if(!R.ev&&R.evCd<=0&&R.idx>4&&R.idx<R.maxBalls-3&&rnd()<0.09*(1+Math.min(ST.event,300)/400)){startEvent()}
  SFX.ball();speak(LET[ballLetter(n)]+'. '+n);
  const b=$('#ball');if(b){b.classList.remove('pop','gold');void b.offsetWidth;b.classList.add('pop');if(gold)b.classList.add('gold')}
  R.cards.forEach((cd,ci)=>cd.cells.forEach((cl,j)=>{if(cl.ca&&!cl.d)updCell(ci,j)}));
  updCaller();
}
function daub(ci,j,auto){
  if(!R||R.over)return;const cd=R.cards[ci],cl=cd.cells[j];const el=document.getElementById('c'+ci+'_'+j);
  if(cl.d||cl.free)return;
  if(!R.called.has(cl.n)){if(!auto){SFX.bad();if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}if(R.combo>=3)feed('💔 Wrong number – combo lost');R.combo=0;updCaller()}return}
  cl.d=true;const freshD=R.idx-cl.ca<=2;
  if(freshD){R.combo++;R.best=Math.max(R.best,R.combo);if(R.combo>S.st.bestCombo)S.st.bestCombo=R.combo;track('combo',R.combo)}
  if(cl.gold&&R.time<=cl.gold){const c=addCoins(Bv(R.land)*1.2*ST.cm*(1+ST.event/100));R.coins+=c;if(el)floatAt(el,'⭐ GOLDEN +'+fmt(c),'#ffd34a');SFX.coin();S.st.events++;track('events')}
  S.st.daubs++;track('daubs');R.xp+=1;R.charge+=1;
  if(!auto)SFX.daub();
  if(cl.sp)collectSp(ci,j);
  updCell(ci,j);checkLines(ci);updPw();updCaller();
}
function collectSp(ci,j){const cl=R.cards[ci].cells[j],el=document.getElementById('c'+ci+'_'+j),sp=cl.sp;cl.sp=null;S.st.specials++;track('specials');
  if(sp==='coin'){const c=addCoins(Bv(R.land)*ri(15,40)/100*ST.cm);R.coins+=c;if(el)floatAt(el,'+'+fmt(c)+' 🪙','#ffcf4a');SFX.coin()}
  else if(sp==='gem'){const g=ri(1,3);addGems(g);R.gems+=g;if(el)floatAt(el,'+'+g+' 💎','#7fd2ff');SFX.coin()}
  else if(sp==='charge'){R.charge+=R.need*0.4;if(el)floatAt(el,'+40% ⚡','#b9a6ff');updPw()}
  else if(sp==='chest'){S.bronze++;R.chests++;if(el)floatAt(el,'+1 🎁','#ff8cc0');SFX.coin()}
  else if(sp==='souv'){R.souv++;findSouv(el)}}
function checkLines(ci){const cd=R.cards[ci];const nl=newLines(ci);
  if(nl.length){updClaim(ci);if(autoBOn()&&!R.claimQ.includes(ci)){R.claimQ.push(ci);setTimeout(()=>{R&&(R.claimQ=R.claimQ.filter(x=>x!==ci));if(R&&!R.over)claim(ci,true)},450)}}
  else updClaim(ci)}
function claim(ci,auto){
  if(!R||R.over)return;const nl=newLines(ci);const el=document.getElementById('bg'+ci);
  if(!nl.length){if(!auto){SFX.bad();feed('❌ No bingo on that card yet!')}return}
  if(R.pool<=0)return;
  const cd=R.cards[ci];let tot=0,n=0;
  for(const k of nl){if(R.pool<=0)break;
    const rank=1+R.pool/R.poolTotal;R.pool--;cd.claimed.add(k);LINES[k].forEach(j=>{cd.cells[j].won=true;updCell(ci,j)});
    let v=Bv(R.land)*ST.cm*rank*(1+Math.min(R.combo,40)*0.0125)*(nl.length>1?1.25:1)*(R.boost?2:1);
    if(R.dbl>0){v*=R.dblM;R.dbl--}
    tot+=addCoins(v);n++;cd.bingos++;R.bingos++;S.st.bingos++;track('bingos');R.xp+=15;
    if(rnd()<0.05*(1+ST.gem/100)){const g=ri(1,3);addGems(g);R.gems+=g}
  }
  R.coins+=tot;SFX.bingo();confetti(n>1?90:50);bigTxt(n>2?'TRIPLE BINGO!':n>1?'DOUBLE BINGO!':'BINGO!');if(el)floatAt(el,'+'+fmt(tot)+' 🪙','#ffcf4a');
  feed(`🎉 You got ${n>1?n+' bingos':'BINGO'}! +${fmt(tot)} 🪙`);
  updClaim(ci);updCaller();
  if(R.pool<=0)endRound('All bingos have been claimed!');
}
function usePw(){
  if(!R||R.over||R.charge<R.need)return;R.charge-=R.need;S.st.powerups++;track('powerups');
  const av=PW.filter(p=>S.pl[p.k]>0);const p=av[wpick(av.map(p=>p.k==='instant'?p.w*(1+0.1*(S.pl[p.k]-1)):p.w))],l=S.pl[p.k];
  SFX.power();toast(`${p.e} <b>${p.n}!</b>`);
  const undaubed=()=>{const a=[];R.cards.forEach((cd,ci)=>cd.cells.forEach((cl,j)=>{if(!cl.d)a.push([ci,j])}));return a};
  const magic=(ci,j)=>{const cl=R.cards[ci].cells[j];if(cl.d)return;cl.d=true;cl.magic=true;S.st.daubs++;if(cl.sp)collectSp(ci,j);updCell(ci,j)};
  if(p.k==='daub'){shuffle(undaubed()).slice(0,2+Math.floor(l/3)).forEach(([ci,j])=>magic(ci,j))}
  else if(p.k==='double'){R.dbl++;R.dblM=2+0.15*(l-1)}
  else if(p.k==='coins'){const c=addCoins(Bv(R.land)*ST.cm*(0.6+0.15*(l-1)));R.coins+=c;floatAt($('#pwBtn'),'+'+fmt(c)+' 🪙','#ffcf4a');SFX.coin()}
  else if(p.k==='freeze'){R.frozen+=4+l;feed(`🧊 Rivals frozen for ${4+l} balls!`)}
  else if(p.k==='bomb'){const ci=ri(0,R.cards.length-1),r=ri(1,3),c=ri(1,3);const cells=l>=5?[-6,-5,-4,-1,0,1,4,5,6]:[-5,-1,0,1,5];cells.forEach(o=>magic(ci,r*5+c+o))}
  else if(p.k==='instant'){let best=null;R.cards.forEach((cd,ci)=>LINES.forEach((ln,k)=>{if(cd.claimed.has(k))return;const d=ln.filter(j=>cd.cells[j].d).length;if(d<5&&(!best||d>best.d))best={ci,k,d}}));if(best)LINES[best.k].forEach(j=>magic(best.ci,j))}
  R.cards.forEach((_,ci)=>checkLines(ci));updPw();updCaller();
}

/* ---------- BONUS EVENTS ---------- */
const EVENTS=['golden','rain','mash','chests','balloon'];
function evReward(m){return Bv(R.land)*ST.cm*(1+ST.event/100)*m}
function evDone(ok){if(!R||!R.ev)return;if(ok){S.st.events++;track('events');R.xp+=5}R.ev=null;R.tNext=Math.max(R.tNext,1.2);R.evCd=8;document.querySelectorAll('.evx').forEach(e=>e.remove())}
function startEvent(){
  const t=pick(EVENTS);R.ev={t};SFX.event();
  if(t==='golden'||t==='balloon'){
    const d=document.createElement('div');d.className='ev evx '+(t==='golden'?'fly':'rise');d.textContent=t==='golden'?'🥔✨':'🎈🎁';
    if(t==='golden'){d.style.left='0';d.style.top=(15+rnd()*55)+'vh';d.style.setProperty('--dur',(3.2-Math.min(1,ST.event/400))+'s');feed('✨ A GOLDEN POTATO! Tap it quick!')}
    else{d.style.left=(10+rnd()*75)+'vw';d.style.top='100vh';d.style.setProperty('--dur','4.2s');feed('🎈 A gift balloon! Pop it!')}
    d.onpointerdown=e=>{e.stopPropagation();const c=addCoins(evReward(t==='golden'?0.9:0.5));R.coins+=c;let txt='+'+fmt(c)+' 🪙';if(t==='balloon'){const g=ri(1,3);addGems(g);R.gems+=g;txt+=' +'+g+'💎'}floatTxt(e.clientX,e.clientY,txt,'#ffcf4a');SFX.coin();evDone(true);updCaller()};
    d.addEventListener('animationend',()=>{if(R&&R.ev&&R.ev.t===t){feed('😢 It got away…');evDone(false)}});
    fxEl.appendChild(d);
  }else if(t==='rain'){
    feed('🌧️ COIN RAIN! Tap the falling coins!');let left=10;R.ev.n=0;
    for(let k=0;k<10;k++){const d=document.createElement('div');d.className='ev fall evx';d.textContent=pick(['🪙','🪙','🥔','💰']);d.style.left=(5+rnd()*85)+'vw';d.style.top='0';d.style.setProperty('--dur',(2.4+rnd()*1.2)+'s');d.style.animationDelay=(k*0.35)+'s';
      d.onpointerdown=e=>{e.stopPropagation();const c=addCoins(evReward(0.14));R.coins+=c;R.ev&&R.ev.n++;floatTxt(e.clientX,e.clientY,'+'+fmt(c),'#ffcf4a');SFX.coin();d.remove();if(--left<=0)evDone(R.ev&&R.ev.n>0);updCaller()};
      d.addEventListener('animationend',()=>{d.remove();if(--left<=0)evDone(R.ev&&R.ev.n>0)});fxEl.appendChild(d)}
  }else if(t==='mash'){
    const need=10+Math.floor(rnd()*5);R.ev.n=0;const p=document.createElement('div');p.className='evp evx';
    p.innerHTML=`<h3>🥔 MASH THE SPUD!</h3><div class="small muted">Tap it <b id="mN">${need}</b> times in 4 seconds!</div><button class="mash" id="mashB">🥔</button><div class="tmr"><i id="mT"></i></div>`;fxEl.appendChild(p);
    const st=performance.now(),dur=4000;
    p.querySelector('#mashB').onpointerdown=e=>{e.stopPropagation();if(!R.ev)return;R.ev.n++;tone(300+R.ev.n*40,.05,'square',.05);$('#mN').textContent=Math.max(0,need-R.ev.n);if(R.ev.n>=need){const c=addCoins(evReward(1.3));R.coins+=c;floatTxt(e.clientX,e.clientY,'MASHED! +'+fmt(c),'#ffcf4a');SFX.coin();evDone(true);updCaller()}};
    R.ev.tick=()=>{const f=1-(performance.now()-st)/dur;const ti=$('#mT');if(ti)ti.style.width=Math.max(0,f*100)+'%';if(f<=0){feed('😅 Too slow! The spud escaped.');evDone(false)}};
  }else if(t==='chests'){
    const p=document.createElement('div');p.className='evp evx';p.innerHTML=`<h3>🎁 MYSTERY CHESTS!</h3><div class="small muted">Pick one – quick!</div><div class="chs" style="margin-top:10px">${[0,1,2].map(k=>`<button data-k="${k}">🎁</button>`).join('')}</div><div class="tmr"><i id="mT"></i></div>`;fxEl.appendChild(p);
    const st=performance.now(),dur=4500;
    p.querySelectorAll('.chs button').forEach(b=>b.onpointerdown=e=>{e.stopPropagation();if(!R.ev)return;const r=wpick([50,25,15,10]);let txt;
      if(r===0){const c=addCoins(evReward(0.4+rnd()*1.6));R.coins+=c;txt='+'+fmt(c)+' 🪙'}else if(r===1){const g=ri(2,8);addGems(g);R.gems+=g;txt='+'+g+' 💎'}else if(r===2){R.charge=Math.max(R.charge,R.need);txt='⚡ FULL POWER!';updPw()}else{S.bronze++;R.chests++;txt='+1 🎁 Chest'}
      floatTxt(e.clientX,e.clientY,txt,'#ffcf4a');SFX.coin();evDone(true);updCaller()});
    R.ev.tick=()=>{const f=1-(performance.now()-st)/dur;const ti=$('#mT');if(ti)ti.style.width=Math.max(0,f*100)+'%';if(f<=0){feed('⌛ The chests vanished…');evDone(false)}};
  }
  // golden ball bonus can piggyback on any event
  if(rnd()<0.35){R.goldNext=true;feed('⭐ Next ball is GOLDEN – daub it fast for a bonus!')}
}

function endRound(msg){
  if(!R||R.over)return;R.over=true;evDone(false);
  S.st.rounds++;track('rounds');R.xp+=5;if(R.boost)S.boost=Math.max(0,S.boost-1);
  const lv0=S.level;addXP(R.xp);
  checkAch();save();
  const r=R;
  setTimeout(()=>{
    r.post.forEach(modal);
    modal(`<div class="me">${r.bingos?'🏆':'🥔'}</div><h2>${r.bingos>=3?'Bingo Legend!':r.bingos?'Great game!':'Round over'}</h2><p>${msg}</p>
     <div class="rl"><span>🎉 Bingos</span><b>${r.bingos}</b></div><div class="rl"><span>🪙 Coins won</span><b>${fmt(r.coins)}</b></div>
     ${r.gems?`<div class="rl"><span>💎 Gems</span><b>${r.gems}</b></div>`:''}${r.souv?`<div class="rl"><span>🧩 Souvenirs</span><b>${r.souv}</b></div>`:''}${r.chests?`<div class="rl"><span>🎁 Chests</span><b>${r.chests}</b></div>`:''}
     <div class="rl"><span>🔥 Best combo</span><b>${r.best}×</b></div><div class="rl"><span>🎓 XP</span><b>+${Math.ceil(r.xp*(1+ST.xp/100))}${S.level>lv0?' · LEVEL UP!':''}</b></div>
     <p class="small">${tipAfter()}</p>
     <div class="acts"><button class="btn big" data-a="again">▶ Play again</button><button class="btn dk" data-a="toTown">🏘️ Town</button><button class="btn dk" data-a="toLobby">Lobby</button></div>`);
    render();
  },900);
}
function tipAfter(){const i=S.cur;if(canBuildAny())return '🏗️ You can afford an upgrade in your town!';if(S.bronze>0)return `🎁 You have ${S.bronze} chest${S.bronze>1?'s':''} to open in Gear.`;const d=quests();if(d.q.some(q=>q.p>=q.n&&!q.c))return '📜 A daily quest is ready to claim!';
  return pick(['💡 Daub numbers fast to build a combo for bonus coins.','💡 Equip a dauber with auto-daub so you never miss a number.','💡 Upgrade your Bingo Hall for bigger payouts.','💡 Farms keep earning while you are away.','💡 Complete albums for permanent coin bonuses.','💡 Earlier bingos pay up to 2×!'])}

/* ---------- MAIN LOOP ---------- */
let lastT=performance.now(),saveT=0,achT=0;
function loop(){
  const now=performance.now();const dt=Math.min(0.25,(now-lastT)/1000);lastT=now;
  idleTick(dt);S.st.playMs+=dt*1000;
  if(R&&!R.over){
    R.time+=dt;
    if(R.ev&&R.ev.tick)R.ev.tick();
    // no new numbers while a bonus event is on screen, so the player can grab it calmly
    if(!R.paused&&!R.ev){R.tNext-=dt;if(R.tNext<=0){R.tNext=R.speed;callBall()}}
    if(R.pending.length){const due=R.pending.filter(p=>p.at<=R.time);R.pending=R.pending.filter(p=>p.at>R.time);due.forEach(p=>daub(p.ci,p.j,true))}
    if(R&&R.endAt&&R.time>=R.endAt&&!R.over)endRound('All the balls have been called!');
  }
  saveT+=dt;achT+=dt;
  if(achT>2){achT=0;checkAch();updDots();if(!R||R.over)refreshAfford()}
  if(saveT>8){saveT=0;save()}
  updHUD();
  requestAnimationFrame(loop);
}
// cheap refresh of buy-button states without rebuilding views mid-scroll
function refreshAfford(){document.querySelectorAll('[data-cost]').forEach(b=>{b.disabled=S.coins<+b.dataset.cost})}

  buyItem:d=>{const it=ITEMS[d.id];if(S.gear[d.id]||S.coins<it.price)return;S.coins-=it.price;giveItem(d.id);calc();SFX.buy();toast(`🛍️ Bought <b>${it.e} ${it.n}</b>! ${S.eq[it.slot]===d.id?'You are wearing it now.':'Find it in your Bag.'}`);checkAch();save();rerender()},
  equip:d=>{const it=ITEMS[d.id];S.eq[it.slot]=d.id;calc();SFX.buy();save();afterItem()},
  unequip:d=>{S.eq[d.s]=null;calc();save();afterItem()},
  upItem:d=>{const it=ITEMS[d.id],lv=S.gear[d.id],c=upCost(it,lv);if(lv>=RAR[it.r].max||S.coins<c)return;S.coins-=c;S.gear[d.id]++;calc();SFX.buy();save();afterItem()},
  openChest:d=>openChest(+d.j),
  cards:d=>{S.cards=+d.n;save();rerender()},
  speed:d=>setSpeed(+d.n),
  pwUnlock:d=>{const p=PW.find(x=>x.k===d.k);if(S.gems<p.unlock)return;S.gems-=p.unlock;S.pl[p.k]=1;SFX.level();save();rerender()},
  pwUp:d=>{const l=S.pl[d.k],c=pwUp(l);if(l>=10||S.gems<c)return;S.gems-=c;S.pl[d.k]++;SFX.buy();save();rerender()},
  play:()=>startRound(),
  again:()=>{closeModalAll();R=null;const fee=(S.cards-1)*FEE(S.cur);if(S.coins<fee)S.cards=1;startRound()},
  toTown:()=>{closeModalAll();R=null;S.tab='town';render()},
  toLobby:()=>{closeModalAll();R=null;S.tab='bingo';render()},
  daub:d=>daub(+d.c,+d.j,false),
  claim:d=>claim(+d.c,false),
  usePw:()=>usePw(),
  login:()=>claimLogin(),
  quest:d=>claimQuest(+d.j),
  qbonus:()=>claimQBonus(),
  spin:()=>spin(),
  tour:()=>startTour(),
  tourGo:()=>tourGo(),
  help:()=>tutorial(),
  reset:()=>modal(`<div class="me">⚠️</div><h2>Reset everything?</h2><p>All progress in Potato Bingo Adventures will be deleted forever.</p><div class="acts"><button class="btn p" data-a="resetGo">Yes, reset</button><button class="btn dk" data-a="close">Cancel</button></div>`),
  resetGo:()=>{localStorage.removeItem(SAVE_KEY);S=fresh();R=null;calc();closeModalAll();save();render()}
};
// daub/claim respond on pointerdown for snappy play; everything else on click
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-a="daub"],[data-a="claim"],[data-a="usePw"]');if(!el||el.disabled)return;e.preventDefault();ACT[el.dataset.a](el.dataset)});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a;if(a==='daub'||a==='claim'||a==='usePw')return;if(ACT[a])ACT[a](el.dataset)});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!R){UI.item=null;UI.sell=null;closeModal()}});
document.addEventListener('keydown',e=>{if(!R||R.over)return;if(e.key===' '||e.key==='Enter'){e.preventDefault();R.cards.forEach((_,ci)=>{if(newLines(ci).length)claim(ci)})}if(e.key==='p'||e.key==='P')usePw()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();musicStop()}else{if(S.music)musicStart();offline(true);lastT=performance.now()}});
window.addEventListener('beforeunload',save);

function tutorial(){
  modal(`<div class="me">🥔🎱✈️</div><h2>Potato Bingo Adventures</h2><p>Travel the world – from Ireland to Potato Planet – and build amazing towns. But there's a catch: <b>the only way to earn coins is to win at bingo!</b></p>
  <div class="rl"><span>🎱 Play bingo</span><b>Daub called numbers</b></div><div class="rl"><span>🎉 Get a line</span><b>Hit BINGO fast!</b></div><div class="rl"><span>🏘️ Spend coins</span><b>Build & upgrade</b></div><div class="rl"><span>🛍️ Buy gear</span><b>Wear it from your Bag</b></div><div class="rl"><span>🏛️ Build landmark</span><b>Unlock a new land</b></div>
  <p class="small">Catch surprise events during games for free coins, collect souvenirs, and come back daily for rewards!</p><div class="acts"><button class="btn big" data-a="close">Let's play! ▶</button></div>`)}

/* ---------- BOOT ---------- */
load();calc();quests();
if(!S.tut){S.tut=true;tutorial();save()}else offline();
render();requestAnimationFrame(loop);
</script>
</body>
</html>
